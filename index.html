ité, les boxplots sont très populaires, surtout pendant la phase exploratoire de l'analyse."},{"titre":"Graphiques en violon et boxplots multiples","contenu":"Le graphique en violon est une variante du boxplot qui montre en plus la densité de probabilité par noyau des données aux différentes valeurs ; il comprend habituellement un marqueur pour la médiane et une boîte pour l'écart interquartile. Dans Jamovi, on l'obtient en cochant les cases « Violin » et « Box plot », et on peut ajouter les points de données réels avec la case « Data », ce qui peut toutefois surcharger le graphique : la clarté, c'est la simplicité. Pour dessiner plusieurs boxplots à la fois (par exemple les marges AFL pour chaque année de 1987 à 2010 dans aflsmall2.csv), il suffit de faire glisser la variable de regroupement (année) dans la case « Split by » : on obtient ainsi une vue d'ensemble année par année sans être submergé de détails, là où 24 histogrammes seraient illisibles."},{"titre":"Détecter les valeurs aberrantes avec les boxplots","contenu":"Parce que le boxplot marque automatiquement d'un point les observations extrêmes, on l'utilise souvent comme méthode informelle de détection des valeurs aberrantes, c'est-à-dire des observations « étrangement » éloignées du reste des données. Dans l'exemple du manuel, deux matchs affichent une marge de plus de 300 points, ce qui est suspect : on crée alors un filtre « margin>300 » via le bouton « Filtres », puis on produit une table de fréquences de la variable ID pour identifier les observations en cause (ID 14 et 134). Il faut alors retourner à la source des données : le plus souvent, quelqu'un a tapé le mauvais chiffre. Cette phase de recherche de fautes de frappe et de données manquantes s'appelle le nettoyage des données ; pour des valeurs moins extrêmes mais légitimes, la décision de les garder relève du jugement de l'analyste."},{"titre":"Diagrammes en barres","contenu":"Le diagramme en barres sert à afficher des comptages pour une variable catégorielle, par exemple le nombre de finales auxquelles chaque équipe AFL a participé dans le jeu de données afl.finalists. Pour ne garder que quatre équipes (Brisbane, Carlton, Fremantle, Richmond), on met d'abord en place un filtre avec l'opérateur « == », par exemple : afl.finalists == 'Brisbane' ou afl.finalists == 'Carlton', etc. Ensuite, dans « Exploration » - « Descriptives », on place la variable dans « Variables » et on coche « Bar plot » pour obtenir le diagramme."},{"titre":"Enregistrer les images et limites de Jamovi","contenu":"Pour sauvegarder un graphique, il suffit de cliquer avec le bouton droit de la souris sur l'image et de l'enregistrer dans un fichier aux formats « .eps », « svg » ou « pdf », qui produisent tous de belles images utilisables dans des devoirs ou des articles. Jamovi produit des graphiques par défaut très soignés, mais l'édition détaillée des tracés n'est pas encore possible. Pour des capacités de traçage plus avancées, les packages de R comme ggplot2, basé sur « The grammar of graphics », sont beaucoup plus puissants, mais ils exigent une bonne maîtrise préalable de R."}],"concepts":["Graphiques exploratoires vs graphiques de présentation","Histogramme et compartiments (bins)","Courbe de densité et estimation par noyau","Boxplot : médiane, boîte, moustaches","Écart interquartile (IQR) et règle du 1,5×IQR","Valeurs aberrantes et nettoyage des données","Graphique en violon","Boxplots multiples avec « Split by »","Diagramme en barres pour variables catégorielles","Export d'images (eps, svg, pdf)"],"formules":[{"nom":"Limite inférieure des moustaches du boxplot","formule":"Limite inférieure = 25e percentile − 1,5 × IQR","explication":"Par défaut, la moustache inférieure s'étend jusqu'au point de données le plus extrême qui ne descend pas en dessous de cette limite. Toute observation en dessous est tracée comme un point (valeur aberrante potentielle)."},{"nom":"Limite supérieure des moustaches du boxplot","formule":"Limite supérieure = 75e percentile + 1,5 × IQR","explication":"La moustache supérieure va jusqu'au point le plus extrême qui ne dépasse pas cette limite ; pour les marges AFL, la limite vaut 107, donc les observations 108 et 116 apparaissent comme des points."}],"jamovi":"Ouvrez « Exploration » - « Descriptives » et placez votre variable continue dans la case « Variables ». Dans le panneau « Plots », cochez « Histogram » pour un histogramme, « Density » pour une courbe de densité, « Box plot » pour un boxplot (ajoutez « Violin » et « Data » pour un graphique en violon avec les points), ou « Bar plot » pour un diagramme en barres d'une variable catégorielle. Pour tracer un boxplot par groupe, glissez la variable de regroupement (par exemple l'année) dans « Split by ». Pour repérer des valeurs aberrantes, cliquez sur le bouton « Filters » de l'onglet « Data » et tapez une expression comme « margin > 300 », puis demandez une table de fréquences de la variable ID (nominale). Enfin, pour sauvegarder un graphique, faites un clic droit sur l'image et enregistrez-la au format .eps, .svg ou .pdf.","glossaire":[{"terme":"Histogramme","definition":"Graphique qui divise les valeurs possibles d'une variable en compartiments et affiche, par des barres verticales, le nombre d'observations tombant dans chaque compartiment. Adapté aux variables d'intervalle ou de ratio."},{"terme":"Compartiment (bin)","definition":"Intervalle de valeurs utilisé par un histogramme pour regrouper les observations ; le nombre de compartiments influence la forme apparente de la distribution."},{"terme":"Courbe de densité","definition":"Variante lissée de l'histogramme, obtenue par estimation par noyau, qui visualise la distribution sur un intervalle continu sans dépendre du nombre de compartiments."},{"terme":"Boxplot","definition":"Tracé « boîte et moustaches » représentant de façon compacte la médiane (ligne épaisse), l'écart interquartile (boîte du 25e au 75e centile) et l'étendue des données (moustaches)."},{"terme":"Écart interquartile (IQR)","definition":"Distance entre le 25e et le 75e percentile ; il sert de base à la règle du 1,5×IQR qui définit la longueur maximale des moustaches d'un boxplot."},{"terme":"Valeur aberrante","definition":"Observation étrangement éloignée du reste des données, tracée comme un point au-delà des moustaches d'un boxplot ; elle peut résulter d'une erreur de saisie ou être légitime."},{"terme":"Graphique en violon","definition":"Variante du boxplot qui montre en plus la densité de probabilité par noyau des données aux différentes valeurs, souvent avec un marqueur de médiane et une boîte interquartile."},{"terme":"Diagramme en barres","definition":"Graphique affichant, pour une variable catégorielle, le comptage des observations de chaque catégorie sous forme de barres."},{"terme":"Nettoyage des données","definition":"Phase de l'analyse consistant à rechercher les fautes de frappe, les données manquantes et autres erreurs dans les fichiers de données brutes ; en pratique, elle peut prendre une grande partie du temps de l'analyste."},{"terme":"ggplot2","definition":"Package graphique de R, basé sur « The grammar of graphics », beaucoup plus puissant que les capacités actuelles de Jamovi pour l'édition avancée des tracés."}],"quiz":[{"question":"Dans la carte du choléra de John Snow (1854), que représentaient les petits points ?","options":["Les pompes à eau","L'emplacement d'un cas de choléra","Les rues de Londres","Les hôpitaux du quartier"],"bonne":1,"explication":"Chaque petit point représentait l'emplacement d'un cas de choléra, tandis que les grands symboles indiquaient les pompes à eau ; c'est ainsi que la pompe de Broad Street a été identifiée comme source de l'épidémie."},{"question":"Pour quel type de variable un histogramme est-il le plus pertinent ?","options":["Une variable nominale","Une variable ordinale à deux niveaux","Une variable sur une échelle d'intervalle ou de ratio","Uniquement une variable binaire"],"bonne":2,"explication":"Le manuel précise que les histogrammes sont plus pertinents avec une variable d'intervalle ou de ratio ; si les données sont à l'échelle nominale, les histogrammes sont inutiles."},{"question":"Quel est l'avantage principal d'une courbe de densité par rapport à un histogramme ?","options":["Elle affiche les comptages exacts de chaque catégorie","Elle est plus colorée par défaut","Elle fonctionne avec les variables nominales","Sa forme n'est pas affectée par le nombre de compartiments utilisés"],"bonne":3,"explication":"La courbe de densité utilise l'estimation par noyau pour lisser le bruit : contrairement à l'histogramme, sa forme ne dépend pas du nombre de compartiments, ce qui aide à juger la forme de la distribution."},{"question":"Dans un boxplot, que représente la ligne épaisse au milieu de la boîte ?","options":["La médiane","La moyenne","Le mode","L'écart-type"],"bonne":0,"explication":"La ligne épaisse au milieu de la boîte est la médiane ; la boîte elle-même s'étend du 25e au 75e centile."},{"question":"Par défaut, jusqu'où s'étendent les moustaches d'un boxplot dans Jamovi ?","options":["Jusqu'au minimum et au maximum des données","Jusqu'à 2 écarts-types de la moyenne","Jusqu'au point le plus extrême situé à moins de 1,5 × IQR des quartiles","Jusqu'aux 5e et 95e percentiles"],"bonne":2,"explication":"Les moustaches vont jusqu'au point de données le plus extrême qui ne dépasse pas 1,5 fois l'écart interquartile au-delà des quartiles ; toute observation en dehors est tracée comme un point (valeur aberrante)."},{"question":"Comment dessiner dans Jamovi des boxplots séparés de la marge pour chaque année ?","options":["En cochant la case « Density »","En faisant glisser la variable année dans la case « Split by »","En créant une variable calculée avec IF","En exportant les données vers R"],"bonne":1,"explication":"Pour tracer des boxplots séparés par groupe, il suffit de faire glisser la variable de regroupement (ici l'année) dans la case « Split by » des Descriptives."},{"question":"Dans l'exemple du manuel, quel filtre permet d'identifier les deux valeurs aberrantes suspectes des marges AFL ?","options":["margin == 300","margin < 300","ID > 300","margin > 300"],"bonne":3,"explication":"On tape « margin > 300 » dans le champ Filtres, puis on produit une table de fréquences de la variable ID (nominale), ce qui révèle les observations suspectes 14 et 134."},{"question":"Sous quels formats peut-on enregistrer un graphique par clic droit dans Jamovi ?","options":[".eps, .svg ou .pdf",".doc, .xls ou .ppt",".bmp uniquement",".omv ou .csv"],"bonne":0,"explication":"Le manuel indique qu'un clic droit sur l'image permet de l'enregistrer aux formats .eps, .svg ou .pdf, qui produisent tous de belles images pour des devoirs ou des articles."}],"exercice":{"titre":"Explorer les marges AFL et traquer les valeurs aberrantes","enonce":"Chargez le fichier aflsmall2.csv dans Jamovi (4296 observations, variables margin et year). 1) Tracez un histogramme puis une courbe de densité de la variable margin et décrivez la forme de la distribution (symétrique ou asymétrique ?). 2) Tracez un boxplot de margin, puis des boxplots séparés par année en utilisant « Split by ». 3) Le boxplot global montre des points très éloignés au-dessus de 300 : créez un filtre pour isoler ces observations et identifiez leurs numéros ID à l'aide d'une table de fréquences. 4) Enregistrez le boxplot final au format .pdf.","correction":"1) Ouvrez « Exploration » - « Descriptives », placez margin dans « Variables », puis dans « Plots » cochez « Histogram » ; l'histogramme montre une distribution asymétrique à droite (beaucoup de petites marges, quelques très grandes). Décochez « Histogram » et cochez « Density » : la courbe lissée confirme cette asymétrie sans dépendre du nombre de compartiments. 2) Cochez « Box plot » : la ligne épaisse est la médiane, la boîte va du 25e au 75e centile, et des points apparaissent au-delà des moustaches. Faites ensuite glisser year dans « Split by » pour obtenir un boxplot par année de 1987 à 2010, ce qui donne une vue d'ensemble impossible à obtenir avec 24 histogrammes. 3) Allez dans l'onglet « Data », cliquez sur « Filters » et tapez « margin > 300 ». Retournez dans « Exploration » - « Descriptives », placez ID (variable nominale) dans « Variables » et cochez « Frequency tables » : la table indique les ID 14 et 134. Ces marges de plus de 300 points sont presque certainement des fautes de frappe : il faudrait retourner à la source des données (nettoyage des données). 4) Faites un clic droit sur le graphique du boxplot et enregistrez l'image au format .pdf."}},{"numero":6,"titre":"Problèmes pratiques","sections":[{"titre":"Les données du monde réel sont désordonnées","contenu":"Ce chapitre parle honnêtement des réalités du travail avec les données : les ensembles de données du monde réel sont désordonnés. Très souvent, le fichier de départ n'a pas les variables stockées dans le bon format pour l'analyse voulue, il peut contenir beaucoup de valeurs manquantes, ou l'on ne veut analyser qu'un sous-ensemble des données. Il faut donc beaucoup de manipulation de données pour obtenir les variables dans le format nécessaire. Le chapitre couvre cinq sujets : la mise en tableaux des données, les expressions logiques, la transformation et le recodage de variables, quelques fonctions mathématiques utiles, et l'extraction de sous-ensembles."},{"titre":"Tableaux de fréquences et tableaux de contingence","contenu":"Une tâche très courante est la construction de tableaux de fréquences ou de tableaux croisés d'une variable par rapport à une autre. Avec le fichier nightgarden.csv (variables speaker et utterance), la case « Frequency Tables » du menu « Descriptives » produit une table listant les niveaux de la variable et le nombre de fois où chacun apparaît, avec pourcentages et pourcentages cumulés. Pour croiser deux variables, on utilise « Frequencies » - « Contingency Tables » - « Independent Samples », en plaçant une variable dans « Rows » et l'autre dans « Columns » : chaque cellule contient un comptage. On peut ajouter des pourcentages par ligne (part des énoncés de chaque locuteur) ou par colonne (part de chaque énoncé attribuable à chaque locuteur) via les cases de l'option « Cellules »."},{"titre":"Expressions et opérateurs logiques","contenu":"Beaucoup de transformations de données reposent sur l'idée de valeur logique : une affirmation est soit VRAI, soit FAUX, sans nuance de gris. L'opérateur d'égalité « == » force Jamovi à porter un jugement vrai/faux, par exemple 2 + 2 == 5 renvoie FAUX pour toutes les lignes. Les autres opérateurs relationnels sont < (moins que), <= (inférieur ou égal), > (supérieur à), >= (supérieur ou égal) et != (pas égal à) ; par exemple 2 != 3 renvoie VRAI. On peut aussi combiner des affirmations avec NOT (négation), « or » (vrai si au moins un des deux termes est vrai) et « and » (vrai seulement si les deux termes sont vrais), par exemple (2+2 == 4) or (2+2 == 5) est VRAI mais (2+2 == 4) and (2+2 == 5) est FAUX."},{"titre":"Opérations logiques sur du texte","contenu":"Les opérateurs logiques s'appliquent aussi au texte : « chat » == « chat » est VRAI, mais Jamovi n'est pas du tout tolérant sur la casse et l'espacement, donc « chat » == « CHAT » ou « chat » == « c h a t » sont FAUX. Les opérateurs < et > comparent les chaînes selon un ordre de tri : « chat » < « chien » est VRAI car « chat » vient avant alphabétiquement. Attention cependant : Jamovi suppose que toutes les lettres majuscules passent avant toutes les minuscules, si bien que « CAT » < « cat » est vrai mais « fourmilier » < « ZEBRE » est faux, ce qui peut sembler contre-intuitif. Un tableau du manuel donne l'ordre complet des caractères (ponctuation, chiffres, majuscules, puis minuscules)."},{"titre":"Transformer et recoder une variable","contenu":"Transformer une variable signifie en pratique appliquer une fonction mathématique simple à la variable originale pour créer une nouvelle variable mieux adaptée à la description ou aux hypothèses des tests. Avec le fichier likert.omv (échelle de 1 à 7), on centre les réponses avec « Data » - « Compute » et la formule « likert.raw − 4 » pour créer likert.centred ; on obtient la force de l'opinion avec ABS(likert.centred), et la direction de l'opinion avec IF(likert.centred == 0, 0, likert.centred / opinion.strength), qui convertit les négatifs en −1, les positifs en +1 et garde 0. Une déclaration IF s'écrit « IF(expression, value, else) » : si l'expression logique est VRAIE on retourne « value », sinon « else ». Des IF imbriqués permettent de réduire une variable continue en catégories discrètes, par exemple découper l'âge en jeunes (0-20), adultes (21-40) et plus âgés (41-60), mais il faut vérifier que les catégories ont un sens pour le projet, car catégoriser des données continues comporte parfois des inconvénients assez graves."},{"titre":"Transformations réutilisables et fonctions mathématiques","contenu":"Le bouton « Data » - « Transform » permet de créer une transformation nommée, enregistrée avec le fichier .omv, qui peut être réappliquée à autant de variables que l'on veut, par exemple pour recoder 20 items de questionnaire de la même manière. Dans l'expression, on utilise « $source » au lieu du nom de la variable, par exemple ABS($source − 4), et le bouton « Add condition » permet de définir des conditions successives (if $source <= 20 use 'young', etc.). Jamovi offre aussi des fonctions mathématiques utiles : SQRT(x) pour la racine carrée, ABS(x) pour la valeur absolue, LOG10(x) pour le logarithme en base 10, LN(x) pour le logarithme naturel, EXP(x) pour l'exponentielle et BOXCOX(x, lambda). Le logarithme est le « contraire » de l'élévation à la puissance : dire que 10³ = 1000 équivaut à dire que log₁₀(1000) = 3 ; le logarithme naturel utilise la base e = 2,718282 (nombre d'Euler), et la log-transformation d'une variable est très fréquente en statistiques."},{"titre":"Extraction d'un sous-ensemble de données","contenu":"Il est très important de pouvoir extraire un sous-ensemble particulier de données, par exemple une seule condition expérimentale ou les personnes de plus de 50 ans. Dans Jamovi, on ouvre la fenêtre de filtre en cliquant sur « Filters » dans la barre d'outils « Data », puis on tape une expression comme speaker == 'makka-pakka'. Une nouvelle colonne « Filter 1 » apparaît dans le tableur : les cas qui ne passent pas le filtre sont grisés (filtrés) et ceux qui passent sont marqués d'une coche verte. On peut construire des filtres plus complexes avec les expressions logiques, par exemple utterance == 'pip' ou utterance == 'oo' pour garder seulement ces énoncés."}],"concepts":["Manipulation et nettoyage de données","Tableau de fréquences","Tableau de contingence (tableau croisé)","Pourcentages par ligne et par colonne","Valeurs logiques VRAI / FAUX","Opérateurs relationnels : ==, !=, <, <=, >, >=","Opérateurs NOT, and, or","Variables calculées (Compute) et fonction IF","Transformations réutilisables avec $source","Logarithmes, exponentielles et filtres de sous-ensembles"],"formules":[{"nom":"Structure d'une déclaration IF","formule":"IF(expression, value, else)","explication":"Si l'expression logique ou mathématique est VRAIE, Jamovi retourne « value » ; sinon il retourne « else », qui peut lui-même contenir un autre IF (IF imbriqués) pour créer plusieurs catégories."},{"nom":"Signe d'une opinion centrée","formule":"IF(likert.centred == 0, 0, likert.centred / opinion.strength)","explication":"Cette formule convertit tous les nombres négatifs en −1, tous les positifs en +1 et garde zéro à 0 ; le IF est nécessaire car la division de zéro par zéro ne fonctionne pas."},{"nom":"Lien puissance-logarithme (base 10)","formule":"10³ = 1000 ⟺ log₁₀(1000) = 3","explication":"Le logarithme est le « contraire » de l'élévation à la puissance : dire que 10 à la puissance 3 égale 1000 équivaut à dire que le logarithme en base 10 de 1000 égale 3."},{"nom":"Nombre d'Euler et exponentielle","formule":"e ≈ 2,718282 ; exp(x) = eˣ ; ln(x) = logₑ(x)","explication":"Élever e à la puissance x s'appelle l'exponentielle de x (fonction EXP() dans Jamovi) ; le logarithme naturel, en base e, correspond à la fonction LN()."}],"jamovi":"Pour un tableau de fréquences, ouvrez « Exploration » - « Descriptives », placez la variable et cochez « Frequency tables ». Pour un tableau croisé, allez dans « Frequencies » - « Contingency Tables » - « Independent Samples », placez une variable dans « Rows » et l'autre dans « Columns », puis cochez « Ligne » ou « Colonne » dans l'option « Cellules » pour ajouter des pourcentages. Pour créer une variable calculée, cliquez sur « Data » - « Compute », nommez la variable et tapez une formule (par exemple likert.raw − 4, ABS(likert.centred) ou un IF) ; le bouton « fx » liste les fonctions et variables disponibles. Pour une transformation réutilisable, sélectionnez la variable source, cliquez sur « Data » - « Transform », choisissez « Create New Transform... » et écrivez l'expression avec $source (par exemple ABS($source − 4)), ou ajoutez des conditions avec le bouton « + » (Add condition). Enfin, pour extraire un sous-ensemble, cliquez sur « Filters » dans l'onglet « Data » et tapez une expression logique comme speaker == 'makka-pakka'.","glossaire":[{"terme":"Manipulation de données","definition":"Ensemble des opérations nécessaires pour obtenir les variables d'un ensemble de données dans le format requis par l'analyse : reformatage, recodage, gestion des valeurs manquantes, extraction de sous-ensembles."},{"terme":"Tableau de fréquences","definition":"Tableau listant les niveaux d'une variable (colonne « Levels ») et le nombre de fois où chaque niveau apparaît dans les données (colonne « Counts »), souvent avec pourcentages et pourcentages cumulés."},{"terme":"Tableau de contingence","definition":"Tableau croisé de deux variables où chaque cellule contient le nombre de cas pour une combinaison de niveaux, par exemple combien de fois chaque locuteur a prononcé chaque énoncé."},{"terme":"Valeur logique","definition":"Affirmation sur le fait que quelque chose est vrai ou faux ; Jamovi n'en connaît que deux, VRAI et FAUX, sans nuance de gris."},{"terme":"Opérateur d'égalité (==)","definition":"Opérateur qui force Jamovi à porter un jugement vrai/faux, à distinguer du signe égal simple = ; la confusion entre les deux est une coquille très courante en programmation."},{"terme":"Transformation de variable","definition":"Application d'une fonction mathématique relativement simple à une variable originale pour créer une nouvelle variable qui décrit mieux ce qui intéresse l'analyste ou respecte mieux les hypothèses des tests."},{"terme":"Fonction IF","definition":"Fonction Jamovi à trois parties, IF(expression, value, else), qui retourne « value » si l'expression logique est vraie et « else » sinon ; les IF imbriqués permettent de découper une variable en catégories."},{"terme":"$source","definition":"Mot-clé utilisé dans une transformation Jamovi (bouton « Transform ») pour faire référence à la variable source, ce qui permet de réappliquer la même transformation à autant de variables que l'on veut."},{"terme":"Logarithme","definition":"Opération « contraire » de l'élévation à la puissance : log₁₀(1000) = 3 parce que 10³ = 1000 ; le logarithme naturel LN() utilise la base e et la log-transformation est très courante en statistiques."},{"terme":"Filtre (Filters)","definition":"Outil de l'onglet « Data » qui garde uniquement les observations satisfaisant une expression logique (par exemple speaker == 'makka-pakka'), en grisant les cas exclus dans le tableur."}],"quiz":[{"question":"Dans un tableau de fréquences Jamovi, que contient la colonne « Counts » ?","options":["Le pourcentage cumulé de chaque niveau","La moyenne de la variable","Le nombre de fois où chaque niveau apparaît dans les données","Le rang alphabétique des niveaux"],"bonne":2,"explication":"La colonne « Levels » liste les niveaux de la variable et la colonne « Counts » indique combien de fois chaque niveau apparaît : c'est la définition d'une table de fréquences."},{"question":"Comment obtenir un tableau croisé de speaker par utterance dans Jamovi ?","options":["« Exploration » - « Descriptives » - « Histogram »","« Frequencies » - « Contingency Tables » - « Independent Samples »","« Data » - « Transform » - « Create New Transform »","« Data » - « Filters »"],"bonne":1,"explication":"Le tableau de contingence se construit via « Frequencies » - « Contingency Tables » - « Independent Samples », en plaçant speaker dans « Rows » et utterance dans « Columns »."},{"question":"Que renvoie l'expression 2 + 2 == 5 dans Jamovi ?","options":["Un ensemble complet de valeurs FALSE","Un message d'erreur","La valeur 5","Un ensemble de valeurs TRUE"],"bonne":0,"explication":"L'opérateur d'égalité == force un jugement vrai/faux : comme 2 + 2 ne vaut pas 5, Jamovi remplit la colonne de valeurs « FALSE » — et il fait de même si l'on tape 2 + 2 = 5, car il comprend qu'il s'agit d'un test."},{"question":"Quel opérateur logique renvoie VRAI lorsque les deux valeurs comparées ne sont pas identiques ?","options":["==","<=",">=","!="],"bonne":3,"explication":"L'opérateur « pas égal à » != retourne VRAI lorsque les choses ne sont pas identiques de part et d'autre : 2 != 3 renvoie VRAI."},{"question":"Que vaut l'expression (2+2 == 4) and (2+2 == 5) ?","options":["VRAI, car un des deux termes est vrai","FAUX, car « and » exige que les deux parties soient vraies","0,5, car une partie sur deux est vraie","Une erreur de syntaxe"],"bonne":1,"explication":"L'opérateur « and » est une conjonction : il faut que les deux parties soient vraies. Comme 2+2 == 5 est faux, l'ensemble est FAUX ; avec « or », le résultat aurait été VRAI."},{"question":"Pourquoi « fourmilier » < « ZEBRE » est-il évalué comme FAUX dans Jamovi ?","options":["Parce que « fourmilier » a plus de lettres que « ZEBRE »","Parce que Jamovi ne compare pas les chaînes de texte","Parce que les accents ne sont pas gérés","Parce que Jamovi place toutes les lettres majuscules avant toutes les minuscules"],"bonne":3,"explication":"Jamovi suppose que toutes les majuscules passent avant toutes les minuscules dans l'ordre de tri : « FOURMILIER » < « ZEBRE » est vrai, mais « fourmilier » < « ZEBRE » est faux, ce qui est contre-intuitif."},{"question":"Avec le fichier likert.omv, quelle formule crée la variable centrée likert.centred ?","options":["ABS(likert.raw)","likert.raw − 4","LOG10(likert.raw)","IF(likert.raw == 4, 0, 1)"],"bonne":1,"explication":"L'échelle allant de 1 à 7, son point médian est 4 : soustraire 4 des scores bruts (likert.raw − 4) recode les réponses de −3 à +3, avec 0 pour « sans opinion »."},{"question":"Dans une transformation créée avec « Data » - « Transform », à quoi sert le mot-clé $source ?","options":["À faire référence à la variable source, pour réutiliser la transformation sur plusieurs variables","À indiquer le fichier de données d'origine","À définir la valeur retournée quand la condition est fausse","À importer une fonction depuis R"],"bonne":0,"explication":"Au lieu du nom d'une variable précise, on écrit $source (par exemple ABS($source − 4)) : la transformation, sauvegardée avec le fichier .omv, peut alors être appliquée à autant de variables différentes qu'on le souhaite."}],"exercice":{"titre":"Manipuler les données du jardin de nuit","enonce":"Chargez le fichier nightgarden.csv dans Jamovi (variables speaker et utterance). 1) Produisez la table de fréquences de speaker et indiquez combien de fois chaque personnage parle. 2) Construisez le tableau de contingence de speaker (lignes) par utterance (colonnes), puis ajoutez les pourcentages par ligne : quel pourcentage des énoncés de makka-pakka sont des « pip » ? 3) Créez un filtre pour ne garder que les cas où le locuteur est makka-pakka, puis vérifiez avec une table de fréquences. 4) Modifiez le filtre pour ne conserver que les énoncés « pip » ou « oo ».","correction":"1) Ouvrez « Exploration » - « Descriptives », placez speaker dans « Variables » et cochez « Frequency tables » : la table montre makka-pakka 4 fois (40 %), tombliboo 2 fois (20 %) et upsy-daisy 4 fois (40 %). 2) Allez dans « Frequencies » - « Contingency Tables » - « Independent Samples », glissez speaker dans « Rows » et utterance dans « Columns » ; chaque cellule est un comptage (par exemple makka-pakka a dit « onk » 2 fois). Dans l'option « Cellules », cochez « Ligne » : les pourcentages par ligne apparaissent et montrent que 50 % des énoncés de makka-pakka sont des « pip » (les 50 % restants sont des « onk »). En cochant plutôt « Colonne », on verrait par exemple que chaque fois que « ee » est prononcé, c'est un tombliboo qui le dit (100 %). 3) Dans l'onglet « Data », cliquez sur « Filters » et tapez, à côté du signe « = », l'expression speaker == 'makka-pakka'. Une colonne « Filter 1 » apparaît : les cas qui ne sont pas makka-pakka sont grisés (croix rouge) et les cas retenus portent une coche verte. Une table de fréquences de speaker ne montre alors plus que makka-pakka avec N = 4 (100 %). 4) Remplacez l'expression du filtre par utterance == 'pip' or utterance == 'oo' : seules les lignes dont l'énoncé est « pip » ou « oo » restent actives, illustrant la construction de filtres plus complexes avec les expressions logiques."}},{"numero":7,"titre":"Introduction à la probabilité","sections":[{"titre":"Probabilité et statistiques : deux questions inverses","contenu":"La théorie des probabilités est « la doctrine des chances » : le modèle du monde est connu (par exemple p(face) = 0,5 pour une pièce équilibrée) et on calcule la fréquence des différents événements qui peuvent se produire. Les statistiques fonctionnent dans l'autre sens : nous ne connaissons pas la vérité sur le monde, nous n'avons que des données, et nous voulons en déduire quel modèle du monde est le bon. Par exemple, si un ami obtient 10 faces sur 10 lancers, l'inférence statistique consiste à déterminer s'il faut croire au modèle p(face) = 0,5 ou soupçonner une pièce truquée. Ces deux questions sont différentes mais étroitement liées, et l'inférence statistique est construite sur la théorie des probabilités."},{"titre":"La vision fréquentiste de la probabilité","contenu":"Le point de vue fréquentiste, le plus dominant en statistique, définit la probabilité comme une fréquence à long terme : si on lance une pièce encore et encore, la proportion de faces N_F/N converge vers 0,5 quand N tend vers l'infini. Cette définition est objective (la probabilité est ancrée dans le monde) et sans ambiguïté (deux observateurs de la même séquence doivent trouver la même réponse). Elle a cependant des inconvénients : les séquences infinies n'existent pas dans le monde physique, et elle interdit d'attribuer une probabilité à un événement unique non répétable, comme « la probabilité de pluie à Adélaïde le 2 novembre 2048 est de 60 % »."},{"titre":"La vision bayésienne de la probabilité","contenu":"La vision bayésienne, ou subjectiviste, définit la probabilité d'un événement comme le degré de croyance qu'un agent intelligent et rationnel attribue à la vérité de cet événement ; les probabilités existent dans les esprits, pas dans le monde. On peut opérationnaliser ce degré de croyance en termes de paris rationnels : si je crois qu'il y a 60 % de chances de pluie, un pari équilibré à 5 $ sur la pluie me semble bon. L'avantage principal est de pouvoir assigner des probabilités à n'importe quel événement, même non répétable ; l'inconvénient est le manque d'objectivité, car deux observateurs rationnels ayant des connaissances différentes peuvent légitimement avoir des croyances différentes sur le même événement. Aucune des deux approches n'est mathématiquement incorrecte, et le manuel adopte principalement l'approche fréquentiste car c'est celle qui domine les analyses statistiques en psychologie."},{"titre":"Distributions de probabilités et règles de base","contenu":"Dans le langage des probabilités (formalisé par Kolmogorov), chaque résultat possible d'une observation est un événement élémentaire, et l'ensemble de tous les événements possibles forme l'espace d'échantillonnage. À chaque événement X on assigne une probabilité P(X) comprise entre 0 (impossible) et 1 (certain), et la somme des probabilités des événements élémentaires doit être égale à 1 : c'est la loi de la probabilité totale. Quand ces exigences sont satisfaites, on a une distribution de probabilités, illustrée dans le manuel par les cinq pantalons de l'auteur. On peut aussi définir des événements non élémentaires (par exemple « porter un jean ») dont la probabilité s'obtient en additionnant celles des événements élémentaires correspondants, et les probabilités obéissent à des règles comme P(¬A) = 1 − P(A)."},{"titre":"La distribution binomiale","contenu":"La distribution binomiale décrit le nombre de « succès » X obtenus lors de N essais indépendants, chaque essai ayant une probabilité de succès θ ; on écrit X ~ Binomiale(θ, N). L'exemple du manuel : en lançant 20 dés dont une face sur six porte un crâne (θ ≈ 0,167), la probabilité d'obtenir exactement 4 crânes est d'environ 0,20. C'est une distribution discrète : chaque valeur possible de X (de 0 à N) a une probabilité représentée par une barre verticale, et la somme des hauteurs vaut 1. Modifier θ déplace la distribution, tandis qu'augmenter N (par exemple passer de 20 à 100 lancers de pièce) accroît la variabilité des résultats possibles."},{"titre":"La distribution normale et la densité de probabilité","contenu":"La distribution normale, ou « courbe en cloche » gaussienne, est la plus importante des distributions ; elle est continue et décrite par deux paramètres, la moyenne μ et l'écart-type σ, et on écrit X ~ Normal(μ, σ). Changer μ déplace la courbe sans changer sa forme ; augmenter σ élargit la courbe et abaisse son pic, l'aire totale sous la courbe restant égale à 1. Quelle que soit la valeur des paramètres, 68,3 % de la distribution se situe à moins d'un écart-type de la moyenne, 95,4 % à moins de deux écarts-types et 99,7 % à moins de trois écarts-types. Pour une variable continue, la probabilité d'une valeur exacte est nulle : la hauteur de la courbe p(x) est une densité de probabilité, et seules les aires sous la courbe entre deux bornes s'interprètent comme de véritables probabilités."},{"titre":"Les distributions t, χ² et F","contenu":"Trois autres distributions continues, étroitement liées à la normale, reviennent partout en statistique. La distribution t ressemble à une normale mais avec des « queues plus lourdes » ; elle apparaît quand on pense que les données sont normales mais qu'on ne connaît ni la moyenne ni l'écart-type (elle sera utilisée pour le test t). La distribution χ² apparaît notamment dans l'analyse de données catégorielles : quand on additionne les carrés de plusieurs variables normalement distribuées (une « somme de carrés »), le résultat suit une distribution χ², qui ne prend que des valeurs positives et est asymétrique. La distribution F apparaît quand on doit comparer deux sommes de carrés (donc deux distributions χ²) entre elles, ce qui sera au cœur de l'ANOVA."}],"concepts":["Statistiques inférentielles vs statistiques descriptives","Vision fréquentiste : probabilité comme fréquence à long terme","Vision bayésienne : probabilité comme degré de croyance","Événement élémentaire et espace d'échantillonnage","Loi de la probabilité totale (les probabilités somment à 1)","Distribution binomiale (paramètres N et θ)","Distribution normale (paramètres μ et σ)","Densité de probabilité et aire sous la courbe","Règle 68,3 % / 95,4 % / 99,7 %","Distributions t, χ² et F liées à la normale"],"formules":[{"nom":"Probabilité du complément","formule":"P(¬A) = 1 − P(A)","explication":"La probabilité qu'un événement A ne se produise pas est 1 moins la probabilité qu'il se produise."},{"nom":"Probabilité de A ou B","formule":"P(A ∪ B) = P(A) + P(B) − P(A ∩ B)","explication":"Pour la probabilité que A ou B se produise, on additionne les deux probabilités puis on retire la probabilité de leur intersection pour ne pas la compter deux fois."},{"nom":"Probabilité de A et B","formule":"P(A ∩ B) = P(A|B) × P(B)","explication":"La probabilité que A et B se produisent ensemble est la probabilité conditionnelle de A sachant B multipliée par la probabilité de B."},{"nom":"Distribution binomiale","formule":"P(X|θ, N) = N! / (X!(N − X)!) × θˣ × (1 − θ)^(N−X)","explication":"Donne la probabilité d'obtenir exactement X succès en N essais quand la probabilité de succès d'un essai est θ ; X! désigne la factorielle."},{"nom":"Densité de la distribution normale","formule":"p(X|μ, σ) = 1/√(2πσ) × exp(−(X − μ)² / (2σ²))","explication":"Formule de la courbe en cloche, entièrement déterminée par la moyenne μ et l'écart-type σ ; p(X) est une densité, pas une probabilité."},{"nom":"Notation de distribution","formule":"X ~ Binomiale(θ, N) ; X ~ Normal(μ, σ)","explication":"Le symbole ~ signifie que la variable aléatoire X est générée aléatoirement à partir de la distribution indiquée avec ses paramètres."}],"jamovi":"Ce chapitre est surtout théorique, mais on peut l'illustrer dans Jamovi. Pour visualiser une distribution empirique, créez une variable calculée (menu Data > Compute) avec la fonction = NORM(100,15) pour simuler des tirages d'une loi normale, puis ouvrez Analyses > Exploration > Descriptives et cochez un histogramme ou un graphique de densité : plus le nombre de lignes est grand, plus l'histogramme ressemble à la courbe en cloche théorique. Vous pouvez aussi construire un diagramme en barres des probabilités d'événements discrets (comme la distribution « pantalon » ou la binomiale) en saisissant les valeurs et en traçant un graphique en barres, en vérifiant que les probabilités sont entre 0 et 1 et somment à 1.","glossaire":[{"terme":"Théorie des probabilités","definition":"Branche des mathématiques qui, partant d'un modèle connu du monde, calcule la fréquence à laquelle différents types d'événements se produisent."},{"terme":"Probabilité fréquentiste","definition":"Définition de la probabilité comme la fréquence à long terme d'un événement dans une séquence répétée : la proportion observée converge vers la vraie probabilité quand N → ∞."},{"terme":"Probabilité bayésienne","definition":"Définition de la probabilité comme le degré de croyance qu'un agent rationnel attribue à la vérité d'un événement, opérationnalisable par les paris qu'il est prêt à accepter."},{"terme":"Événement élémentaire","definition":"Résultat possible d'une observation tel qu'à chaque observation un et un seul de ces événements se produit."},{"terme":"Espace d'échantillonnage","definition":"Ensemble de tous les événements élémentaires possibles (la « garde-robe » dans l'exemple des pantalons)."},{"terme":"Distribution de probabilités","definition":"Attribution d'une probabilité comprise entre 0 et 1 à chaque événement élémentaire, la somme de toutes ces probabilités étant égale à 1."},{"terme":"Variable aléatoire","definition":"Quantité, comme le nombre de succès X d'une expérience, dont la valeur réelle est due au hasard."},{"terme":"Probabilité de succès (θ)","definition":"Paramètre de la distribution binomiale indiquant la probabilité qu'un essai unique produise le résultat qui nous intéresse."},{"terme":"Densité de probabilité","definition":"Hauteur p(x) de la courbe d'une distribution continue ; elle n'est pas une probabilité en soi, mais l'aire sous la courbe entre deux valeurs correspond à une vraie probabilité."},{"terme":"Degrés de liberté","definition":"Paramètre qui détermine la forme exacte des distributions t, χ² et F (par exemple une distribution t à 3 degrés de liberté)."}],"quiz":[{"question":"Quelle est la différence fondamentale entre une question de probabilité et une question de statistique ?","options":["En probabilité on utilise des nombres, en statistique des graphiques","En probabilité le modèle est connu et on prédit les données ; en statistique on a les données et on cherche le modèle","La probabilité concerne les pièces de monnaie, la statistique concerne les humains","Il n'y a aucune différence, ce sont deux noms pour la même discipline"],"bonne":1,"explication":"Le manuel insiste : en théorie des probabilités le modèle du monde est connu (p. ex. p(face) = 0,5) et les données ne le sont pas ; en statistique nous n'avons que des données et nous voulons en déduire quel modèle du monde est le bon."},{"question":"Selon la vision fréquentiste, que signifie « la probabilité de face est de 0,5 » ?","options":["Mon degré de croyance en l'obtention d'une face vaut 0,5","Chaque lancer donnera exactement une demi-face","Sur deux lancers, on obtient toujours une face et un pile","Si on lançait la pièce à l'infini, la proportion de faces convergerait vers 50 %"],"bonne":3,"explication":"Le fréquentiste définit la probabilité comme une fréquence à long terme : quand N → ∞, la proportion N_F/N converge vers la vraie probabilité. Les croyances personnelles relèvent de la vision bayésienne."},{"question":"Pourquoi un fréquentiste strict refuse-t-il d'énoncer « il y a 60 % de chances de pluie à Adélaïde le 2 novembre 2048 » ?","options":["Parce que cet événement est unique et non répétable, donc aucune fréquence à long terme ne peut être définie","Parce que la météo est trop chaotique pour être modélisée","Parce que 60 % n'est pas une probabilité valide","Parce que les fréquentistes ne croient pas aux prévisions météorologiques"],"bonne":0,"explication":"La définition fréquentiste exige une séquence d'événements répétables ; or il n'y a qu'une seule ville d'Adélaïde et un seul 2 novembre 2048, donc aucune probabilité fréquentiste ne peut s'attacher à cet événement unique."},{"question":"Dan possède 5 pantalons avec P(jean bleu) = 0,5, P(jean gris) = 0,3, P(jean noir) = 0,1, P(costume) = 0 et P(survêtement) = 0,1. Quelle est la probabilité qu'il porte un jean ?","options":["0,5","1,0","0,9","0,3"],"bonne":2,"explication":"L'événement non élémentaire « porter un jean » regroupe les trois événements élémentaires jean bleu, gris et noir : P(E) = 0,5 + 0,3 + 0,1 = 0,9."},{"question":"Dans l'expérience des 20 dés dont une face sur six porte un crâne, quelle distribution décrit le nombre de crânes obtenus ?","options":["Une distribution normale de moyenne 4","Une distribution χ² à 20 degrés de liberté","Une distribution F","Une distribution binomiale avec N = 20 et θ ≈ 0,167"],"bonne":3,"explication":"On compte le nombre de succès (crânes) sur N = 20 essais indépendants avec une probabilité de succès θ = 1/6 ≈ 0,167 par essai : c'est exactement X ~ Binomiale(θ, N)."},{"question":"Pour une distribution normale, quel pourcentage des observations se situe à moins de deux écarts-types de la moyenne ?","options":["68,3 %","95,4 %","99,7 %","50 %"],"bonne":1,"explication":"Quelle que soit la moyenne et l'écart-type, 68,3 % de la distribution se trouve à un écart-type de la moyenne, 95,4 % à deux écarts-types et 99,7 % à trois écarts-types."},{"question":"Piège classique : si la température de demain suit une loi normale de moyenne 23 et d'écart-type 1, quelle est la probabilité qu'il fasse exactement 23 degrés ?","options":["Environ 0,4, la hauteur de la courbe au sommet","50 %, car 23 est la moyenne","Zéro (ou un nombre si proche de zéro qu'il pourrait aussi bien l'être)","68,3 %"],"bonne":2,"explication":"Pour une variable continue, la probabilité d'une valeur exacte est nulle, comme lancer une fléchette sur une cible infiniment petite ; seule la probabilité que la valeur tombe dans une plage (l'aire sous la courbe) a un sens. La hauteur de la courbe est une densité, pas une probabilité."},{"question":"Quelle affirmation sur les distributions t, χ² et F est correcte ?","options":["La distribution t ressemble à la normale mais avec des queues plus lourdes, la χ² provient d'une somme de carrés de variables normales, et la F sert à comparer deux sommes de carrés","Ce sont trois distributions discrètes sans lien avec la normale","La distribution χ² est symétrique et peut prendre des valeurs négatives","La distribution F est identique à la distribution t"],"bonne":0,"explication":"Le manuel résume ainsi les trois distributions : toutes continues et profondément liées à la normale ; la t a des queues plus lourdes, la χ² (positive et asymétrique) apparaît quand on additionne des carrés de variables normales, et la F apparaît quand on compare deux distributions χ² entre elles."}],"exercice":{"titre":"Du dé à la courbe en cloche","enonce":"1) On lance 20 dés à six faces dont une face porte un crâne. Nommez la distribution du nombre de crânes X, donnez ses paramètres, et dites si elle est discrète ou continue. 2) Les scores de QI suivent une loi Normal(μ = 100, σ = 15). Sans calcul compliqué, donnez le pourcentage approximatif de personnes ayant un QI entre 85 et 115, puis entre 70 et 130. 3) Expliquez pourquoi on ne peut pas parler de la probabilité qu'une personne ait un QI d'exactement 100, et ce qu'il faut calculer à la place. 4) Vérifiez le point 2 par simulation dans Jamovi.","correction":"1) X suit une distribution binomiale : X ~ Binomiale(θ, N) avec N = 20 (paramètre de taille) et θ = 1/6 ≈ 0,167 (probabilité de succès). C'est une distribution discrète : X ne peut prendre que les valeurs entières 0, 1, 2, ..., 20 (on peut obtenir 3 ou 4 crânes, jamais 3,9). Le manuel indique que P(X = 4) ≈ 0,20. 2) L'intervalle 85–115 correspond à μ ± 1σ (100 ± 15), donc environ 68,3 % des personnes ; l'intervalle 70–130 correspond à μ ± 2σ, donc environ 95,4 %. 3) Le QI modélisé comme variable continue rend la probabilité d'une valeur exacte nulle : la hauteur de la courbe est une densité de probabilité, pas une probabilité. Ce qui a un sens, c'est la probabilité que le QI se situe dans une plage, par exemple entre 99,5 et 100,5, obtenue comme l'aire sous la courbe entre ces bornes. 4) Dans Jamovi : créer un fichier avec de nombreuses lignes, calculer une variable avec = NORM(100,15) (Data > Compute), puis Analyses > Exploration > Descriptives avec histogramme et courbe de densité ; on observe une courbe en cloche centrée sur 100, et en comptant les observations entre 85 et 115 (par exemple avec un filtre) on retrouve environ 68 % des cas."}},{"numero":8,"titre":"Estimation de quantités inconnues à partir d'un échantillon","sections":[{"titre":"Échantillons, populations et méthodes d'échantillonnage","contenu":"Un échantillon est concret : ce sont les données que vous avez réellement recueillies ; la population est l'ensemble, généralement beaucoup plus grand et souvent abstrait, de toutes les observations possibles au sujet desquelles on veut tirer des conclusions. Définir la population d'intérêt est souvent difficile : pour une expérience avec 100 étudiants, s'agit-il des étudiants d'Adélaïde, de tous les humains, de tout être intelligent ? La relation entre échantillon et population dépend de la méthode d'échantillonnage : dans un simple échantillon aléatoire, chaque membre de la population a les mêmes chances d'être sélectionné, avec ou sans remise. Un plan d'échantillonnage biaisé (comme ne tirer que des jetons noirs du sac) réduit fortement la valeur probante des données, car l'échantillon ne renseigne plus fidèlement sur la population."},{"titre":"Échantillons non aléatoires en pratique","contenu":"Dans le monde réel, presque aucun échantillon n'est un simple échantillon aléatoire de la population d'intérêt. L'échantillonnage stratifié divise la population en strates et échantillonne dans chacune, ce qui est utile quand certaines sous-populations sont rares (suréchantillonnage) ; l'échantillonnage en boule de neige permet d'atteindre des populations cachées, mais produit des échantillons très non aléatoires et pose des questions éthiques ; l'échantillonnage de commodité (comme les étudiants de premier cycle en psychologie) choisit ce qui arrange le chercheur. Ce n'est pas toujours dramatique : ce qui compte est que l'échantillon soit aléatoire à l'égard du phénomène psychologique étudié. Il faut réfléchir à la population visée lors de la conception, et proposer une théorie précise du biais possible si l'on critique un échantillon de convenance."},{"titre":"Paramètres de population et statistiques d'échantillon","contenu":"Les statisticiens opérationnalisent la notion de population par une distribution de probabilités : par exemple, les scores de QI sont conçus pour suivre une loi normale avec une moyenne de population μ = 100 et un écart-type σ = 15 ; ces valeurs sont les paramètres de population. Si l'on tire un échantillon de 100 personnes, on obtient par exemple une moyenne d'échantillon de 98,5 et un écart-type de 15,9 : ce sont des statistiques d'échantillon, propriétés de vos données, semblables mais non identiques aux paramètres. En général, les statistiques d'échantillon sont ce que l'on peut calculer à partir des données, et les paramètres de population sont ce que l'on veut apprendre."},{"titre":"La loi des grands nombres","contenu":"Un échantillon plus grand donne généralement de meilleures informations : avec 10 000 mesures de QI simulées, la moyenne d'échantillon (99,68) et l'écart-type (14,90) sont très proches des vraies valeurs de la population. La loi des grands nombres formalise cette intuition, déjà exprimée par Jacob Bernoulli en 1713 : à mesure que la taille de l'échantillon N approche l'infini (N → ∞), la moyenne de l'échantillon X̄ approche la moyenne de la population μ. C'est l'un des outils les plus importants de la théorie statistique, car il justifie la croyance que collecter de plus en plus de données mène finalement à la vérité. Cependant, elle ne fournit qu'une garantie « à long terme », peu réconfortante quand on dispose d'un échantillon réel de taille modeste."},{"titre":"Distributions d'échantillonnage et théorème de la limite centrale","contenu":"Si l'on répète encore et encore une expérience (par exemple mesurer le QI de N = 5 personnes) et qu'on note à chaque fois la moyenne obtenue, on construit la distribution d'échantillonnage de la moyenne ; toute statistique (moyenne, maximum, écart-type...) possède sa propre distribution d'échantillonnage. Plus l'échantillon est grand, plus cette distribution est étroite, et son écart-type s'appelle l'erreur standard (SE, ou SEM pour la moyenne). Le théorème de la limite centrale démontre trois choses : la moyenne de la distribution d'échantillonnage égale la moyenne de la population, l'erreur standard vaut SEM = σ/√N et diminue donc quand N augmente, et la forme de la distribution d'échantillonnage devient normale quand N augmente, quelle que soit la forme de la distribution de la population. Cela explique pourquoi les grandes expériences sont plus fiables et pourquoi la distribution normale apparaît partout dans les données réelles."},{"titre":"Estimation de la moyenne et de l'écart-type de la population","contenu":"Pour estimer la moyenne inconnue d'une population, la meilleure estimation est simplement la moyenne de l'échantillon : μ̂ = X̄ ; la moyenne d'échantillon est un estimateur non biaisé, car en moyenne elle égale la moyenne de la population. En revanche, l'écart-type de l'échantillon s (division par N) est un estimateur biaisé de σ : il sous-estime systématiquement la variabilité de la population, comme le montre l'exemple d'un échantillon de taille 1 dont l'écart-type est 0. La correction est simple : diviser par N − 1 au lieu de N donne l'estimation σ̂, et c'est précisément ce que calcule la fonction d'écart-type intégrée de Jamovi. Il faut garder les concepts séparés : s décrit l'échantillon, σ est le paramètre inconnu de la population, et σ̂ est notre estimation de ce paramètre."},{"titre":"Intervalles de confiance : calcul et interprétation","contenu":"Une estimation ponctuelle ne suffit pas ; il faut quantifier l'incertitude qui s'y attache. Grâce au théorème de la limite centrale, il y a 95 % de chances que la moyenne d'échantillon se situe à moins de 1,96 erreur standard de μ, ce qui, réécrit algébriquement, donne l'intervalle de confiance à 95 % : IC₉₅ = X̄ ± 1,96 × (σ/√N) ; le multiplicateur 1,96 n'a rien de magique (pour 70 % on utiliserait 1,04). Comme σ est inconnu, on le remplace en pratique par σ̂, ce qui oblige à utiliser les percentiles de la distribution t plutôt que la normale : pour N petit, le multiplicateur est plus grand (p. ex. 2,26), donc l'intervalle plus large. L'interprétation correcte est fréquentiste : si l'on répétait l'expérience un très grand nombre de fois en calculant à chaque fois un IC à 95 %, alors 95 % de ces intervalles contiendraient la vraie moyenne ; il est incorrect (car bayésien) de dire qu'il y a 95 % de chances que la vraie moyenne soit dans cet intervalle particulier, la moyenne de population étant fixe du point de vue fréquentiste."}],"concepts":["Échantillon vs population","Simple échantillon aléatoire, avec ou sans remise","Échantillonnage stratifié, en boule de neige, de commodité","Paramètres de population (μ, σ) vs statistiques d'échantillon (X̄, s)","Loi des grands nombres","Distribution d'échantillonnage d'une statistique","Théorème de la limite centrale","Erreur standard de la moyenne (SEM)","Estimateur biaisé vs non biaisé (division par N − 1)","Intervalle de confiance et son interprétation fréquentiste"],"formules":[{"nom":"Erreur standard de la moyenne","formule":"SEM = σ/√N","explication":"Écart-type de la distribution d'échantillonnage de la moyenne ; elle diminue quand la taille d'échantillon N augmente, ce qui quantifie pourquoi les grandes expériences sont plus fiables."},{"nom":"Variance d'échantillon (biaisée)","formule":"s² = (1/N) × Σᵢ (Xᵢ − X̄)²","explication":"Moyenne des écarts quadratiques à la moyenne de l'échantillon ; c'est une description de l'échantillon mais un estimateur biaisé de la variance de la population."},{"nom":"Estimation non biaisée de la variance de la population","formule":"σ̂² = (1/(N − 1)) × Σᵢ (Xᵢ − X̄)²","explication":"En divisant par N − 1 au lieu de N, on corrige le biais systématique : σ̂² est un estimateur non biaisé de la variance de la population σ²."},{"nom":"Estimation de l'écart-type de la population","formule":"σ̂ = √[(1/(N − 1)) × Σᵢ (Xᵢ − X̄)²]","explication":"Racine carrée de la variance corrigée ; c'est la valeur que calcule la fonction d'écart-type intégrée de Jamovi (σ̂, pas s)."},{"nom":"Estimation de la moyenne de la population","formule":"μ̂ = X̄","explication":"Dans un simple échantillon aléatoire, la meilleure estimation de la moyenne de la population est la moyenne de l'échantillon, qui est un estimateur non biaisé."},{"nom":"Intervalle de confiance à 95 %","formule":"IC₉₅ = X̄ ± 1,96 × (σ̂/√N)","explication":"Plage qui, sur un grand nombre de répétitions de l'expérience, contient la vraie moyenne μ dans 95 % des cas ; quand N est petit, le multiplicateur 1,96 (issu de la normale) doit être remplacé par une valeur plus grande issue de la distribution t (p. ex. 2,26)."}],"jamovi":"Pour simuler un échantillon dans Jamovi, ouvrez l'onglet Data, cliquez sur Compute et créez une variable avec la formule = NORM(100,15) : chaque ligne reçoit un tirage aléatoire d'une loi normale de moyenne 100 et d'écart-type 15 (fichier d'exemple IQsim.omv avec 10 000 lignes). Lancez ensuite Analyses > Exploration > Descriptives : la moyenne et l'écart-type affichés (qui correspond à σ̂, calculé avec N − 1) se rapprochent de 100 et 15 quand N grandit, illustrant la loi des grands nombres ; ajoutez histogramme et courbe de densité pour visualiser la distribution. Jamovi n'a pas (encore) d'option directe pour l'IC de la moyenne dans les Descriptives, mais il propose une case à cocher pour la SEM : calculez alors à la main IC 95 % inférieur = Moyenne − 1,96 × SEM et IC 95 % supérieur = Moyenne + 1,96 × SEM (p. ex. 99,68 ± 1,96 × 0,15 donne [99,39 ; 99,98] pour IQsim). Les IC pourront être tracés directement dans le cadre des tests statistiques des chapitres suivants.","glossaire":[{"terme":"Population","definition":"Ensemble de toutes les personnes ou observations possibles au sujet desquelles on veut tirer des conclusions ; généralement beaucoup plus grand que l'échantillon et opérationnalisé par les statisticiens comme une distribution de probabilités."},{"terme":"Échantillon","definition":"Sous-ensemble fini et concret de la population, constitué des données réellement recueillies, à partir duquel on tire des inférences."},{"terme":"Simple échantillon aléatoire","definition":"Échantillon obtenu par une procédure dans laquelle chaque membre de la population a les mêmes chances d'être sélectionné."},{"terme":"Échantillonnage avec/sans remise","definition":"Avec remise, un même membre de la population peut être observé plusieurs fois ; sans remise, non. Pour les grandes populations, la différence est négligeable."},{"terme":"Paramètre de population","definition":"Caractéristique de l'ensemble de la population, comme la moyenne μ ou l'écart-type σ ; presque jamais connue avec certitude."},{"terme":"Statistique d'échantillon","definition":"Propriété calculée à partir des données de l'échantillon, comme la moyenne X̄ ou l'écart-type s ; semblable mais non identique au paramètre de population correspondant."},{"terme":"Loi des grands nombres","definition":"Loi mathématique selon laquelle, quand la taille de l'échantillon approche l'infini, la moyenne de l'échantillon approche la moyenne de la population (X̄ → μ)."},{"terme":"Distribution d'échantillonnage","definition":"Distribution que suivrait une statistique (moyenne, maximum, écart-type...) si l'on répétait l'expérience un très grand nombre de fois avec la même taille d'échantillon."},{"terme":"Théorème de la limite centrale","definition":"Théorème établissant que la distribution d'échantillonnage de la moyenne a pour moyenne μ, pour écart-type SEM = σ/√N, et devient normale quand N augmente, quelle que soit la distribution de la population."},{"terme":"Erreur standard (SE/SEM)","definition":"Écart-type de la distribution d'échantillonnage d'une statistique ; pour la moyenne on parle de SEM, qui diminue quand N augmente."},{"terme":"Estimateur non biaisé","definition":"Estimateur qui, en moyenne sur un grand nombre d'échantillons, est égal au vrai paramètre de population ; la moyenne d'échantillon en est un, l'écart-type s (division par N) n'en est pas un."},{"terme":"Intervalle de confiance à 95 %","definition":"Plage de valeurs construite de sorte que, sur de nombreuses répétitions de l'expérience, 95 % des intervalles ainsi calculés contiennent la vraie moyenne de la population."}],"quiz":[{"question":"Quelle est la différence entre une statistique d'échantillon et un paramètre de population ?","options":["La statistique se calcule à partir des données recueillies ; le paramètre décrit la population entière et est presque jamais connu avec certitude","Le paramètre se calcule à partir des données ; la statistique décrit la population","Ce sont deux synonymes exacts","La statistique est toujours plus grande que le paramètre"],"bonne":0,"explication":"Les statistiques d'échantillon (comme X̄ = 98,5) sont des propriétés de vos données, calculables directement ; les paramètres de population (comme μ = 100) sont les quantités que l'on veut apprendre et qu'on ne connaît presque jamais avec certitude."},{"question":"Un enfant sort du sac uniquement les 4 jetons noirs qu'il a choisis exprès. Pourquoi cet échantillon pose-t-il problème ?","options":["Parce que 4 jetons, c'est toujours trop peu, quel que soit le plan","Parce qu'il fallait remettre les jetons dans le sac","Parce que le plan d'échantillonnage est biaisé : un échantillon tout noir ne nous dit alors plus grand-chose sur la population","Il ne pose aucun problème puisque les jetons viennent bien du sac"],"bonne":2,"explication":"La valeur probante d'un échantillon dépend de la procédure de sélection : si le plan est biaisé pour ne sélectionner que des jetons noirs, observer 4 jetons noirs n'apporte presque aucune information sur la composition réelle de la population."},{"question":"Que dit la loi des grands nombres ?","options":["Toute distribution devient normale quand N augmente","Quand la taille de l'échantillon approche l'infini, la moyenne de l'échantillon approche la moyenne de la population","Les grands échantillons ont toujours une moyenne exactement égale à μ","Il faut au moins 30 observations pour faire des statistiques"],"bonne":1,"explication":"La loi des grands nombres énonce que lorsque N → ∞, X̄ → μ : plus on recueille de données, plus les statistiques d'échantillon tendent à se rapprocher des vrais paramètres de population. La convergence vers la normalité est le théorème de la limite centrale, pas la loi des grands nombres."},{"question":"Le QI suit une loi de moyenne 100 et d'écart-type 15. Si l'on mesure des échantillons de N = 25 personnes, quelle est l'erreur standard de la moyenne (SEM) ?","options":["15","0,6","4","3"],"bonne":3,"explication":"SEM = σ/√N = 15/√25 = 15/5 = 3. L'erreur standard diminue quand N augmente, ce qui quantifie le gain de précision des grandes expériences."},{"question":"Selon le théorème de la limite centrale, que devient la distribution d'échantillonnage de la moyenne quand N augmente, si la population n'est pas normale ?","options":["Elle garde exactement la forme de la distribution de la population","Elle devient de plus en plus asymétrique","Elle s'élargit à mesure que N augmente","Elle se rapproche d'une distribution normale, quelle que soit la forme de la population"],"bonne":3,"explication":"Le théorème de la limite centrale montre que la distribution d'échantillonnage de la moyenne devient approximativement normale quand N augmente (déjà presque parfaitement dès N = 8 dans la simulation du manuel), même si la distribution de la population ne ressemble pas du tout à une normale ; de plus elle se resserre (le SEM diminue), elle ne s'élargit pas."},{"question":"Pourquoi Jamovi divise-t-il par N − 1 plutôt que par N pour calculer l'écart-type ?","options":["Parce que l'écart-type s de l'échantillon sous-estime systématiquement σ : diviser par N − 1 donne l'estimation corrigée σ̂ de l'écart-type de la population","Pour rendre les résultats plus petits et plus lisibles","Parce que la première observation ne compte jamais","C'est une erreur historique conservée par compatibilité"],"bonne":0,"explication":"La variance d'échantillon s² (division par N) est un estimateur biaisé : en moyenne, elle est inférieure à la variance de la population. Diviser par N − 1 corrige ce biais systématique, et Jamovi calcule σ̂ (et σ̂²), pas s, car c'est l'estimation du paramètre de population qui intéresse presque toujours le chercheur."},{"question":"Piège classique : vous obtenez un IC à 95 % de [109 ; 121] pour un QI moyen. Quelle interprétation est correcte du point de vue fréquentiste ?","options":["Il y a 95 % de chances que la vraie moyenne de la population se trouve entre 109 et 121","95 % des personnes de la population ont un QI entre 109 et 121","Si l'on répétait l'expérience de nombreuses fois, environ 95 % des intervalles ainsi construits contiendraient la vraie moyenne","Il y a 95 % de chances que la moyenne du prochain échantillon soit entre 109 et 121"],"bonne":2,"explication":"Les IC sont des outils fréquentistes : la probabilité porte sur la procédure répétable (les intervalles), pas sur la moyenne de population, qui est fixe et non répétable. Dire « 95 % de chances que la vraie moyenne soit dans l'intervalle » est une interprétation bayésienne (celle des intervalles crédibles), inappropriée pour un IC fréquentiste."},{"question":"Quand N est petit et que l'on remplace σ par son estimation σ̂, que se passe-t-il pour le calcul de l'intervalle de confiance à 95 % ?","options":["Rien, on garde toujours 1,96","Il faut utiliser les percentiles de la distribution t, avec un multiplicateur plus grand (p. ex. 2,26), d'où un intervalle plus large","L'intervalle devient plus étroit car on a moins de données","On doit utiliser la distribution χ² à la place de la normale"],"bonne":1,"explication":"Comme σ̂ pourrait être faux, il y a une incertitude supplémentaire : on utilise la distribution t plutôt que la normale, ce qui donne un multiplicateur plus grand quand N est petit (2,26 au lieu de 1,96 dans l'exemple du manuel) et donc un intervalle de confiance plus large, reflétant cette incertitude accrue."}],"exercice":{"titre":"Estimer le QI moyen d'une ville à partir d'un échantillon","enonce":"Sur le modèle de l'exemple de Port Pirie du manuel : vous mesurez le QI de N = 100 habitants d'une ville industrielle. Votre échantillon donne une moyenne X̄ = 98,5 et un écart-type calculé par Jamovi de 15 (donc σ̂ = 15, car Jamovi divise par N − 1). 1) Donnez la meilleure estimation de la moyenne de la population μ̂. 2) Calculez l'erreur standard de la moyenne. 3) Calculez l'intervalle de confiance à 95 % pour le QI moyen de la ville. 4) Formulez l'interprétation fréquentiste correcte de cet intervalle et donnez un exemple d'interprétation incorrecte à éviter. 5) Décrivez comment obtenir SEM et l'IC dans Jamovi.","correction":"1) Dans un simple échantillon aléatoire, la meilleure estimation de la moyenne de la population est la moyenne de l'échantillon : μ̂ = X̄ = 98,5 (la moyenne d'échantillon est un estimateur non biaisé de μ). 2) SEM = σ̂/√N = 15/√100 = 15/10 = 1,5. 3) Comme N = 100 est assez grand, on peut utiliser le multiplicateur 1,96 de la loi normale : IC₉₅ = X̄ ± 1,96 × SEM = 98,5 ± 1,96 × 1,5 = 98,5 ± 2,94, soit environ [95,56 ; 101,44]. (Avec un N petit, il aurait fallu un multiplicateur plus grand issu de la distribution t.) 4) Interprétation correcte : si l'on répétait cette étude un très grand nombre de fois en calculant à chaque fois un IC à 95 %, environ 95 % de ces intervalles contiendraient le vrai QI moyen de la ville. Interprétation incorrecte à éviter : « il y a 95 % de chances que la vraie moyenne se trouve entre 95,56 et 101,44 » — cette formulation attribue une probabilité à la moyenne de population, ce qui est une lecture bayésienne inappropriée pour un outil fréquentiste (la moyenne de population est fixe, ce sont les intervalles qui varient d'une réplication à l'autre). 5) Dans Jamovi : charger les données, ouvrir Analyses > Exploration > Descriptives, cocher la case SEM (les Descriptives n'offrent pas encore l'IC directement), puis calculer à la main : borne inférieure = Moyenne − 1,96 × SEM et borne supérieure = Moyenne + 1,96 × SEM."}},{"numero":9,"titre":"Tests d'hypothèses","sections":[{"titre":"Hypothèses de recherche et hypothèses statistiques","contenu":"Une hypothèse de recherche est une affirmation scientifique vérifiable sur le monde (par exemple « la clairvoyance existe »), tandis qu'une hypothèse statistique est une affirmation mathématiquement précise sur le mécanisme de production des données, c'est-à-dire sur un paramètre de la population. Dans l'exemple de la perception extrasensorielle (PES) du manuel, l'hypothèse de recherche « la PES existe » se traduit par l'hypothèse statistique θ ≠ 0,5, où θ est la probabilité de donner la bonne réponse. Un point clé : un test d'hypothèse statistique teste l'hypothèse statistique, pas l'hypothèse de recherche ; si l'étude est mal conçue, le lien entre les deux est rompu."},{"titre":"Hypothèse nulle et hypothèse alternative","contenu":"Le chercheur formule une hypothèse nulle H₀ (par exemple θ = 0,5) qui correspond exactement à l'opposé de ce qu'il veut croire, et une hypothèse alternative H₁ (par exemple θ ≠ 0,5) qui correspond à ce qu'il espère montrer. Le but du test n'est pas de prouver que H₁ est vraie, mais de montrer que H₀ est probablement fausse. Le manuel compare le test à un procès criminel : H₀ est l'accusé, le chercheur est le procureur, et il y a présomption d'innocence, H₀ étant considérée comme vraie tant qu'on n'a pas prouvé hors de tout doute raisonnable qu'elle est fausse."},{"titre":"Erreurs de type I et II, niveau de signification et puissance","contenu":"Deux erreurs sont possibles : rejeter H₀ alors qu'elle est vraie (erreur de type I, probabilité α) et retenir H₀ alors qu'elle est fausse (erreur de type II, probabilité β). Le principe central de conception d'un test est de contrôler le taux d'erreur de type I : α est appelé le niveau de signification du test, avec les conventions .05, .01 et .001. La puissance du test, définie comme 1 − β, est la probabilité de rejeter H₀ quand elle est réellement fausse ; on cherche à la maximiser, mais cet objectif reste secondaire par rapport au contrôle de α, comme l'aurait dit Blackstone : il est préférable de retenir dix fausses hypothèses nulles que d'en rejeter une seule vraie."},{"titre":"Statistique de test, distribution d'échantillonnage et régions critiques","contenu":"Une statistique de test est une quantité calculée à partir des données (par exemple X, le nombre de bonnes réponses sur N) qui guide la décision. On détermine ensuite sa distribution d'échantillonnage sous H₀ ; dans l'exemple PES, X suit une loi binomiale Binomiale(0,5, N). La région critique regroupe les valeurs les plus extrêmes (les queues de la distribution) qui conduisent au rejet de H₀ : pour α = .05 et N = 100, on rejette si X ≤ 40 ou X ≥ 60, les nombres 40 et 60 étant les valeurs critiques. Avec X = 62 observé, on rejette H₀ et on dit que le résultat est statistiquement significatif, ce qui signifie seulement que les données permettent de rejeter H₀, pas que le résultat est important."},{"titre":"Tests unilatéraux et bilatéraux","contenu":"Un test bilatéral correspond à une alternative couvrant les deux côtés de H₀ (H₀ : θ = .5 contre H₁ : θ ≠ .5) : la région critique couvre les deux queues de la distribution, avec 2,5 % de chaque côté si α = .05. Un test unilatéral correspond à une alternative dirigée dans un seul sens (H₀ : θ ≤ .5 contre H₁ : θ > .5) : la région critique ne couvre alors qu'une seule queue, avec les 5 % supérieurs de la distribution. Le choix dépend de ce que le chercheur est prêt à croire avant de voir les données."},{"titre":"La valeur p et ses interprétations","contenu":"Il existe deux interprétations légitimes de la valeur p. Selon Neyman, p est le plus petit taux d'erreur de type I (α) que l'on doit être prêt à tolérer pour rejeter H₀ : si p ≤ α on rejette, si p > α on conserve H₀. Selon Fisher, p est la probabilité d'observer une statistique de test au moins aussi extrême que celle obtenue, si H₀ est vraie. Une troisième interprétation, courante mais absolument fausse, consiste à dire que p est « la probabilité que l'hypothèse nulle soit vraie » : le cadre fréquentiste ne permet pas d'attribuer des probabilités aux hypothèses, et il ne faut jamais interpréter p de cette façon. Dans l'étude PES (X = 62, N = 100), p = .021, donc le résultat est significatif à α = .05."},{"titre":"Taille de l'effet, taille de l'échantillon et puissance","contenu":"La taille de l'effet quantifie l'écart entre l'état réel du monde et ce que prédit l'hypothèse nulle, par exemple θ − θ₀ dans l'étude PES. Elle complète le test : le test dit si l'effet observé est réel (pas seulement dû au hasard), la taille de l'effet dit s'il mérite qu'on s'y intéresse ; avec des milliers d'observations, une différence de 1 % peut être significative sans être intéressante. La puissance augmente avec la taille de l'effet et avec la taille de l'échantillon N ; l'analyse de puissance consiste à deviner la taille de l'effet pour estimer la taille d'échantillon nécessaire avant de mener l'étude."},{"titre":"Neyman contre Fisher et pièges du NHST","contenu":"Le cadre orthodoxe du test de signification de l'hypothèse nulle (NHST) est un hybride de deux approches : celle de Fisher, où l'on vérifie seulement si les données sont suffisamment improbables sous H₀ sans alternative explicite, et celle de Neyman, plus formelle, où le test guide l'action entre hypothèses concurrentes explicites. Le manuel avertit aussi contre un piège classique : la différence entre un résultat significatif et un résultat non significatif n'est pas la preuve d'une différence réelle ; si l'on veut affirmer que deux groupes diffèrent, il faut tester directement cette différence. Enfin, la valeur p est une terrible approximation de la probabilité que H₀ soit vraie : si c'est cette probabilité qu'on cherche, il faut une approche bayésienne."}],"concepts":["Hypothèse de recherche vs hypothèse statistique","Hypothèse nulle H₀ et hypothèse alternative H₁","Erreur de type I (α) et erreur de type II (β)","Niveau de signification α","Statistique de test et distribution d'échantillonnage","Région critique et valeurs critiques","Test unilatéral vs test bilatéral","Valeur p (interprétations de Neyman et de Fisher)","Puissance du test (1 − β)","Taille de l'effet"],"formules":[{"nom":"Distribution de la statistique de test sous H₀ (exemple PES)","formule":"X ~ Binomiale(θ, N), avec θ = 0,5 sous H₀","explication":"Si l'hypothèse nulle est vraie, le nombre X de bonnes réponses sur N essais suit une loi binomiale ; cette distribution d'échantillonnage indique quelles valeurs de X sont attendues sous H₀."},{"nom":"Puissance du test","formule":"Puissance = 1 − β","explication":"β est le taux d'erreur de type II ; la puissance est la probabilité de rejeter correctement l'hypothèse nulle quand elle est réellement fausse. Elle dépend de la vraie valeur du paramètre et de N."},{"nom":"Taille de l'effet (exemple simple)","formule":"effet = θ − θ₀, ou |θ − θ₀|","explication":"Mesure l'ampleur de la différence entre la vraie valeur du paramètre de population θ et la valeur θ₀ supposée par l'hypothèse nulle."},{"nom":"Règle de décision avec la valeur p","formule":"rejeter H₀ si p ≤ α ; conserver H₀ si p > α","explication":"p est le plus petit niveau α qui permettrait de rejeter l'hypothèse nulle avec les données obtenues ; on le compare au niveau de signification choisi."}],"jamovi":"Le test construit dans ce chapitre est le test binomial, disponible dans Jamovi via Analyses > Frequencies > 2 Outcomes (Proportion Test, 2 Outcomes). Ouvrez le fichier binomialtest.omv, déplacez la variable réponse dans la case « Outcome », vérifiez que « Test value » vaut 0,5 (la valeur de θ sous H₀), et cochez éventuellement « Confidence intervals ». Avec 62 bonnes réponses sur 100, Jamovi affiche une valeur p ≈ 0,02, inférieure à α = .05, donc on rejette l'hypothèse nulle. Sous « Hypothesis », on peut choisir ≠ Test value (bilatéral), > Test value ou < Test value (unilatéral).","glossaire":[{"terme":"Hypothèse nulle (H₀)","definition":"Hypothèse statistique correspondant à l'opposé de ce que le chercheur veut croire (par exemple « pas d'effet », θ = 0,5) ; elle est considérée comme vraie tant que les données ne prouvent pas hors de tout doute raisonnable qu'elle est fausse."},{"terme":"Hypothèse alternative (H₁)","definition":"Hypothèse statistique qui correspond à ce que le chercheur espère montrer ; le test vise à rejeter H₀ en sa faveur, pas à la prouver directement."},{"terme":"Erreur de type I","definition":"Rejeter l'hypothèse nulle alors qu'elle est en fait vraie ; sa probabilité maximale est fixée par le niveau de signification α."},{"terme":"Erreur de type II","definition":"Retenir l'hypothèse nulle alors qu'elle est en fait fausse ; sa probabilité est notée β."},{"terme":"Niveau de signification (α)","definition":"Taux d'erreur de type I maximal toléré par le test ; par convention .05, .01 ou .001. Un test a un niveau α si son taux d'erreur de type I n'est pas supérieur à α."},{"terme":"Statistique de test","definition":"Quantité calculée à partir des données (comme X, le nombre de succès) dont la valeur guide la décision de retenir ou rejeter l'hypothèse nulle."},{"terme":"Région critique","definition":"Ensemble des valeurs de la statistique de test qui conduisent au rejet de l'hypothèse nulle ; elle correspond aux valeurs les plus extrêmes (queues de la distribution) et couvre une proportion α de la distribution d'échantillonnage sous H₀."},{"terme":"Valeur p","definition":"Selon Neyman, le plus petit taux d'erreur de type I que l'on doit tolérer pour rejeter H₀ ; selon Fisher, la probabilité d'observer une statistique au moins aussi extrême que celle obtenue si H₀ est vraie. Ce n'est jamais la probabilité que H₀ soit vraie."},{"terme":"Puissance","definition":"Probabilité (1 − β) de rejeter l'hypothèse nulle quand elle est réellement fausse ; elle augmente avec la taille de l'effet et la taille de l'échantillon."},{"terme":"Taille de l'effet","definition":"Mesure de l'ampleur de la différence entre les paramètres réels de la population et les valeurs supposées par l'hypothèse nulle ; elle indique si un effet significatif est aussi important en pratique."}],"quiz":[{"question":"Quel est le but principal d'un test d'hypothèse nulle ?","options":["Prouver que l'hypothèse alternative est vraie","Calculer la probabilité que l'hypothèse nulle soit vraie","Montrer que l'hypothèse nulle est probablement fausse","Mesurer la taille de l'effet"],"bonne":2,"explication":"Le manuel insiste : le but d'un test n'est pas de montrer que H₁ est (probablement) vraie, mais de montrer que H₀ est (probablement) fausse, comme dans un procès où l'on cherche à condamner l'accusé (H₀)."},{"question":"Rejeter l'hypothèse nulle alors qu'elle est en réalité vraie correspond à :","options":["Une erreur de type I","Une erreur de type II","Une décision juste","Un manque de puissance"],"bonne":0,"explication":"L'erreur de type I consiste à rejeter une hypothèse nulle qui est en fait vraie ; sa probabilité est contrôlée par le niveau de signification α."},{"question":"Un test d'hypothèse obtient p = .021. Quelle interprétation est correcte ?","options":["Il y a 2,1 % de chances que l'hypothèse nulle soit vraie","2,1 % est le plus petit taux d'erreur de type I à tolérer pour rejeter H₀","Il y a 97,9 % de chances que l'hypothèse alternative soit vraie","L'effet observé est important en pratique"],"bonne":1,"explication":"C'est la définition de Neyman utilisée dans le manuel : p est le plus petit α qui permettrait de rejeter H₀. Interpréter p comme la probabilité que H₀ soit vraie est l'erreur classique, absolument fausse dans le cadre fréquentiste."},{"question":"Dans l'étude PES avec H₁ : θ > .5, la région critique du test :","options":["Couvre les deux queues de la distribution, 2,5 % de chaque côté","Couvre le centre de la distribution","Disparaît car le test n'a plus de niveau α","Ne couvre qu'une seule queue, les 5 % supérieurs si α = .05"],"bonne":3,"explication":"Avec une alternative unilatérale (θ > .5), on ne rejette H₀ que pour les grandes valeurs de X : la région critique ne couvre que la queue supérieure de la distribution d'échantillonnage."},{"question":"Qu'est-ce que la puissance d'un test ?","options":["La probabilité α de rejeter H₀ à tort","La taille de l'effet mesurée dans l'échantillon","La probabilité 1 − β de rejeter H₀ quand elle est réellement fausse","Le nombre d'observations nécessaires pour le test"],"bonne":2,"explication":"La puissance est définie comme 1 − β, où β est le taux d'erreur de type II ; c'est la probabilité de détecter un effet qui existe réellement. Elle dépend de la vraie valeur de θ et de N."},{"question":"Un « résultat statistiquement significatif » signifie que :","options":["Les données ont permis de rejeter l'hypothèse nulle","Le résultat est important dans le monde réel","L'effet mesuré est de grande taille","L'expérience est bien conçue"],"bonne":0,"explication":"« Significatif » est un terme ancien qui veut simplement dire que H₀ a été rejetée. La question de savoir si le résultat est réellement important est différente et dépend notamment de la taille de l'effet."},{"question":"Avec des milliers d'étudiants, on trouve que les filles ont des notes en moyenne 1 % plus élevées que les garçons, avec p très faible. Que conclure ?","options":
