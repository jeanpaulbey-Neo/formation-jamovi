["L'effet est forcément important puisque p est très faible","Le test est invalide car l'échantillon est trop grand","Il faut refaire le test avec un plus petit échantillon","La différence est probablement réelle mais de faible taille, donc peu intéressante en pratique"],"bonne":3,"explication":"C'est l'exemple du manuel : avec un très grand N, une toute petite différence devient statistiquement significative, mais peu importe à quel point p est faible, une différence de 1 % n'est généralement pas très intéressante. D'où l'importance de rapporter la taille de l'effet."},{"question":"Dans une étude PES, le test est significatif chez les femmes (p = .03) mais pas chez les hommes (p = .32). Que peut-on conclure ?","options":["Les femmes ont plus de capacités psychiques que les hommes","Rien sur la différence hommes-femmes : il faudrait tester directement cette différence","Les hommes n'ont aucune capacité psychique","Il faut baisser α à .01 pour trancher"],"bonne":1,"explication":"Piège classique (Gelman et Stern) : la différence entre significatif et non significatif n'est pas la preuve d'une différence réelle. Pour affirmer que les groupes diffèrent, il faut tester l'hypothèse nulle d'absence de différence entre eux (ici, ce test donne p = .54)."}],"exercice":{"titre":"Test binomial sur l'étude PES dans Jamovi","enonce":"Vous répliquez l'étude de clairvoyance du manuel : 100 participants doivent deviner la couleur (noir ou blanc) d'une carte cachée, et 62 donnent la bonne réponse. En utilisant le fichier binomialtest.omv (ou en créant une variable nominale « Outcome » avec 62 valeurs 1 et 38 valeurs 0), testez dans Jamovi l'hypothèse nulle que la probabilité de bonne réponse est θ = 0,5, au niveau α = .05, avec un test bilatéral. Rapportez la décision, la valeur p et rédigez la conclusion en une phrase.","correction":"1) Ouvrez binomialtest.omv dans Jamovi (ou saisissez la variable Outcome avec 62 « 1 » et 38 « 0 »). 2) Allez dans Analyses > Frequencies > 2 Outcomes (Proportion Test, 2 Outcomes) et déplacez Outcome dans la case d'analyse. 3) Vérifiez que « Test value » vaut 0,5 : c'est la valeur de θ sous H₀ (réponse au hasard). Sous « Hypothesis », laissez l'option ≠ Test value pour un test bilatéral. 4) Lisez le tableau de résultats : proportion observée 0,62 et valeur p ≈ 0,021 (Jamovi affiche 0,02). 5) Décision : p = .021 < α = .05, donc on rejette l'hypothèse nulle ; le résultat est statistiquement significatif. 6) Rédaction : « Sur 100 participants, 62 ont correctement identifié la couleur de la carte ; un test binomial rejette l'hypothèse que la probabilité de réussite est de 0,5 (p = .021), ce qui suggère une performance supérieure au hasard. » Attention : cela ne prouve pas que la PES existe (hypothèse de recherche) ; cela montre seulement que θ ≠ 0,5 (hypothèse statistique), et p n'est pas la probabilité que H₀ soit vraie."}},{"numero":10,"titre":"Analyse des données catégoriques","sections":[{"titre":"Le test d'adéquation χ² (qualité de l'ajustement)","contenu":"Le test d'adéquation χ², inventé par Karl Pearson (1900), vérifie si une distribution de fréquences observées d'une variable nominale correspond à une distribution attendue. Dans l'exemple des cartes, 200 personnes choisissent mentalement une carte et l'on observe O = (35, 51, 64, 50) pour trèfles, carreaux, cœurs et piques ; l'hypothèse nulle est que les quatre couleurs sont choisies avec une probabilité égale, soit P = (.25, .25, .25, .25). Les fréquences attendues sous H₀ sont Eᵢ = N × Pᵢ = 50 pour chaque catégorie, et la statistique compare observé et attendu : on obtient χ² = 8,44. L'hypothèse nulle peut aussi spécifier des probabilités inégales, tant qu'elles sont positives et totalisent 1."},{"titre":"Distribution d'échantillonnage et degrés de liberté","contenu":"Sous H₀, chaque fréquence observée Oᵢ suit une loi binomiale qui, quand N est grand, s'approche d'une loi normale ; la somme de carrés de quantités normalement distribuées suit une distribution χ². Les degrés de liberté se calculent comme le nombre de quantités décrivant les données moins le nombre de contraintes : avec k catégories et la contrainte que les effectifs somment à N (ou que les probabilités somment à 1), on obtient df = k − 1, soit 3 pour les cartes. Le test du chi carré est toujours unilatéral : on rejette H₀ seulement si χ² dépasse la valeur critique (7,815 pour df = 3 et α = .05) ; comme 8,44 > 7,815, on rejette H₀ avec p = .038."},{"titre":"Le test d'indépendance (ou d'association) χ²","contenu":"Le test d'indépendance s'applique à un tableau de contingence croisant deux variables nominales, comme l'espèce (robot ou humain) et le choix préféré (chiot, fleur ou fichier de données) chez 180 répondants de Chapek 9. L'hypothèse nulle est que les deux variables sont indépendantes : la probabilité de chaque réponse est la même pour toutes les espèces (Pᵢ₁ = Pᵢ₂). Les fréquences attendues se calculent à partir des totaux de lignes et de colonnes, Eᵢⱼ = Rᵢ × Cⱼ / N, et la statistique X² somme les écarts (Eᵢⱼ − Oᵢⱼ)²/Eᵢⱼ sur toutes les cellules, avec df = (r − 1)(c − 1). Dans l'exemple, χ²(2) = 10,72, p = .005 : il y a une association significative entre l'espèce et le choix."},{"titre":"La correction de continuité (correction de Yates)","contenu":"Le test χ² repose sur une approximation : la vraie distribution d'échantillonnage de X² est discrète alors que la distribution χ² est continue. Quand N est petit et qu'il n'y a qu'un seul degré de liberté (par exemple un tableau 2×2), la statistique tend à être « trop grande », ce qui rend les valeurs p un peu trop petites et le taux d'erreur α plus grand que prévu. Yates (1934) a proposé une correction pragmatique consistant à soustraire 0,5 aux écarts absolus avant de les élever au carré : χ² = Σ (|Eᵢ − Oᵢ| − 0,5)²/Eᵢ. Dans Jamovi, cette correction s'active par la case « χ² continuity correction » dans les options « Statistics »."},{"titre":"Taille de l'effet : φ et V de Cramer","contenu":"Après un test χ² significatif, on rapporte une mesure de la force de l'association. La statistique φ = √(X²/N) est censée varier entre 0 (aucune association) et 1 (association parfaite), mais elle peut dépasser 1 pour des tableaux plus grands que 2×2. On préfère donc le V de Cramer : V = √(X²/(N(k − 1))), où k = min(r, c) ; V varie réellement de 0 à 1. Dans l'exemple de Chapek 9, V = 0,24, ce qui se demande dans Jamovi via une case à cocher des options « Statistics » de l'analyse Contingency Tables."},{"titre":"Hypothèses des tests χ² et test exact de Fisher","contenu":"Les tests du chi carré supposent que les fréquences attendues sont suffisamment élevées (toutes supérieures à environ 5, ou au moins 80 % supérieures à 5 et aucune inférieure à 1) et que les observations sont indépendantes les unes des autres. Quand les effectifs attendus sont trop faibles, on utilise le test exact de Fisher : il n'a pas de statistique de test mais calcule directement la valeur p à partir de la distribution hypergéométrique, en traitant les totaux de lignes et de colonnes comme fixes et en sommant les probabilités des tableaux au moins aussi extrêmes que celui observé. Dans l'exemple des données salem.csv (accusées de sorcellerie brûlées ou non, heureuses ou non), le test exact de Fisher donne p = .036, ce qui permet de rejeter l'hypothèse nulle malgré le petit échantillon."},{"titre":"Le test de McNemar pour données appariées","contenu":"Quand chaque participant est mesuré deux fois (par exemple intention de vote avant et après avoir vu des publicités, N = 100 personnes mais 200 observations), les observations ne sont pas indépendantes et le test d'indépendance χ² habituel n'est pas fiable. La solution de McNemar (1947) consiste à réorganiser les données pour que chaque participant n'apparaisse que dans une seule cellule d'un tableau croisant avant × après, puis à tester l'homogénéité marginale : les totaux de lignes et de colonnes proviennent-ils de la même distribution ? Seules les cellules hors diagonale b et c comptent, et la statistique avec correction de Yates est χ² = (|b − c| − 0,5)²/(b + c), avec df = 1. Dans l'exemple AGPP, χ²(1) = 12,03, p < .001 : les publicités ont eu un effet, en l'occurrence négatif."}],"concepts":["Données catégorielles (échelle nominale)","Test d'adéquation χ² de Pearson (goodness of fit)","Fréquences observées (Oᵢ) et fréquences attendues (Eᵢ)","Degrés de liberté (k − 1 ; (r − 1)(c − 1))","Test d'indépendance χ² sur tableau de contingence","Correction de continuité de Yates","Taille de l'effet : φ et V de Cramer","Hypothèses du test : effectifs attendus suffisants et indépendance des observations","Test exact de Fisher (distribution hypergéométrique)","Test de McNemar (homogénéité marginale, données appariées)"],"formules":[{"nom":"Statistique du test d'adéquation χ²","formule":"χ² = Σᵢ₌₁ᵏ (Oᵢ − Eᵢ)² / Eᵢ, avec Eᵢ = N × Pᵢ","explication":"Somme, sur les k catégories, des écarts au carré entre fréquences observées et attendues, normalisés par les fréquences attendues. Une grande valeur indique que H₀ prédit mal les données ; sous H₀, la statistique suit une loi χ² à k − 1 degrés de liberté."},{"nom":"Fréquences attendues du test d'indépendance","formule":"Eᵢⱼ = (Rᵢ × Cⱼ) / N","explication":"Sous l'hypothèse d'indépendance, l'effectif attendu d'une cellule est le produit du total de sa ligne et du total de sa colonne, divisé par le nombre total d'observations."},{"nom":"Statistique du test d'indépendance et degrés de liberté","formule":"X² = Σᵢ₌₁ʳ Σⱼ₌₁ᶜ (Eᵢⱼ − Oᵢⱼ)² / Eᵢⱼ, avec df = (r − 1)(c − 1)","explication":"Même logique que le test d'adéquation, mais sommée sur les lignes et colonnes du tableau de contingence ; les degrés de liberté découlent du nombre de cellules moins les contraintes (totaux fixés et probabilités estimées)."},{"nom":"Correction de continuité de Yates","formule":"χ² = Σᵢ (|Eᵢ − Oᵢ| − 0,5)² / Eᵢ","explication":"On soustrait 0,5 aux écarts absolus avant de les élever au carré, pour compenser le fait que la statistique tend à être trop grande quand N est petit et df = 1."},{"nom":"Statistique φ","formule":"φ = √(X² / N)","explication":"Mesure de taille de l'effet pour un tableau de contingence, entre 0 (aucune association) et 1 (association parfaite), mais elle peut dépasser 1 pour des tableaux plus grands que 2×2."},{"nom":"V de Cramer","formule":"V = √(X² / (N(k − 1))), avec k = min(r, c)","explication":"Version corrigée de φ qui varie réellement de 0 à 1 quelle que soit la taille du tableau ; c'est la mesure de taille de l'effet la plus couramment rapportée pour un χ²."},{"nom":"Statistique du test de McNemar (avec correction de Yates)","formule":"χ² = (|b − c| − 0,5)² / (b + c), soit (|O₁₂ − O₂₁| − 0,5)² / (O₁₂ + O₂₁)","explication":"Seules les cellules hors diagonale b et c du tableau avant × après comptent ; la statistique suit approximativement une loi χ² avec df = 1 et teste l'homogénéité marginale."}],"jamovi":"Test d'adéquation : Analyses > Frequencies > One Sample Proportion Tests > N Outcomes, déplacez la variable (ex. choice_1 de randomness.csv) dans « Variable », cochez « Expected counts » pour afficher les effectifs attendus ; pour une hypothèse nulle différente, développez « Expected Proportions » et modifiez les ratios. Test d'indépendance : Analyses > Frequencies > Contingency Tables > Independent Samples, placez une variable en lignes et l'autre en colonnes ; dans « Cells », cochez Counts > Expected, et dans « Statistics », cochez « χ² continuity correction » (Yates), « Cramer's V » (taille de l'effet) ou « Fisher's exact test » selon les besoins. Test de McNemar : Analyses > Frequencies > Contingency Tables > Paired Samples, mettez response_before dans « Rows » et response_after dans « Columns ».","glossaire":[{"terme":"Données catégorielles","definition":"Autre nom des données à échelle nominale ; l'analyse catégorielle des données regroupe les outils applicables à ce type de variables."},{"terme":"Test d'adéquation χ² (goodness of fit)","definition":"Test de Pearson qui vérifie si les fréquences observées d'une variable nominale correspondent à un ensemble de probabilités « connues » spécifiées par l'hypothèse nulle."},{"terme":"Fréquence attendue (Eᵢ)","definition":"Nombre de réponses de la catégorie i que l'on s'attend à observer si l'hypothèse nulle est vraie ; pour le test d'adéquation, Eᵢ = N × Pᵢ."},{"terme":"Degrés de liberté","definition":"Nombre de quantités distinctes décrivant les données moins le nombre de contraintes qu'elles doivent satisfaire ; k − 1 pour le test d'adéquation, (r − 1)(c − 1) pour le test d'indépendance."},{"terme":"Test d'indépendance χ²","definition":"Test appliqué à un tableau de contingence entre deux variables catégorielles ; l'hypothèse nulle est qu'il n'y a aucune relation ou association entre les variables."},{"terme":"Correction de continuité (Yates)","definition":"Ajustement (soustraire 0,5 aux écarts absolus) utilisé quand df = 1 et N petit, car la distribution discrète de la statistique est approchée par la distribution χ² continue, ce qui rend sinon les valeurs p trop petites."},{"terme":"V de Cramer","definition":"Mesure de la taille de l'effet pour un tableau de contingence, V = √(X²/(N(k − 1))) ; elle varie de 0 (aucune association) à 1 (association parfaite)."},{"terme":"Test exact de Fisher","definition":"Test d'association pour petits effectifs qui calcule directement la valeur p à partir de la distribution hypergéométrique, en traitant les totaux de lignes et de colonnes comme fixes, sans statistique de test."},{"terme":"Test de McNemar","definition":"Test de l'homogénéité marginale pour des données appariées (mesures répétées) ; il ne fait intervenir que les cellules hors diagonale du tableau avant × après et suit approximativement une loi χ² à 1 degré de liberté."},{"terme":"Distribution hypergéométrique","definition":"Distribution de probabilité qui décrit les fréquences d'un tableau de contingence quand les totaux de lignes et de colonnes sont fixés ; elle est au cœur du test exact de Fisher."}],"quiz":[{"question":"Dans l'exemple des cartes (N = 200, 4 couleurs, H₀ : probabilités égales), quelle est la fréquence attendue de chaque catégorie ?","options":["25","64","50","200"],"bonne":2,"explication":"Eᵢ = N × Pᵢ = 200 × 0,25 = 50 : si les quatre couleurs sont également probables, on attend en moyenne 50 observations dans chaque catégorie."},{"question":"Combien de degrés de liberté a un test d'adéquation χ² avec k = 4 catégories ?","options":["4","3","2","1"],"bonne":1,"explication":"df = k − 1 = 3 : bien que les données soient décrites par quatre chiffres, la contrainte que les effectifs somment à N (ou que les probabilités somment à 1) ne laisse que trois quantités réellement indépendantes."},{"question":"Le test du chi carré rejette l'hypothèse nulle quand :","options":["χ² est très petit, dans la queue inférieure","χ² est proche de zéro","χ² tombe dans l'une des deux queues de la distribution","χ² dépasse la valeur critique, dans la queue supérieure uniquement"],"bonne":3,"explication":"Le test du chi carré est toujours un test unilatéral : seules les grandes valeurs de χ² indiquent que H₀ prédit mal les données, donc la région critique ne couvre que la queue supérieure."},{"question":"Pour un tableau de contingence à r lignes et c colonnes, les degrés de liberté du test d'indépendance sont :","options":["(r − 1) × (c − 1)","r × c − 1","r + c − 2","r × c"],"bonne":0,"explication":"On part des r × c cellules et on soustrait les contraintes (totaux fixés et probabilités estimées), ce qui donne df = (r − 1)(c − 1) ; par exemple 2 pour le tableau 3×2 de Chapek 9."},{"question":"Quand la correction de continuité de Yates est-elle recommandée ?","options":["Quand le tableau a plus de 5 catégories","Quand N est petit et qu'il n'y a qu'un seul degré de liberté","Quand les observations ne sont pas indépendantes","Quand la valeur p est supérieure à .05"],"bonne":1,"explication":"L'approximation de la distribution discrète de X² par la loi χ² continue fonctionne mal quand N est petit et df = 1 (par exemple un tableau 2×2) : la statistique tend à être trop grande, et la correction de Yates (soustraire 0,5) compense ce biais."},{"question":"Pourquoi préfère-t-on le V de Cramer à la statistique φ comme taille de l'effet ?","options":["φ ne peut être calculé que dans Jamovi","V est plus facile à calculer que φ","V teste l'hypothèse nulle alors que φ ne le fait pas","φ peut dépasser 1 pour des tableaux plus grands que 2×2, alors que V reste entre 0 et 1"],"bonne":3,"explication":"φ = √(X²/N) est censée aller de 0 à 1 mais peut dépasser 1 pour des tableaux plus grands que 2×2 ; le V de Cramer divise en plus par (k − 1), avec k = min(r, c), et varie réellement de 0 à 1."},{"question":"Dans quelle situation le test exact de Fisher est-il particulièrement utile ?","options":["Quand les fréquences attendues sont trop faibles pour le test χ²","Quand les observations sont appariées (mesures répétées)","Quand les variables sont continues","Quand on veut mesurer la taille de l'effet"],"bonne":0,"explication":"Quand les effectifs attendus sont trop petits (règle indicative : inférieurs à environ 5), l'approximation χ² n'est pas fiable ; le test exact de Fisher calcule directement la valeur p via la distribution hypergéométrique, comme dans l'exemple salem.csv."},{"question":"On interroge 100 personnes avant puis après une campagne publicitaire sur leur intention de vote. Quel test convient et pourquoi ?","options":["Le test d'adéquation χ², car il y a une seule variable","Le test exact de Fisher, car l'échantillon est petit","Le test de McNemar, car les 200 observations proviennent des mêmes 100 personnes et ne sont pas indépendantes","Le test d'indépendance χ² classique sur le tableau avant/après"],"bonne":2,"explication":"Chaque personne fournit deux réponses (avant et après), donc l'hypothèse d'indépendance du χ² classique est violée. Le test de McNemar réorganise les données pour que chaque participant occupe une seule cellule et teste l'homogénéité marginale à partir des cellules hors diagonale."}],"exercice":{"titre":"Choix de cartes et test d'indépendance dans Jamovi","enonce":"Avec le fichier randomness.csv (variables id, choice_1 et choice_2 pour 200 participants) : (a) réalisez un test d'adéquation χ² sur choice_1 pour vérifier si les quatre couleurs (trèfle, carreau, cœur, pique) sont choisies avec une probabilité égale ; (b) réalisez ensuite un test d'indépendance χ² entre choice_1 et choice_2 pour vérifier si le second choix dépend du premier, en demandant les effectifs attendus et le V de Cramer. Rapportez chaque résultat sous forme conventionnelle (bloc statistique) et interprétez.","correction":"Partie (a) : ouvrez randomness.csv dans Jamovi, puis Analyses > Frequencies > One Sample Proportion Tests > N Outcomes ; déplacez choice_1 dans « Variable » et cochez « Expected counts ». Les fréquences observées sont 35 (trèfles), 51 (carreaux), 64 (cœurs) et 50 (piques), contre 50 attendues partout ; Jamovi affiche χ² = 8,44, df = 3, p = .038. Comme p < .05, on rejette H₀ : « Sur les 200 participants, 64 ont choisi des cœurs, 51 des carreaux, 50 des piques et 35 des trèfles. Un test d'ajustement du chi carré était significatif (χ²(3) = 8,44, p < .05), ce qui suggère que les gens n'ont pas choisi les couleurs au hasard. » Partie (b) : Analyses > Frequencies > Contingency Tables > Independent Samples, choice_1 en « Rows » et choice_2 en « Columns » ; dans « Cells », cochez Counts > Expected, et dans « Statistics », cochez « Cramer's V ». Jamovi donne χ² = 29,24, df = 9 (car (4 − 1) × (4 − 1) = 9), p < .001, avec un V de Cramer modéré. Conclusion : le second choix n'est pas indépendant du premier ; on rapporte « χ²(9) = 29,24, p < .001 », en précisant que le V de Cramer quantifie la force de cette association. Vérifiez au passage les hypothèses du test : effectifs attendus suffisants (tous bien supérieurs à 5 ici) et indépendance des observations entre participants."}},{"numero":11,"titre":"Comparer deux moyennes","sections":[{"titre":"Le z-test pour un échantillon","contenu":"Le z-test compare la moyenne d'un échantillon à une valeur hypothétique de la moyenne de population, en supposant que l'écart-type de la population σ est connu. Dans l'exemple du Dr Zeppo, on teste si la note moyenne des 20 étudiants en psychologie (x̄ = 72,3) diffère de la moyenne de la classe (μ₀ = 67,5, σ = 9,5) : on obtient z = 2,26, significatif à α = .05. Le z-score se calcule en divisant l'écart entre la moyenne observée et la moyenne hypothétique par l'erreur type de la moyenne (σ/√N). Le manuel insiste toutefois sur le fait que ce test n'est presque jamais utilisé en pratique, car l'hypothèse d'un écart-type de population connu est toujours fausse dans la vraie vie ; il sert surtout de tremplin pédagogique vers le test t. Jamovi n'a d'ailleurs pas de fonction intégrée pour le z-test."},{"titre":"Le test t sur un échantillon","contenu":"Quand l'écart-type de la population est inconnu, on le remplace par son estimation σ̂ calculée à partir des données, ce qui donne le test t sur un échantillon introduit par Gosset (« Student ») en 1908. La statistique t se calcule comme le z-score, mais sa distribution d'échantillonnage est une distribution t à N − 1 degrés de liberté, qui a des queues plus épaisses que la normale ; pour un grand N, elle devient pratiquement identique à la normale. Le test suppose la normalité de la distribution de la population et l'indépendance des observations, mais plus l'écart-type connu. Pour les données de Zeppo, Jamovi donne t(19) = 2,25, p = .036, avec un intervalle de confiance à 95 % de 67,8 à 76,8 : les étudiants en psychologie obtiennent des notes significativement supérieures à 67,5."},{"titre":"Le test t pour échantillons indépendants (Student)","contenu":"Le test t de Student pour échantillons indépendants compare les moyennes de deux groupes différents de participants et teste l'hypothèse nulle μ₁ = μ₂ contre l'alternative μ₁ ≠ μ₂. Dans l'exemple du Dr Harpo (harpo.csv), on compare les notes des 15 élèves d'Anastasia (moyenne 74,53) à celles des 18 élèves de Bernadette (moyenne 69,06) : t(31) = 2,1, p < .05, d = 0,74. La statistique t est la différence entre les moyennes divisée par l'erreur type de cette différence, calculée à partir d'une estimation globale (« poolée ») de l'écart-type obtenue en divisant la somme des écarts quadratiques par N − 2 ; les degrés de liberté sont N − 2. Le test suppose la normalité dans chaque groupe, l'indépendance des observations et l'homogénéité de la variance (mêmes écarts-types de population dans les deux groupes), cette dernière pouvant être vérifiée avec le test de Levene. Le signe de la statistique t (moyenne 1 − moyenne 2) est arbitraire : pour savoir quel groupe est le meilleur, il vaut mieux regarder directement les moyennes des groupes."},{"titre":"Le test de Welch","contenu":"L'hypothèse d'écarts-types égaux du test de Student est rarement vraie dans la vraie vie : si deux groupes n'ont pas la même moyenne, pourquoi auraient-ils le même écart-type ? Le test de Welch (1947) s'en affranchit : la statistique t reste la différence entre les moyennes divisée par une erreur type, mais celle-ci est calculée à partir des variances séparées des deux groupes, SE = √(σ̂₁²/N₁ + σ̂₂²/N₂), et les degrés de liberté ne sont plus des nombres entiers. Sur les données de Harpo, le résultat de Welch (t(23,02) = 2,03, p = .054) n'est plus significatif alors que celui de Student l'était (p = .043) ; le manuel met en garde contre l'interprétation de la différence entre un p de .049 et un p de .051. Si les variances sont réellement égales, Student est légèrement plus puissant ; sinon, Student risque un taux d'erreur de type I plus élevé, si bien que l'auteur préfère généralement Welch en pratique."},{"titre":"Le test t pour échantillons appariés","contenu":"Quand chaque participant est mesuré dans les deux conditions (plan à mesures répétées), un test t pour échantillons indépendants ne convient pas car il confondrait les différences intra-sujet avec la variabilité entre sujets. Le test t apparié consiste à calculer pour chaque personne le score de différence Dᵢ = Xᵢ₁ − Xᵢ₂, puis à faire un simple test t sur un échantillon sur ces différences, avec H₀ : μD = 0 et N − 1 degrés de liberté. Dans l'exemple de la classe du Dr Chico (chico.csv), la moyenne passe de 57 au test 1 à 58 au test 2 ; les intervalles de confiance des deux moyennes se chevauchent, mais presque tous les élèves se sont améliorés individuellement, et le test apparié le détecte : t(19) = 6,48, p < .001, amélioration moyenne de 1,4. Dans Jamovi, l'analyse « Paired Samples T-Test » donne exactement les mêmes chiffres qu'un test t à un échantillon effectué sur une variable de différence créée à la main."},{"titre":"Tests unilatéraux et taille d'effet (d de Cohen)","contenu":"Toutes les variantes du test t peuvent être unilatérales lorsqu'on ne s'intéresse qu'à une direction de l'effet (par exemple, tester seulement si la vraie moyenne est supérieure à 67,5) ; la statistique t et les degrés de liberté ne changent pas, mais la valeur p change (zone de rejet différente) et l'intervalle de confiance devient unilatéral. Le manuel précise que les tests unilatéraux sont légitimes à condition d'être planifiés à l'avance. La taille de l'effet la plus utilisée pour un test t est le d de Cohen : la différence entre les moyennes exprimée en nombre d'écarts-types, avec le guide approximatif d ≈ 0,2 (petit), 0,5 (modéré), 0,8 (grand), à ne pas appliquer aveuglément. Il en existe plusieurs versions : pour un échantillon d = (x̄ − μ₀)/σ̂ ; pour deux échantillons indépendants Jamovi utilise l'écart-type poolé (version parfois appelée g de Hedges) ; pour un test apparié, Jamovi calcule d = D̄/σ̂D par rapport aux scores de différence, ce qui peut donner une valeur très différente (1,45 chez Chico) de celle calculée sur l'échelle des variables originales (0,22)."},{"titre":"Vérifier la normalité : graphiques QQ et test de Shapiro-Wilk","contenu":"Tous les tests t supposent la normalité des données, hypothèse souvent raisonnable grâce au théorème central limite, mais parfois clairement violée (les temps de réponse en psychologie, par exemple, sont systématiquement asymétriques). Le graphique QQ trace le quantile observé de chaque observation contre le quantile théorique attendu sous la normalité : si les données sont normales, les points forment une ligne droite ; des données asymétriques donnent une courbe qui se plie vers le haut, et une forte kurtosis un tracé aplati au milieu et incurvé aux extrémités. Le test de Shapiro-Wilk formalise cette vérification : l'hypothèse nulle est que les N observations sont normalement distribuées, et contrairement à la plupart des tests, ce sont les petites valeurs de W (maximum 1) qui indiquent un écart à la normalité. Dans Jamovi, on obtient Shapiro-Wilk en cochant « Normality » sous « Assumption Checks » dans les analyses de tests t ; il convient de rapporter W, la valeur p et idéalement N."},{"titre":"Tests non paramétriques : Wilcoxon et Mann-Whitney","contenu":"Quand les données sont substantiellement non normales (comme les marges de victoire AFL, où Shapiro-Wilk donne W = 0,94, p = 9,481e-07), on peut remplacer les tests t par les tests de Wilcoxon, qui ne font aucune supposition sur le type de distribution : ce sont des tests non paramétriques. L'inconvénient est qu'ils sont habituellement moins puissants que le test t (taux d'erreur de type II plus élevé). Le test U de Mann-Whitney (deux échantillons indépendants) compare chaque observation d'un groupe à chaque observation de l'autre et compte le nombre de fois où la première est plus grande. Le test de Wilcoxon pour un échantillon (ou son équivalent apparié) compare les différences positives à l'ensemble des différences de l'échantillon ; l'interprétation de la statistique W est qualitativement la même que celle de t ou z."}],"concepts":["z-test pour un échantillon (σ connu)","Test t sur un échantillon et degrés de liberté N − 1","Test t de Student pour échantillons indépendants","Homogénéité de la variance et estimation poolée de l'écart-type","Test de Welch (variances inégales, ddl non entiers)","Test t pour échantillons appariés (scores de différence)","Tests unilatéraux vs bilatéraux","Taille d'effet : d de Cohen (0,2 / 0,5 / 0,8)","Vérification de la normalité : graphique QQ et Shapiro-Wilk","Tests non paramétriques de Wilcoxon et Mann-Whitney"],"formules":[{"nom":"Statistique z (z-test à un échantillon)","formule":"z = (x̄ − μ₀) / SE(x̄), avec SE(x̄) = σ/√N","explication":"On standardise l'écart entre la moyenne observée et la moyenne prédite par l'hypothèse nulle en le divisant par l'erreur type de la moyenne, calculée avec l'écart-type de population σ supposé connu. Sous H₀, z suit une loi normale standard."},{"nom":"Statistique t (test t sur un échantillon)","formule":"t = (x̄ − μ) / (σ̂/√N)","explication":"Identique au z-score sauf que l'écart-type inconnu σ est remplacé par son estimation σ̂ ; la statistique suit alors une distribution t à N − 1 degrés de liberté, aux queues plus épaisses que la normale."},{"nom":"Statistique t (échantillons indépendants)","formule":"t = (x̄₁ − x̄₂) / SE(x̄₁ − x̄₂)","explication":"La différence entre les moyennes des deux groupes est divisée par l'erreur type de cette différence. Sous H₀ (μ₁ = μ₂), t suit une distribution t à N − 2 degrés de liberté dans la version de Student."},{"nom":"Erreur type poolée (test de Student)","formule":"SE(x̄₁ − x̄₂) = σ̂ · √(1/N₁ + 1/N₂), avec σ̂p² = Σᵢₖ(Xᵢₖ − x̄ₖ)² / (N − 2)","explication":"En supposant σ₁ = σ₂, on calcule une estimation globale de la variance en divisant la somme des écarts quadratiques aux moyennes de groupe par N − 2 (deux moyennes estimées, donc deux contraintes)."},{"nom":"Erreur type du test de Welch","formule":"SE(x̄₁ − x̄₂) = √(σ̂₁²/N₁ + σ̂₂²/N₂)","explication":"Quand les variances des deux populations peuvent différer, chaque groupe contribue sa propre variance à l'erreur type. Les degrés de liberté de Welch, ddl = (σ̂₁²/N₁ + σ̂₂²/N₂)² / [(σ̂₁²/N₁)²/(N₁−1) + (σ̂₂²/N₂)²/(N₂−1)], ne sont généralement pas entiers et sont un peu plus petits que ceux de Student."},{"nom":"Statistique t (échantillons appariés)","formule":"t = D̄ / (σ̂D/√N), avec Dᵢ = Xᵢ₁ − Xᵢ₂","explication":"On calcule le score de différence de chaque participant, puis on fait un test t à un échantillon sur ces différences (H₀ : μD = 0) ; σ̂D est l'écart-type des scores de différence et les degrés de liberté valent N − 1."},{"nom":"d de Cohen","formule":"d = (moyenne 1 − moyenne 2) / écart-type ; un échantillon : d = (x̄ − μ₀)/σ̂ ; deux échantillons : d = (x̄₁ − x̄₂)/σ̂p ; apparié : d = D̄/σ̂D","explication":"Le d de Cohen exprime la différence entre les moyennes en nombre d'écarts-types. Guide approximatif : environ 0,2 = effet petit, 0,5 = effet modéré, 0,8 = effet grand, à interpréter avec prudence selon le contexte pratique."},{"nom":"Statistique W de Shapiro-Wilk","formule":"W = (Σᵢ aᵢXᵢ)² / Σᵢ(Xᵢ − x̄)²","explication":"Test de l'hypothèse nulle que les N observations sont normalement distribuées. W vaut au maximum 1 (données « parfaitement normales ») et, contrairement à la plupart des statistiques de test, ce sont les petites valeurs de W qui signalent un écart à la normalité."}],"jamovi":"Test t sur un échantillon : Analyses > T-Tests > One Sample T-Test, déplacer la variable dans « Dependent Variables » et saisir la moyenne de l'hypothèse nulle (ex. 67.5) dans « Hypothesis > Test value ». Test t pour échantillons indépendants : Analyses > T-Tests > Independent Samples T-Test, mettre la variable de résultat dans « Dependent Variables » et la variable de groupe dans « Grouping Variable » ; cocher « Student's » et/ou « Welch's » sous « Tests », et « Mann-Whitney U » pour la version non paramétrique. Test t apparié : Analyses > T-Tests > Paired Samples T-Test, glisser les deux mesures dans la boîte « Paired Variables » (ou créer une variable de différence via Data > Compute puis faire un One Sample T-Test dessus) ; l'option « Wilcoxon rank » donne le test non paramétrique. Options utiles sous « Additional Statistics » : Mean difference, Effect size (d de Cohen), Confidence interval, Descriptives. Sous « Assumption Checks » : cocher « Normality » (test de Shapiro-Wilk) et « Equality of variances » (test de Levene, test indépendant seulement). Pour un test unilatéral, choisir sous « Hypothesis » l'option « > Test value » / « < Test value » (un échantillon), « Group 1 > Group 2 » (indépendants) ou « Measure 1 > Measure 2 » (apparié). Les moyennes et écarts-types descriptifs s'obtiennent via Exploration > Descriptives.","glossaire":[{"terme":"z-test","definition":"Test comparant la moyenne d'un échantillon à une valeur hypothétique en supposant l'écart-type de population σ connu ; la statistique z suit une loi normale standard. Presque jamais utilisé en pratique car σ n'est jamais réellement connu."},{"terme":"Distribution t","definition":"Distribution d'échantillonnage de la statistique t, semblable à la normale mais avec des queues plus épaisses ; elle dépend des degrés de liberté et devient pratiquement identique à la normale quand ils augmentent."},{"terme":"Degrés de liberté (ddl)","definition":"En gros, le nombre de points de données moins le nombre de contraintes : N − 1 pour un test t à un échantillon ou apparié, N − 2 pour le test de Student. Dans le test de Welch, ils sont calculés autrement et ne sont généralement pas entiers."},{"terme":"Homogénéité de la variance (homoscédasticité)","definition":"Hypothèse du test de Student selon laquelle l'écart-type de population est le même dans les deux groupes (σ₁ = σ₂). Elle peut être testée avec le test de Levene, et le test de Welch permet de s'en passer."},{"terme":"Estimation globale (poolée) de l'écart-type","definition":"Estimation unique σ̂p de l'écart-type commun aux deux groupes, obtenue par une moyenne pondérée des variances des échantillons (poids Nₖ − 1), soit la somme des écarts quadratiques divisée par N − 2."},{"terme":"Test de Welch","definition":"Variante du test t pour échantillons indépendants qui ne suppose pas l'égalité des variances : l'erreur type combine les variances séparées des deux groupes et les degrés de liberté ne sont pas entiers. Généralement préférable quand on doute de l'égalité des écarts-types."},{"terme":"Test t pour échantillons appariés","definition":"Test utilisé quand chaque participant fournit deux scores (mesures répétées) : on teste si la moyenne des scores de différence intra-sujet est nulle. C'est au fond un test t à un échantillon appliqué à la variable de différence."},{"terme":"Test unilatéral","definition":"Test dont l'hypothèse alternative ne porte que sur une direction (par exemple μ > 67,5) : la zone de rejet est concentrée d'un seul côté et l'intervalle de confiance devient unilatéral. Légitime à condition d'être planifié à l'avance."},{"terme":"d de Cohen","definition":"Mesure standard de la taille de l'effet pour un test t : la différence entre les moyennes exprimée en nombre d'écarts-types. Guide approximatif : 0,2 petit, 0,5 modéré, 0,8 grand."},{"terme":"Graphique QQ (quantile-quantile)","definition":"Graphique de diagnostic où chaque observation est tracée selon son quantile théorique sous la normalité (x) et son quantile observé (y) : des données normales forment une ligne droite, une asymétrie ou une forte kurtosis courbe le tracé."},{"terme":"Test de Shapiro-Wilk","definition":"Test formel de normalité dont l'hypothèse nulle est que les données sont normalement distribuées ; de petites valeurs de la statistique W (maximum 1) et un p faible indiquent une violation de la normalité."},{"terme":"Test non paramétrique (Wilcoxon / Mann-Whitney)","definition":"Test qui ne fait aucune supposition sur la distribution des données : le U de Mann-Whitney remplace le test t indépendant, et le W de Wilcoxon remplace les tests t à un échantillon ou appariés. Ils sont toutefois habituellement moins puissants que les tests t."}],"quiz":[{"question":"Pourquoi le z-test à un échantillon n'est-il presque jamais utilisé dans la vraie vie ?","options":["Parce qu'il exige des échantillons de très grande taille","Parce qu'il ne fonctionne que pour des données non normales","Parce qu'il suppose que l'écart-type de la population est connu, ce qui est toujours faux en pratique","Parce qu'il ne peut pas être bilatéral"],"bonne":2,"explication":"Le manuel qualifie de « stupide » l'hypothèse d'un σ connu : dans aucun problème réel on ne connaît l'écart-type d'une population tout en ignorant sa moyenne. C'est précisément ce défaut qui motive le test t, où σ est remplacé par son estimation σ̂."},{"question":"Un chercheur mesure la mémoire de travail des mêmes 25 participants avec et sans musique. Quel test doit-il utiliser pour comparer les deux conditions ?","options":["Un test t pour échantillons appariés","Un test t pour échantillons indépendants (Student)","Un z-test à un échantillon","Un test de Levene"],"bonne":0,"explication":"Chaque participant apparaît dans les deux conditions (plan à mesures répétées) : il faut un test t apparié, qui analyse les différences intra-sujet. Un test indépendant confondrait ces différences avec la variabilité entre sujets."},{"question":"Quelle est la principale différence d'hypothèses entre le test de Student et le test de Welch pour échantillons indépendants ?","options":["Welch ne suppose pas la normalité des données","Welch ne suppose pas l'indépendance des observations","Student ne nécessite pas de variable de regroupement","Welch ne suppose pas l'homogénéité de la variance (écarts-types égaux)"],"bonne":3,"explication":"Les deux tests supposent la normalité et l'indépendance ; seul Student suppose en plus que les deux populations ont le même écart-type. Welch calcule l'erreur type à partir des variances séparées et des degrés de liberté non entiers, ce qui le rend robuste aux variances inégales."},{"question":"Sur les données de Harpo, Student donne p = .043 (significatif) et Welch p = .054 (non significatif). Quelle est la bonne attitude selon le manuel ?","options":["Conclure que les données sont inutilisables et abandonner l'analyse","Ne pas surinterpréter la différence entre un p proche de .05 de part et d'autre du seuil, et réfléchir au test le plus approprié (Welch étant souvent préférable)","Choisir le test de Student parce qu'il est significatif","Faire la moyenne des deux valeurs p"],"bonne":1,"explication":"Le manuel avertit qu'il n'est pas raisonnable d'interpréter la différence entre p = .049 et p = .051 : dans la vraie vie, un tel écart est presque certainement dû au hasard. Ce qui compte est de choisir le test adapté ; l'auteur préfère Welch car l'égalité parfaite des écarts-types de population est peu crédible."},{"question":"Dans un test t pour échantillons indépendants, votre statistique t est négative. Qu'est-ce que cela signifie ?","options":["Que le test n'est pas significatif","Que l'hypothèse de normalité est violée","Simplement que la moyenne du groupe 2 est supérieure à celle du groupe 1 ; le choix du groupe 1 est arbitraire et la valeur p bilatérale est inchangée","Qu'il faut refaire le test avec Welch"],"bonne":2,"explication":"t = (moyenne 1 − moyenne 2)/SE : le signe dépend seulement de quel groupe est étiqueté « 1 ». Pour un test bilatéral, la valeur p est identique quel que soit l'ordre ; pour savoir quel groupe est le meilleur, le plus simple est de regarder les moyennes des groupes dans la sortie Jamovi."},{"question":"Qu'est-ce qui change dans la sortie Jamovi quand on passe d'un test t bilatéral à un test unilatéral ?","options":["La statistique t et les degrés de liberté changent, mais pas la valeur p","Le d de Cohen double","Rien ne change, seul le libellé de l'hypothèse est différent","La valeur p change et l'intervalle de confiance devient unilatéral ; la statistique t et les ddl restent identiques"],"bonne":3,"explication":"Le test unilatéral a une zone de rejet différente, donc la valeur p change, et Jamovi rapporte un intervalle de confiance unilatéral (une seule borne, l'autre étant infinie). La statistique t et les degrés de liberté, eux, ne dépendent pas de la direction de l'hypothèse."},{"question":"Un test t donne d de Cohen = 0,74. Selon le guide approximatif de Cohen, comment qualifier cet effet ?","options":["Un effet plutôt grand : les moyennes sont séparées d'environ 0,74 écart-type (entre modéré, 0,5, et grand, 0,8)","Un effet nul, car d doit dépasser 1 pour compter","Un petit effet, car d est inférieur à 1","Impossible à dire sans la valeur p"],"bonne":0,"explication":"Le guide de Cohen indique environ 0,2 = petit, 0,5 = modéré, 0,8 = grand ; d = 0,74 se situe donc entre modéré et grand. Le manuel rappelle toutefois de ne pas appliquer ce guide aveuglément : d décrit la séparation des moyennes en écarts-types, et son importance dépend du contexte pratique."},{"question":"Quelle particularité distingue la statistique W de Shapiro-Wilk de la plupart des statistiques de test ?","options":["Elle peut être négative quand les données sont asymétriques","Ce sont les petites valeurs de W (le maximum étant 1) qui indiquent un écart à la normalité","Elle suit toujours une distribution normale standard","Plus W est grand, plus les données s'écartent de la normalité"],"bonne":1,"explication":"W vaut au maximum 1, valeur atteinte quand les données semblent parfaitement normales ; plus W est petit, moins les données sont normales. C'est l'inverse de la logique habituelle où de grandes statistiques signalent un effet, et la distribution d'échantillonnage de W dépend en outre de N."},{"question":"Vos données violent clairement la normalité (Shapiro-Wilk significatif, QQ plot courbé) et vous voulez comparer deux groupes indépendants. Que faire ?","options":["Utiliser quand même le test de Student, qui n'a pas d'hypothèse de normalité","Utiliser le test de Welch, conçu pour les données non normales","Utiliser le test U de Mann-Whitney, test non paramétrique qui ne fait aucune supposition sur la distribution","Supprimer les observations extrêmes jusqu'à ce que Shapiro-Wilk devienne non significatif"],"bonne":2,"explication":"Le Mann-Whitney U est l'équivalent non paramétrique du test t indépendant : il compare chaque observation d'un groupe à chaque observation de l'autre sans supposer de distribution. Attention au piège : Welch dispense de l'égalité des variances, pas de la normalité. Le prix à payer est une puissance généralement moindre que le test t."},{"question":"Pourquoi l'estimation poolée de la variance dans le test de Student divise-t-elle par N − 2 et non par N − 1 ?","options":["C'est une convention arbitraire sans justification","Parce qu'il y a deux groupes, on divise une fois par N₁ et une fois par N₂","Pour rendre le test plus conservateur face aux variances inégales","Parce que le calcul repose sur deux moyennes d'échantillon estimées (une par groupe), soit deux contraintes qui biaisent la variance si on n'en tient pas compte"],"bonne":3,"explication":"Diviser par N sous-estime la variance car les écarts sont mesurés par rapport aux moyennes d'échantillon ; chaque moyenne estimée coûte un degré de liberté. Avec un échantillon on divisait par N − 1 ; avec deux moyennes de groupe estimées, il faut diviser par N − 2, ce qui correspond aussi aux degrés de liberté du test."}],"exercice":{"titre":"Anastasia contre Bernadette : analyse complète d'une comparaison de deux groupes","enonce":"Reprenez le fichier harpo.csv du manuel (33 étudiants du Dr Harpo : variables ID, grade et tuteur, avec N₁ = 15 élèves dans les travaux dirigés d'Anastasia et N₂ = 18 dans ceux de Bernadette). Question de recherche : les élèves d'Anastasia et de Bernadette obtiennent-ils en moyenne les mêmes notes ? Dans Jamovi : (1) importez harpo.csv et vérifiez que « grade » est bien traitée comme variable continue ; (2) obtenez les moyennes et écarts-types par groupe ; (3) effectuez un test t pour échantillons indépendants en demandant à la fois le test de Student et le test de Welch, avec la différence des moyennes, l'intervalle de confiance à 95 %, la taille d'effet, et les vérifications d'hypothèses (normalité et égalité des variances) ; (4) interprétez et rédigez le résultat comme dans un article, en indiquant t, ddl, p, IC95 et d de Cohen ; (5) indiquez ce que vous feriez si le test de Shapiro-Wilk avait été clairement significatif.","correction":"Étape 1 : ouvrir harpo.csv dans Jamovi ; si « grade » a été importée en variable nominale, changer son niveau de mesure en « Continuous » (double-clic sur l'en-tête de colonne). Étape 2 : Exploration > Descriptives, avec grade en variable et tuteur en « Split by » : élèves d'Anastasia, moyenne = 74,53, écart-type = 9,00, N = 15 ; élèves de Bernadette, moyenne = 69,06, écart-type = 5,77, N = 18. Étape 3 : Analyses > T-Tests > Independent Samples T-Test ; glisser grade dans « Dependent Variables » et tuteur dans « Grouping Variable » ; cocher « Student's » et « Welch's » sous Tests, puis « Mean difference », « Effect size », « Confidence interval », « Descriptives » sous Additional Statistics, et « Normality » et « Equality of variances » sous Assumption Checks. Étape 4 : résultats : test de Student t(31) = 2,12, p = .043, différence des moyennes = 5,48, IC95 = [0,20 ; 10,76], d = 0,74 ; test de Welch t(23,02) = 2,03, p = .054, IC95 = [−0,09 ; 11,05], d = 0,74. Shapiro-Wilk n'est pas significatif (pas de preuve de non-normalité) et le test de Levene non plus (p = .12, pas de preuve d'inégalité des variances). Rédaction possible : « La note moyenne dans la classe d'Anastasia était de 74,5 (écart-type = 9,0) et celle de la classe de Bernadette de 69,1 (écart-type = 5,8). Le test t de Student pour échantillons indépendants montre que cette différence de 5,4 points est significative (t(31) = 2,1, p < .05, IC95 = [0,2 ; 10,8], d = 0,74), un effet plutôt grand. » On notera toutefois qu'avec Welch le résultat passe juste au-dessus du seuil (p = .054) : il ne faut pas surinterpréter cette différence entre les deux valeurs p, mais elle rappelle que la significativité est ici fragile, et l'auteur du manuel recommande plutôt Welch en pratique puisque l'égalité exacte des écarts-types de population est peu plausible. Étape 5 : si Shapiro-Wilk avait clairement rejeté la normalité (petit W, p faible, QQ plot courbé), on remplacerait le test t par son équivalent non paramétrique en cochant « Mann-Whitney U » sous Tests, en acceptant une puissance un peu moindre."}},{"numero":12,"titre":"Corrélation et régression linéaire","sections":[{"titre":"Corrélation et coefficient de Pearson","contenu":"Le chapitre s'appuie sur les données fictives sur la parentalité (parenthood.csv : sommeil de Dan, sommeil de son fils, grinchiosité de Dan) pour décrire la relation entre deux variables continues. Un diagramme de dispersion donne une première idée de la force et de la direction d'une relation : par exemple, plus de sommeil égale moins de grinchiosité. Le coefficient de corrélation de Pearson r formalise cette idée : il varie entre -1 et 1, où r = 1 indique une relation positive parfaite, r = -1 une relation négative parfaite et r = 0 une absence de relation. Techniquement, r est une covariance standardisée : on divise la covariance entre X et Y par le produit de leurs écarts-types, ce qui règle le problème des unités bizarres de la covariance (comme des « heures × grinchiosité »)."},{"titre":"Interpréter une corrélation et le quatuor d'Anscombe","contenu":"L'interprétation d'une corrélation dépend fortement du contexte : un r de 0,3 peut être excellent en psychologie cognitive alors qu'un ingénieur exigerait 0,95. Le manuel propose néanmoins un guide approximatif : de 0 à 0,2 négligeable, 0,2 à 0,4 faible, 0,4 à 0,7 modéré, 0,7 à 0,9 fort et 0,9 à 1 très fort (avec les mêmes seuils en négatif). Surtout, il faut toujours regarder le nuage de points avant d'interpréter : le quatuor d'Anscombe montre quatre jeux de données qualitativement très différents qui partagent pourtant exactement la même corrélation r = 0,816. La leçon, trop souvent oubliée, est qu'il faut toujours tracer un graphique de ses données brutes."},{"titre":"Corrélation de rang de Spearman","contenu":"Le r de Pearson ne mesure que la force de la relation linéaire entre deux variables, c'est-à-dire leur tendance à s'aligner sur une droite. Or certaines relations sont monotones sans être linéaires : dans l'exemple de l'effort d'étude et de la note obtenue, plus d'heures de travail augmente toujours la note, mais de façon non linéaire, et Pearson donne r = 0,91 alors que la relation ordinale est parfaite. La corrélation de Spearman ρ résout ce problème en remplaçant les valeurs par leurs rangs avant de calculer la corrélation : elle vaut alors 1 si le classement des deux variables est identique. Dans Jamovi, il suffit de cocher la case « Spearman » dans « Correlation Matrix »."},{"titre":"Le modèle de régression linéaire simple et son estimation","contenu":"La régression linéaire est une version plus sophistiquée de la corrélation : on trace une droite de régression qui passe au milieu des données, d'équation Ŷᵢ = b₀ + b₁Xᵢ, où b₀ est l'intersection (valeur attendue de Y quand X = 0) et b₁ la pente (variation de Y quand X augmente d'une unité). Les résidus εᵢ = Yᵢ - Ŷᵢ mesurent l'écart entre les données réelles et les prédictions du modèle. Les coefficients estimés b̂₀ et b̂₁ sont ceux qui minimisent la somme des résidus au carré : c'est la régression des moindres carrés ordinaires (MCO). Pour les données de parentalité, on obtient Ŷᵢ = 125,96 + (-8,94 Xᵢ) : chaque heure de sommeil supplémentaire réduit la grinchiosité de Dan d'environ 8,94 points."},{"titre":"Régression multiple et qualité d'ajustement (R²)","contenu":"La régression multiple étend le modèle en ajoutant des prédicteurs : Yᵢ = b₀ + b₁Xᵢ₁ + b₂Xᵢ₂ + εᵢ, et le principe d'estimation reste la minimisation de la somme des carrés des résidus (le modèle forme alors un plan plutôt qu'une droite). Pour juger la qualité du modèle, on compare la somme des carrés résiduelle SSᵣₑₛ à la variabilité totale SSₜₒₜ, ce qui donne R² = 1 - SSᵣₑₛ/SSₜₒₜ, le coefficient de détermination : la proportion de variance du résultat expliquée par le modèle. Dans l'exemple, R² = 0,816, donc dan.sleep explique 81,6 % de la variance de la grinchiosité. Pour une régression à un seul prédicteur, R² est exactement le carré de la corrélation de Pearson r². Le R² ajusté corrige la tendance de R² à toujours augmenter quand on ajoute des prédicteurs, mais il perd l'interprétation élégante en proportion de variance."},{"titre":"Tests d'hypothèses et coefficients standardisés","contenu":"Deux types de tests existent : le test F du modèle dans son ensemble compare le modèle nul (intersection seule) au modèle complet en divisant la variance en SSₘₒd et SSᵣₑₛ, avec F = MSₘₒd/MSᵣₑₛ ; de grandes valeurs de F rejettent l'hypothèse nulle d'absence de relation. Le test t sur chaque coefficient teste H₀ : b = 0 contre H₁ : b ≠ 0 avec t = b̂/SE(b̂) et df = N - K - 1. Dans l'exemple, le modèle global est très significatif (F(2,97) = 215,24, p < .001) mais le test t montre que baby.sleep n'a aucun effet significatif : réussir le test F ne garantit pas que chaque prédicteur est utile. On peut aussi rapporter des intervalles de confiance CI(b) = b̂ ± tcrit × SE(b̂), et des coefficients standardisés β (obtenus comme si toutes les variables étaient converties en z-scores) pour comparer l'importance de prédicteurs mesurés sur des échelles différentes."},{"titre":"Hypothèses du modèle et vérification : résidus, données anormales, colinéarité","contenu":"La régression repose sur plusieurs hypothèses : normalité des résidus, linéarité de la relation, homogénéité de la variance des résidus, prédicteurs non fortement corrélés, indépendance des résidus et absence de valeurs aberrantes trop influentes. La vérification passe par l'examen des résidus (ordinaires, standardisés ou studentisés) : un graphique Q-Q contrôle la normalité et les « Residuals Plots » doivent montrer des points répartis uniformément sans structure. Trois types de données anormales sont distingués : la valeur aberrante (grand résidu studentisé, très éloignée de la prédiction), le point à fort effet de levier (valeur chapeau hᵢ élevée, inhabituel sur les prédicteurs) et l'observation à forte influence, qui combine les deux et déforme réellement la droite ; on la mesure par la distance de Cook (supérieure à 1 = préoccupante). Enfin, la colinéarité entre prédicteurs se diagnostique avec les facteurs d'inflation de variance (VIF) : des VIF élevés signalent que les coefficients sont estimés avec beaucoup d'incertitude."},{"titre":"Sélection de modèle et comparaison de modèles","contenu":"Choisir quels prédicteurs inclure repose sur deux principes : avoir une base théorique substantielle pour ses choix, et respecter le compromis entre simplicité et qualité d'ajustement (rasoir d'Ockham : ne pas multiplier les entités au-delà de la nécessité). Le critère d'information d'Akaike, AIC = SSᵣₑₛ/σ̂² + 2K, pénalise la complexité : plus l'AIC est faible, meilleur est le modèle ; le BIC est une alternative disponible dans Jamovi. Les procédures automatisées (élimination rétrograde, sélection en avant) existent mais le manuel met en garde contre leur usage irréfléchi : l'interprétabilité prime. Pour comparer deux modèles imbriqués, on peut utiliser un test F de comparaison (régression hiérarchique), réalisable dans Jamovi via « Model Builder » avec des blocs de prédicteurs : dans l'exemple, ajouter baby.sleep n'apporte rien (F(1,96) = 0,00, p = 0,954), donc on retient le modèle sans lui."}],"concepts":["Coefficient de corrélation de Pearson (r)","Covariance et standardisation","Corrélation de rang de Spearman (ρ)","Quatuor d'Anscombe : toujours tracer les données","Droite de régression et moindres carrés ordinaires (MCO)","R² et R² ajusté (coefficient de détermination)","Test F global et tests t sur les coefficients","Coefficients standardisés (β)","Outliers, effet de levier et distance de Cook","Colinéarité (VIF) et sélection de modèle (AIC, régression hiérarchique)"],"formules":[{"nom":"Covariance","formule":"Cov(X,Y) = 1/(N-1) × Σᵢ (Xᵢ - X̄)(Yᵢ - Ȳ)","explication":"Produit croisé moyen entre X et Y : elle capte le signe de la relation (positive, négative ou nulle) mais son amplitude dépend des unités et n'est pas interprétable directement."},{"nom":"Corrélation de Pearson","formule":"r₍XY₎ = Cov(X,Y) / (σ̂X × σ̂Y)","explication":"Covariance standardisée par les deux écarts-types ; r varie entre -1 (relation négative parfaite) et +1 (relation positive parfaite), 0 signifiant l'absence de relation linéaire."},{"nom":"Modèle de régression linéaire simple","formule":"Yᵢ = b₀ + b₁Xᵢ + εᵢ  (prédiction : Ŷᵢ = b₀ + b₁Xᵢ)","explication":"b₀ est l'intersection (valeur attendue de Y quand X = 0), b₁ la pente (variation de Y pour une augmentation de X d'une unité) et εᵢ = Yᵢ - Ŷᵢ le résidu."},{"nom":"Régression linéaire multiple","formule":"Yᵢ = b₀ + b₁Xᵢ₁ + b₂Xᵢ₂ + εᵢ  (cas général : Yᵢ = b₀ + Σₖ bₖXᵢₖ + εᵢ)","explication":"Extension du modèle simple à K prédicteurs ; les coefficients estimés restent ceux qui minimisent la somme des résidus au carré Σᵢ εᵢ²."},{"nom":"Coefficient de détermination","formule":"R² = 1 - SSᵣₑₛ/SSₜₒₜ  avec SSᵣₑₛ = Σᵢ(Yᵢ - Ŷᵢ)² et SSₜₒₜ = Σᵢ(Yᵢ - Ȳ)²","explication":"Proportion de la variance de la variable résultat expliquée par le modèle ; R² = 1 signifie une prédiction parfaite, R² = 0 un modèle inutile. Pour un seul prédicteur, R² = r²."},{"nom":"R² ajusté","formule":"adj. R² = 1 - (SSᵣₑₛ/SSₜₒₜ) × (N-1)/(N-K-1)","explication":"Correction tenant compte des degrés de liberté : il n'augmente que si un nouveau prédicteur améliore le modèle plus qu'attendu par hasard, mais il perd l'interprétation en proportion de variance."},{"nom":"Statistique F du modèle","formule":"F = MSₘₒd/MSᵣₑₛ  avec MSₘₒd = SSₘₒd/dfₘₒd et MSᵣₑₛ = SSᵣₑₛ/dfᵣₑₛ (dfₘₒd = K, dfᵣₑₛ = N-K-1)","explication":"Teste le modèle dans son ensemble contre le modèle nul à intersection seule ; de grandes valeurs de F indiquent que l'hypothèse nulle fonctionne mal."},{"nom":"Test t d'un coefficient","formule":"t = b̂ / SE(b̂),  df = N - K - 1","explication":"Teste H₀ : b = 0 contre H₁ : b ≠ 0 pour chaque coefficient individuel ; des valeurs extrêmes de t conduisent à rejeter l'hypothèse nulle."},{"nom":"Intervalle de confiance d'un coefficient","formule":"CI(b) = b̂ ± (tcrit × SE(b̂))","explication":"Exprime l'incertitude sur la vraie valeur de b ; pour un IC à 95 %, tcrit est le quantile 97,5 d'une distribution t à N-K-1 degrés de liberté."},{"nom":"Coefficient standardisé","formule":"βX = bX × (σX/σY)","explication":"Coefficient qu'on aurait obtenu en convertissant toutes les variables en z-scores ; β = 1 signifie qu'une augmentation d'un écart-type du prédicteur produit une augmentation d'un écart-type du résultat."},{"nom":"Distance de Cook","formule":"Dᵢ = (εᵢ*²/(K+1)) × (hᵢ/(1-hᵢ))","explication":"Mesure l'influence d'une observation en combinant son caractère aberrant (résidu studentisé) et son effet de levier (valeur chapeau hᵢ) ; une valeur supérieure à 1 est souvent considérée comme grande."},{"nom":"Facteur d'inflation de variance","formule":"VIFₖ = 1 / (1 - R²₍₋ₖ₎)","explication":"R²₍₋ₖ₎ est le R² obtenu en régressant Xₖ sur tous les autres prédicteurs ; un VIF élevé signale une forte colinéarité, et sa racine carrée indique de combien l'intervalle de confiance de bₖ est gonflé."},{"nom":"Critère d'information d'Akaike","formule":"AIC = SSᵣₑₛ/σ̂² + 2K","explication":"Critère de sélection de modèle qui pénalise à la fois les mauvaises prédictions (terme de gauche) et la complexité (terme 2K) ; plus l'AIC est faible, meilleur est le modèle."}],"jamovi":"Corrélations : ouvrir parenthood.csv, puis Analyses > Regression > Correlation Matrix ; transférer les variables continues dans la boîte de droite ; cocher « Pearson » et/ou « Spearman », « Report Significance », éventuellement « Confidence intervals ». Diagramme de dispersion : dans Correlation Matrix, cocher « Plot » > « Correlation matrix » et « Densities for variables » ; ou installer le module « Scatr » (icône « + » en haut à droite > bibliothèque Jamovi > scatr > Install) qui ajoute « Scatterplot » sous Exploration. Régression simple : Analyses > Regression > Linear Regression ; placer dan.grump en « Dependent Variable » et dan.sleep en « Covariates ». Régression multiple : ajouter baby.sleep dans « Covariates ». Sous « Model Fit », cocher R, R², Adjusted R², AIC/BIC et « F test » (Overall Model Test) ; sous « Model Coefficients », cocher « Confidence interval » (95 %) et « Standardized estimate » pour les β. Vérification du modèle sous « Assumption Checks » : « Q-Q plot of residuals » (normalité), « Residual plots » (linéarité et homogénéité), « Collinearity statistics » (VIF et tolérance) et « Cook's distance » dans « Data Summary ». Comparaison de modèles (régression hiérarchique) : ouvrir « Model Builder », mettre les prédicteurs du modèle 1 dans « Block 1 » (ex. dan.sleep et day), puis ajouter le prédicteur supplémentaire (baby.sleep) dans « Block 2 » ; le tableau « Model Comparisons » donne le test F et les AIC/BIC de chaque modèle.","glossaire":[{"terme":"Corrélation de Pearson (r)","definition":"Mesure standardisée de la force et de la direction de la relation linéaire entre deux variables continues, variant de -1 à +1."},{"terme":"Covariance","definition":"Produit croisé moyen entre deux variables qui capte le signe de leur relation, mais dont l'amplitude dépend des unités et n'est pas interprétable directement."},{"terme":"Corrélation de Spearman (ρ)","definition":"Corrélation calculée sur les rangs des observations plutôt que sur leurs valeurs ; elle mesure la force d'une relation ordinale (monotone), pas seulement linéaire."},{"terme":"Droite de régression","definition":"Droite Ŷᵢ = b₀ + b₁Xᵢ qui passe au milieu des données et résume la relation entre le prédicteur et la variable résultat."},{"terme":"Résidu (εᵢ)","definition":"Différence entre la valeur observée et la valeur prédite par le modèle : εᵢ = Yᵢ - Ŷᵢ. On distingue les résidus ordinaires, standardisés et studentisés."},{"terme":"Moindres carrés ordinaires (MCO)","definition":"Méthode d'estimation qui choisit les coefficients b̂₀ et b̂₁ minimisant la somme des résidus au carré Σᵢ(Yᵢ - Ŷᵢ)²."},{"terme":"Coefficient de détermination (R²)","definition":"Proportion de la variance de la variable résultat expliquée par le modèle de régression ; pour un modèle à un seul prédicteur, R² égale le carré de la corrélation r."},{"terme":"Coefficient standardisé (β)","definition":"Coefficient de régression exprimé en écarts-types (comme si toutes les variables étaient des z-scores), utile pour comparer des prédicteurs mesurés sur des échelles différentes."},{"terme":"Valeur aberrante (outlier)","definition":"Observation très différente de ce que le modèle prévoit, repérée par un grand résidu studentisé ; elle mérite examen mais ne doit pas être supprimée automatiquement."},{"terme":"Effet de levier (valeur chapeau hᵢ)","definition":"Mesure du caractère inhabituel d'une observation sur les variables prédictrices ; un levier élevé (plus de 2-3 fois la moyenne) signale un point éloigné des autres en X."},{"terme":"Distance de Cook","definition":"Mesure de l'influence d'une observation combinant résidu et effet de levier ; une distance supérieure à 1 suggère que le point déforme fortement la droite de régression."},{"terme":"Colinéarité et VIF","definition":"Situation où les prédicteurs sont fortement corrélés entre eux ; le facteur d'inflation de variance (VIF) la diagnostique, un VIF élevé rendant les coefficients très incertains."},{"terme":"Régression hiérarchique","definition":"Approche où l'on place les covariables de contrôle dans un modèle nul puis on ajoute les variables d'intérêt dans un modèle alternatif, comparés par un test F (Model Builder dans Jamovi)."}],"quiz":[{"question":"Un coefficient de corrélation de Pearson r = -0,85 entre le sommeil et la grinchiosité indique :","options":["Une relation positive faible","Une absence de relation","Une relation négative forte : plus de sommeil est associé à moins de grinchiosité","Que dormir cause une baisse de 85 % de la grinchiosité"],"bonne":2,"explication":"Selon le guide du manuel, une valeur entre -0,9 et -0,7 correspond à une relation forte et négative : quand une variable augmente, l'autre tend à diminuer. La corrélation ne dit rien sur la causalité ni sur un pourcentage de réduction."},{"question":"Pourquoi utilise-t-on la corrélation r plutôt que la covariance brute ?","options":["Parce que la covariance est standardisée entre -1 et 1, mais dépend des unités des variables ; r corrige cela en divisant par les deux écarts-types","Parce que la covariance ne peut pas être négative","Parce que la covariance ne détecte que les relations non linéaires","Parce que r se calcule sans connaître les moyennes"],"bonne":0,"explication":"La covariance capte bien le signe de la relation, mais son amplitude dépend des unités (par exemple « heures × grinchiosité », ininterprétable). En la divisant par σ̂X × σ̂Y, on obtient r, une mesure standardisée entre -1 et 1."},{"question":"Que nous enseigne le quatuor d'Anscombe ?","options":["Que quatre variables suffisent pour toute analyse","Que la corrélation de Spearman est toujours supérieure à celle de Pearson","Que r = 0,816 correspond toujours à une relation forte et fiable","Que des jeux de données très différents peuvent avoir exactement la même corrélation : il faut toujours tracer ses données brutes"],"bonne":3,"explication":"Les quatre ensembles d'Anscombe ont tous r = 0,816, mêmes moyennes et écarts-types presque identiques, mais des nuages de points qualitativement très différents. La statistique seule peut être trompeuse : il faut toujours regarder le graphique."},{"question":"Dans quel cas la corrélation de Spearman est-elle préférable à celle de Pearson ?","options":["Quand les deux variables sont parfaitement normales","Quand la relation est monotone mais non linéaire, comme entre les heures d'étude et la note obtenue","Quand on veut mesurer la pente de la droite de régression","Quand l'échantillon dépasse 100 observations"],"bonne":1,"explication":"Spearman travaille sur les rangs : dans l'exemple du manuel, plus d'effort augmente toujours la note (relation ordinale parfaite, ρ = 1) alors que Pearson ne donne que r = 0,91 car la relation n'est pas linéaire."},{"question":"Dans le modèle Ŷᵢ = 125,96 + (-8,94 Xᵢ) prédisant la grinchiosité à partir des heures de sommeil, que signifie le coefficient -8,94 ?","options":["La grinchiosité maximale possible","La corrélation entre les deux variables","Chaque heure de sommeil supplémentaire réduit la grinchiosité prédite de 8,94 points","Le pourcentage de variance expliquée par le sommeil"],"bonne":2,"explication":"La pente b₁ indique la variation de Y quand X augmente d'une unité : ici, une heure de sommeil en plus est associée à une baisse de 8,94 points de grinchiosité. L'intersection 125,96 est la grinchiosité prédite pour zéro heure de sommeil."},{"question":"Un modèle de régression donne R² = 0,816. Quelle est l'interprétation correcte ?","options":["Le prédicteur explique 81,6 % de la variance de la variable résultat","Le modèle se trompe dans 81,6 % des cas","La corrélation entre les variables est de 0,816","81,6 % des observations sont sur la droite de régression"],"bonne":0,"explication":"R² est le coefficient de détermination : la proportion de la variance du résultat prise en compte par le modèle. Attention : pour un seul prédicteur, la corrélation serait √0,816 ≈ 0,90, pas 0,816."},{"question":"Pourquoi rapporter parfois le R² ajusté plutôt que le R² ?","options":["Parce que le R² ajusté est toujours plus grand","Parce que le R² ajusté s'interprète directement comme une proportion de variance","Parce que le R² ordinaire ne peut pas dépasser 0,5","Parce que le R² augmente mécaniquement à chaque prédicteur ajouté, alors que le R² ajusté n'augmente que si l'ajout améliore le modèle plus qu'attendu par hasard"],"bonne":3,"explication":"Ajouter des prédicteurs ne peut jamais faire baisser R², même s'ils sont inutiles. Le R² ajusté pénalise la complexité via les degrés de liberté ; en contrepartie, il perd l'interprétation simple en proportion de variance expliquée."},{"question":"Dans l'exemple du manuel, le test F global est très significatif (F(2,97) = 215,24, p < .001) mais le test t de baby.sleep donne p = 0,97. Que faut-il conclure ?","options":["Le test F est faux puisque les deux tests se contredisent","Le modèle global fait mieux que le hasard, mais baby.sleep n'apporte rien : tout le travail est fait par dan.sleep, et on ferait mieux de retirer baby.sleep","baby.sleep est le prédicteur le plus important du modèle","Il faut augmenter la taille de l'échantillon avant de conclure"],"bonne":1,"explication":"Réussir le test F ne signifie pas que le modèle est le bon : il indique seulement que le modèle fait mieux que le modèle nul. Les tests t individuels montrent que baby.sleep a un coefficient minuscule et non significatif ; le modèle simple avec dan.sleep seul est meilleur."},{"question":"Quelle est la différence entre une valeur aberrante, un point à fort effet de levier et une observation influente ?","options":["Ce sont trois noms pour le même phénomène","L'aberrante a un fort levier, le levier a un grand résidu, l'influente n'a ni l'un ni l'autre","L'aberrante a un grand résidu studentisé, le point à fort levier est inhabituel sur les prédicteurs (hᵢ élevé), et l'observation influente combine les deux et déforme la droite (distance de Cook élevée)","Seules les valeurs aberrantes doivent être supprimées automatiquement"],"bonne":2,"explication":"Le manuel distingue trois cas : l'outlier est loin de la prédiction (grand résidu), le point à fort levier est inhabituel en X mais peut être proche de la droite, et le point influent est à la fois aberrant et à fort levier, ce qui déforme réellement la régression (Dᵢ > 1 est préoccupant). Aucune observation ne doit être jetée sans examen."},{"question":"Le VIF de chaque prédicteur d'un modèle vaut environ 6. Qu'est-ce que cela suggère ?","options":["Que les résidus ne sont pas normaux","Que le modèle explique 6 % de la variance","Que six prédicteurs doivent être ajoutés au modèle","Une forte colinéarité : les prédicteurs sont très corrélés entre eux et les coefficients sont estimés avec beaucoup d'incertitude"],"bonne":3,"explication":"VIFₖ = 1/(1-R²₍₋ₖ₎) mesure à quel point Xₖ est prédit par les autres prédicteurs. Un VIF élevé (dans l'exemple du manuel, prédire « day » donnait des VIF autour de 5-6) signale une colinéarité problématique ; la racine du VIF indique de combien l'intervalle de confiance du coefficient est gonflé, contrairement au VIF de 1,65 jugé sans problème pour dan.sleep et baby.sleep."}],"exercice":{"titre":"Sommeil et grinchiosité : de la corrélation au meilleur modèle","enonce":"Avec le fichier parenthood.csv (variables dan.sleep, baby.sleep, dan.grump et day), réalisez l'analyse complète suivante dans Jamovi : (1) calculez la matrice de corrélations de Pearson entre les quatre variables et identifiez la relation la plus forte ; (2) tracez le nuage de points entre dan.sleep et dan.grump et décrivez la relation ; (3) ajustez une régression linéaire multiple avec dan.grump comme variable dépendante et dan.sleep et baby.sleep comme covariables ; rapportez R², R² ajusté, le test F global et les tests t des coefficients ; (4) vérifiez les hypothèses du modèle (Q-Q plot des résidus, graphiques des résidus, VIF, distance de Cook) ; (5) à l'aide du Model Builder, comparez le modèle avec baby.sleep au modèle sans baby.sleep et concluez sur le meilleur modèle.","correction":"Étape 1 : Analyses > Regression > Correlation Matrix ; transférer dan.sleep, baby.sleep, dan.grump et day ; cocher Pearson et Report Significance. La relation la plus forte est dan.sleep/dan.grump avec r ≈ -0,90 (p < .001), très forte et négative ; baby.sleep/dan.grump donne r ≈ -0,57 et baby.sleep/dan.sleep r ≈ 0,63 ; day n'est corrélé avec rien. Étape 2 : dans Correlation Matrix, cocher Plot > Correlation matrix (ou utiliser le module Scatr : Exploration > Scatterplot). Le nuage montre une relation linéaire négative nette : plus Dan dort, moins il est grincheux. Étape 3 : Analyses > Regression > Linear Regression ; dan.grump en Dependent Variable, dan.sleep et baby.sleep en Covariates ; sous Model Fit cocher R, R², Adjusted R² et F test ; sous Model Coefficients cocher Confidence interval. Résultats : R² = 0,82, R² ajusté = 0,81, F(2,97) = 215,24, p < .00001 : le modèle global est très significatif. Coefficients : intersection = 125,97 (SE = 3,04, t = 41,42, p < .00001) ; dan.sleep = -8,95 (SE = 0,55, t = -16,17, p < .00001, significatif) ; baby.sleep = 0,01 (SE = 0,27, t = 0,04, p = 0,97, non significatif). Étape 4 : ouvrir Assumption Checks ; le Q-Q plot montre des résidus standardisés proches de la droite (normalité respectée) ; les Residual Plots montrent des points répartis uniformément sans structure (linéarité et homogénéité de la variance acceptables) ; Collinearity statistics donne VIF = 1,65 pour les deux prédicteurs (√1,65 ≈ 1,28, pas de problème de colinéarité) ; Cook's distance (Data Summary) : moyenne 0,01, maximum 0,11, bien en dessous du seuil de 1, donc aucune observation trop influente. Étape 5 : ouvrir Model Builder ; placer dan.sleep dans Block 1 et baby.sleep dans Block 2 (avec AIC/BIC cochés dans Model Fit). Le tableau Model Comparisons montre que l'ajout de baby.sleep n'améliore pas le modèle (F ≈ 0,00, p ≈ 0,95 ; l'AIC du modèle réduit est plus faible). Conclusion : conformément au rasoir d'Ockham, on retient le modèle simple dan.grump ~ dan.sleep : c'est le sommeil de Dan, et non celui du bébé, qui prédit sa grinchiosité — sans pour autant conclure à une causalité, car il s'agit de données observationnelles."}},{"numero":13,"titre":"Comparaison de plusieurs moyennes (ANOVA à un facteur)","sections":[{"titre":"La logique de l'ANOVA : des variances aux sommes des carrés","contenu":"L'ANOVA à un facteur, développée par Ronald Fisher, sert à comparer les moyennes de plusieurs groupes (plus de deux), par exemple l'amélioration de l'humeur (mood.gain) selon trois médicaments (placebo, Anxifree, Joyzepam) dans l'essai clinique fictif du manuel. L'hypothèse nulle est que toutes les moyennes de population sont identiques (H₀ : μP = μA = μJ), et l'hypothèse alternative est qu'au moins une moyenne diffère des autres. Bien que son nom fasse référence aux variances, l'ANOVA s'intéresse aux différences de moyennes : l'astuce est de décomposer la variabilité totale des données. La somme totale des carrés SS_tot se découpe exactement en une somme des carrés inter groupes SS_b (différences entre les moyennes de groupes et la moyenne générale) et une somme des carrés intra groupes SS_w (écarts de chaque individu à la moyenne de son propre groupe), avec SS_w + SS_b = SS_tot. Si l'hypothèse nulle est vraie, on s'attend à ce que SS_b soit petit par rapport à SS_w."},{"titre":"La statistique F et son interprétation","contenu":"Pour construire un test d'hypothèse, on convertit les sommes des carrés en carrés moyens en les divisant par leurs degrés de liberté : df_b = G − 1 (G est le nombre de groupes) et df_w = N − G. La statistique de test est le rapport F = MS_b / MS_w : plus F est élevé, plus la variation inter groupes est importante par rapport à la variation intra groupes, et plus on a de preuves contre l'hypothèse nulle. Sous H₀, F suit une distribution F avec df_b et df_w degrés de liberté, et sa moyenne vaut environ 1 ; il faut donc des valeurs de F supérieures à 1 pour espérer rejeter H₀. En effet, MS_w estime la variance des erreurs σ², tandis que MS_b estime σ² plus une quantité Q qui dépend des vraies différences entre moyennes de groupes. Dans l'exemple des essais cliniques, on obtient F(2,15) = 18,6 avec p = 0,00009, ce qui permet de rejeter H₀ et de conclure à un effet significatif du médicament."},{"titre":"Exécuter l'ANOVA dans Jamovi et taille de l'effet η²","contenu":"Dans Jamovi, on sélectionne « ANOVA » - « ANOVA », on place mood.gain dans « Dependent Variable » et drug dans « Fixed Factors » ; le tableau de résultats donne les sommes des carrés, les degrés de liberté, F et p, la variance résiduelle (Residuals) correspondant à la variabilité intra groupes. Pour quantifier l'ampleur de l'effet, la mesure la plus courante est l'êta au carré : η² = SS_b / SS_tot, qui s'interprète comme la proportion de la variabilité de la variable résultat expliquée par le prédicteur (ici η² = 3,45/4,84 = 0,71). Une valeur de 0 signifie aucune relation et une valeur de 1 une relation parfaite ; η² est étroitement lié au R² de la régression. Le manuel note que η² peut être un estimateur biaisé et que Jamovi propose aussi l'oméga carré (ω²), moins biaisé."},{"titre":"Comparaisons multiples, tests post hoc et corrections de Bonferroni et Holm","contenu":"Quand l'ANOVA est significative avec plus de deux groupes, on veut savoir quels groupes diffèrent : on effectue alors des tests t par paires, dits analyses post hoc, accessibles dans Jamovi via l'option « Post Hoc Tests ». Le problème est que multiplier les tests fait exploser le taux d'erreur de type I de la famille de tests : avec 10 groupes et 45 tests t à α = 0,05, on s'attendrait à 2 ou 3 résultats significatifs par simple hasard. La correction de Bonferroni multiplie chaque valeur p brute par le nombre m de tests (p' = m × p), garantissant un taux d'erreur global d'au plus α. La correction de Holm procède séquentiellement, de la plus petite à la plus grande valeur p, en multipliant la j-ème plus grande valeur p par j et en conservant la valeur ajustée la plus contraignante ; elle est plus puissante que Bonferroni (moins d'erreurs de type II) tout en gardant le même taux d'erreur de type I, si bien qu'en pratique elle devrait toujours lui être préférée."},{"titre":"Les hypothèses de l'ANOVA et leur vérification (Levene, Shapiro-Wilk)","contenu":"L'ANOVA repose sur trois hypothèses concernant les résidus ε_ik ~ Normal(0, σ²) : l'homogénéité de la variance (le même écart-type σ pour tous les groupes, aussi appelée homoscédasticité), la normalité des résidus, et l'indépendance des observations. L'homogénéité se vérifie avec le test de Levene (une ANOVA sur les écarts absolus Z_ik = |Y_ik − Ȳ_k|) ou le test de Brown-Forsythe (écarts aux médianes), disponibles dans Jamovi via « Assumption Checks » - « Homogeneity tests » ; un résultat non significatif (p > .05) suggère que l'hypothèse tient, mais il faut aussi inspecter les écarts-types des groupes car le test dépend de la taille de l'échantillon. Si l'homogénéité est violée, on peut utiliser le test univarié de Welch dans « ANOVA One Way », qui ajuste les degrés de liberté. La normalité se vérifie par un graphique QQ et le test de Shapiro-Wilk ; en cas de mesures répétées, l'indépendance ne tient pas et il faut passer à l'ANOVA pour mesures appariées."},{"titre":"Le test non paramétrique de Kruskal-Wallis","contenu":"Si l'hypothèse de normalité est violée avec trois groupes ou plus indépendants, on peut utiliser le test de la somme des rangs de Kruskal-Wallis, l'analogue non paramétrique de l'ANOVA (comme Mann-Whitney/Wilcoxon pour deux groupes). L'idée est de classer toutes les valeurs Y_ik puis de mener l'analyse sur les rangs : on compare les sommes de carrés de rangs entre groupes (RSS_b) au total (RSS_tot) via la statistique K = (N − 1) × RSS_b / RSS_tot. Sous l'hypothèse nulle, K suit approximativement une distribution du Khi-deux à G − 1 degrés de liberté, et on rejette H₀ pour les grandes valeurs de K (test unilatéral) ; en présence d'ex aequo, un facteur de correction des liens (TCF) est appliqué, version que Jamovi calcule. Dans Jamovi, le test se lance via « ANOVA » - « One Way ANOVA (Non-parametric, Kruskal-Wallis) » ; pour les données cliniques, on obtient χ² = 12,076, df = 2, p = 0,00239."},{"titre":"L'ANOVA à un facteur pour mesures appariées et la sphéricité","contenu":"Quand les mêmes participants passent dans toutes les conditions (plan intra-sujets), on utilise l'ANOVA pour mesures appariées : la logique est la même, mais on retire de SS_w la variabilité due aux différences individuelles entre sujets (SS_subjects), ce qui donne un terme d'erreur plus petit (SS_error = SS_w − SS_subjects) et souvent un test plus puissant, au prix de degrés de liberté réduits à (n − 1)(k − 1). Dans Jamovi (« ANOVA » - « Repeated Measures ANOVA »), on définit un nom de facteur à mesures répétées avec ses niveaux, on place les variables dans « Repeated Measures Cells » et on coche « Sphericity checks ». Le test de Mauchly vérifie la sphéricité, c'est-à-dire l'égalité des variances des différences entre conditions : s'il est non significatif (p > .05), aucune correction n'est nécessaire ; s'il est significatif, on applique la correction de Greenhouse-Geisser (si ε GG < 0,75) ou de Huynh-Feldt (si ε GG > 0,75). Dans l'exemple des patients aphasiques de Broca (tâches de parole, conceptuelle et syntaxique), on obtient F(2,10) = 6,93, p = .013, avec des post hoc montrant une différence significative entre parole et syntaxe."},{"titre":"Le test de Friedman et la relation entre ANOVA et test t","contenu":"Le test de Friedman est la version non paramétrique de l'ANOVA pour mesures appariées : on l'utilise avec trois conditions ou plus sur les mêmes participants lorsque la variable dépendante est ordinale ou que la normalité n'est pas respectée. Dans Jamovi, on choisit « Analyses » - « ANOVA » - « Repeated Measures ANOVA (Non-parametric) », on transfère les variables appa
