<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#1c2733; --muted:#5b6b7c;
  --accent:#3e6da8; --accent-dark:#2d5183; --accent-soft:#e8eff8;
  --green:#2e8b57; --green-soft:#e6f4ec; --red:#c0392b; --red-soft:#fdecea;
  --amber:#b7791f; --amber-soft:#fdf3e0;
  --sidebar:#1d2b3a; --sidebar-ink:#c9d6e3; --border:#e2e8f0;
  --radius:12px; --shadow:0 1px 3px rgba(16,32,54,.08),0 4px 14px rgba(16,32,54,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15.5px;line-height:1.6}
button{font-family:inherit;cursor:pointer}
/* ---------- layout ---------- */
#app{display:flex;min-height:100vh}
#sidebar{width:292px;background:var(--sidebar);color:var(--sidebar-ink);position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:40;transition:transform .25s ease;display:flex;flex-direction:column}
#main{flex:1;margin-left:292px;padding:32px clamp(18px,4vw,56px) 80px;max-width:1150px}
#sidebar .brand{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
#sidebar .brand h1{font-size:1.02rem;color:#fff;line-height:1.35;font-weight:700}
#sidebar .brand p{font-size:.74rem;opacity:.65;margin-top:5px}
#sidebar nav{padding:12px 10px 30px;flex:1}
.nav-group{margin-top:14px}
.nav-group>.grp{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;opacity:.55;padding:4px 12px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;color:var(--sidebar-ink);padding:8px 12px;border-radius:8px;font-size:.86rem;line-height:1.3}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:var(--accent);color:#fff}
.nav-item .num{flex:0 0 22px;height:22px;border-radius:6px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700}
.nav-item.done .num{background:var(--green);color:#fff}
.nav-item .score{margin-left:auto;font-size:.68rem;opacity:.8}
.nav-item .ttl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#burger{display:none;position:fixed;top:14px;left:14px;z-index:50;background:var(--sidebar);color:#fff;border:none;border-radius:10px;width:42px;height:42px;font-size:1.2rem;box-shadow:var(--shadow)}
#overlay{display:none;position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:35}
@media(max-width:900px){
  #sidebar{transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #main{margin-left:0;padding-top:70px}
  #burger{display:block}
  body.menu-open #overlay{display:block}
}
/* ---------- generic ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 26px;margin-bottom:20px}
h2.page-title{font-size:1.55rem;margin-bottom:4px;line-height:1.3}
.page-sub{color:var(--muted);margin-bottom:24px;font-size:.92rem}
.chip{display:inline-block;background:var(--accent-soft);color:var(--accent-dark);border-radius:999px;padding:3px 12px;font-size:.8rem;font-weight:600;margin:3px 5px 3px 0}
.btn{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:10px 20px;font-size:.9rem;font-weight:600;transition:background .15s}
.btn:hover{background:var(--accent-dark)}
.btn.ghost{background:var(--accent-soft);color:var(--accent-dark)}
.btn.ghost:hover{background:#d9e6f5}
.btn.green{background:var(--green)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.progress-track{background:#e6ebf2;border-radius:999px;height:10px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),#5f8fc9);border-radius:999px;transition:width .4s ease}
.progress-fill.green{background:linear-gradient(90deg,#2e8b57,#4aab74)}
/* ---------- home ---------- */
.hero{background:linear-gradient(120deg,#2d5183,#3e6da8 60%,#4f81bd);color:#fff;border-radius:var(--radius);padding:30px 30px 26px;margin-bottom:22px;box-shadow:var(--shadow)}
.hero h2{font-size:1.5rem;margin-bottom:6px}
.hero p{opacity:.9;font-size:.93rem;max-width:640px}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
.stat .v{font-size:1.6rem;font-weight:800;color:var(--accent-dark)}
.stat .l{font-size:.78rem;color:var(--muted);margin-top:2px}
.chap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}
.chap-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;border:none;text-align:left;display:flex;flex-direction:column;gap:9px;transition:transform .12s,box-shadow .12s}
.chap-card:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(16,32,54,.12),0 8px 24px rgba(16,32,54,.1)}
.chap-card .top{display:flex;align-items:center;gap:10px}
.chap-card .badge{flex:0 0 34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent-dark);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.chap-card.done .badge{background:var(--green-soft);color:var(--green)}
.chap-card h3{font-size:.95rem;line-height:1.3;flex:1}
.chap-card .meta{font-size:.76rem;color:var(--muted)}
/* ---------- chapter ---------- */
.tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.tab{border:1px solid var(--border);background:var(--card);border-radius:999px;padding:8px 18px;font-size:.87rem;font-weight:600;color:var(--muted)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.section-block{margin-bottom:18px}
.section-block h3{font-size:1.05rem;color:var(--accent-dark);margin-bottom:6px}
.formula-card{background:#f8fafc;border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:8px;padding:13px 16px;margin-bottom:12px}
.formula-card .f{font-family:"Cambria Math",Georgia,serif;font-size:1.06rem;margin:4px 0 6px;color:#12385f}
.formula-card .n{font-weight:700;font-size:.86rem}
.formula-card .e{font-size:.85rem;color:var(--muted)}
.jamovi-box{background:var(--green-soft);border:1px solid #cde7d8;border-radius:10px;padding:16px 18px;margin-top:6px}
.jamovi-box h4{color:var(--green);font-size:.92rem;margin-bottom:6px}
.jamovi-box p{font-size:.9rem}
.chap-nav{display:flex;justify-content:space-between;gap:10px;margin-top:26px}
/* ---------- quiz ---------- */
.quiz-progress{display:flex;align-items:center;gap:12px;margin-bottom:18px;font-size:.85rem;color:var(--muted)}
.quiz-progress .progress-track{flex:1}
.q-text{font-size:1.08rem;font-weight:700;margin-bottom:16px;line-height:1.45}
.opt{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;background:#f8fafc;border:1.5px solid var(--border);border-radius:10px;padding:12px 15px;margin-bottom:10px;font-size:.93rem;line-height:1.45;transition:all .12s}
.opt:hover{border-color:var(--accent)}
.opt .letter{flex:0 0 26px;height:26px;border-radius:7px;background:#e6ebf2;font-weight:800;font-size:.8rem;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.opt.selected{border-color:var(--accent);background:var(--accent-soft)}
.opt.selected .letter{background:var(--accent);color:#fff}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.correct .letter{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .letter{background:var(--red);color:#fff}
.opt:disabled{cursor:default}
.explain{border-radius:10px;padding:14px 17px;margin:14px 0;font-size:.9rem}
.explain.good{background:var(--green-soft);border:1px solid #cde7d8}
.explain.bad{background:var(--red-soft);border:1px solid #f2cfca}
.explain b{display:block;margin-bottom:4px}
.quiz-result{text-align:center;padding:30px 10px}
.quiz-result .big{font-size:2.6rem;font-weight:800;color:var(--accent-dark)}
.quiz-result p{color:var(--muted);margin:8px 0 20px}
/* ---------- exercise ---------- */
.exo-correction{background:var(--amber-soft);border:1px solid #efd9ad;border-radius:10px;padding:16px 18px;margin-top:16px;font-size:.92rem;white-space:pre-wrap}
/* ---------- glossary ---------- */
#gsearch{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:12px 16px;font-size:.95rem;margin-bottom:20px;font-family:inherit}
#gsearch:focus{outline:none;border-color:var(--accent)}
.gletter{font-size:1.1rem;font-weight:800;color:var(--accent-dark);margin:18px 0 8px;border-bottom:2px solid var(--accent-soft);padding-bottom:4px}
.gterm{padding:10px 2px;border-bottom:1px solid var(--border)}
.gterm b{font-size:.95rem}
.gterm .src{font-size:.72rem;color:var(--muted);background:var(--accent-soft);border-radius:999px;padding:1px 9px;margin-left:8px;white-space:nowrap}
.gterm p{font-size:.88rem;color:#33414f;margin-top:3px}
.footer-note{margin-top:40px;font-size:.78rem;color:var(--muted);text-align:center}
.footer-note a{color:var(--accent)}
mark{background:#ffe9a8;border-radius:3px;padding:0 2px}
</style>
</head>

<script>
const DATA = {"chapitres":[{"numero":1,"titre":"Pourquoi apprenons-nous les statistiques ?","sections":[{"titre":"Sur la psychologie des statistiques : pourquoi faire des statistiques ?","contenu":"Les statistiques occupent une place importante dans l'enseignement de la psychologie, ce qui surprend souvent les étudiants. La meilleure réponse à la question « pourquoi faire des statistiques ? » est très simple : nous ne nous faisons pas assez confiance. Les humains sont sensibles aux préjugés, aux tentations et aux fragilités, et une grande partie des statistiques est essentiellement une sauvegarde contre ces biais. Se fier au « bon sens », c'est se fier à son instinct et à des arguments verbaux, une approche que la plupart des scientifiques jugent peu fiable, car nos intuitions ne sont pas faites pour résoudre des problèmes scientifiques."},{"titre":"La malédiction des biais de croyance","contenu":"Lorsqu'on demande aux gens de juger si un argument est logiquement valide (c'est-à-dire si la conclusion découle des prémisses), ils sont influencés par la crédibilité de la conclusion, même quand ils ne le devraient pas : c'est l'effet de biais de croyance. Dans l'étude classique d'Evans, Barston et Pollard (1983), quand croyances et logique concordent, les jugements sont bons (92 % de réponses correctes pour un argument valide à conclusion crédible). Mais quand elles s'opposent, seuls 44 % des gens reconnaissent un argument valide dont la conclusion n'est pas crédible, et 92 % acceptent à tort un argument invalide dont la conclusion est crédible. Globalement, les gens font à peine mieux que le hasard (environ 60 % de jugements exacts) : les statistiques sont l'outil qui nous aide à « rester honnêtes » et à garder nos préjugés sous contrôle."},{"titre":"La mise en garde contre le paradoxe de Simpson","contenu":"En 1973, l'Université de Californie à Berkeley s'inquiétait de ses admissions en troisième cycle : 44 % des 8442 candidats hommes étaient admis contre seulement 35 % des 4321 candidates femmes, une différence bien trop grande pour être une coïncidence. Pourtant, en examinant les données département par département, Bickel, Hammel et O'Connell (1975) ont montré que la plupart des départements avaient un taux d'admission légèrement plus élevé pour les femmes que pour les hommes. L'explication est que les femmes avaient tendance à candidater dans des départements « plus durs » (à faible taux d'admission), tandis que les hommes postulaient davantage dans des départements « faciles ». Ce renversement entre données agrégées et données désagrégées est le paradoxe de Simpson : il est réel, contre-intuitif, et illustre que la recherche est pleine de pièges subtils qui attendent les imprudents."},{"titre":"Les statistiques ne sont qu'un outil","contenu":"Le paradoxe de Simpson montre aussi que les statistiques ne résolvent qu'une partie du problème : savoir s'il faut regarder les données agrégées ou désagrégées dépend de la question de recherche, pas des mathématiques. Par exemple, se demander pourquoi les femmes postulaient dans des départements moins financés relève d'une réflexion sociologique et psychologique que les chiffres seuls ne tranchent pas. Il y a beaucoup de questions critiques auxquelles on ne peut pas répondre avec des statistiques, mais dont les réponses influencent énormément la façon d'analyser et d'interpréter les données. Il faut donc considérer les statistiques comme un outil puissant pour mieux connaître ses données, ni plus ni moins : rien ne remplace une réflexion approfondie."},{"titre":"Statistiques en psychologie","contenu":"La psychologie comporte autant de statistiques parce que c'est une science statistique : les « choses » étudiées sont des personnes réelles, compliquées et désordonnées, contrairement aux électrons de la physique qui n'ont ni opinions ni humeurs. Un dicton de physique dit « si votre expérience a besoin de statistiques, vous auriez dû faire une meilleure expérience », mais les physiciens ont le luxe d'objets d'étude bien plus simples. Trois raisons justifient qu'un chercheur en psychologie maîtrise les statistiques de base : elles sont étroitement liées à la conception de la recherche, elles sont indispensables pour comprendre la littérature scientifique, et déléguer l'analyse coûte cher car les statisticiens sont rares. Ces raisons valent aussi pour les praticiens qui veulent rester à la pointe de leur domaine."},{"titre":"Statistiques dans la vie quotidienne","contenu":"Au XXIe siècle, les données sont partout, et une connaissance de base des statistiques est un véritable outil de survie. L'auteur illustre cela avec les 20 articles les plus récents d'un site d'actualités : 8 portaient sur un sujet statistique et 6 comportaient une erreur, la plus courante étant l'absence de données de base (par exemple annoncer que 5 % des personnes dans la situation X ont la caractéristique Y sans dire si cette caractéristique est commune à tous). Connaître les statistiques permet de repérer quand quelqu'un se trompe ou même vous ment, et de porter un regard critique sur les médias."},{"titre":"Les méthodes de recherche ne se limitent pas aux statistiques","contenu":"La méthodologie de recherche est un concept plus large que les statistiques, même si environ 99 % des craintes des étudiants portent sur la partie statistique. Les cours d'introduction sont riches en statistiques parce qu'on a presque toujours besoin de celles-ci avant les autres méthodes : il est plus courant de devoir analyser des données recueillies par un tiers que de concevoir sa propre étude. Connaître les statistiques est donc « urgent », mais la conception de la recherche est tout aussi « importante » : elle est cependant plus idiosyncrasique et propre à chaque domaine de recherche."}],"concepts":["Les statistiques comme sauvegarde contre nos biais","Effet de biais de croyance","Validité logique d'un argument (prémisses et conclusion)","Paradoxe de Simpson","Données agrégées vs données désagrégées","La psychologie comme science statistique","Les statistiques comme outil, pas comme substitut à la réflexion","Culture statistique dans la vie quotidienne","Distinction entre statistiques et conception de la recherche"],"formules":[],"jamovi":"Ce chapitre est conceptuel, mais on peut déjà l'illustrer dans Jamovi : créez un jeu de données avec trois colonnes (Departement, Sexe, Admis) reproduisant les admissions de Berkeley, puis utilisez Analyses > Exploration > Descriptives en plaçant Admis en variable et Sexe en variable de regroupement pour obtenir le taux global, et ajoutez ensuite Departement comme second facteur (ou utilisez Frequencies > Contingency Tables) pour voir le taux par département. Vous constaterez vous-même le renversement du paradoxe de Simpson entre les données agrégées et désagrégées.","glossaire":[{"terme":"Biais de croyance","definition":"Tendance à juger la validité logique d'un argument en fonction de la crédibilité de sa conclusion plutôt que de sa structure logique. Ce biais persiste même quand on sait qu'on ne devrait pas en tenir compte."},{"terme":"Argument valide","definition":"Argument dont la conclusion est une conséquence logique des prémisses : si les prémisses sont vraies, la conclusion l'est aussi. Un argument valide n'a pas besoin de contenir des affirmations vraies."},{"terme":"Prémisse","definition":"Proposition de départ d'un raisonnement à partir de laquelle on tire une conclusion. La validité d'un argument dépend du lien logique entre prémisses et conclusion, pas de la vérité des prémisses."},{"terme":"Paradoxe de Simpson","definition":"Phénomène dans lequel une tendance observée dans des données agrégées s'inverse ou disparaît lorsqu'on examine les données désagrégées par sous-groupes. L'exemple classique est celui des admissions de Berkeley en 1973."},{"terme":"Données agrégées","definition":"Données regroupées à un niveau global (par exemple le taux d'admission de toute une université). Elles peuvent raconter une histoire différente de celle des données examinées par sous-groupes."},{"terme":"Données désagrégées","definition":"Données examinées au niveau des sous-groupes (par exemple les taux d'admission département par département). Leur analyse peut révéler des tendances masquées ou inversées dans le total."},{"terme":"Bon sens","definition":"Approche consistant à évaluer les preuves en se fiant à son instinct et à des arguments verbaux. Les scientifiques s'en méfient car nos intuitions sont faites pour les inférences quotidiennes, pas pour les problèmes scientifiques."},{"terme":"Induction","definition":"Raisonnement qui va au-delà de l'évidence immédiate des sens pour faire des généralisations sur le monde. Elle exige des suppositions sages et est vulnérable à nos biais préexistants."}],"quiz":[{"question":"Selon le manuel, quelle est la meilleure réponse à la question « pourquoi les scientifiques font-ils des statistiques ? »","options":["Parce que les revues scientifiques l'exigent","Parce que les mathématiques sont plus prestigieuses que le bon sens","Parce que nous ne nous faisons pas assez confiance : les statistiques sont une sauvegarde contre nos biais","Parce que les ordinateurs rendent les calculs faciles"],"bonne":2,"explication":"L'auteur explique que les humains sont sensibles aux préjugés et aux fragilités, et qu'une grande partie des statistiques est essentiellement une sauvegarde : elles nous aident à « rester honnêtes » face à la tentation de croire ce que nous voulons croire."},{"question":"Dans l'étude d'Evans, Barston et Pollard (1983), quel pourcentage de personnes a jugé « valide » un argument invalide dont la conclusion était crédible ?","options":["92 %","44 %","8 %","60 %"],"bonne":0,"explication":"C'est le résultat le plus frappant de l'étude : quand un argument faible correspond aux préjugés préexistants, presque personne ne voit qu'il est faible, et 92 % des gens le déclarent à tort valide."},{"question":"Un argument est déductivement valide si...","options":["ses prémisses sont vraies dans le monde réel","sa conclusion est crédible et conforme aux connaissances actuelles","il est accepté par la majorité des gens","sa conclusion est une conséquence logique de ses prémisses, que celles-ci soient vraies ou non"],"bonne":3,"explication":"La validité est une propriété de la structure logique : si les prémisses sont vraies, la conclusion doit l'être. Un argument valide n'a pas besoin d'impliquer de vraies déclarations, c'est justement ce que le biais de croyance nous fait oublier."},{"question":"Dans les données de Berkeley en 1973, comment le taux global d'admission pouvait-il être plus faible pour les femmes alors que la plupart des départements les admettaient à un taux légèrement plus élevé ?","options":["Les données globales avaient été falsifiées par l'université","Les femmes candidataient davantage dans des départements « durs » à faible taux d'admission, les hommes dans des départements « faciles »","L'échantillon de femmes était trop petit pour être fiable","Les départements admettaient les femmes seulement en fin d'année"],"bonne":1,"explication":"C'est l'explication du paradoxe de Simpson : les taux par département étaient légèrement favorables aux femmes, mais la répartition des candidatures différait, les femmes postulant surtout dans les départements les plus sélectifs, ce qui abaissait leur taux global."},{"question":"Quelle leçon générale l'auteur tire-t-il du paradoxe de Simpson ?","options":["Il faut toujours analyser les données désagrégées et ignorer les totaux","Les statistiques permettent de trancher toutes les questions de recherche","La recherche est pleine de pièges subtils et les statistiques ne résolvent qu'une partie du problème","Les universités ne devraient pas publier leurs statistiques d'admission"],"bonne":2,"explication":"Le paradoxe illustre les pièges contre-intuitifs qui attendent les imprudents, mais aussi que le choix entre données agrégées et désagrégées dépend de la question de recherche : les statistiques sont un outil, elles ne remplacent pas la réflexion."},{"question":"Pourquoi l'auteur affirme-t-il que la psychologie est une « science statistique » ?","options":["Parce que les objets étudiés sont des personnes réelles, compliquées et variables, contrairement aux objets simples de la physique","Parce que les psychologues ont inventé la plupart des tests statistiques","Parce que la psychologie utilise plus d'ordinateurs que les autres sciences","Parce que les expériences en psychologie sont mal conçues"],"bonne":0,"explication":"Les « choses » de la psychologie sont des gens qui ont des opinions, diffèrent de façon arbitraire et peuvent s'ennuyer ou saboter les données, contrairement aux électrons. Ce désordre rend les statistiques indispensables : la psychologie a choisi un problème plus difficile à résoudre."},{"question":"Parmi les raisons suivantes, laquelle N'EST PAS citée par le manuel pour justifier qu'un chercheur en psychologie sache faire des statistiques de base ?","options":["Les statistiques sont étroitement liées à la conception de la recherche","Comprendre la littérature psychologique exige de comprendre les analyses statistiques","L'analyse statistique coûte cher à déléguer car les statisticiens sont rares","Les statistiques garantissent que les résultats publiés sont toujours vrais"],"bonne":3,"explication":"Les trois premières raisons sont exactement celles données par l'auteur. En revanche, le manuel n'affirme jamais que les statistiques garantissent la vérité des résultats ; au contraire, il insiste sur le fait qu'elles ne sont qu'un outil."},{"question":"Dans l'analyse informelle des 20 articles d'actualité faite par l'auteur, quelle était l'erreur statistique la plus courante ?","options":["Confondre corrélation et causalité","Ne pas rapporter les données de base permettant de comparer (par exemple, ne pas dire si une caractéristique est commune à tous)","Utiliser des graphiques trompeurs avec des axes tronqués","Inventer complètement les chiffres cités"],"bonne":1,"explication":"Sur 8 articles à sujet statistique, 6 comportaient une erreur, et la plus courante était l'absence des données de base : annoncer que 5 % des personnes dans la situation X ont la caractéristique Y sans préciser la fréquence de Y dans la population générale."}],"exercice":{"titre":"Reproduire le paradoxe de Simpson avec les données de Berkeley","enonce":"À partir du tableau du manuel pour les six plus grands départements de Berkeley (A : 825 hommes / 62 % admis, 108 femmes / 82 % ; B : 560 / 63 %, 25 / 68 % ; C : 325 / 37 %, 593 / 34 % ; D : 417 / 33 %, 375 / 35 % ; E : 191 / 28 %, 393 / 24 % ; F : 272 / 6 %, 341 / 7 %), construisez une feuille de données dans Jamovi avec les colonnes Departement, Sexe, NbCandidats et NbAdmis (une ligne par combinaison département × sexe, en calculant NbAdmis = NbCandidats × taux). Puis : (1) calculez le taux d'admission global par sexe pour ces six départements ; (2) comparez-le aux taux par département ; (3) expliquez le renversement observé.","correction":"Étape 1 : dans Jamovi, ouvrez l'onglet Données et saisissez 12 lignes (6 départements × 2 sexes) avec NbAdmis arrondi : A hommes 512, A femmes 89 ; B hommes 353, B femmes 17 ; C hommes 120, C femmes 202 ; D hommes 138, D femmes 131 ; E hommes 53, E femmes 94 ; F hommes 16, F femmes 24. Étape 2 : créez une variable calculée Taux = NbAdmis / NbCandidats (bouton Données > Calculer). Étape 3 : pour le taux global, additionnez par sexe : hommes = (512+353+120+138+53+16) / (825+560+325+417+191+272) = 1192/2590 ≈ 46 % ; femmes = (89+17+202+131+94+24) / (108+25+593+375+393+341) = 557/1835 ≈ 30 %. Le taux global est nettement plus favorable aux hommes. Étape 4 : en examinant les taux département par département (Exploration > Descriptives avec Departement et Sexe en variables de regroupement), on voit que dans 4 départements sur 6 (A, B, D, F) les femmes ont un taux égal ou supérieur à celui des hommes. Étape 5 : l'explication est que les hommes ont surtout candidaté dans les départements généreux A et B (1385 candidats masculins contre 133 féminins), alors que les femmes ont surtout candidaté dans les départements sélectifs C, E et F. C'est exactement le paradoxe de Simpson : l'agrégation mélange des sous-groupes de tailles très différentes, et la conclusion tirée du total s'inverse au niveau des sous-groupes."}},{"numero":2,"titre":"Brève introduction à la conception de la recherche","sections":[{"titre":"La mesure psychologique et l'opérationnalisation","contenu":"La collecte de données est une forme de mesure : attribuer des nombres, des étiquettes ou des descriptions bien définies aux « choses » que l'on étudie. Même un concept apparemment simple comme l'âge exige des choix : temps depuis la naissance ou depuis la conception, mesuré en années, en mois ou en jours, par auto-déclaration, par un parent ou via des documents officiels. L'opérationnalisation est le processus par lequel on transforme un concept significatif mais vague en une mesure précise : être précis sur ce qu'on mesure, choisir la méthode et définir l'ensemble des valeurs admissibles. Le manuel distingue quatre notions liées : l'élaboration théorique (le construit qu'on veut mesurer, non observable directement), la mesure (la méthode ou l'outil d'observation), l'opérationnalisation (la connexion logique entre les deux) et la variable (les données réellement obtenues)."},{"titre":"Les échelles de mesure : nominale, ordinale, intervalle, rapport","contenu":"Toutes les variables ne sont pas du même type, et les échelles de mesure permettent de les distinguer. Une variable nominale (ou catégorielle) n'a aucune relation d'ordre entre ses valeurs : la couleur des yeux ou le type de transport ne peuvent être que « différents », et parler d'une moyenne n'a aucun sens. Une variable ordinale possède un ordre naturel (comme le classement dans une course ou le degré d'accord avec la science du climat), ce qui autorise des regroupements sensés, mais pas le calcul de moyennes car les écarts entre rangs ne sont pas connus. Une variable d'intervalle a des différences numériques interprétables mais pas de zéro naturel (comme la température en Celsius ou l'année d'entrée à l'université) : addition et soustraction sont significatives, mais pas multiplication ni division. Enfin, une variable de rapport possède un vrai zéro (comme le temps de réponse) : on peut dire que Ben a mis 1,35 fois plus de temps qu'Alan."},{"titre":"Variables continues ou discrètes, et le cas de l'échelle de Likert","contenu":"Une variable continue est une variable pour laquelle, entre deux valeurs quelconques, il est toujours logiquement possible d'en trouver une autre (comme le temps de réponse), alors qu'une variable discrète ne le permet pas (il n'y a rien entre la 1ère et la 2e place). Les variables nominales et ordinales sont toujours discrètes, tandis que les variables d'intervalle et de rapport peuvent être continues ou discrètes. Attention : dire « variable discrète » quand on veut dire « variable nominale » est une confusion fréquente. L'échelle de Likert, outil de base de toute enquête, illustre les limites de cette classification : discrète, ordonnée, sans zéro naturel, elle est formellement ordinale, mais comme les participants tendent à traiter les écarts entre options comme semblables, beaucoup de chercheurs la traitent en pratique comme une échelle quasi-intervalle."},{"titre":"Évaluer la fiabilité d'une mesure","contenu":"La fiabilité désigne la répétabilité ou la cohérence d'une mesure : un pèse-personne est fiable car il donne toujours la même réponse, alors que « demander à ma mère » pour mesurer mon intelligence ne l'est pas. La fiabilité est distincte de la validité : une balance mal calibrée est fiable mais non valable, et une mesure fluctuante peut être peu fiable mais fondamentalement juste ; la fiabilité est ainsi nécessaire mais non suffisante pour la validité. On distingue quatre formes : la fiabilité test-retest (uniformité dans le temps), la fiabilité entre évaluateurs (uniformité entre personnes), la fiabilité des formes parallèles (cohérence entre mesures théoriquement équivalentes) et la fiabilité de cohérence interne (cohérence entre les items d'un même questionnaire). Toutes les mesures n'ont pas besoin de toutes les formes de fiabilité : on ne doit exiger la fiabilité que là où l'on veut mesurer la même chose."},{"titre":"Le rôle des variables : prédicteurs et résultats","contenu":"Dans une analyse, on essaie d'expliquer certaines variables (Y, la variable « à expliquer ») en fonction d'autres (X, les variables « explicatives »). Les noms classiques sont variable indépendante (VI) pour X et variable dépendante (VD) pour Y, mais l'auteur les juge trompeurs : la VI n'est jamais indépendante de tout, et s'il n'y a pas de relation, la VD ne dépend pas de la VI. Le manuel préfère les termes modernes de prédicteurs (X) et de résultats (Y) : on utilise les prédicteurs pour faire des suppositions sur les résultats."},{"titre":"Recherche expérimentale et non expérimentale","contenu":"La distinction porte sur le degré de contrôle du chercheur. Dans la recherche expérimentale, le chercheur manipule les prédicteurs et laisse le résultat varier naturellement, en maintenant tout le reste constant ; comme c'est impossible en pratique, la solution standard est l'aléatorisation, qui assigne les personnes au hasard aux groupes pour minimiser (sans éliminer) les différences systématiques. Comparer simplement fumeurs et non-fumeurs n'est pas une expérience correcte, car les groupes peuvent différer sur bien d'autres choses que le tabagisme (alimentation, profession...), appelées facteurs de confusion. La recherche non expérimentale couvre les études où le chercheur n'a pas ce contrôle : la recherche quasi-expérimentale ressemble à une expérience mais sans contrôle des prédicteurs, et les études de cas décrivent en détail un ou quelques cas, précieuses par exemple en neuropsychologie, mais difficiles à généraliser."},{"titre":"Les cinq types de validité","contenu":"La validité pose la question : peut-on faire confiance aux résultats de l'étude ? La validité interne concerne la capacité à tirer des conclusions causales correctes : l'exemple des étudiants de 1ère et 3e année en rédaction échoue car âge, expérience et éducation sont confondus. La validité externe concerne la généralisabilité des conclusions à la vie réelle ; elle est menacée quand la population échantillonnée (souvent des étudiants en psychologie) diffère de la population générale à des égards pertinents pour le phénomène étudié. La validité de construction demande si l'on mesure bien le construit visé : demander aux tricheurs de se lever mesure en fait la disposition à avouer, pas le taux de triche. La validité apparente (la mesure « semble »-t-elle faire ce qu'elle doit ?) importe surtout pour convaincre des non-spécialistes, et la validité écologique (l'étude ressemble-t-elle au scénario du monde réel ?) est un indice, mais pas une garantie, de validité externe."},{"titre":"Confusion, artefacts et menaces à la validité","contenu":"Un facteur de confusion est une variable supplémentaire, souvent non mesurée, liée à la fois au prédicteur et au résultat : il menace la validité interne, surtout dans les études non expérimentales. Un résultat est un artefact s'il ne tient que dans la situation spéciale testée : il menace la validité externe, surtout dans les études de laboratoire. Le manuel passe en revue les menaces classiques : effets de l'histoire (événements extérieurs pendant l'étude, comme les inondations du Queensland), effets de maturation (les gens changent d'eux-mêmes avec le temps), effets des tests répétés (la première mesure influence la seconde), biais de sélection (groupes déséquilibrés au départ), attrition différentielle (les abandons non aléatoires créent un biais), biais de non-réponse et données manquantes, régression vers la moyenne (des valeurs extrêmes sélectionnées deviennent moins extrêmes à la mesure suivante, purement par hasard), biais de l'expérimentateur (illustré par Clever Hans, contré par le double aveugle), effets de demande et de réactivité (effet Hawthorne), et effet placebo. Enfin, fraude, tromperie et auto-illusion (fabrication de données, données déformées, data mining non reconnu, biais de publication et autocensure) rappellent que la science est menée par de vrais humains."}],"concepts":["Opérationnalisation d'un construit théorique","Élaboration théorique, mesure, variable","Échelles de mesure : nominale, ordinale, intervalle, rapport","Variables continues vs discrètes","Échelle de Likert et échelle quasi-intervalle","Fiabilité (test-retest, entre évaluateurs, formes parallèles, cohérence interne)","Prédicteurs et résultats (VI et VD)","Aléatorisation et recherche expérimentale","Cinq types de validité (interne, externe, de construction, apparente, écologique)","Facteurs de confusion, artefacts et régression vers la moyenne"],"formules":[],"jamovi":"Dans Jamovi, chaque colonne de données doit être associée au bon type de mesure, qui reprend directement les échelles de ce chapitre. Double-cliquez sur l'en-tête d'une colonne (ou utilisez l'onglet Données > Configuration) pour ouvrir ses propriétés, puis choisissez le type de mesure : « Nominal » pour les variables catégorielles (sexe, type de transport), « Ordinal » pour les variables ordonnées (classement, échelle de Likert traitée en ordinal), « Continu » pour les variables d'intervalle ou de rapport (temps de réponse, température), et « ID » pour les identifiants. Précisez aussi le type de données (entier, décimal, texte). Ce choix est important car il détermine quelles analyses Jamovi propose et comment les variables sont traitées dans les résultats.","glossaire":[{"terme":"Opérationnalisation","definition":"Processus par lequel on transforme un concept significatif mais vague (comme « l'âge » ou « l'anxiété ») en une mesure précise : définir ce qu'on mesure, la méthode utilisée et l'ensemble des valeurs admissibles."},{"terme":"Échelle nominale","definition":"Échelle de mesure sans relation d'ordre entre les valeurs possibles (couleur des yeux, type de transport) : on peut seulement dire que les catégories sont différentes, et une moyenne n'a aucun sens."},{"terme":"Échelle ordinale","definition":"Échelle dont les valeurs possèdent un ordre naturel et significatif (classement dans une course), mais dont les écarts entre valeurs ne sont pas quantifiables : on peut ordonner, mais pas faire de moyenne."},{"terme":"Échelle d'intervalle","definition":"Échelle où les différences entre les nombres sont interprétables mais où le zéro est arbitraire (température en Celsius) : addition et soustraction sont significatives, multiplication et division ne le sont pas."},{"terme":"Échelle de rapport","definition":"Échelle où zéro signifie vraiment zéro (temps de réponse), ce qui rend toutes les opérations significatives, y compris les rapports : on peut dire qu'une valeur est 1,35 fois plus grande qu'une autre."},{"terme":"Fiabilité","definition":"Répétabilité ou cohérence d'une mesure : si l'on mesure deux fois la même chose, obtient-on la même réponse ? Elle est nécessaire mais non suffisante pour la validité."},{"terme":"Validité interne","definition":"Mesure dans laquelle une étude permet de tirer les conclusions correctes sur les relations causales entre les variables « à l'intérieur » de l'étude. Elle est menacée notamment par les facteurs de confusion."},{"terme":"Validité externe","definition":"Généralisabilité ou applicabilité des conclusions au-delà de l'étude : dans quelle mesure retrouverait-on le même schéma de résultats dans la « vie réelle » et avec d'autres populations."},{"terme":"Facteur de confusion","definition":"Variable supplémentaire, souvent non mesurée, liée à la fois aux prédicteurs et au résultat : on ne peut alors plus dire si c'est le prédicteur ou le facteur de confusion qui cause le résultat."},{"terme":"Régression vers la moyenne","definition":"Phénomène par lequel des observations sélectionnées pour leur valeur extrême tendent, purement par hasard, à être moins extrêmes lors d'une mesure ultérieure, la variable ayant une variation naturelle."}],"quiz":[{"question":"Dans la terminologie du manuel, qu'est-ce qu'une « variable » ?","options":["Le construit théorique, vague et non observable, que l'on cherche à étudier","Ce que l'on obtient quand on applique une mesure à quelque chose dans le monde : les données réelles de nos ensembles de données","La connexion logique entre une mesure et un construit théorique","L'outil ou la question d'enquête utilisés pour faire les observations"],"bonne":1,"explication":"Le manuel distingue quatre notions : l'élaboration théorique (le construit), la mesure (la méthode ou l'outil), l'opérationnalisation (la connexion logique entre les deux) et la variable, qui correspond aux données réellement obtenues."},{"question":"Pourquoi est-il absurde de dire que 20 °C est « deux fois plus chaud » que 10 °C ?","options":["Parce que la température est une variable discrète","Parce que la température en Celsius est une variable ordinale","Parce que les thermomètres ne sont pas assez fiables","Parce que le zéro de l'échelle Celsius est arbitraire : c'est une échelle d'intervalle, la multiplication n'y a pas de sens"],"bonne":3,"explication":"Le 0 °C correspond au point de congélation de l'eau, un choix arbitraire et non une absence de température. Sur une échelle d'intervalle, seules l'addition et la soustraction sont significatives ; multiplier et diviser exige un vrai zéro, propre aux échelles de rapport."},{"question":"Le classement dans une course (1er, 2e, 3e...) est une variable...","options":["ordinale et discrète","ordinale et continue","d'intervalle et discrète","nominale et discrète"],"bonne":0,"explication":"On peut ordonner les coureurs (1er > 2e > 3e), mais on ne sait pas de combien le premier devance le second : l'échelle est donc ordinale. Et rien ne peut logiquement se situer entre la 1ère et la 2e place, ce qui rend la variable discrète ; les variables ordinales sont d'ailleurs toujours discrètes."},{"question":"Je pèse un sac de pommes de terre sur une balance mal calibrée : elle affiche toujours exactement le même poids, mais ce poids est faux. Cette mesure est...","options":["ni fiable ni valable","peu fiable mais valable","fiable mais non valable","fiable et valable"],"bonne":2,"explication":"La fiabilité est la répétabilité : la balance donne toujours la même réponse, elle est donc très fiable. Mais cette réponse ne correspond pas au poids réel : la mesure n'est pas valide. C'est l'exemple du manuel montrant que la fiabilité est nécessaire mais pas suffisante pour la validité."},{"question":"Si deux psychologues évaluent indépendamment l'anxiété des mêmes participants et qu'on vérifie s'ils obtiennent des scores semblables, quelle forme de fiabilité examine-t-on ?","options":["La fiabilité test-retest","La fiabilité de cohérence interne","La fiabilité des formes parallèles","La fiabilité entre évaluateurs"],"bonne":3,"explication":"La fiabilité entre évaluateurs concerne l'uniformité entre les personnes qui effectuent la mesure : si quelqu'un d'autre répète la mesure, produit-il la même réponse ? Le test-retest concerne le temps, les formes parallèles les instruments équivalents, et la cohérence interne les items d'un même questionnaire."},{"question":"Quelle est la principale caractéristique qui fait d'une étude une véritable expérience, selon le manuel ?","options":["L'utilisation d'un laboratoire et d'instruments de mesure précis","Le contrôle par le chercheur, qui manipule les prédicteurs et utilise l'aléatorisation pour minimiser les différences systématiques entre groupes","Un grand nombre de participants recrutés dans la population générale","L'analyse des résultats avec des tests statistiques appropriés"],"bonne":1,"explication":"Ce qui définit la recherche expérimentale, c'est le degré de contrôle : le chercheur manipule les prédicteurs (VI) et laisse le résultat (VD) varier naturellement, l'aléatorisation servant à minimiser (sans éliminer) la possibilité de différences systématiques entre les groupes. Comparer fumeurs et non-fumeurs existants n'est qu'un plan quasi-expérimental."},{"question":"Vous sélectionnez les 20 élèves ayant eu les meilleures notes au secondaire et constatez qu'ils réussissent bien à l'université, mais sans être en tête de classe. Quelle est l'explication la plus probable selon le manuel ?","options":["La régression vers la moyenne : sélectionnés pour des valeurs extrêmes (talent, travail et chance), ils redeviennent moins extrêmes car la chance ne se transfère pas","Un effet de maturation : les élèves deviennent moins intelligents en vieillissant","Un biais de l'expérimentateur qui influence les notes universitaires","Un effet placebo lié à leur réputation de bons élèves"],"bonne":0,"explication":"Obtenir la meilleure note exige intelligence, travail et un peu de chance. Intelligence et travail se transfèrent à l'université, mais pas la chance : on doit donc s'attendre à ce que des personnes sélectionnées pour des valeurs extrêmes soient un peu moins extrêmes à la mesure suivante, purement par hasard."},{"question":"L'histoire de Clever Hans, le cheval qui semblait savoir compter, illustre quelle menace à la validité, et quelle en est la solution générale ?","options":["L'effet placebo, corrigé par un groupe témoin non traité","Le biais de non-réponse, corrigé par des relances des participants","Le biais de l'expérimentateur, corrigé par les études en double aveugle","L'attrition différentielle, corrigée par un échantillon plus grand"],"bonne":2,"explication":"Hans ne savait pas faire de maths : il réagissait aux signaux involontaires des humains qui connaissaient la réponse. C'est le biais de l'expérimentateur, qui communique subtilement la « bonne réponse ». La solution générale est le double aveugle, où ni l'expérimentateur ni le participant ne connaissent la condition, même si le manuel souligne qu'il est difficile à réaliser parfaitement."}],"exercice":{"titre":"Classer des variables et configurer leurs échelles de mesure dans Jamovi","enonce":"Une chercheuse étudie le stress des étudiants et recueille pour chaque participant : (a) le numéro d'identification du participant ; (b) le sexe déclaré (femme / homme / autre) ; (c) le moyen de transport pour venir au campus (train, bus, voiture, vélo) ; (d) le rang de l'étudiant au dernier examen (1er, 2e, 3e...) ; (e) une réponse de type Likert à 5 points (« Je me sens stressé avant les examens » : de 1 = fortement en désaccord à 5 = tout à fait d'accord) ; (f) l'année d'entrée à l'université (2021, 2022...) ; (g) le temps de réponse en secondes à une tâche d'attention. Pour chaque variable : identifiez l'échelle de mesure (nominale, ordinale, intervalle, rapport), dites si elle est continue ou discrète, puis créez un petit jeu de données dans Jamovi (5 à 10 lignes fictives) et attribuez à chaque colonne le type de mesure approprié.","correction":"Étape 1 – Classification : (a) l'ID n'est qu'une étiquette, sans ordre ni quantité : type ID dans Jamovi ; (b) le sexe est nominal et discret : aucune catégorie n'est « plus grande » qu'une autre ; (c) le moyen de transport est nominal et discret, comme l'exemple du manuel ; (d) le rang à l'examen est ordinal et discret : on peut ordonner (1er > 2e), mais l'écart entre 1er et 2e n'est pas connu et rien n'existe entre deux rangs ; (e) l'item de Likert est formellement ordinal et discret (options ordonnées, pas de zéro naturel, pas de réponse 2,5), mais il est souvent traité en pratique comme quasi-intervalle ; (f) l'année d'entrée est une variable d'intervalle discrète : la différence 2008 − 2003 = 5 ans a du sens, mais diviser 2008 par 2003 n'en a aucun, et il n'y a pas d'année entre 2002 et 2003 ; (g) le temps de réponse est une variable de rapport continue : zéro seconde signifie vraiment « aucun temps », les rapports ont du sens (3,1/2,3 = 1,35 fois plus de temps) et une valeur intermédiaire est toujours possible. Étape 2 – Dans Jamovi : ouvrez l'onglet Données, saisissez quelques lignes fictives, puis double-cliquez sur chaque en-tête de colonne pour définir : ID → type de mesure « ID » ; Sexe et Transport → « Nominal » (type de données texte) ; Rang et Likert → « Ordinal » (type entier) ; AnneeEntree → « Continu » (entier ; Jamovi ne distingue pas intervalle et rapport, les deux sont « Continu ») ; TempsReponse → « Continu » (décimal). Étape 3 – Vérification : lancez Analyses > Exploration > Descriptives sur toutes les variables ; observez que Jamovi propose la moyenne pour les variables continues, mais qu'une « moyenne » du transport n'aurait aucun sens, ce qui confirme l'importance de bien déclarer les échelles avant toute analyse."}},{"numero":3,"titre":"Démarrer avec Jamovi","sections":[{"titre":"Pourquoi utiliser Jamovi et comment l'installer","contenu":"Faire ses statistiques sur ordinateur est plus rapide, plus facile et plus puissant qu'à la main, et les tableurs classiques comme Excel sont très limités pour l'analyse de données. Jamovi est un logiciel libre et gratuit, ce qui évite le piège des licences commerciales coûteuses, et il repose fondamentalement sur le langage statistique R, devenu un standard en analyse de données. Jamovi se télécharge gratuitement depuis le site https://www.jamovi.org, où des liens séparés existent pour Windows, Mac et Linux, avec des mises à jour publiées régulièrement."},{"titre":"L'interface de Jamovi","contenu":"Au premier démarrage, Jamovi affiche à gauche la vue de la feuille de calcul et à droite le panneau des résultats des analyses ; une barre centrale déplaçable permet de redimensionner ces deux zones. Les analyses se choisissent dans le ruban « Analyses » : sélectionner une analyse ouvre un panneau d'options où l'on assigne les variables, et les résultats se mettent à jour en temps réel à droite. On peut fermer les options avec la flèche en haut à droite, revenir à une analyse en cliquant sur ses résultats, et supprimer une analyse via le menu contextuel (clic droit, « Analyses » puis « Remove »)."},{"titre":"La feuille de calcul et les types de variables","contenu":"Dans Jamovi, chaque colonne représente une variable et chaque ligne un cas ou un participant. Les variables de données peuvent avoir trois niveaux de mesure : nominal (étiquettes catégorielles comme Homme/Femme), ordinal (valeurs ordonnées comme une échelle de Likert) et continu (échelle d'intervalle ou de rapport, comme la taille ou le poids), auxquels s'ajoute le type ID propre à Jamovi pour les identifiants qu'on n'analyse pas. On peut aussi spécifier un type de données : texte, entier (Integer) ou décimal. Jamovi devine automatiquement le type à la saisie ou à l'importation, mais l'éditeur de variables (ouvert par « Setup » ou double-clic sur l'en-tête de colonne) permet de corriger le nom, le type, l'ordre des niveaux et les étiquettes."},{"titre":"Les variables calculées et les fonctions V","contenu":"Les variables calculées prennent leur valeur en effectuant un calcul sur d'autres variables : transformations logarithmiques, scores z, scores sommatifs, moyennes, etc. On les ajoute avec le bouton « Add » de l'onglet Données, puis on saisit une formule comme A + B, LOG10(len) ou (dose - VMEAN(dose)) / VSTDEV(dose) qui crée le score z de la variable dose. Dans le menu déroulant fx, plusieurs fonctions existent par paires : les fonctions préfixées d'un V (comme VMEAN) calculent sur l'ensemble d'une variable, tandis que les fonctions sans V (comme MEAN) calculent ligne par ligne."},{"titre":"Importer des données (csv, SPSS, Excel et autres)","contenu":"Les deux formats essentiels sont le fichier Jamovi (.omv), qui stocke données, variables et analyses, et le fichier csv (valeurs séparées par des virgules), simple fichier texte très répandu. Pour ouvrir un fichier, on passe par le menu à trois barres horizontales en haut à gauche, puis « Open ». Lors d'une importation, il faut vérifier la ligne d'entête, le caractère séparateur (virgule, point-virgule ou tabulation), le caractère décimal, les guillemets et les valeurs manquantes (par défaut NA dans Jamovi). Jamovi importe aussi directement des fichiers SPSS (.sav), SAS, Stata et JASP ; les fichiers Excel doivent en revanche d'abord être exportés en csv depuis un tableur."},{"titre":"Changer le niveau de mesure et installer des modules","contenu":"Il arrive que des données importées arrivent dans le mauvais format : des nombres lus comme valeurs nominales, des dates importées en texte, ou des ID lus en continu. On peut alors « contraindre » la variable d'un niveau à un autre en cochant simplement le niveau souhaité (continu, ordinal ou nominal) dans l'éditeur de variables. Par ailleurs, Jamovi permet d'installer des modules complémentaires développés par la communauté via le grand « + » en haut à droite puis « Jamovi library » ; les modules installés (comme « scatr » ou « Rj ») apparaissent ensuite dans la barre « Analyses »."},{"titre":"Mode syntaxe R, copier-coller et sauvegarde","contenu":"Jamovi produit des tableaux formatés selon les normes APA et des graphiques que l'on peut copier-coller par clic droit dans Word ou un courriel. Le « R Syntax Mode », activé via le menu Application (trois points verticaux), affiche le code R équivalent de chaque analyse, que l'on peut copier vers une session R. Avant de quitter, il est recommandé de sauvegarder : « Export » puis « Data » enregistre l'ensemble de données modifié sous un nouveau nom, tandis que « Save as » crée un fichier Jamovi (.omv) contenant à la fois les données et les analyses."}],"concepts":["Logiciel libre et gratuit basé sur R","Feuille de calcul : colonnes = variables, lignes = cas","Niveaux de mesure : nominal, ordinal, continu, ID","Types de données : texte, entier, décimal","Éditeur de variables (Setup)","Variables calculées et fonctions V","Importation de fichiers csv, SPSS, SAS, Stata, Excel","Contraindre une variable d'un niveau à un autre","Modules complémentaires de la bibliothèque Jamovi","Sauvegarde au format .omv et mode syntaxe R"],"formules":[{"nom":"Score z comme variable calculée","formule":"(dose − VMEAN(dose)) / VSTDEV(dose)","explication":"Exemple de formule de variable calculée dans Jamovi : on soustrait la moyenne de la variable puis on divise par son écart-type pour obtenir le score standardisé de chaque observation."}],"jamovi":"Téléchargez Jamovi sur https://www.jamovi.org et installez-le pour votre système. Au démarrage, saisissez des valeurs directement dans le tableur ou ouvrez un fichier via le menu à trois barres horizontales, « Open », puis « Browse ». Double-cliquez sur l'en-tête d'une colonne (ou cliquez « Setup » dans l'onglet Data) pour définir le nom, le niveau de mesure (nominal, ordinal, continu, ID) et le type de données. Ajoutez une variable calculée avec le bouton « Add » et une formule comme LOG10(len). Pour étendre Jamovi, cliquez sur le « + » en haut à droite puis « Jamovi library » et installez un module comme « scatr ». Enfin, sauvegardez votre travail avec « Save as » dans un fichier .omv.","glossaire":[{"terme":"Jamovi","definition":"Logiciel statistique libre et gratuit, construit comme une interface sophistiquée pour le langage de programmation statistique R."},{"terme":"Variable nominale","definition":"Variable catégorielle dont les valeurs sont des étiquettes sans ordre, comme Sexe avec les valeurs Homme et Femme ; les codes numériques éventuels y sont arbitraires."},{"terme":"Variable ordinale","definition":"Variable catégorielle dont les valeurs ont un ordre spécifique, comme une échelle de Likert allant de « tout à fait en désaccord » à « tout à fait d'accord »."},{"terme":"Variable continue","definition":"Variable existant sur une échelle continue, dite aussi d'intervalle ou de rapport, comme la taille ou le poids."},{"terme":"Variable ID","definition":"Type propre à Jamovi destiné aux identifiants (nom, numéro de participant) que l'on n'analyse presque jamais ; il peut améliorer les performances sur de grands jeux de données."},{"terme":"Variable calculée","definition":"Variable dont la valeur résulte d'un calcul sur d'autres variables, par exemple une transformation logarithmique, un score z ou une moyenne."},{"terme":"Fichier csv","definition":"Fichier texte simple où les valeurs sont séparées par des virgules (comma separated values) ; format très courant pour stocker des tableaux de données."},{"terme":"Fichier .omv","definition":"Format de fichier standard de Jamovi, qui stocke à la fois les données, les variables et les analyses effectuées."},{"terme":"Contraindre une variable","definition":"Convertir une variable d'un niveau de mesure à un autre (continu, ordinal ou nominal), par exemple lorsqu'une importation a mal deviné le type."},{"terme":"Module complémentaire","definition":"Extension développée par la communauté Jamovi, installable depuis la bibliothèque Jamovi (bouton « + »), qui ajoute des analyses au programme de base."}],"quiz":[{"question":"Dans la feuille de calcul de Jamovi, que représente chaque colonne ?","options":["Un participant ou un cas","Une analyse statistique","Une variable","Un niveau de mesure"],"bonne":2,"explication":"Dans Jamovi, chaque colonne représente une variable et chaque ligne un cas ou un participant."},{"question":"Quel type de variable est propre à Jamovi et destiné aux identifiants que l'on n'analyse presque jamais ?","options":["ID","Nominal","Ordinal","Continu"],"bonne":0,"explication":"Le type ID est unique à Jamovi : il sert aux identificateurs (noms, numéros de participants) et peut améliorer les performances avec de très grands jeux de données."},{"question":"Une colonne contenant les réponses à une échelle de Likert (de -3 « tout à fait en désaccord » à 3 « tout à fait d'accord ») correspond à quel niveau de mesure ?","options":["Nominal","Continu","ID","Ordinal"],"bonne":3,"explication":"Les valeurs d'une échelle de Likert ont un ordre spécifique mais ne sont pas sur une véritable échelle continue : c'est l'exemple type d'une variable ordinale donné par le manuel."},{"question":"Quelle est la différence entre les fonctions MEAN(A, B) et VMEAN(A) dans une variable calculée ?","options":["MEAN arrondit le résultat alors que VMEAN garde les décimales","MEAN calcule ligne par ligne alors que VMEAN calcule sur l'ensemble de la variable","MEAN fonctionne sur du texte alors que VMEAN fonctionne sur des nombres","Il n'y a aucune différence, ce sont des synonymes"],"bonne":1,"explication":"Les fonctions préfixées d'un V effectuent leur calcul sur l'ensemble d'une variable (VMEAN(A) donne la moyenne de toutes les valeurs de A), tandis que les fonctions non V calculent ligne par ligne (MEAN(A, B) donne la moyenne de A et B pour chaque rangée)."},{"question":"Vous recevez un fichier Excel (.xls) à analyser. D'après le manuel, quelle est la bonne façon de procéder ?","options":["L'ouvrir d'abord dans un tableur puis l'exporter en csv avant de l'importer dans Jamovi","Le glisser-déposer directement dans le panneau des résultats","Le renommer en .omv pour que Jamovi le reconnaisse","Impossible : Jamovi ne peut traiter aucune donnée venant d'Excel"],"bonne":0,"explication":"Le manuel indique que pour manipuler des fichiers Excel il faut d'abord les ouvrir dans Excel ou un autre tableur, puis exporter les données en csv avant de les importer dans Jamovi."},{"question":"Lors de l'importation d'un fichier texte, quelle valeur Jamovi suppose-t-il par défaut pour indiquer une donnée manquante ?","options":["0","-9999","NA","Une cellule contenant le mot « manquant »"],"bonne":2,"explication":"Par défaut, Jamovi suppose que la valeur manquante est NA, pour les données numériques comme textuelles ; les valeurs manquantes deviennent des cellules vides après importation."},{"question":"Après une importation, une variable numérique a été lue comme nominale. Que faire dans Jamovi ?","options":["Supprimer la colonne et tout ressaisir à la main","La contraindre au niveau continu en cochant ce niveau dans l'éditeur de variables","Réinstaller Jamovi car il s'agit d'un bogue","Créer une variable calculée avec la fonction LOG10"],"bonne":1,"explication":"Le manuel explique qu'on peut « contraindre » une variable d'un niveau de mesure à un autre en cliquant simplement sur la case correspondant au niveau souhaité (continu, ordinal ou nominal)."},{"question":"Quel avantage offre la sauvegarde avec « Save as » dans un fichier .omv plutôt que le seul export des données ?","options":["Le fichier .omv est lisible par Excel sans conversion","Le fichier .omv est automatiquement envoyé sur le site de Jamovi","Le fichier .omv compresse les données pour gagner de l'espace disque","Le fichier .omv sauvegarde à la fois les données modifiées et les analyses effectuées"],"bonne":3,"explication":"Le format .omv est le format standard de Jamovi : il stocke les données, les variables et les analyses, alors que « Export » / « Data » n'enregistre que l'ensemble de données."}],"exercice":{"titre":"Importer un fichier csv et créer une variable standardisée","enonce":"Créez avec un éditeur de texte un fichier notes.csv contenant une ligne d'entête « nom,note » puis cinq lignes : Alice,12 ; Bruno,15 ; Chloé,9 ; David,18 ; Emma,11 (chaque paire sur sa propre ligne, séparée par une virgule). Importez ce fichier dans Jamovi, vérifiez que « nom » est bien traité comme ID ou nominal et « note » comme variable continue, puis créez une variable calculée « note_z » contenant le score z de la note. Enfin, sauvegardez le tout dans un fichier Jamovi.","correction":"1) Créez le fichier texte notes.csv avec la ligne d'entête « nom,note » suivie des cinq lignes de données. 2) Dans Jamovi, cliquez sur le menu à trois barres horizontales en haut à gauche, choisissez « Open » puis « Browse » et sélectionnez notes.csv : Jamovi lit la première ligne comme les noms de variables. 3) Double-cliquez sur l'en-tête de la colonne « nom » (ou utilisez « Setup » dans l'onglet Data) et vérifiez son niveau : ID (ou nominal) convient puisqu'il s'agit d'identifiants ; vérifiez que « note » est bien continue (type Integer ou Decimal), sinon contraignez-la en cochant « Continuous ». 4) Dans l'onglet Data, cliquez sur « Add » pour ajouter une variable calculée nommée note_z et saisissez la formule (note - VMEAN(note)) / VSTDEV(note), sur le modèle du z-score de « dose » montré dans le manuel ; chaque ligne affiche alors l'écart de la note à la moyenne exprimé en écarts-types. 5) Sauvegardez avec le menu principal, « Save as », en donnant un nom de fichier : vous obtenez un fichier .omv contenant les données et la variable calculée."}},{"numero":4,"titre":"Statistiques descriptives","sections":[{"titre":"Pourquoi des statistiques descriptives ?","contenu":"Face à un nouveau jeu de données, la première tâche consiste à trouver des moyens de le résumer de manière synthétique et facile à comprendre : c'est le rôle des statistiques descriptives, par opposition aux statistiques inférentielles. Le chapitre s'appuie sur des données réelles de la Ligue australienne de football (AFL) : la variable afl.margins contient la marge gagnante des 176 matchs de la saison 2010. Regarder les données brutes ne suffit pas à les comprendre : il faut calculer des statistiques sommaires et dessiner des graphiques comme un histogramme."},{"titre":"Mesures de la tendance centrale : moyenne, médiane, mode","contenu":"La tendance centrale indique où se situe le « milieu » des données ; les trois mesures les plus courantes sont la moyenne, la médiane et le mode. La moyenne s'obtient en additionnant toutes les valeurs puis en divisant par leur nombre : pour les cinq premières marges AFL (56, 31, 56, 8, 32), on obtient 183/5 = 36,60. La médiane est la valeur centrale après tri croissant : 32 pour ces cinq valeurs, et la moyenne des deux valeurs centrales si l'effectif est pair (31,5 pour six valeurs). Le mode est simplement la valeur qui s'observe le plus fréquemment : le mode des équipes finalistes AFL est « Geelong » (39 finales) et celui des marges gagnantes est 3 points."},{"titre":"Moyenne ou médiane ? Le choix de la bonne mesure","contenu":"La moyenne est le « centre de gravité » des données tandis que la médiane en est la « valeur centrale ». Pour des données nominales, il vaut mieux utiliser le mode ; pour des données ordinales, la médiane est préférable car elle n'utilise que l'ordre des valeurs ; pour des échelles d'intervalle ou de rapport, les deux sont acceptables. La moyenne utilise toute l'information des données mais est très sensible aux valeurs extrêmes : si Bill (100 000 000 $) rejoint une table où les revenus étaient de 50 000, 60 000 et 65 000 $, la moyenne bondit à 25 043 750 $ alors que la médiane n'atteint que 62 500 $. L'exemple de la Commonwealth Bank, qui comparait des revenus moyens à des prix médians de maisons, montre qu'un mauvais choix de mesure peut gravement fausser une conclusion."},{"titre":"Mesures de la variabilité : étendue, IQR, écart absolu moyen","contenu":"Les mesures de variabilité indiquent comment les données sont « étalées » autour du centre. L'étendue (maximum moins minimum, soit 116 − 0 = 116 pour les marges AFL) est simple mais très vulnérable aux valeurs aberrantes : une seule valeur extrême peut la faire passer de 8 à 110. L'écart interquartile (IQR) est la différence entre le 75e et le 25e percentile, soit l'intervalle couvert par la « moitié centrale » des données : 50,50 − 12,75 = 37,75 pour les marges AFL ; il est robuste et complète bien la médiane. L'écart absolu moyen (AAD) est la moyenne des écarts absolus à la moyenne : 15,52 pour les cinq premières marges ; il est très interprétable mais moins utilisé que l'écart-type."},{"titre":"Variance et écart-type","contenu":"La variance est la moyenne des écarts au carré par rapport à la moyenne : elle possède d'élégantes propriétés mathématiques (notamment l'additivité) mais est ininterprétable pour un humain car elle s'exprime en unités au carré (des « points carrés »). Jamovi calcule en fait une version divisant par N − 1 plutôt que N (405,80 au lieu de 324,64 pour les cinq premières marges AFL), car on cherche généralement à estimer un paramètre de population plutôt qu'à décrire le seul échantillon. L'écart-type, racine carrée de la variance, résout le problème d'interprétation puisqu'il s'exprime dans les unités d'origine : Jamovi donne 26,07 pour ces cinq valeurs. Selon une règle empirique valable pour des données en cloche, environ 68 % des données se situent à un écart-type de la moyenne, 95 % à deux écarts-types et 99,7 % à trois écarts-types."},{"titre":"Asymétrie et aplatissement","contenu":"L'asymétrie (skewness) mesure le manque de symétrie d'une distribution : elle est négative quand la queue inférieure est plus longue (beaucoup de valeurs extrêmement petites), nulle pour une distribution symétrique et positive quand la queue s'étend vers la droite. Pour les marges AFL, l'asymétrie vaut 0,780 ; divisée par son erreur standard (0,780/0,183 = 4,262, valeur supérieure à 2), elle indique des données assez asymétriques. L'aplatissement (kurtosis) mesure l'« acuité » d'une distribution par rapport à la courbe normale : négatif pour une courbe trop plate (platykurtique), nul pour une courbe juste assez pointue (mésokurtique) et positif pour une courbe trop pointue (leptokurtique). Pour les marges AFL, le kurtosis vaut 0,101 avec une erreur standard de 0,364 : les données sont juste assez pointues."},{"titre":"Statistiques par groupe et scores standards (z)","contenu":"Jamovi permet d'obtenir des statistiques descriptives ventilées par une variable de regroupement en glissant celle-ci dans la case « Split by » : par exemple le gain d'humeur du fichier clinicaltrial.csv séparément pour chaque type de thérapie. Le score standard (score z) exprime une observation comme le nombre d'écarts-types au-dessus de la moyenne : un score de grincheux de 35 avec une moyenne de 17 et un écart-type de 5 donne z = (35 − 17)/5 = 3,6, ce qui place la personne au-delà de 99,98 % des gens. Les scores z permettent aussi de comparer des variables mesurées sur des échelles complètement différentes, comme la grinchiosité (z = 3,6) et l'extraversion (z = −2,75), ce que les scores bruts ne permettent pas."}],"concepts":["Statistiques descriptives vs inférentielles","Moyenne, médiane, mode","Sensibilité de la moyenne aux valeurs extrêmes","Étendue et écart interquartile (IQR)","Percentiles et quartiles","Écart absolu moyen (AAD)","Variance et division par N − 1","Écart-type et règle 68-95-99,7","Asymétrie (skewness) et aplatissement (kurtosis)","Scores standards (scores z)"],"formules":[{"nom":"Moyenne","formule":"x̄ = (1/N) Σᵢ xᵢ","explication":"On additionne toutes les observations puis on divise par leur nombre N ; x̄ est la notation traditionnelle de la moyenne d'échantillon."},{"nom":"Écart absolu moyen (AAD)","formule":"AAD(X) = (1/N) Σᵢ |xᵢ − x̄|","explication":"Moyenne des écarts absolus entre chaque observation et la moyenne ; elle indique la distance « typique » des données à la moyenne dans les unités d'origine."},{"nom":"Variance","formule":"Var(X) = s² = (1/N) Σᵢ (xᵢ − x̄)²","explication":"Moyenne des écarts au carré par rapport à la moyenne, d'où son autre nom d'« écart quadratique moyen » ; elle s'exprime en unités au carré, ce qui la rend difficile à interpréter."},{"nom":"Variance calculée par Jamovi (estimateur)","formule":"σ̂² = (1/(N−1)) Σᵢ (xᵢ − x̄)²","explication":"Jamovi divise par N − 1 plutôt que par N car on cherche généralement à estimer la variance de la population d'où provient l'échantillon, et non à décrire l'échantillon lui-même."},{"nom":"Écart-type","formule":"s = √[(1/N) Σᵢ (xᵢ − x̄)²]  ;  version Jamovi : σ̂ = √[(1/(N−1)) Σᵢ (xᵢ − x̄)²]","explication":"Racine carrée de la variance, exprimée dans les mêmes unités que les données, ce qui la rend interprétable ; Jamovi calcule la version divisée par N − 1."},{"nom":"Asymétrie (skewness)","formule":"skewness(X) = (1/(N σ̂³)) Σᵢ (xᵢ − x̄)³","explication":"Elle est fondée sur les écarts au cube : négative si la queue inférieure est plus longue, nulle pour une distribution symétrique, positive si la queue s'étend vers la droite."},{"nom":"Aplatissement (kurtosis)","formule":"kurtosis(X) = (1/(N σ̂⁴)) Σᵢ (xᵢ − x̄)⁴ − 3","explication":"Fondé sur les écarts à la puissance quatre ; le « −3 » sert à donner un kurtosis nul à la courbe normale, si bien qu'une valeur négative signale une courbe trop plate et une valeur positive une courbe trop pointue."},{"nom":"Score standard (score z)","formule":"zᵢ = (xᵢ − x̄) / σ̂","explication":"Nombre d'écarts-types séparant une observation de la moyenne ; il permet d'interpréter un score brut par rapport à une population et de comparer des variables mesurées sur des échelles différentes."}],"jamovi":"Ouvrez le fichier de données (par exemple aflsmall_margins.csv) puis cliquez sur « Exploration » et « Descriptives ». Mettez la variable en surbrillance (afl.margins) et cliquez sur la flèche pour la déplacer dans la boîte « Variables » : le tableau de droite affiche par défaut N, les valeurs manquantes, la moyenne, la médiane, le minimum et le maximum. Développez la section « Statistics » pour cocher les options supplémentaires : « Mode », « Quartiles » (25e, 50e et 75e percentiles), « Std. deviation », « Variance », « Range », « Skewness » et « Kurtosis ». Pour une variable nominale comme afl.finalists, cochez « Frequency tables » afin d'obtenir le tableau de fréquences et repérer le mode. Enfin, pour des statistiques ventilées par groupe, glissez la variable de regroupement (par exemple therapy du fichier clinicaltrial.csv) dans la case « Split by ».","glossaire":[{"terme":"Statistiques descriptives","definition":"Ensemble de mesures servant à résumer un jeu de données de manière synthétique et facile à comprendre, par opposition aux statistiques inférentielles."},{"terme":"Moyenne","definition":"Somme de toutes les valeurs divisée par le nombre total d'observations ; c'est le « centre de gravité » des données, mais elle est très sensible aux valeurs extrêmes."},{"terme":"Médiane","definition":"Valeur centrale d'un ensemble d'observations triées par ordre croissant ; si l'effectif est pair, c'est la moyenne des deux valeurs du milieu."},{"terme":"Mode","definition":"Valeur qui s'observe le plus fréquemment dans un échantillon ; c'est la mesure de tendance centrale appropriée pour les données nominales."},{"terme":"Étendue","definition":"Différence entre la plus grande et la plus petite valeur d'une variable ; mesure de variabilité très simple mais très vulnérable aux valeurs aberrantes."},{"terme":"Percentile","definition":"Le pe percentile est le plus petit nombre x tel que p % des données lui sont inférieures ; la médiane est ainsi le 50e percentile."},{"terme":"Écart interquartile (IQR)","definition":"Différence entre le 75e et le 25e percentile, soit l'intervalle couvert par la « moitié centrale » des données ; mesure de dispersion robuste qui complète bien la médiane."},{"terme":"Variance","definition":"Moyenne des écarts au carré par rapport à la moyenne ; mathématiquement élégante (elle est additive) mais ininterprétable car exprimée en unités au carré."},{"terme":"Écart-type","definition":"Racine carrée de la variance, exprimée dans les mêmes unités que les données ; c'est de loin la mesure de variabilité la plus populaire lorsque la moyenne sert de tendance centrale."},{"terme":"Score standard (score z)","definition":"Nombre d'écarts-types séparant une observation de la moyenne ; il situe un score brut par rapport à sa population et permet de comparer des variables d'échelles différentes."}],"quiz":[{"question":"Les cinq premières marges gagnantes de l'AFL sont 56, 31, 56, 8 et 32. Quelle est leur moyenne ?","options":["32,00","36,60","35,30","38,25"],"bonne":1,"explication":"La moyenne s'obtient en additionnant toutes les valeurs puis en divisant par leur nombre : (56 + 31 + 56 + 8 + 32)/5 = 183/5 = 36,60. La valeur 35,30 est la moyenne des 176 matchs, pas des cinq premiers."},{"question":"Pour les six valeurs triées 8, 14, 31, 32, 56, 56, quelle est la médiane ?","options":["32","31","33,5","31,5"],"bonne":3,"explication":"Avec un nombre pair d'observations, la médiane est la moyenne des deux valeurs centrales : (31 + 32)/2 = 31,5."},{"question":"Vos données sont sur une échelle nominale (par exemple des noms d'équipes). Quelle mesure de tendance centrale devez-vous utiliser ?","options":["Le mode","La moyenne","La médiane","L'écart-type"],"bonne":0,"explication":"Pour des données nominales, moyenne et médiane n'ont pas de sens car les nombres attribués aux valeurs sont arbitraires : il faut utiliser le mode, la valeur la plus fréquente (par exemple « Geelong » pour afl.finalists)."},{"question":"Quatre personnes ont des revenus de 50 000 $, 60 000 $, 65 000 $ et 100 000 000 $. Quelle affirmation est correcte ?","options":["La moyenne et la médiane sont toutes deux proches de 60 000 $","La médiane est plus élevée que la moyenne","La moyenne dépasse 25 millions de dollars alors que la médiane reste à 62 500 $","La médiane dépasse 25 millions de dollars alors que la moyenne reste à 62 500 $"],"bonne":2,"explication":"C'est l'exemple de Bill dans le manuel : la moyenne, très sensible aux valeurs extrêmes, bondit à 25 043 750 $, tandis que la médiane, valeur centrale, n'est que de 62 500 $ et reflète mieux le revenu « typique »."},{"question":"Pour les marges AFL, le 25e percentile vaut 12,75 et le 75e percentile 50,50. Quel est l'écart interquartile (IQR) ?","options":["63,25","50,50","116","37,75"],"bonne":3,"explication":"L'IQR est la différence entre le 75e et le 25e percentile : 50,50 − 12,75 = 37,75. C'est l'intervalle couvert par la moitié centrale des données."},{"question":"Pourquoi Jamovi divise-t-il par N − 1 plutôt que par N lorsqu'il calcule la variance ?","options":["Parce qu'on cherche généralement à estimer le paramètre de la population plutôt qu'à décrire seulement l'échantillon","Parce que c'est un bogue connu de Jamovi qui sera corrigé","Parce que la première observation est toujours ignorée dans les calculs","Parce que diviser par N donnerait un résultat négatif"],"bonne":0,"explication":"Le manuel explique la distinction entre « décrire un échantillon » (diviser par N) et « faire des suppositions sur la population d'où provient l'échantillon » : Jamovi divise par N − 1 car on veut habituellement estimer un paramètre de population. C'est pourquoi il donne 405,80 et non 324,64 pour les cinq premières marges."},{"question":"Selon la règle empirique associée à l'écart-type (pour des données en forme de cloche), quel pourcentage des données se situe à moins de deux écarts-types de la moyenne ?","options":["50 %","68 %","95 %","99,7 %"],"bonne":2,"explication":"La règle empirique indique environ 68 % des données à un écart-type de la moyenne, 95 % à deux écarts-types et 99,7 % à trois écarts-types."},{"question":"Un test a une moyenne de 17 et un écart-type de 5. Une personne obtient 35. Quel est son score z et comment l'interpréter ?","options":["z = 0,7 ; le score est proche de la moyenne","z = 3,6 ; le score est extrêmement élevé, au-delà de la quasi-totalité de la population","z = 7,0 ; le score est impossible","z = −3,6 ; le score est extrêmement bas"],"bonne":1,"explication":"z = (35 − 17)/5 = 3,6 : le score se situe à 3,6 écarts-types au-dessus de la moyenne. Comme 99,7 % des valeurs se situent dans les 3 écarts-types, un z de 3,6 place la personne au-delà d'environ 99,98 % des gens (l'exemple de la « grinchiosité » du manuel)."}],"exercice":{"titre":"Explorer la variabilité des marges gagnantes de l'AFL","enonce":"Ouvrez une nouvelle session Jamovi et saisissez dans la colonne A les cinq premières marges gagnantes de l'AFL : 56, 31, 56, 8 et 32. Définissez la variable comme continue. Avec l'analyse « Descriptives », obtenez la moyenne, la médiane, la variance et l'écart-type. Calculez ensuite à la main la variance en divisant par N, comparez-la à la valeur affichée par Jamovi et expliquez la différence. Enfin, indiquez quelle mesure de dispersion vous rapporteriez à un lecteur humain et pourquoi.","correction":"1) Dans une nouvelle session Jamovi (menu principal, « Nouveau »), saisissez 56, 31, 56, 8, 32 dans la colonne A, puis double-cliquez sur l'en-tête et changez le type de variable en « Continu ». 2) Cliquez « Exploration » puis « Descriptives », déplacez A dans « Variables », développez « Statistics » et cochez « Variance » et « Std. deviation ». Jamovi affiche une moyenne de 36,60, une médiane de 32, une variance de 405,80 et un écart-type de 26,07. 3) Calcul à la main : les écarts à la moyenne sont 19,4 ; −5,6 ; 19,4 ; −28,6 ; −4,6 et leurs carrés 376,36 ; 31,36 ; 376,36 ; 817,96 ; 21,16. Leur somme divisée par N = 5 donne une variance de 324,64. 4) La différence vient de la formule : Jamovi divise la somme des écarts au carré par N − 1 = 4 (soit 1623,20/4 = 405,80) car il estime la variance de la population d'où provient l'échantillon, alors que la division par N décrit seulement l'échantillon lui-même. 5) On rapporterait l'écart-type (26,07 points) plutôt que la variance : exprimé dans les unités d'origine (des points, et non des « points carrés »), il est interprétable par un humain, alors que la variance est mathématiquement élégante mais dénuée de sens concret."}},{"numero":5,"titre":"Réaliser des graphiques","sections":[{"titre":"Pourquoi visualiser les données ?","contenu":"La visualisation des données est l'une des tâches les plus importantes de l'analyste de données, pour deux raisons liées : dessiner des représentations graphiques propres et attrayantes facilite la compréhension par le lecteur, et dessiner des graphiques exploratoires vous aide vous-même à comprendre les données au fur et à mesure de l'analyse. Le chapitre s'ouvre sur la célèbre carte des décès dus au choléra de John Snow en 1854 : de petits points marquent les cas de choléra et de grands cercles les pompes à eau, montrant clairement que la source de l'épidémie était la pompe de Broad Street. Cette carte a permis de retirer la poignée de la pompe et de mettre fin à une épidémie qui avait tué plus de 500 personnes, illustrant la puissance d'une bonne visualisation."},{"titre":"Histogrammes et courbes de densité","contenu":"L'histogramme est l'un des moyens les plus simples et les plus utiles de visualiser des données mesurées sur une échelle d'intervalle ou de ratio. On divise les valeurs possibles en compartiments, puis on compte le nombre d'observations qui tombent dans chaque compartiment ; ce comptage (fréquence ou densité) est affiché sous forme de barre verticale. Jamovi propose aussi une courbe de « densité », variante de l'histogramme qui utilise l'estimation par noyau pour lisser le bruit : elle est moins affectée par le nombre de compartiments choisis et permet donc de mieux juger la forme de la distribution (normalité, asymétrie, aplatissement). La grande force de l'histogramme est de montrer toute la dispersion des données, mais il n'est pas compact : difficile d'en entasser 20 ou 30 dans une seule image, et il est inutile pour des données nominales."},{"titre":"Boxplots (diagrammes en boîtes)","contenu":"Le boxplot, parfois appelé tracé « boîte et moustaches », offre une représentation visuelle compacte de la médiane, de l'écart interquartile et de l'étendue des données. La ligne épaisse au milieu de la boîte est la médiane ; la boîte s'étend du 25e au 75e centile ; les moustaches vont jusqu'au point de données le plus extrême qui ne dépasse pas 1,5 fois l'écart interquartile (IQR) au-delà des quartiles. Toute observation située en dehors de cette plage est tracée comme un point séparé et est communément appelée valeur aberrante. Grâce à leur compac
