<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formation — Apprentissage des statistiques avec Jamovi</title>
<meta name="theme-color" content="#2d5183">
<meta name="description" content="Formation interactive aux statistiques avec Jamovi : leçons, quiz corrigés, exercices pratiques et glossaire.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#1c2733; --muted:#5b6b7c;
  --accent:#3e6da8; --accent-dark:#2d5183; --accent-soft:#e8eff8;
  --green:#2e8b57; --green-soft:#e6f4ec; --red:#c0392b; --red-soft:#fdecea;
  --amber:#b7791f; --amber-soft:#fdf3e0;
  --sidebar:#1d2b3a; --sidebar-ink:#c9d6e3; --border:#e2e8f0;
  --radius:12px; --shadow:0 1px 3px rgba(16,32,54,.08),0 4px 14px rgba(16,32,54,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15.5px;line-height:1.6}
button{font-family:inherit;cursor:pointer}
/* ---------- layout ---------- */
#app{display:flex;min-height:100vh}
#sidebar{width:292px;background:var(--sidebar);color:var(--sidebar-ink);position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:40;transition:transform .25s ease;display:flex;flex-direction:column}
#main{flex:1;margin-left:292px;padding:32px clamp(18px,4vw,56px) 80px;max-width:1150px}
#sidebar .brand{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
#sidebar .brand h1{font-size:1.02rem;color:#fff;line-height:1.35;font-weight:700}
#sidebar .brand p{font-size:.74rem;opacity:.65;margin-top:5px}
#sidebar nav{padding:12px 10px 30px;flex:1}
.nav-group{margin-top:14px}
.nav-group>.grp{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;opacity:.55;padding:4px 12px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;color:var(--sidebar-ink);padding:8px 12px;border-radius:8px;font-size:.86rem;line-height:1.3}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:var(--accent);color:#fff}
.nav-item .num{flex:0 0 22px;height:22px;border-radius:6px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700}
.nav-item.done .num{background:var(--green);color:#fff}
.nav-item .score{margin-left:auto;font-size:.68rem;opacity:.8}
.nav-item .ttl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#burger{display:none;position:fixed;top:14px;left:14px;z-index:50;background:var(--sidebar);color:#fff;border:none;border-radius:10px;width:42px;height:42px;font-size:1.2rem;box-shadow:var(--shadow)}
#overlay{display:none;position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:35}
@media(max-width:900px){
  #sidebar{transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #main{margin-left:0;padding-top:70px}
  #burger{display:block}
  body.menu-open #overlay{display:block}
}
/* ---------- generic ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 26px;margin-bottom:20px}
h2.page-title{font-size:1.55rem;margin-bottom:4px;line-height:1.3}
.page-sub{color:var(--muted);margin-bottom:24px;font-size:.92rem}
.chip{display:inline-block;background:var(--accent-soft);color:var(--accent-dark);border-radius:999px;padding:3px 12px;font-size:.8rem;font-weight:600;margin:3px 5px 3px 0}
.btn{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:10px 20px;font-size:.9rem;font-weight:600;transition:background .15s}
.btn:hover{background:var(--accent-dark)}
.btn.ghost{background:var(--accent-soft);color:var(--accent-dark)}
.btn.ghost:hover{background:#d9e6f5}
.btn.green{background:var(--green)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.progress-track{background:#e6ebf2;border-radius:999px;height:10px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),#5f8fc9);border-radius:999px;transition:width .4s ease}
.progress-fill.green{background:linear-gradient(90deg,#2e8b57,#4aab74)}
/* ---------- home ---------- */
.hero{background:linear-gradient(120deg,#2d5183,#3e6da8 60%,#4f81bd);color:#fff;border-radius:var(--radius);padding:30px 30px 26px;margin-bottom:22px;box-shadow:var(--shadow)}
.hero h2{font-size:1.5rem;margin-bottom:6px}
.hero p{opacity:.9;font-size:.93rem;max-width:640px}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
.stat .v{font-size:1.6rem;font-weight:800;color:var(--accent-dark)}
.stat .l{font-size:.78rem;color:var(--muted);margin-top:2px}
.chap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}
.chap-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;border:none;text-align:left;display:flex;flex-direction:column;gap:9px;transition:transform .12s,box-shadow .12s}
.chap-card:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(16,32,54,.12),0 8px 24px rgba(16,32,54,.1)}
.chap-card .top{display:flex;align-items:center;gap:10px}
.chap-card .badge{flex:0 0 34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent-dark);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.chap-card.done .badge{background:var(--green-soft);color:var(--green)}
.chap-card h3{font-size:.95rem;line-height:1.3;flex:1}
.chap-card .meta{font-size:.76rem;color:var(--muted)}
/* ---------- chapter ---------- */
.tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.tab{border:1px solid var(--border);background:var(--card);border-radius:999px;padding:8px 18px;font-size:.87rem;font-weight:600;color:var(--muted)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.section-block{margin-bottom:18px}
.section-block h3{font-size:1.05rem;color:var(--accent-dark);margin-bottom:6px}
.section-block ul{margin:2px 0 0 4px;list-style:none}
.section-block li{padding-left:20px;position:relative;margin-bottom:5px;font-size:.94rem}
.section-block li::before{content:"▸";position:absolute;left:0;color:var(--accent);font-weight:700}
.formula-card{background:#f8fafc;border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:8px;padding:13px 16px;margin-bottom:12px}
.formula-card .f{font-family:"Cambria Math",Georgia,serif;font-size:1.06rem;margin:4px 0 6px;color:#12385f}
.formula-card .n{font-weight:700;font-size:.86rem}
.formula-card .e{font-size:.85rem;color:var(--muted)}
.jamovi-box{background:var(--green-soft);border:1px solid #cde7d8;border-radius:10px;padding:16px 18px;margin-top:6px}
.jamovi-box h4{color:var(--green);font-size:.92rem;margin-bottom:6px}
.jamovi-box p{font-size:.9rem}
.chap-nav{display:flex;justify-content:space-between;gap:10px;margin-top:26px}
/* ---------- quiz ---------- */
.quiz-progress{display:flex;align-items:center;gap:12px;margin-bottom:18px;font-size:.85rem;color:var(--muted)}
.quiz-progress .progress-track{flex:1}
.q-text{font-size:1.08rem;font-weight:700;margin-bottom:16px;line-height:1.45}
.opt{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;background:#f8fafc;border:1.5px solid var(--border);border-radius:10px;padding:12px 15px;margin-bottom:10px;font-size:.93rem;line-height:1.45;transition:all .12s}
.opt:hover{border-color:var(--accent)}
.opt .letter{flex:0 0 26px;height:26px;border-radius:7px;background:#e6ebf2;font-weight:800;font-size:.8rem;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.opt.selected{border-color:var(--accent);background:var(--accent-soft)}
.opt.selected .letter{background:var(--accent);color:#fff}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.correct .letter{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .letter{background:var(--red);color:#fff}
.opt:disabled{cursor:default}
.explain{border-radius:10px;padding:14px 17px;margin:14px 0;font-size:.9rem}
.explain.good{background:var(--green-soft);border:1px solid #cde7d8}
.explain.bad{background:var(--red-soft);border:1px solid #f2cfca}
.explain b{display:block;margin-bottom:4px}
.quiz-result{text-align:center;padding:30px 10px}
.quiz-result .big{font-size:2.6rem;font-weight:800;color:var(--accent-dark)}
.quiz-result p{color:var(--muted);margin:8px 0 20px}
/* ---------- exercise ---------- */
.exo-correction{background:var(--amber-soft);border:1px solid #efd9ad;border-radius:10px;padding:16px 18px;margin-top:16px;font-size:.92rem;white-space:pre-wrap}
/* ---------- glossary ---------- */
#gsearch{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:12px 16px;font-size:.95rem;margin-bottom:20px;font-family:inherit}
#gsearch:focus{outline:none;border-color:var(--accent)}
.gletter{font-size:1.1rem;font-weight:800;color:var(--accent-dark);margin:18px 0 8px;border-bottom:2px solid var(--accent-soft);padding-bottom:4px}
.gterm{padding:10px 2px;border-bottom:1px solid var(--border)}
.gterm b{font-size:.95rem}
.gterm .src{font-size:.72rem;color:var(--muted);background:var(--accent-soft);border-radius:999px;padding:1px 9px;margin-left:8px;white-space:nowrap}
.gterm p{font-size:.88rem;color:#33414f;margin-top:3px}
.footer-note{margin-top:40px;font-size:.78rem;color:var(--muted);text-align:center}
.footer-note a{color:var(--accent)}
mark{background:#ffe9a8;border-radius:3px;padding:0 2px}
</style>
</head>
<body>
<button id="burger" aria-label="Menu">☰</button>
<div id="overlay"></div>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <h1>📊 Statistiques avec Jamovi</h1>
      <p>Formation interactive d'après Navarro, Foxcroft &amp; Meunier</p>
    </div>
    <nav id="nav"></nav>
  </aside>
  <main id="main"></main>
</div>
<script>
const DATA = {"chapitres":[{"numero":1,"titre":"Pourquoi apprenons-nous les statistiques ?","sections":[{"titre":"Sur la psychologie des statistiques : pourquoi faire des statistiques ?","points":["Les étudiants en psychologie sont souvent surpris de découvrir la place centrale des statistiques dans leur discipline.","La raison principale de faire des statistiques est que nous ne pouvons pas entièrement nous faire confiance.","Les êtres humains sont sensibles aux préjugés, aux tentations et à de nombreuses fragilités de raisonnement.","Les statistiques servent de garde-fou : elles nous aident à rester honnêtes face à nos biais.","Le simple « bon sens », fondé sur l'instinct et les arguments verbaux, est jugé peu fiable en science."]},{"titre":"La malédiction des biais de croyance","points":["Le biais de croyance pousse à juger un argument selon la crédibilité de sa conclusion plutôt que sa logique.","Dans l'étude d'Evans, Barston et Pollard (1983), quand logique et croyance concordent, 92 % des jugements sont corrects.","Un argument valide dont la conclusion paraît incroyable n'est reconnu comme valide que par 44 % des gens.","À l'inverse, un argument invalide mais à la conclusion crédible est accepté à tort par 92 % des participants.","Au total, les gens répondent correctement environ 60 % du temps, à peine mieux que le hasard."]},{"titre":"La mise en garde contre le paradoxe de Simpson","points":["À Berkeley en 1973, 44 % des 8442 candidats hommes furent admis, contre 35 % des 4321 candidatures de femmes.","Pourtant, Bickel et ses collègues (1975) ont montré que, département par département, les taux favorisaient souvent les femmes.","L'explication : les femmes postulaient surtout dans des départements très sélectifs, les hommes dans des départements admettant facilement.","Le paradoxe de Simpson désigne ce renversement d'une tendance entre les données agrégées et les données désagrégées.","C'est un piège bien réel et contre-intuitif qui guette les analystes de données imprudents."]},{"titre":"Les statistiques ne sont qu'un outil","points":["Choisir entre données agrégées et désagrégées dépend de la question de recherche posée, pas des mathématiques.","Comprendre pourquoi les candidatures se répartissent ainsi exige une réflexion sociologique et psychologique, pas un calcul.","Certaines questions essentielles n'ont pas de réponse statistique, mais elles influencent malgré tout la manière d'analyser.","Les statistiques sont un outil puissant pour connaître ses données, mais rien de plus qu'un outil.","Aucune méthode statistique ne remplace une réflexion approfondie sur le problème que l'on étudie."]},{"titre":"Statistiques en psychologie","points":["La psychologie est une science statistique parce qu'elle étudie des êtres humains compliqués, variables et désordonnés.","La physique a la tâche plus simple : les électrons n'ont ni opinions ni humeurs changeantes.","Les statistiques sont étroitement liées à la conception même de la recherche en psychologie.","Sans elles, il est impossible de comprendre la littérature scientifique, remplie d'analyses statistiques.","Déléguer ses analyses coûte cher car les statisticiens sont rares ; l'argument vaut aussi pour les praticiens."]},{"titre":"Statistiques dans la vie quotidienne","points":["Au XXIe siècle, les données sont partout et la culture statistique devient un véritable outil de survie.","Sur 20 articles de presse examinés par l'auteur, 8 parlaient de statistiques et 6 contenaient une erreur.","L'erreur la plus courante consiste à ne pas donner les données de base permettant la comparaison.","Par exemple, annoncer que « 5 % ont la caractéristique Y » sans indiquer sa fréquence dans la population générale.","Savoir un peu de statistiques aide à repérer les erreurs et les mensonges diffusés par les médias."]},{"titre":"Les méthodes de recherche ne se limitent pas aux statistiques","points":["La méthodologie de recherche est un domaine bien plus large que les seules statistiques.","Pourtant, environ 99 % des craintes des étudiants portent sur la partie statistique du cours.","Les statistiques sont enseignées en premier parce qu'on analyse souvent des données recueillies par d'autres.","L'auteur juge les statistiques « urgentes » et la conception de la recherche « importante » à long terme.","La conception de la recherche est plus idiosyncrasique : chaque domaine possède ses propres méthodes."]}],"concepts":["Les statistiques comme sauvegarde contre nos biais","Effet de biais de croyance","Validité logique d'un argument (prémisses et conclusion)","Paradoxe de Simpson","Données agrégées vs données désagrégées","La psychologie comme science statistique","Les statistiques comme outil, pas comme substitut à la réflexion","Culture statistique dans la vie quotidienne","Distinction entre statistiques et conception de la recherche"],"formules":[],"jamovi":"Données : colonnes Departement, Sexe, Admis (admissions Berkeley) → Analyses → Exploration → Descriptives → Admis en variable, Sexe en regroupement (taux global) → ajouter Departement en second facteur (ou Frequencies → Contingency Tables) → observer le renversement du paradoxe de Simpson","glossaire":[{"terme":"Biais de croyance","definition":"Tendance à juger la validité logique d'un argument en fonction de la crédibilité de sa conclusion plutôt que de sa structure logique. Ce biais persiste même quand on sait qu'on ne devrait pas en tenir compte."},{"terme":"Argument valide","definition":"Argument dont la conclusion est une conséquence logique des prémisses : si les prémisses sont vraies, la conclusion l'est aussi. Un argument valide n'a pas besoin de contenir des affirmations vraies."},{"terme":"Prémisse","definition":"Proposition de départ d'un raisonnement à partir de laquelle on tire une conclusion. La validité d'un argument dépend du lien logique entre prémisses et conclusion, pas de la vérité des prémisses."},{"terme":"Paradoxe de Simpson","definition":"Phénomène dans lequel une tendance observée dans des données agrégées s'inverse ou disparaît lorsqu'on examine les données désagrégées par sous-groupes. L'exemple classique est celui des admissions de Berkeley en 1973."},{"terme":"Données agrégées","definition":"Données regroupées à un niveau global (par exemple le taux d'admission de toute une université). Elles peuvent raconter une histoire différente de celle des données examinées par sous-groupes."},{"terme":"Données désagrégées","definition":"Données examinées au niveau des sous-groupes (par exemple les taux d'admission département par département). Leur analyse peut révéler des tendances masquées ou inversées dans le total."},{"terme":"Bon sens","definition":"Approche consistant à évaluer les preuves en se fiant à son instinct et à des arguments verbaux. Les scientifiques s'en méfient car nos intuitions sont faites pour les inférences quotidiennes, pas pour les problèmes scientifiques."},{"terme":"Induction","definition":"Raisonnement qui va au-delà de l'évidence immédiate des sens pour faire des généralisations sur le monde. Elle exige des suppositions sages et est vulnérable à nos biais préexistants."}],"quiz":[{"question":"Selon le manuel, quelle est la meilleure réponse à la question « pourquoi les scientifiques font-ils des statistiques ? »","options":["Parce que les revues scientifiques l'exigent","Parce que les mathématiques sont plus prestigieuses que le bon sens","Parce que nous ne nous faisons pas assez confiance : les statistiques sont une sauvegarde contre nos biais","Parce que les ordinateurs rendent les calculs faciles"],"bonne":2,"explication":"L'auteur explique que les humains sont sensibles aux préjugés et aux fragilités, et qu'une grande partie des statistiques est essentiellement une sauvegarde : elles nous aident à « rester honnêtes » face à la tentation de croire ce que nous voulons croire."},{"question":"Dans l'étude d'Evans, Barston et Pollard (1983), quel pourcentage de personnes a jugé « valide » un argument invalide dont la conclusion était crédible ?","options":["92 %","44 %","8 %","60 %"],"bonne":0,"explication":"C'est le résultat le plus frappant de l'étude : quand un argument faible correspond aux préjugés préexistants, presque personne ne voit qu'il est faible, et 92 % des gens le déclarent à tort valide."},{"question":"Un argument est déductivement valide si...","options":["ses prémisses sont vraies dans le monde réel","sa conclusion est crédible et conforme aux connaissances actuelles","il est accepté par la majorité des gens","sa conclusion est une conséquence logique de ses prémisses, que celles-ci soient vraies ou non"],"bonne":3,"explication":"La validité est une propriété de la structure logique : si les prémisses sont vraies, la conclusion doit l'être. Un argument valide n'a pas besoin d'impliquer de vraies déclarations, c'est justement ce que le biais de croyance nous fait oublier."},{"question":"Dans les données de Berkeley en 1973, comment le taux global d'admission pouvait-il être plus faible pour les femmes alors que la plupart des départements les admettaient à un taux légèrement plus élevé ?","options":["Les données globales avaient été falsifiées par l'université","Les femmes candidataient davantage dans des départements « durs » à faible taux d'admission, les hommes dans des départements « faciles »","L'échantillon de femmes était trop petit pour être fiable","Les départements admettaient les femmes seulement en fin d'année"],"bonne":1,"explication":"C'est l'explication du paradoxe de Simpson : les taux par département étaient légèrement favorables aux femmes, mais la répartition des candidatures différait, les femmes postulant surtout dans les départements les plus sélectifs, ce qui abaissait leur taux global."},{"question":"Quelle leçon générale l'auteur tire-t-il du paradoxe de Simpson ?","options":["Il faut toujours analyser les données désagrégées et ignorer les totaux","Les statistiques permettent de trancher toutes les questions de recherche","La recherche est pleine de pièges subtils et les statistiques ne résolvent qu'une partie du problème","Les universités ne devraient pas publier leurs statistiques d'admission"],"bonne":2,"explication":"Le paradoxe illustre les pièges contre-intuitifs qui attendent les imprudents, mais aussi que le choix entre données agrégées et désagrégées dépend de la question de recherche : les statistiques sont un outil, elles ne remplacent pas la réflexion."},{"question":"Pourquoi l'auteur affirme-t-il que la psychologie est une « science statistique » ?","options":["Parce que les objets étudiés sont des personnes réelles, compliquées et variables, contrairement aux objets simples de la physique","Parce que les psychologues ont inventé la plupart des tests statistiques","Parce que la psychologie utilise plus d'ordinateurs que les autres sciences","Parce que les expériences en psychologie sont mal conçues"],"bonne":0,"explication":"Les « choses » de la psychologie sont des gens qui ont des opinions, diffèrent de façon arbitraire et peuvent s'ennuyer ou saboter les données, contrairement aux électrons. Ce désordre rend les statistiques indispensables : la psychologie a choisi un problème plus difficile à résoudre."},{"question":"Parmi les raisons suivantes, laquelle N'EST PAS citée par le manuel pour justifier qu'un chercheur en psychologie sache faire des statistiques de base ?","options":["Les statistiques sont étroitement liées à la conception de la recherche","Comprendre la littérature psychologique exige de comprendre les analyses statistiques","L'analyse statistique coûte cher à déléguer car les statisticiens sont rares","Les statistiques garantissent que les résultats publiés sont toujours vrais"],"bonne":3,"explication":"Les trois premières raisons sont exactement celles données par l'auteur. En revanche, le manuel n'affirme jamais que les statistiques garantissent la vérité des résultats ; au contraire, il insiste sur le fait qu'elles ne sont qu'un outil."},{"question":"Dans l'analyse informelle des 20 articles d'actualité faite par l'auteur, quelle était l'erreur statistique la plus courante ?","options":["Confondre corrélation et causalité","Ne pas rapporter les données de base permettant de comparer (par exemple, ne pas dire si une caractéristique est commune à tous)","Utiliser des graphiques trompeurs avec des axes tronqués","Inventer complètement les chiffres cités"],"bonne":1,"explication":"Sur 8 articles à sujet statistique, 6 comportaient une erreur, et la plus courante était l'absence des données de base : annoncer que 5 % des personnes dans la situation X ont la caractéristique Y sans préciser la fréquence de Y dans la population générale."}],"exercice":{"titre":"Reproduire le paradoxe de Simpson avec les données de Berkeley","enonce":"À partir du tableau du manuel pour les six plus grands départements de Berkeley (A : 825 hommes / 62 % admis, 108 femmes / 82 % ; B : 560 / 63 %, 25 / 68 % ; C : 325 / 37 %, 593 / 34 % ; D : 417 / 33 %, 375 / 35 % ; E : 191 / 28 %, 393 / 24 % ; F : 272 / 6 %, 341 / 7 %), construisez une feuille de données dans Jamovi avec les colonnes Departement, Sexe, NbCandidats et NbAdmis (une ligne par combinaison département × sexe, en calculant NbAdmis = NbCandidats × taux). Puis : (1) calculez le taux d'admission global par sexe pour ces six départements ; (2) comparez-le aux taux par département ; (3) expliquez le renversement observé.","correction":"Étape 1 : dans Jamovi, ouvrez l'onglet Données et saisissez 12 lignes (6 départements × 2 sexes) avec NbAdmis arrondi : A hommes 512, A femmes 89 ; B hommes 353, B femmes 17 ; C hommes 120, C femmes 202 ; D hommes 138, D femmes 131 ; E hommes 53, E femmes 94 ; F hommes 16, F femmes 24. Étape 2 : créez une variable calculée Taux = NbAdmis / NbCandidats (bouton Données > Calculer). Étape 3 : pour le taux global, additionnez par sexe : hommes = (512+353+120+138+53+16) / (825+560+325+417+191+272) = 1192/2590 ≈ 46 % ; femmes = (89+17+202+131+94+24) / (108+25+593+375+393+341) = 557/1835 ≈ 30 %. Le taux global est nettement plus favorable aux hommes. Étape 4 : en examinant les taux département par département (Exploration > Descriptives avec Departement et Sexe en variables de regroupement), on voit que dans 4 départements sur 6 (A, B, D, F) les femmes ont un taux égal ou supérieur à celui des hommes. Étape 5 : l'explication est que les hommes ont surtout candidaté dans les départements généreux A et B (1385 candidats masculins contre 133 féminins), alors que les femmes ont surtout candidaté dans les départements sélectifs C, E et F. C'est exactement le paradoxe de Simpson : l'agrégation mélange des sous-groupes de tailles très différentes, et la conclusion tirée du total s'inverse au niveau des sous-groupes."}},{"numero":2,"titre":"Brève introduction à la conception de la recherche","sections":[{"titre":"La mesure psychologique et l'opérationnalisation","points":["Collecter des données, c'est mesurer : attribuer des nombres, des étiquettes ou des descriptions à ce qu'on observe.","Même mesurer l'âge exige des choix : point de départ, unités utilisées et source de l'information.","L'opérationnalisation transforme un concept vague en une mesure précise avec un ensemble de valeurs admissibles.","On distingue quatre notions : le construit théorique, la mesure, l'opérationnalisation et la variable.","La variable correspond aux données réellement obtenues une fois la mesure appliquée."]},{"titre":"Les échelles de mesure : nominale, ordinale, intervalle, rapport","points":["Échelle nominale : catégories sans aucun ordre, comme la couleur des yeux ; calculer une moyenne n'a aucun sens.","Échelle ordinale : les valeurs s'ordonnent naturellement, comme un classement, mais les écarts entre elles restent inconnus.","Échelle d'intervalle : les écarts sont comparables mais le zéro est arbitraire, comme les degrés Celsius.","Sur une échelle d'intervalle, seules l'addition et la soustraction ont un sens, pas la multiplication.","Échelle de rapport : le zéro est réel, comme un temps de réponse, et les rapports deviennent significatifs."]},{"titre":"Variables continues ou discrètes, et le cas de l'échelle de Likert","points":["Une variable continue admet toujours une valeur possible entre deux valeurs quelconques, comme le temps.","Une variable discrète n'admet rien entre deux valeurs voisines, comme la première et la deuxième place.","Les variables nominales et ordinales sont toujours discrètes ; celles d'intervalle ou de rapport peuvent être les deux.","Attention à la confusion fréquente : une variable discrète n'est pas forcément une variable nominale.","L'échelle de Likert est formellement ordinale, mais elle est souvent traitée en pratique comme quasi-intervalle."]},{"titre":"Évaluer la fiabilité d'une mesure","points":["La fiabilité d'une mesure désigne sa répétabilité : mesurer deux fois la même chose donne-t-il la même réponse ?","Elle se distingue de la validité : une balance mal calibrée est fiable mais donne un poids faux.","La fiabilité est donc nécessaire à la validité, mais elle ne suffit pas à la garantir.","Il en existe quatre formes : test-retest, entre évaluateurs, formes parallèles et cohérence interne.","On n'exige la fiabilité que lorsque les mesures répétées portent réellement sur la même chose."]},{"titre":"Le rôle des variables : prédicteurs et résultats","points":["On appelle Y la variable que l'on cherche à expliquer et X les variables qui servent à l'expliquer.","Les noms classiques sont variable indépendante (X) et variable dépendante (Y), mais l'auteur les juge trompeurs.","Le manuel préfère les termes modernes : prédicteurs pour les X et résultats pour les Y.","Les prédicteurs servent de base pour formuler des suppositions sur les résultats observés."]},{"titre":"Recherche expérimentale et non expérimentale","points":["Dans une recherche expérimentale, le chercheur manipule les prédicteurs et maintient constant tout le reste.","L'aléatorisation assigne les participants au hasard, ce qui minimise, sans les éliminer, les différences systématiques entre groupes.","Comparer fumeurs et non-fumeurs n'est pas une expérience : alimentation ou profession peuvent créer des facteurs de confusion.","Une étude quasi-expérimentale ressemble à une expérience, mais le chercheur n'y contrôle pas les prédicteurs.","Les études de cas, fréquentes en neuropsychologie, décrivent en détail un individu mais se généralisent difficilement."]},{"titre":"Les cinq types de validité","points":["La validité interne concerne la justesse des conclusions causales tirées à l'intérieur même de l'étude.","La validité externe concerne la généralisation des résultats à la vie réelle, au-delà des seuls étudiants testés.","La validité de construction demande si l'on mesure vraiment le construit visé : avouer tricher n'est pas tricher.","La validité apparente indique seulement que la mesure semble fonctionner, ce qui rassure surtout les non-spécialistes.","La validité écologique évalue la ressemblance de l'étude avec le monde réel ; c'est un indice, pas une garantie."]},{"titre":"Confusion, artefacts et menaces à la validité","points":["Un facteur de confusion, lié à la fois au prédicteur et au résultat, menace la validité interne.","Un artefact est un résultat propre à la situation testée ; il menace la validité externe.","Les menaces classiques incluent l'histoire, la maturation, les tests répétés, le biais de sélection et l'attrition différentielle.","S'y ajoutent la non-réponse, la régression vers la moyenne, les effets Hawthorne et placebo, et le biais de l'expérimentateur, corrigé par le double aveugle.","Fraude, exploration cachée des données et biais de publication rappellent que la science est menée par des humains."]}],"concepts":["Opérationnalisation d'un construit théorique","Élaboration théorique, mesure, variable","Échelles de mesure : nominale, ordinale, intervalle, rapport","Variables continues vs discrètes","Échelle de Likert et échelle quasi-intervalle","Fiabilité (test-retest, entre évaluateurs, formes parallèles, cohérence interne)","Prédicteurs et résultats (VI et VD)","Aléatorisation et recherche expérimentale","Cinq types de validité (interne, externe, de construction, apparente, écologique)","Facteurs de confusion, artefacts et régression vers la moyenne"],"formules":[],"jamovi":"Données → double-clic sur l'en-tête de colonne (ou Configuration) → type de mesure : Nominal / Ordinal / Continu / ID → type de données : entier, décimal, texte → choix déterminant les analyses proposées","glossaire":[{"terme":"Opérationnalisation","definition":"Processus par lequel on transforme un concept significatif mais vague (comme « l'âge » ou « l'anxiété ») en une mesure précise : définir ce qu'on mesure, la méthode utilisée et l'ensemble des valeurs admissibles."},{"terme":"Échelle nominale","definition":"Échelle de mesure sans relation d'ordre entre les valeurs possibles (couleur des yeux, type de transport) : on peut seulement dire que les catégories sont différentes, et une moyenne n'a aucun sens."},{"terme":"Échelle ordinale","definition":"Échelle dont les valeurs possèdent un ordre naturel et significatif (classement dans une course), mais dont les écarts entre valeurs ne sont pas quantifiables : on peut ordonner, mais pas faire de moyenne."},{"terme":"Échelle d'intervalle","definition":"Échelle où les différences entre les nombres sont interprétables mais où le zéro est arbitraire (température en Celsius) : addition et soustraction sont significatives, multiplication et division ne le sont pas."},{"terme":"Échelle de rapport","definition":"Échelle où zéro signifie vraiment zéro (temps de réponse), ce qui rend toutes les opérations significatives, y compris les rapports : on peut dire qu'une valeur est 1,35 fois plus grande qu'une autre."},{"terme":"Fiabilité","definition":"Répétabilité ou cohérence d'une mesure : si l'on mesure deux fois la même chose, obtient-on la même réponse ? Elle est nécessaire mais non suffisante pour la validité."},{"terme":"Validité interne","definition":"Mesure dans laquelle une étude permet de tirer les conclusions correctes sur les relations causales entre les variables « à l'intérieur » de l'étude. Elle est menacée notamment par les facteurs de confusion."},{"terme":"Validité externe","definition":"Généralisabilité ou applicabilité des conclusions au-delà de l'étude : dans quelle mesure retrouverait-on le même schéma de résultats dans la « vie réelle » et avec d'autres populations."},{"terme":"Facteur de confusion","definition":"Variable supplémentaire, souvent non mesurée, liée à la fois aux prédicteurs et au résultat : on ne peut alors plus dire si c'est le prédicteur ou le facteur de confusion qui cause le résultat."},{"terme":"Régression vers la moyenne","definition":"Phénomène par lequel des observations sélectionnées pour leur valeur extrême tendent, purement par hasard, à être moins extrêmes lors d'une mesure ultérieure, la variable ayant une variation naturelle."}],"quiz":[{"question":"Dans la terminologie du manuel, qu'est-ce qu'une « variable » ?","options":["Le construit théorique, vague et non observable, que l'on cherche à étudier","Ce que l'on obtient quand on applique une mesure à quelque chose dans le monde : les données réelles de nos ensembles de données","La connexion logique entre une mesure et un construit théorique","L'outil ou la question d'enquête utilisés pour faire les observations"],"bonne":1,"explication":"Le manuel distingue quatre notions : l'élaboration théorique (le construit), la mesure (la méthode ou l'outil), l'opérationnalisation (la connexion logique entre les deux) et la variable, qui correspond aux données réellement obtenues."},{"question":"Pourquoi est-il absurde de dire que 20 °C est « deux fois plus chaud » que 10 °C ?","options":["Parce que la température est une variable discrète","Parce que la température en Celsius est une variable ordinale","Parce que les thermomètres ne sont pas assez fiables","Parce que le zéro de l'échelle Celsius est arbitraire : c'est une échelle d'intervalle, la multiplication n'y a pas de sens"],"bonne":3,"explication":"Le 0 °C correspond au point de congélation de l'eau, un choix arbitraire et non une absence de température. Sur une échelle d'intervalle, seules l'addition et la soustraction sont significatives ; multiplier et diviser exige un vrai zéro, propre aux échelles de rapport."},{"question":"Le classement dans une course (1er, 2e, 3e...) est une variable...","options":["ordinale et discrète","ordinale et continue","d'intervalle et discrète","nominale et discrète"],"bonne":0,"explication":"On peut ordonner les coureurs (1er > 2e > 3e), mais on ne sait pas de combien le premier devance le second : l'échelle est donc ordinale. Et rien ne peut logiquement se situer entre la 1ère et la 2e place, ce qui rend la variable discrète ; les variables ordinales sont d'ailleurs toujours discrètes."},{"question":"Je pèse un sac de pommes de terre sur une balance mal calibrée : elle affiche toujours exactement le même poids, mais ce poids est faux. Cette mesure est...","options":["ni fiable ni valable","peu fiable mais valable","fiable mais non valable","fiable et valable"],"bonne":2,"explication":"La fiabilité est la répétabilité : la balance donne toujours la même réponse, elle est donc très fiable. Mais cette réponse ne correspond pas au poids réel : la mesure n'est pas valide. C'est l'exemple du manuel montrant que la fiabilité est nécessaire mais pas suffisante pour la validité."},{"question":"Si deux psychologues évaluent indépendamment l'anxiété des mêmes participants et qu'on vérifie s'ils obtiennent des scores semblables, quelle forme de fiabilité examine-t-on ?","options":["La fiabilité test-retest","La fiabilité de cohérence interne","La fiabilité des formes parallèles","La fiabilité entre évaluateurs"],"bonne":3,"explication":"La fiabilité entre évaluateurs concerne l'uniformité entre les personnes qui effectuent la mesure : si quelqu'un d'autre répète la mesure, produit-il la même réponse ? Le test-retest concerne le temps, les formes parallèles les instruments équivalents, et la cohérence interne les items d'un même questionnaire."},{"question":"Quelle est la principale caractéristique qui fait d'une étude une véritable expérience, selon le manuel ?","options":["L'utilisation d'un laboratoire et d'instruments de mesure précis","Le contrôle par le chercheur, qui manipule les prédicteurs et utilise l'aléatorisation pour minimiser les différences systématiques entre groupes","Un grand nombre de participants recrutés dans la population générale","L'analyse des résultats avec des tests statistiques appropriés"],"bonne":1,"explication":"Ce qui définit la recherche expérimentale, c'est le degré de contrôle : le chercheur manipule les prédicteurs (VI) et laisse le résultat (VD) varier naturellement, l'aléatorisation servant à minimiser (sans éliminer) la possibilité de différences systématiques entre les groupes. Comparer fumeurs et non-fumeurs existants n'est qu'un plan quasi-expérimental."},{"question":"Vous sélectionnez les 20 élèves ayant eu les meilleures notes au secondaire et constatez qu'ils réussissent bien à l'université, mais sans être en tête de classe. Quelle est l'explication la plus probable selon le manuel ?","options":["La régression vers la moyenne : sélectionnés pour des valeurs extrêmes (talent, travail et chance), ils redeviennent moins extrêmes car la chance ne se transfère pas","Un effet de maturation : les élèves deviennent moins intelligents en vieillissant","Un biais de l'expérimentateur qui influence les notes universitaires","Un effet placebo lié à leur réputation de bons élèves"],"bonne":0,"explication":"Obtenir la meilleure note exige intelligence, travail et un peu de chance. Intelligence et travail se transfèrent à l'université, mais pas la chance : on doit donc s'attendre à ce que des personnes sélectionnées pour des valeurs extrêmes soient un peu moins extrêmes à la mesure suivante, purement par hasard."},{"question":"L'histoire de Clever Hans, le cheval qui semblait savoir compter, illustre quelle menace à la validité, et quelle en est la solution générale ?","options":["L'effet placebo, corrigé par un groupe témoin non traité","Le biais de non-réponse, corrigé par des relances des participants","Le biais de l'expérimentateur, corrigé par les études en double aveugle","L'attrition différentielle, corrigée par un échantillon plus grand"],"bonne":2,"explication":"Hans ne savait pas faire de maths : il réagissait aux signaux involontaires des humains qui connaissaient la réponse. C'est le biais de l'expérimentateur, qui communique subtilement la « bonne réponse ». La solution générale est le double aveugle, où ni l'expérimentateur ni le participant ne connaissent la condition, même si le manuel souligne qu'il est difficile à réaliser parfaitement."}],"exercice":{"titre":"Classer des variables et configurer leurs échelles de mesure dans Jamovi","enonce":"Une chercheuse étudie le stress des étudiants et recueille pour chaque participant : (a) le numéro d'identification du participant ; (b) le sexe déclaré (femme / homme / autre) ; (c) le moyen de transport pour venir au campus (train, bus, voiture, vélo) ; (d) le rang de l'étudiant au dernier examen (1er, 2e, 3e...) ; (e) une réponse de type Likert à 5 points (« Je me sens stressé avant les examens » : de 1 = fortement en désaccord à 5 = tout à fait d'accord) ; (f) l'année d'entrée à l'université (2021, 2022...) ; (g) le temps de réponse en secondes à une tâche d'attention. Pour chaque variable : identifiez l'échelle de mesure (nominale, ordinale, intervalle, rapport), dites si elle est continue ou discrète, puis créez un petit jeu de données dans Jamovi (5 à 10 lignes fictives) et attribuez à chaque colonne le type de mesure approprié.","correction":"Étape 1 – Classification : (a) l'ID n'est qu'une étiquette, sans ordre ni quantité : type ID dans Jamovi ; (b) le sexe est nominal et discret : aucune catégorie n'est « plus grande » qu'une autre ; (c) le moyen de transport est nominal et discret, comme l'exemple du manuel ; (d) le rang à l'examen est ordinal et discret : on peut ordonner (1er > 2e), mais l'écart entre 1er et 2e n'est pas connu et rien n'existe entre deux rangs ; (e) l'item de Likert est formellement ordinal et discret (options ordonnées, pas de zéro naturel, pas de réponse 2,5), mais il est souvent traité en pratique comme quasi-intervalle ; (f) l'année d'entrée est une variable d'intervalle discrète : la différence 2008 − 2003 = 5 ans a du sens, mais diviser 2008 par 2003 n'en a aucun, et il n'y a pas d'année entre 2002 et 2003 ; (g) le temps de réponse est une variable de rapport continue : zéro seconde signifie vraiment « aucun temps », les rapports ont du sens (3,1/2,3 = 1,35 fois plus de temps) et une valeur intermédiaire est toujours possible. Étape 2 – Dans Jamovi : ouvrez l'onglet Données, saisissez quelques lignes fictives, puis double-cliquez sur chaque en-tête de colonne pour définir : ID → type de mesure « ID » ; Sexe et Transport → « Nominal » (type de données texte) ; Rang et Likert → « Ordinal » (type entier) ; AnneeEntree → « Continu » (entier ; Jamovi ne distingue pas intervalle et rapport, les deux sont « Continu ») ; TempsReponse → « Continu » (décimal). Étape 3 – Vérification : lancez Analyses > Exploration > Descriptives sur toutes les variables ; observez que Jamovi propose la moyenne pour les variables continues, mais qu'une « moyenne » du transport n'aurait aucun sens, ce qui confirme l'importance de bien déclarer les échelles avant toute analyse."}},{"numero":3,"titre":"Démarrer avec Jamovi","sections":[{"titre":"Pourquoi utiliser Jamovi et comment l'installer","points":["Faire ses statistiques sur ordinateur est plus rapide, plus facile et plus puissant qu'à la main.","Les tableurs comme Excel restent très limités dès qu'il s'agit d'analyses statistiques sérieuses.","Jamovi est un logiciel libre et gratuit : aucune licence coûteuse n'est nécessaire.","Il est fondé sur le langage R, devenu un standard de l'analyse de données.","On le télécharge sur https://www.jamovi.org pour Windows, Mac ou Linux, avec des mises à jour régulières."]},{"titre":"L'interface de Jamovi","points":["La fenêtre affiche la feuille de calcul à gauche et le panneau des résultats à droite.","Une barre centrale peut être déplacée pour redimensionner les deux zones à volonté.","Le ruban « Analyses » permet de choisir une analyse puis d'y assigner les variables.","Les résultats se mettent à jour en temps réel dès que l'on modifie les options.","La flèche ferme le panneau d'options, cliquer sur les résultats le rouvre, et le clic droit (Remove) supprime une analyse."]},{"titre":"La feuille de calcul et les types de variables","points":["Dans la feuille de calcul, chaque colonne représente une variable et chaque ligne un cas ou un participant.","Les niveaux de mesure disponibles sont nominal, ordinal et continu, plus le type ID pour les identifiants.","Les types de données possibles sont le texte, les nombres entiers (Integer) et les nombres décimaux.","Jamovi devine automatiquement le type d'une variable lors de la saisie ou de l'importation.","L'éditeur de variables, ouvert par double-clic ou Setup, règle le nom, le type, les niveaux et les étiquettes."]},{"titre":"Les variables calculées et les fonctions V","points":["Une variable calculée résulte d'un calcul sur d'autres variables : logarithme, score z, somme ou moyenne.","On l'ajoute avec le bouton « Add » de l'onglet Données de Jamovi.","Les formules s'écrivent simplement, par exemple A + B ou LOG10(len).","Un score z se calcule avec la formule (dose − VMEAN(dose)) / VSTDEV(dose).","Les fonctions à préfixe V, comme VMEAN, portent sur la variable entière ; les autres calculent ligne par ligne."]},{"titre":"Importer des données (csv, SPSS, Excel et autres)","points":["Deux formats sont essentiels : le fichier .omv, qui garde données, variables et analyses, et le csv, simple texte.","Pour ouvrir un fichier, on passe par le menu à trois barres puis la commande « Open ».","À l'importation, il faut vérifier l'entête, le séparateur, la décimale, les guillemets et les valeurs manquantes, NA par défaut.","Jamovi importe aussi directement les fichiers SPSS (.sav), SAS, Stata et JASP.","Pour un fichier Excel, il faut d'abord exporter les données au format csv."]},{"titre":"Changer le niveau de mesure et installer des modules","points":["Après une importation, certaines variables arrivent au mauvais format : nombres lus comme nominaux, dates en texte, identifiants continus.","Pour corriger, on « contraint » la variable en cochant le niveau souhaité dans l'éditeur : continu, ordinal ou nominal.","Des modules communautaires s'installent via le bouton « + » en haut à droite, dans la bibliothèque Jamovi.","Une fois installés, les modules comme scatr ou Rj apparaissent dans la barre « Analyses »."]},{"titre":"Mode syntaxe R, copier-coller et sauvegarde","points":["Les tableaux au format APA et les graphiques se copient facilement par un simple clic droit.","Le mode « R Syntax », dans le menu à trois points, affiche le code R équivalent, copiable vers R.","La commande Export puis Data enregistre l'ensemble de données modifié dans un fichier séparé.","« Save as » crée un fichier .omv qui conserve à la fois les données et les analyses."]}],"concepts":["Logiciel libre et gratuit basé sur R","Feuille de calcul : colonnes = variables, lignes = cas","Niveaux de mesure : nominal, ordinal, continu, ID","Types de données : texte, entier, décimal","Éditeur de variables (Setup)","Variables calculées et fonctions V","Importation de fichiers csv, SPSS, SAS, Stata, Excel","Contraindre une variable d'un niveau à un autre","Modules complémentaires de la bibliothèque Jamovi","Sauvegarde au format .omv et mode syntaxe R"],"formules":[{"nom":"Score z comme variable calculée","formule":"(dose − VMEAN(dose)) / VSTDEV(dose)","explication":"Exemple de formule de variable calculée dans Jamovi : on soustrait la moyenne de la variable puis on divise par son écart-type pour obtenir le score standardisé de chaque observation."}],"jamovi":"Télécharger sur https://www.jamovi.org → installer → saisir des valeurs ou menu trois barres → Open → Browse → double-clic sur l'en-tête (ou Setup) : nom, niveau de mesure, type de données → Données → Add : variable calculée (ex. LOG10(len)) → « + » → Jamovi library : installer un module (ex. scatr) → Save as : fichier .omv","glossaire":[{"terme":"Jamovi","definition":"Logiciel statistique libre et gratuit, construit comme une interface sophistiquée pour le langage de programmation statistique R."},{"terme":"Variable nominale","definition":"Variable catégorielle dont les valeurs sont des étiquettes sans ordre, comme Sexe avec les valeurs Homme et Femme ; les codes numériques éventuels y sont arbitraires."},{"terme":"Variable ordinale","definition":"Variable catégorielle dont les valeurs ont un ordre spécifique, comme une échelle de Likert allant de « tout à fait en désaccord » à « tout à fait d'accord »."},{"terme":"Variable continue","definition":"Variable existant sur une échelle continue, dite aussi d'intervalle ou de rapport, comme la taille ou le poids."},{"terme":"Variable ID","definition":"Type propre à Jamovi destiné aux identifiants (nom, numéro de participant) que l'on n'analyse presque jamais ; il peut améliorer les performances sur de grands jeux de données."},{"terme":"Variable calculée","definition":"Variable dont la valeur résulte d'un calcul sur d'autres variables, par exemple une transformation logarithmique, un score z ou une moyenne."},{"terme":"Fichier csv","definition":"Fichier texte simple où les valeurs sont séparées par des virgules (comma separated values) ; format très courant pour stocker des tableaux de données."},{"terme":"Fichier .omv","definition":"Format de fichier standard de Jamovi, qui stocke à la fois les données, les variables et les analyses effectuées."},{"terme":"Contraindre une variable","definition":"Convertir une variable d'un niveau de mesure à un autre (continu, ordinal ou nominal), par exemple lorsqu'une importation a mal deviné le type."},{"terme":"Module complémentaire","definition":"Extension développée par la communauté Jamovi, installable depuis la bibliothèque Jamovi (bouton « + »), qui ajoute des analyses au programme de base."}],"quiz":[{"question":"Dans la feuille de calcul de Jamovi, que représente chaque colonne ?","options":["Un participant ou un cas","Une analyse statistique","Une variable","Un niveau de mesure"],"bonne":2,"explication":"Dans Jamovi, chaque colonne représente une variable et chaque ligne un cas ou un participant."},{"question":"Quel type de variable est propre à Jamovi et destiné aux identifiants que l'on n'analyse presque jamais ?","options":["ID","Nominal","Ordinal","Continu"],"bonne":0,"explication":"Le type ID est unique à Jamovi : il sert aux identificateurs (noms, numéros de participants) et peut améliorer les performances avec de très grands jeux de données."},{"question":"Une colonne contenant les réponses à une échelle de Likert (de -3 « tout à fait en désaccord » à 3 « tout à fait d'accord ») correspond à quel niveau de mesure ?","options":["Nominal","Continu","ID","Ordinal"],"bonne":3,"explication":"Les valeurs d'une échelle de Likert ont un ordre spécifique mais ne sont pas sur une véritable échelle continue : c'est l'exemple type d'une variable ordinale donné par le manuel."},{"question":"Quelle est la différence entre les fonctions MEAN(A, B) et VMEAN(A) dans une variable calculée ?","options":["MEAN arrondit le résultat alors que VMEAN garde les décimales","MEAN calcule ligne par ligne alors que VMEAN calcule sur l'ensemble de la variable","MEAN fonctionne sur du texte alors que VMEAN fonctionne sur des nombres","Il n'y a aucune différence, ce sont des synonymes"],"bonne":1,"explication":"Les fonctions préfixées d'un V effectuent leur calcul sur l'ensemble d'une variable (VMEAN(A) donne la moyenne de toutes les valeurs de A), tandis que les fonctions non V calculent ligne par ligne (MEAN(A, B) donne la moyenne de A et B pour chaque rangée)."},{"question":"Vous recevez un fichier Excel (.xls) à analyser. D'après le manuel, quelle est la bonne façon de procéder ?","options":["L'ouvrir d'abord dans un tableur puis l'exporter en csv avant de l'importer dans Jamovi","Le glisser-déposer directement dans le panneau des résultats","Le renommer en .omv pour que Jamovi le reconnaisse","Impossible : Jamovi ne peut traiter aucune donnée venant d'Excel"],"bonne":0,"explication":"Le manuel indique que pour manipuler des fichiers Excel il faut d'abord les ouvrir dans Excel ou un autre tableur, puis exporter les données en csv avant de les importer dans Jamovi."},{"question":"Lors de l'importation d'un fichier texte, quelle valeur Jamovi suppose-t-il par défaut pour indiquer une donnée manquante ?","options":["0","-9999","NA","Une cellule contenant le mot « manquant »"],"bonne":2,"explication":"Par défaut, Jamovi suppose que la valeur manquante est NA, pour les données numériques comme textuelles ; les valeurs manquantes deviennent des cellules vides après importation."},{"question":"Après une importation, une variable numérique a été lue comme nominale. Que faire dans Jamovi ?","options":["Supprimer la colonne et tout ressaisir à la main","La contraindre au niveau continu en cochant ce niveau dans l'éditeur de variables","Réinstaller Jamovi car il s'agit d'un bogue","Créer une variable calculée avec la fonction LOG10"],"bonne":1,"explication":"Le manuel explique qu'on peut « contraindre » une variable d'un niveau de mesure à un autre en cliquant simplement sur la case correspondant au niveau souhaité (continu, ordinal ou nominal)."},{"question":"Quel avantage offre la sauvegarde avec « Save as » dans un fichier .omv plutôt que le seul export des données ?","options":["Le fichier .omv est lisible par Excel sans conversion","Le fichier .omv est automatiquement envoyé sur le site de Jamovi","Le fichier .omv compresse les données pour gagner de l'espace disque","Le fichier .omv sauvegarde à la fois les données modifiées et les analyses effectuées"],"bonne":3,"explication":"Le format .omv est le format standard de Jamovi : il stocke les données, les variables et les analyses, alors que « Export » / « Data » n'enregistre que l'ensemble de données."}],"exercice":{"titre":"Importer un fichier csv et créer une variable standardisée","enonce":"Créez avec un éditeur de texte un fichier notes.csv contenant une ligne d'entête « nom,note » puis cinq lignes : Alice,12 ; Bruno,15 ; Chloé,9 ; David,18 ; Emma,11 (chaque paire sur sa propre ligne, séparée par une virgule). Importez ce fichier dans Jamovi, vérifiez que « nom » est bien traité comme ID ou nominal et « note » comme variable continue, puis créez une variable calculée « note_z » contenant le score z de la note. Enfin, sauvegardez le tout dans un fichier Jamovi.","correction":"1) Créez le fichier texte notes.csv avec la ligne d'entête « nom,note » suivie des cinq lignes de données. 2) Dans Jamovi, cliquez sur le menu à trois barres horizontales en haut à gauche, choisissez « Open » puis « Browse » et sélectionnez notes.csv : Jamovi lit la première ligne comme les noms de variables. 3) Double-cliquez sur l'en-tête de la colonne « nom » (ou utilisez « Setup » dans l'onglet Data) et vérifiez son niveau : ID (ou nominal) convient puisqu'il s'agit d'identifiants ; vérifiez que « note » est bien continue (type Integer ou Decimal), sinon contraignez-la en cochant « Continuous ». 4) Dans l'onglet Data, cliquez sur « Add » pour ajouter une variable calculée nommée note_z et saisissez la formule (note - VMEAN(note)) / VSTDEV(note), sur le modèle du z-score de « dose » montré dans le manuel ; chaque ligne affiche alors l'écart de la note à la moyenne exprimé en écarts-types. 5) Sauvegardez avec le menu principal, « Save as », en donnant un nom de fichier : vous obtenez un fichier .omv contenant les données et la variable calculée."}},{"numero":4,"titre":"Statistiques descriptives","sections":[{"titre":"Pourquoi des statistiques descriptives ?","points":["La première tâche de l'analyste est de résumer les données de façon synthétique et claire.","Les statistiques descriptives se distinguent des statistiques inférentielles, qui tirent des conclusions au-delà des données.","L'exemple du chapitre est afl.margins : les marges gagnantes des 176 matchs de l'AFL en 2010.","Les données brutes étant illisibles, on les résume par des statistiques sommaires et des graphiques comme l'histogramme."]},{"titre":"Mesures de la tendance centrale : moyenne, médiane, mode","points":["La tendance centrale cherche le « milieu » des données grâce à trois mesures : moyenne, médiane et mode.","La moyenne s'obtient en additionnant toutes les valeurs puis en divisant par l'effectif : 183/5 = 36,60.","La médiane est la valeur centrale après tri (32) ; avec un effectif pair, on moyenne les deux valeurs centrales (31,5).","Le mode est la valeur la plus fréquente : l'équipe « Geelong » (39 finales) ou une marge de 3 points."]},{"titre":"Moyenne ou médiane ? Le choix de la bonne mesure","points":["La moyenne correspond au centre de gravité des données, la médiane à leur valeur centrale.","Pour une variable nominale on utilise le mode, pour une ordinale la médiane, pour intervalle ou rapport les deux.","La moyenne utilise toute l'information disponible, mais elle est très sensible aux valeurs extrêmes.","Exemple de Bill : un revenu de 100 000 000 $ fait bondir la moyenne à 25 043 750 $, la médiane restant à 62 500 $.","La Commonwealth Bank a comparé revenus moyens et prix immobiliers médians, ce qui faussait la conclusion."]},{"titre":"Mesures de la variabilité : étendue, IQR, écart absolu moyen","points":["Les mesures de variabilité décrivent l'étalement des données autour de leur tendance centrale.","L'étendue est la différence entre maximum et minimum (116 − 0 = 116), mais elle est très vulnérable aux valeurs aberrantes.","L'écart interquartile (IQR) va du 25e au 75e percentile (50,50 − 12,75 = 37,75) : il couvre la moitié centrale et reste robuste.","L'écart absolu moyen (15,52) est la moyenne des distances à la moyenne : interprétable, mais peu utilisé."]},{"titre":"Variance et écart-type","points":["La variance est la moyenne des écarts au carré : additive, mais exprimée en unités au carré, donc peu interprétable.","Jamovi divise par N − 1 plutôt que par N (405,80 au lieu de 324,64) pour estimer la variance de la population.","L'écart-type, racine carrée de la variance, retrouve les unités d'origine des données (26,07 points).","Règle empirique pour une distribution en cloche : 68 % des données à un écart-type, 95 % à deux, 99,7 % à trois."]},{"titre":"Asymétrie et aplatissement","points":["L'asymétrie est négative quand la queue s'étire à gauche, nulle en cas de symétrie, positive quand elle s'étire à droite.","Pour l'AFL, l'asymétrie vaut 0,780, soit 4,262 fois son erreur standard : les données sont donc assez asymétriques.","Le kurtosis est négatif pour une courbe trop plate (platykurtique), nul pour la normale (mésokurtique), positif pour une courbe pointue (leptokurtique).","Pour l'AFL, un kurtosis de 0,101 avec une erreur standard de 0,364 indique une courbe juste assez pointue."]},{"titre":"Statistiques par groupe et scores standards (z)","points":["L'option « Split by » calcule les descriptives séparément par groupe, par exemple selon therapy dans clinicaltrial.csv.","Le score z indique de combien d'écarts-types une observation se situe au-dessus de la moyenne.","Exemple : (35 − 17)/5 = 3,6, un score plus élevé que celui d'environ 99,98 % des gens.","Les scores z permettent de comparer des échelles différentes, comme une grinchiosité de 3,6 et une extraversion de −2,75."]}],"concepts":["Statistiques descriptives vs inférentielles","Moyenne, médiane, mode","Sensibilité de la moyenne aux valeurs extrêmes","Étendue et écart interquartile (IQR)","Percentiles et quartiles","Écart absolu moyen (AAD)","Variance et division par N − 1","Écart-type et règle 68-95-99,7","Asymétrie (skewness) et aplatissement (kurtosis)","Scores standards (scores z)"],"formules":[{"nom":"Moyenne","formule":"x̄ = (1/N) Σᵢ xᵢ","explication":"On additionne toutes les observations puis on divise par leur nombre N ; x̄ est la notation traditionnelle de la moyenne d'échantillon."},{"nom":"Écart absolu moyen (AAD)","formule":"AAD(X) = (1/N) Σᵢ |xᵢ − x̄|","explication":"Moyenne des écarts absolus entre chaque observation et la moyenne ; elle indique la distance « typique » des données à la moyenne dans les unités d'origine."},{"nom":"Variance","formule":"Var(X) = s² = (1/N) Σᵢ (xᵢ − x̄)²","explication":"Moyenne des écarts au carré par rapport à la moyenne, d'où son autre nom d'« écart quadratique moyen » ; elle s'exprime en unités au carré, ce qui la rend difficile à interpréter."},{"nom":"Variance calculée par Jamovi (estimateur)","formule":"σ̂² = (1/(N−1)) Σᵢ (xᵢ − x̄)²","explication":"Jamovi divise par N − 1 plutôt que par N car on cherche généralement à estimer la variance de la population d'où provient l'échantillon, et non à décrire l'échantillon lui-même."},{"nom":"Écart-type","formule":"s = √[(1/N) Σᵢ (xᵢ − x̄)²]  ;  version Jamovi : σ̂ = √[(1/(N−1)) Σᵢ (xᵢ − x̄)²]","explication":"Racine carrée de la variance, exprimée dans les mêmes unités que les données, ce qui la rend interprétable ; Jamovi calcule la version divisée par N − 1."},{"nom":"Asymétrie (skewness)","formule":"skewness(X) = (1/(N σ̂³)) Σᵢ (xᵢ − x̄)³","explication":"Elle est fondée sur les écarts au cube : négative si la queue inférieure est plus longue, nulle pour une distribution symétrique, positive si la queue s'étend vers la droite."},{"nom":"Aplatissement (kurtosis)","formule":"kurtosis(X) = (1/(N σ̂⁴)) Σᵢ (xᵢ − x̄)⁴ − 3","explication":"Fondé sur les écarts à la puissance quatre ; le « −3 » sert à donner un kurtosis nul à la courbe normale, si bien qu'une valeur négative signale une courbe trop plate et une valeur positive une courbe trop pointue."},{"nom":"Score standard (score z)","formule":"zᵢ = (xᵢ − x̄) / σ̂","explication":"Nombre d'écarts-types séparant une observation de la moyenne ; il permet d'interpréter un score brut par rapport à une population et de comparer des variables mesurées sur des échelles différentes."}],"jamovi":"Ouvrir aflsmall_margins.csv → Exploration → Descriptives → afl.margins dans « Variables » → Statistics : cocher Mode, Quartiles, Std. deviation, Variance, Range, Skewness, Kurtosis → variable nominale (afl.finalists) : cocher Frequency tables → par groupe : glisser therapy (clinicaltrial.csv) dans « Split by »","glossaire":[{"terme":"Statistiques descriptives","definition":"Ensemble de mesures servant à résumer un jeu de données de manière synthétique et facile à comprendre, par opposition aux statistiques inférentielles."},{"terme":"Moyenne","definition":"Somme de toutes les valeurs divisée par le nombre total d'observations ; c'est le « centre de gravité » des données, mais elle est très sensible aux valeurs extrêmes."},{"terme":"Médiane","definition":"Valeur centrale d'un ensemble d'observations triées par ordre croissant ; si l'effectif est pair, c'est la moyenne des deux valeurs du milieu."},{"terme":"Mode","definition":"Valeur qui s'observe le plus fréquemment dans un échantillon ; c'est la mesure de tendance centrale appropriée pour les données nominales."},{"terme":"Étendue","definition":"Différence entre la plus grande et la plus petite valeur d'une variable ; mesure de variabilité très simple mais très vulnérable aux valeurs aberrantes."},{"terme":"Percentile","definition":"Le pe percentile est le plus petit nombre x tel que p % des données lui sont inférieures ; la médiane est ainsi le 50e percentile."},{"terme":"Écart interquartile (IQR)","definition":"Différence entre le 75e et le 25e percentile, soit l'intervalle couvert par la « moitié centrale » des données ; mesure de dispersion robuste qui complète bien la médiane."},{"terme":"Variance","definition":"Moyenne des écarts au carré par rapport à la moyenne ; mathématiquement élégante (elle est additive) mais ininterprétable car exprimée en unités au carré."},{"terme":"Écart-type","definition":"Racine carrée de la variance, exprimée dans les mêmes unités que les données ; c'est de loin la mesure de variabilité la plus populaire lorsque la moyenne sert de tendance centrale."},{"terme":"Score standard (score z)","definition":"Nombre d'écarts-types séparant une observation de la moyenne ; il situe un score brut par rapport à sa population et permet de comparer des variables d'échelles différentes."}],"quiz":[{"question":"Les cinq premières marges gagnantes de l'AFL sont 56, 31, 56, 8 et 32. Quelle est leur moyenne ?","options":["32,00","36,60","35,30","38,25"],"bonne":1,"explication":"La moyenne s'obtient en additionnant toutes les valeurs puis en divisant par leur nombre : (56 + 31 + 56 + 8 + 32)/5 = 183/5 = 36,60. La valeur 35,30 est la moyenne des 176 matchs, pas des cinq premiers."},{"question":"Pour les six valeurs triées 8, 14, 31, 32, 56, 56, quelle est la médiane ?","options":["32","31","33,5","31,5"],"bonne":3,"explication":"Avec un nombre pair d'observations, la médiane est la moyenne des deux valeurs centrales : (31 + 32)/2 = 31,5."},{"question":"Vos données sont sur une échelle nominale (par exemple des noms d'équipes). Quelle mesure de tendance centrale devez-vous utiliser ?","options":["Le mode","La moyenne","La médiane","L'écart-type"],"bonne":0,"explication":"Pour des données nominales, moyenne et médiane n'ont pas de sens car les nombres attribués aux valeurs sont arbitraires : il faut utiliser le mode, la valeur la plus fréquente (par exemple « Geelong » pour afl.finalists)."},{"question":"Quatre personnes ont des revenus de 50 000 $, 60 000 $, 65 000 $ et 100 000 000 $. Quelle affirmation est correcte ?","options":["La moyenne et la médiane sont toutes deux proches de 60 000 $","La médiane est plus élevée que la moyenne","La moyenne dépasse 25 millions de dollars alors que la médiane reste à 62 500 $","La médiane dépasse 25 millions de dollars alors que la moyenne reste à 62 500 $"],"bonne":2,"explication":"C'est l'exemple de Bill dans le manuel : la moyenne, très sensible aux valeurs extrêmes, bondit à 25 043 750 $, tandis que la médiane, valeur centrale, n'est que de 62 500 $ et reflète mieux le revenu « typique »."},{"question":"Pour les marges AFL, le 25e percentile vaut 12,75 et le 75e percentile 50,50. Quel est l'écart interquartile (IQR) ?","options":["63,25","50,50","116","37,75"],"bonne":3,"explication":"L'IQR est la différence entre le 75e et le 25e percentile : 50,50 − 12,75 = 37,75. C'est l'intervalle couvert par la moitié centrale des données."},{"question":"Pourquoi Jamovi divise-t-il par N − 1 plutôt que par N lorsqu'il calcule la variance ?","options":["Parce qu'on cherche généralement à estimer le paramètre de la population plutôt qu'à décrire seulement l'échantillon","Parce que c'est un bogue connu de Jamovi qui sera corrigé","Parce que la première observation est toujours ignorée dans les calculs","Parce que diviser par N donnerait un résultat négatif"],"bonne":0,"explication":"Le manuel explique la distinction entre « décrire un échantillon » (diviser par N) et « faire des suppositions sur la population d'où provient l'échantillon » : Jamovi divise par N − 1 car on veut habituellement estimer un paramètre de population. C'est pourquoi il donne 405,80 et non 324,64 pour les cinq premières marges."},{"question":"Selon la règle empirique associée à l'écart-type (pour des données en forme de cloche), quel pourcentage des données se situe à moins de deux écarts-types de la moyenne ?","options":["50 %","68 %","95 %","99,7 %"],"bonne":2,"explication":"La règle empirique indique environ 68 % des données à un écart-type de la moyenne, 95 % à deux écarts-types et 99,7 % à trois écarts-types."},{"question":"Un test a une moyenne de 17 et un écart-type de 5. Une personne obtient 35. Quel est son score z et comment l'interpréter ?","options":["z = 0,7 ; le score est proche de la moyenne","z = 3,6 ; le score est extrêmement élevé, au-delà de la quasi-totalité de la population","z = 7,0 ; le score est impossible","z = −3,6 ; le score est extrêmement bas"],"bonne":1,"explication":"z = (35 − 17)/5 = 3,6 : le score se situe à 3,6 écarts-types au-dessus de la moyenne. Comme 99,7 % des valeurs se situent dans les 3 écarts-types, un z de 3,6 place la personne au-delà d'environ 99,98 % des gens (l'exemple de la « grinchiosité » du manuel)."}],"exercice":{"titre":"Explorer la variabilité des marges gagnantes de l'AFL","enonce":"Ouvrez une nouvelle session Jamovi et saisissez dans la colonne A les cinq premières marges gagnantes de l'AFL : 56, 31, 56, 8 et 32. Définissez la variable comme continue. Avec l'analyse « Descriptives », obtenez la moyenne, la médiane, la variance et l'écart-type. Calculez ensuite à la main la variance en divisant par N, comparez-la à la valeur affichée par Jamovi et expliquez la différence. Enfin, indiquez quelle mesure de dispersion vous rapporteriez à un lecteur humain et pourquoi.","correction":"1) Dans une nouvelle session Jamovi (menu principal, « Nouveau »), saisissez 56, 31, 56, 8, 32 dans la colonne A, puis double-cliquez sur l'en-tête et changez le type de variable en « Continu ». 2) Cliquez « Exploration » puis « Descriptives », déplacez A dans « Variables », développez « Statistics » et cochez « Variance » et « Std. deviation ». Jamovi affiche une moyenne de 36,60, une médiane de 32, une variance de 405,80 et un écart-type de 26,07. 3) Calcul à la main : les écarts à la moyenne sont 19,4 ; −5,6 ; 19,4 ; −28,6 ; −4,6 et leurs carrés 376,36 ; 31,36 ; 376,36 ; 817,96 ; 21,16. Leur somme divisée par N = 5 donne une variance de 324,64. 4) La différence vient de la formule : Jamovi divise la somme des écarts au carré par N − 1 = 4 (soit 1623,20/4 = 405,80) car il estime la variance de la population d'où provient l'échantillon, alors que la division par N décrit seulement l'échantillon lui-même. 5) On rapporterait l'écart-type (26,07 points) plutôt que la variance : exprimé dans les unités d'origine (des points, et non des « points carrés »), il est interprétable par un humain, alors que la variance est mathématiquement élégante mais dénuée de sens concret."}},{"numero":5,"titre":"Réaliser des graphiques","sections":[{"titre":"Pourquoi visualiser les données ?","points":["Un graphique sert deux buts : communiquer clairement ses résultats et explorer soi-même ses données.","Sur la carte du choléra de John Snow (1854), chaque point marquait un cas et les cercles les pompes à eau.","La carte a désigné la pompe de Broad Street comme source de l'épidémie ; sa poignée fut retirée.","L'épidémie, qui avait fait plus de 500 morts, s'arrêta : preuve de la puissance d'une bonne visualisation."]},{"titre":"Histogrammes et courbes de densité","points":["Un histogramme découpe les valeurs en compartiments et affiche les comptages sous forme de barres verticales.","Il convient surtout aux variables mesurées sur une échelle d'intervalle ou de rapport.","La courbe de densité lisse l'histogramme par estimation par noyau et ne dépend pas du nombre de compartiments.","Elle facilite la lecture de la forme de la distribution : normalité, asymétrie, aplatissement.","L'histogramme montre toute la dispersion, mais il est peu compact et inutile pour des données nominales."]},{"titre":"Boxplots (diagrammes en boîtes)","points":["Le boxplot, ou « boîte et moustaches », résume de façon compacte la médiane, l'IQR et l'étendue.","La ligne épaisse marque la médiane et la boîte s'étend du 25e au 75e centile.","Chaque moustache va jusqu'au point le plus extrême situé à moins de 1,5 fois l'IQR des quartiles.","Les observations au-delà des moustaches sont tracées comme des points séparés : ce sont des valeurs aberrantes potentielles.","Grâce à leur compacité, les boxplots sont très populaires pendant la phase exploratoire de l'analyse."]},{"titre":"Graphiques en violon et boxplots multiples","points":["Le graphique en violon ajoute au boxplot la densité par noyau, avec marqueur de médiane et boîte interquartile.","Dans Jamovi, on coche « Violin » et « Box plot », plus « Data » pour afficher les points individuels.","Attention à ne pas surcharger le graphique : la clarté vient de la simplicité.","Pour des boxplots multiples, on glisse la variable de regroupement dans la case « Split by ».","Exemple : les marges AFL de 1987 à 2010 (aflsmall2.csv) restent lisibles, contrairement à 24 histogrammes séparés."]},{"titre":"Détecter les valeurs aberrantes avec les boxplots","points":["Le boxplot offre une méthode informelle pour détecter les valeurs aberrantes d'une variable.","Dans l'exemple du manuel, deux marges dépassent 300 points, ce qui paraît très suspect.","Le filtre « margin > 300 » puis une table de fréquences de ID révèlent les observations 14 et 134.","Il faut alors retourner à la source des données : il s'agit souvent d'une faute de frappe à corriger.","Quand une valeur extrême est légitime, la garder ou non relève du jugement de l'analyste."]},{"titre":"Diagrammes en barres","points":["Le diagramme en barres affiche les comptages de chaque catégorie d'une variable catégorielle.","L'exemple du manuel montre le nombre de finales jouées par chaque équipe de l'AFL (afl.finalists).","Un filtre utilisant « == » permet de ne garder que Brisbane, Carlton, Fremantle et Richmond.","On l'obtient dans Exploration, puis Descriptives, en cochant la case « Bar plot »."]},{"titre":"Enregistrer les images et limites de Jamovi","points":["Un clic droit sur l'image permet de l'enregistrer aux formats .eps, .svg ou .pdf.","Les graphiques par défaut de Jamovi sont soignés, mais leur édition détaillée reste impossible.","Le traçage avancé exige ggplot2, fondé sur « The grammar of graphics », et donc la maîtrise de R."]}],"concepts":["Graphiques exploratoires vs graphiques de présentation","Histogramme et compartiments (bins)","Courbe de densité et estimation par noyau","Boxplot : médiane, boîte, moustaches","Écart interquartile (IQR) et règle du 1,5×IQR","Valeurs aberrantes et nettoyage des données","Graphique en violon","Boxplots multiples avec « Split by »","Diagramme en barres pour variables catégorielles","Export d'images (eps, svg, pdf)"],"formules":[{"nom":"Limite inférieure des moustaches du boxplot","formule":"Limite inférieure = 25e percentile − 1,5 × IQR","explication":"Par défaut, la moustache inférieure s'étend jusqu'au point de données le plus extrême qui ne descend pas en dessous de cette limite. Toute observation en dessous est tracée comme un point (valeur aberrante potentielle)."},{"nom":"Limite supérieure des moustaches du boxplot","formule":"Limite supérieure = 75e percentile + 1,5 × IQR","explication":"La moustache supérieure va jusqu'au point le plus extrême qui ne dépasse pas cette limite ; pour les marges AFL, la limite vaut 107, donc les observations 108 et 116 apparaissent comme des points."}],"jamovi":"Exploration → Descriptives → variable dans « Variables » → Plots : cocher Histogram / Density / Box plot (+ Violin, Data) / Bar plot → par groupe : glisser la variable (ex. année) dans « Split by » → aberrantes : Data → Filters → « margin > 300 » → table de fréquences de ID → clic droit sur l'image : enregistrer en .eps, .svg ou .pdf","glossaire":[{"terme":"Histogramme","definition":"Graphique qui divise les valeurs possibles d'une variable en compartiments et affiche, par des barres verticales, le nombre d'observations tombant dans chaque compartiment. Adapté aux variables d'intervalle ou de ratio."},{"terme":"Compartiment (bin)","definition":"Intervalle de valeurs utilisé par un histogramme pour regrouper les observations ; le nombre de compartiments influence la forme apparente de la distribution."},{"terme":"Courbe de densité","definition":"Variante lissée de l'histogramme, obtenue par estimation par noyau, qui visualise la distribution sur un intervalle continu sans dépendre du nombre de compartiments."},{"terme":"Boxplot","definition":"Tracé « boîte et moustaches » représentant de façon compacte la médiane (ligne épaisse), l'écart interquartile (boîte du 25e au 75e centile) et l'étendue des données (moustaches)."},{"terme":"Écart interquartile (IQR)","definition":"Distance entre le 25e et le 75e percentile ; il sert de base à la règle du 1,5×IQR qui définit la longueur maximale des moustaches d'un boxplot."},{"terme":"Valeur aberrante","definition":"Observation étrangement éloignée du reste des données, tracée comme un point au-delà des moustaches d'un boxplot ; elle peut résulter d'une erreur de saisie ou être légitime."},{"terme":"Graphique en violon","definition":"Variante du boxplot qui montre en plus la densité de probabilité par noyau des données aux différentes valeurs, souvent avec un marqueur de médiane et une boîte interquartile."},{"terme":"Diagramme en barres","definition":"Graphique affichant, pour une variable catégorielle, le comptage des observations de chaque catégorie sous forme de barres."},{"terme":"Nettoyage des données","definition":"Phase de l'analyse consistant à rechercher les fautes de frappe, les données manquantes et autres erreurs dans les fichiers de données brutes ; en pratique, elle peut prendre une grande partie du temps de l'analyste."},{"terme":"ggplot2","definition":"Package graphique de R, basé sur « The grammar of graphics », beaucoup plus puissant que les capacités actuelles de Jamovi pour l'édition avancée des tracés."}],"quiz":[{"question":"Dans la carte du choléra de John Snow (1854), que représentaient les petits points ?","options":["Les pompes à eau","L'emplacement d'un cas de choléra","Les rues de Londres","Les hôpitaux du quartier"],"bonne":1,"explication":"Chaque petit point représentait l'emplacement d'un cas de choléra, tandis que les grands symboles indiquaient les pompes à eau ; c'est ainsi que la pompe de Broad Street a été identifiée comme source de l'épidémie."},{"question":"Pour quel type de variable un histogramme est-il le plus pertinent ?","options":["Une variable nominale","Une variable ordinale à deux niveaux","Une variable sur une échelle d'intervalle ou de ratio","Uniquement une variable binaire"],"bonne":2,"explication":"Le manuel précise que les histogrammes sont plus pertinents avec une variable d'intervalle ou de ratio ; si les données sont à l'échelle nominale, les histogrammes sont inutiles."},{"question":"Quel est l'avantage principal d'une courbe de densité par rapport à un histogramme ?","options":["Elle affiche les comptages exacts de chaque catégorie","Elle est plus colorée par défaut","Elle fonctionne avec les variables nominales","Sa forme n'est pas affectée par le nombre de compartiments utilisés"],"bonne":3,"explication":"La courbe de densité utilise l'estimation par noyau pour lisser le bruit : contrairement à l'histogramme, sa forme ne dépend pas du nombre de compartiments, ce qui aide à juger la forme de la distribution."},{"question":"Dans un boxplot, que représente la ligne épaisse au milieu de la boîte ?","options":["La médiane","La moyenne","Le mode","L'écart-type"],"bonne":0,"explication":"La ligne épaisse au milieu de la boîte est la médiane ; la boîte elle-même s'étend du 25e au 75e centile."},{"question":"Par défaut, jusqu'où s'étendent les moustaches d'un boxplot dans Jamovi ?","options":["Jusqu'au minimum et au maximum des données","Jusqu'à 2 écarts-types de la moyenne","Jusqu'au point le plus extrême situé à moins de 1,5 × IQR des quartiles","Jusqu'aux 5e et 95e percentiles"],"bonne":2,"explication":"Les moustaches vont jusqu'au point de données le plus extrême qui ne dépasse pas 1,5 fois l'écart interquartile au-delà des quartiles ; toute observation en dehors est tracée comme un point (valeur aberrante)."},{"question":"Comment dessiner dans Jamovi des boxpl
