é les effets principaux","Ne pas accorder beaucoup d'attention aux effets principaux, car les moyennes marginales mélangent des groupes hétérogènes","Transformer la variable dépendante pour éliminer l'interaction"],"bonne":2,"explication":"Quand l'interaction est significative, les effets principaux testent des moyennes marginales formées en moyennant des groupes que l'interaction nous dit justement de ne pas moyenner : il faut s'arrêter et réfléchir à ce que l'effet principal signifie réellement."},{"question":"Quelle affirmation à propos du η² partiel est correcte ?","options":["Il est toujours plus petit que η²","La somme des η² partiels de tous les termes vaut le R² du modèle","Il mesure la corrélation entre les deux facteurs","Il vaut SS_A / (SS_A + SS_R) et n'est pas comparable d'un terme à l'autre"],"bonne":3,"explication":"Le η² partiel retire du dénominateur les SS des autres termes : partial η²_A = SS_A / (SS_A + SS_R). Il est toujours au moins aussi grand que η² et exprime chaque effet seulement par rapport à la variation résiduelle, ce qui interdit les comparaisons entre termes."},{"question":"Quel risque particulier l'ANCOVA présente-t-elle lorsque les groupes ne se chevauchent pas sur la covariable (p. ex. âges très différents) ?","options":["Le test de Levene devient impossible à calculer","L'analyse peut aplanir des différences réelles en extrapolant « à une région sans données »","La puissance statistique du test augmente artificiellement","La covariable devient automatiquement significative"],"bonne":1,"explication":"Quand les groupes sont distincts sur la covariable, l'ajustement extrapole vers une région sans données et peut conclure à tort à l'absence de différence entre les groupes (exemple de l'anxiété statistique selon l'âge chez artistes et scientifiques)."},{"question":"Dans le codage d'une ANOVA 2 x 2 comme régression Ŷ = b0 + b1 X1 + b2 X2 avec des variables binaires, à quoi correspond b0 ?","options":["À la grande moyenne de toutes les observations","À l'effet d'interaction entre les deux facteurs","À la note attendue du groupe de référence (X1 = 0 et X2 = 0)","À la différence entre les deux moyennes marginales"],"bonne":2,"explication":"Avec des contrastes de traitement, l'interception b0 est la valeur attendue quand les deux prédicteurs binaires valent 0 (le groupe de référence), tandis que b1 et b2 représentent les augmentations associées à chaque facteur."},{"question":"Dans un plan non équilibré, quel type de somme des carrés le manuel recommande-t-il généralement, et pourquoi ?","options":["Le type II, car il ne dépend ni de l'ordre d'entrée des facteurs ni du choix des contrastes","Le type I, car il est la valeur par défaut de Jamovi","Le type III, car il respecte le principe de marginalité","Aucun : l'ANOVA est impossible dans un plan non équilibré"],"bonne":0,"explication":"Les tests de type I dépendent de l'ordre des facteurs et ceux de type III dépendent des contrastes et violent le principe de marginalité ; les tests de type II évitent ces deux problèmes et sont souvent le meilleur choix (le type III est néanmoins le défaut de Jamovi)."}],"exercice":{"titre":"ANOVA factorielle complète sur les données d'essai clinique","enonce":"Avec le fichier clinicaltrial.csv (18 participants, facteur drug à 3 niveaux : placebo, anxifree, joyzepam ; facteur therapy à 2 niveaux : no.therapy, CBT ; variable résultat mood.gain), réalisez dans Jamovi une ANOVA factorielle complète. (a) Ouvrez Analyses - ANOVA - ANOVA, placez mood.gain en variable dépendante et drug et therapy en facteurs fixes, en conservant l'interaction drug*therapy. (b) Demandez les tailles d'effet η² et partial η². (c) Créez un graphique descriptif avec drug en axe horizontal et therapy en lignes séparées, et commentez le parallélisme des lignes. (d) Vérifiez les hypothèses avec le test de Levene et le graphe Q-Q. (e) Effectuez des tests post hoc de Tukey sur les effets principaux. Rédigez vos conclusions au format statistique standard.","correction":"(a) Le tableau ANOVA du modèle complet donne : drug, SS = 3,45, df = 2, F(2,12) = 31,7, p < .001 ; therapy, SS = 0,47, df = 1, F(1,12) = 8,6, p = .013 ; interaction drug*therapy, SS = 0,27, df = 2, F(2,12) = 2,5, p = .125 ; résidus SS = 0,65, df = 12. On conclut à deux effets principaux significatifs (médicament et thérapie) mais à l'absence d'interaction significative. (b) η² = 0,71 pour drug et 0,10 pour therapy (effets η² partiels : 0,84 et 0,42 ; interaction η² = 0,06, partiel 0,29) : très grand effet du médicament, effet modeste de la thérapie ; les η² partiels sont plus grands et non comparables entre termes. (c) Les lignes ne sont pas exactement parallèles (l'effet de la CBT semble plus grand avec Anxifree), mais le test montre que cet écart peut être attribué au hasard puisque l'interaction n'est pas significative. (d) Le test de Levene n'est pas significatif (F(5,12) = 0,21, p = .954), donc l'homogénéité des variances n'est pas violée ; les points du graphe Q-Q sont proches de la droite, donc la normalité des résidus est plausible. (e) Post hoc de Tukey (modèle avec interaction) : joyzepam vs placebo, différence = 1,03, p(tukey) < .001 ; anxifree vs joyzepam, différence = −0,77, p = .00027 ; placebo vs anxifree, différence = −0,27, p = .16 (non significatif) ; no.therapy vs CBT, différence = −0,32, p = .013. Conclusion : Joyzepam est supérieur au placebo et à Anxifree, Anxifree ne se distingue pas significativement du placebo, et la TCC améliore significativement le gain d'humeur."}},{"numero":15,"titre":"Épilogue : les statistiques non découvertes","sections":[{"titre":"Un livre d'introduction, pas un point final","points":["L'auteur présente son livre comme inachevé : l'index, les références et les exercices manquent encore.","Un cours d'introduction aux statistiques n'est justement qu'une introduction, pas un panorama complet.","Un sujet non enseigné n'est pas impossible, et un sujet couvert n'est pas forcément bien traité.","Parmi les omissions figurent la corrélation polychorique, les tailles d'effet et le traitement des hypothèses violées.","Manquent aussi les interactions en régression ainsi que les comparaisons planifiées et multiples."]},{"titre":"Les modèles statistiques manquants","points":["La régression non linéaire regroupe des méthodes comme les régressions isotonique, Lowess et polynomiale.","La régression logistique prédit des résultats binaires ; le modèle linéaire généralisé englobe ces familles.","L'analyse de survie traite les données censurées, où la fin de l'étude coupe les observations.","Les modèles mixtes décrivent à la fois les individus et les effets globaux de l'expérience.","S'ajoutent la mise à l'échelle multidimensionnelle, le clustering comme les k-moyennes et les modèles causaux comme les équations structurelles."]},{"titre":"D'autres façons de faire des inférences","points":["Le livre est surtout fréquentiste, fondé sur les valeurs p, avec un seul chapitre bayésien.","Le bootstrapping simule la distribution d'échantillonnage en supposant que la population ressemble à l'échantillon observé.","Cette méthode simple se révèle remarquablement efficace dans un très grand nombre de situations pratiques.","La validation croisée ajuste le modèle sur une partie des données et évalue sa généralisation sur l'autre.","Les statistiques robustes résistent à la contamination des données : la médiane est ainsi préférée à la moyenne."]},{"titre":"Sujets divers : données manquantes, puissance, modèles théoriques","points":["Ignorer les données manquantes est risqué lorsqu'elles manquent de façon systématique et non aléatoire.","L'imputation multiple remplace chaque valeur manquante par plusieurs suppositions plausibles, afin d'exprimer l'incertitude associée.","L'analyse de puissance sert à planifier la taille d'échantillon nécessaire avant de lancer une étude.","Un résultat significatif obtenu avec une puissance très faible laisse un grand rôle au hasard.","Les modèles théoriques, comme l'échantillonnage séquentiel, décrivent par exemple les temps de réponse."]},{"titre":"Pourquoi apprendre les bases (et avec Jamovi)","points":["Par pragmatisme d'abord : l'ANOVA est partout dans la littérature scientifique qu'il faut savoir lire.","La connaissance est incrémentale : les outils avancés prolongent directement le socle de l'ANOVA.","Le but est de devenir un analyste compétent, capable de penser correctement aux données.","Les fondamentaux comme les probabilités, la densité et l'estimation rendent possible l'apprentissage ultérieur, par exemple du bayésien.","L'auteur refuse de cacher les complexités et préfère donner de vraies compétences et de vrais outils."]}],"concepts":["Les cours d'introduction ne sont qu'une introduction : ne pas confondre couvert et suffisant","Modèles manquants : régression logistique, GLM, analyse de survie, modèles mixtes, MDS, clustering, modèles causaux (SEM)","Bootstrapping : simuler la distribution d'échantillonnage à partir de l'échantillon","Validation croisée : évaluer la généralisation d'un modèle à de nouvelles données","Statistiques robustes et point de rupture (médiane vs moyenne)","Données manquantes et imputation multiple","Analyse de puissance pour planifier et interpréter les études","Extensibilité : les fondamentaux permettent d'apprendre les outils avancés"],"formules":[],"jamovi":"","glossaire":[{"terme":"Bootstrapping","definition":"Méthode d'inférence qui simule maintes fois les résultats de l'expérience en supposant que la population ressemble aux données brutes, afin d'obtenir la distribution d'échantillonnage d'une statistique sans hypothèse de forme."},{"terme":"Validation croisée","definition":"Technique qui divise les données en sous-ensembles, ajuste le modèle sur l'un (X1) et évalue sa performance sur l'autre (X2), mesurant ainsi la qualité de généralisation du modèle à de nouvelles données."},{"terme":"Statistiques robustes","definition":"Branche des statistiques qui étudie les outils restant fiables quand les données ne satisfont pas les hypothèses théoriques ou sont contaminées, par exemple la médiane comme estimateur robuste de tendance centrale."},{"terme":"Imputation multiple","definition":"Traitement des données manquantes qui impute une série de suppositions plausibles plutôt qu'une valeur unique, afin de refléter l'incertitude sur les valeurs manquantes."},{"terme":"Analyse de survie","definition":"Ensemble d'outils conçus pour les données censurées, où il manque systématiquement un « côté » des observations parce que l'étude a pris fin (p. ex. durées de jeu limitées à deux heures, suivi de patients pendant 5 ans)."},{"terme":"Modèles mixtes","definition":"Modèles qui apprennent à la fois les caractéristiques des unités expérimentales individuelles (p. ex. la trajectoire de bonheur de chaque personne) et les effets globaux, généralisant l'ANOVA pour mesures répétées."}],"quiz":[{"question":"Quel outil l'auteur recommande-t-il pour prédire une variable résultat binaire (p. ex. être ou non sur Twitter) à partir de prédicteurs continus ?","options":["La régression linéaire standard","La régression logistique","L'ANOVA factorielle","La mise à l'échelle multidimensionnelle"],"bonne":1,"explication":"Avec une variable résultat binaire, les résidus ne peuvent pas être distribués normalement, ce qui exclut la régression linéaire standard ; l'outil le plus important dans ce cas est la régression logistique."},{"question":"Quelle est l'idée de base du bootstrapping ?","options":["Corriger les valeurs p pour les comparaisons multiples","Remplacer les valeurs manquantes par la moyenne de l'échantillon","Diviser l'échantillon en deux pour tester la généralisation du modèle","Simuler la distribution d'échantillonnage en supposant que la population ressemble aux données brutes"],"bonne":3,"explication":"Le bootstrapping simule les résultats de l'expérience à maintes reprises en supposant que l'hypothèse nulle est vraie et que la population inconnue ressemble à l'échantillon, au lieu de supposer une distribution théorique connue."},{"question":"Dans l'exemple des cinq amis âgés de 34, 39, 31, 43 et 4003 ans, pourquoi la médiane (39 ans) est-elle préférable à la moyenne (830 ans) ?","options":["Parce que la médiane est un estimateur robuste, peu sensible à l'observation clairement erronée","Parce que la médiane est toujours un meilleur estimateur que la moyenne","Parce que la moyenne ne peut pas être calculée avec cinq observations","Parce que la médiane suit une distribution normale"],"bonne":0,"explication":"La moyenne n'est pas un estimateur robuste de la tendance centrale : une seule valeur aberrante (4003, probablement une faute de frappe) la contamine complètement, alors que la médiane donne une réponse raisonnable malgré l'erreur."},{"question":"Pourquoi ignorer les données manquantes n'est-il généralement pas une solution sûre ?","options":["Parce que les logiciels statistiques refusent les jeux de données incomplets","Parce que cela réduit toujours la puissance en dessous de 50 %","Parce que les données manquent souvent de façon systématique (p. ex. les personnes en surpoids répondent moins), ce qui biaise les conclusions","Parce que la loi impose l'imputation multiple dans toutes les revues"],"bonne":2,"explication":"Quand les données manquent de façon systématique (non-réponse liée à la variable mesurée), les ignorer biaise les estimations ; l'imputation, idéalement multiple pour refléter l'incertitude, est alors importante."},{"question":"Quels sont les deux arguments clés de l'auteur pour continuer d'apprendre l'ANOVA classique malgré ses critiques ?","options":["Sa simplicité de calcul et sa disponibilité dans Jamovi","Le pragmatisme (elle domine la littérature scientifique) et la connaissance incrémentale (elle sert de base aux outils avancés)","Son exactitude mathématique et sa robustesse aux valeurs aberrantes","Son caractère bayésien et sa gratuité"],"bonne":1,"explication":"L'ANOVA est largement utilisée, à tort ou à raison, donc indispensable pour comprendre la littérature ; et beaucoup d'outils plus avancés (comme les modèles mixtes) prolongent l'installation ANOVA fondamentale : il faut apprendre à ramper avant de gravir une montagne."}],"exercice":{"titre":"Cartographier les limites de sa boîte à outils statistique","enonce":"Exercice de réflexion. Pour chacune des trois situations suivantes, expliquez pourquoi les outils vus dans ce manuel (tests t, ANOVA, régression linéaire, chi carré) sont insuffisants, identifiez la méthode évoquée dans l'épilogue qui conviendrait, et justifiez votre choix : (1) vous suivez pendant 5 ans des patients atteints d'un cancer recevant le traitement A ou B, et certains sont encore vivants à la fin de l'étude ; (2) vous mesurez le bonheur de plusieurs personnes à trois moments dans le temps et vous voulez modéliser à la fois les trajectoires individuelles et les effets globaux ; (3) vous voulez prédire si une personne possède un compte sur un réseau social (oui/non) en fonction de son revenu et de son âge. Enfin, expliquez en quelques phrases pourquoi, selon l'auteur, il vaut quand même la peine d'avoir appris les outils « classiques » d'abord.","correction":"(1) Les données sont censurées : on ne connaît pas la durée de survie des patients encore vivants à la fin du suivi, et une ANOVA ou une régression standard ne sait pas traiter ce « côté » manquant systématiquement ; l'analyse de survie est conçue exactement pour cette situation et permet de comparer l'efficacité des traitements et le risque de décès au fil du temps. (2) Une ANOVA pour mesures répétées traiterait de la même manière une personne dont le bonheur diminue (10, 8, 6) et une dont il augmente (6, 8, 10) puisqu'elles ont la même moyenne ; les modèles mixtes modélisent à la fois les unités expérimentales individuelles (les trajectoires de chaque personne) et les effets globaux, ce qui est nécessaire ici. (3) La variable résultat est binaire, donc les résidus ne peuvent pas être normalement distribués et la régression linéaire standard est inappropriée ; la régression logistique (membre de la famille du GLM) est l'outil le plus important pour ce cas. Pourquoi apprendre les classiques : d'abord par pragmatisme, car l'ANOVA et la régression sont omniprésentes dans la littérature qu'il faut pouvoir lire ; ensuite par connaissance incrémentale, car les outils avancés prolongent le socle ANOVA/régression (personne n'apprend les modèles mixtes sans maîtriser d'abord l'ANOVA et la régression) ; enfin parce que le but d'une introduction est de rendre l'étudiant capable de penser correctement aux données, avec des compétences transférables aux modèles plus complexes."}}]};

  {label:"Général", items:["home","gloss"]},

];

const STORE_KEY = "jamovi-formation-progress";

try{ const saved = localStorage.getItem(STORE_KEY); if(saved) progress = JSON.parse(saved).progress || {}; }catch(e){}
function saveProgress(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify({progress})); }catch(e){} }
let quizSessions = {}; // num -> {idx, score, answered, selected, finished}
let view = {page:"home", chap:null, tab:"lecon"};

const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const chap = n => CHAPS.find(c=>c.numero===n);

function setView(page, chapNum=null, tab="lecon"){
  view = {page, chap:chapNum, tab};
  render();

// ---------- sidebar ----------
function renderNav(){
  let h = "";
  h += `<div class="nav-group">
    <button class="nav-item ${view.page==='home'?'active':''}" onclick="setView('home')"><span class="num">🏠</span><span class="ttl">Tableau de bord</span></button>
    <button class="nav-item ${view.page==='gloss'?'active':''}" onclick="setView('gloss')"><span class="num">📖</span><span class="ttl">Glossaire (${allTerms.length})</span></button>
  </div>`;
  for(const g of GROUPS){
    if(!g.chapters) continue;
    h += `<div class="nav-group"><div class="grp">${g.label}</div>`;
    for(const n of g.chapters){
      const c = chap(n), p = progress[n];
      const done = p && p.done;
      h += `<button class="nav-item ${done?'done':''} ${view.page==='chap'&&view.chap===n?'active':''}" onclick="setView('chap',${n})">

        ${p&&p.best!=null?`<span class="score">${p.best}%</span>`:""}</button>`;
    }
    h += `</div>`;

  $("#nav").innerHTML = h;
}

// ---------- accueil ----------
function renderHome(){
  const doneCount = CHAPS.filter(c=>progress[c.numero]?.done).length;
  const scores = CHAPS.map(c=>progress[c.numero]?.best).filter(v=>v!=null);
  const avg = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : null;
  const totalQ = CHAPS.reduce((a,c)=>a+c.quiz.length,0);
  const pct = Math.round(doneCount/CHAPS.length*100);
  let h = `
  <div class="hero">
    <h2>Bienvenue dans votre formation 👋</h2>
    <p>Un parcours complet en 15 étapes fondé sur le manuel <em>Apprentissage des statistiques avec Jamovi</em> : leçons synthétiques, ${totalQ} questions de quiz corrigées, exercices pratiques dans Jamovi et glossaire de ${allTerms.length} termes.</p>
  </div>
  <div class="stats-row">
    <div class="stat"><div class="v">${doneCount} / ${CHAPS.length}</div><div class="l">Chapitres terminés</div></div>
    <div class="stat"><div class="v">${avg!=null?avg+" %":"—"}</div><div class="l">Score moyen aux quiz</div></div>
    <div class="stat"><div class="v">${scores.length}</div><div class="l">Quiz réalisés</div></div>
    <div class="stat"><div class="v">${pct} %</div><div class="l">Progression globale</div></div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <b>Progression du parcours</b><span style="color:var(--muted);font-size:.85rem">${pct} %</span>
    </div>
    <div class="progress-track"><div class="progress-fill ${pct===100?'green':''}" style="width:${pct}%"></div></div>
    <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn ghost" onclick="exportProgress()">💾 Exporter ma progression</button>
      <button class="btn ghost" onclick="$('#importFile').click()">📂 Importer une progression</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importProgress(event)">
    </div>
    <p style="font-size:.78rem;color:var(--muted);margin-top:8px">La progression est enregistrée automatiquement dans ce navigateur. L'export en fichier permet de la transférer sur un autre appareil.</p>
  </div>
  <h2 class="page-title" style="font-size:1.2rem;margin:26px 0 14px">Les chapitres</h2>
  <div class="chap-grid">`;
  for(const c of CHAPS){
    const p = progress[c.numero];
    h += `<button class="chap-card ${p?.done?'done':''}" onclick="setView('chap',${c.numero})">
      <div class="top"><span class="badge">${p?.done?'✓':c.numero}</span><h3>${esc(c.titre)}</h3></div>
      <div class="meta">${c.sections.length} sections · ${c.quiz.length} questions${p?.best!=null?` · meilleur score ${p.best} %`:""}</div>
    </button>`;
  }
  h += `</div>
  <p class="footer-note">D'après Navarro D.J. &amp; Foxcroft D.R., <em>Apprentissage des statistiques avec Jamovi</em> (trad. J.-M. Meunier, Univ. Paris 8), licence CC BY-SA 4.0.</p>`;
  return h;
}

// ---------- chapitre ----------
function renderChapter(){
  const c = chap(view.chap);
  const p = progress[c.numero];
  let h = `<h2 class="page-title">Chapitre ${c.numero===15?'— Épilogue':c.numero} · ${esc(c.titre)}</h2>
  <p class="page-sub">${c.sections.length} sections · ${c.quiz.length} questions de quiz${p?.best!=null?` · meilleur score : ${p.best} %`:""}</p>
  <div class="tabs">
    <button class="tab ${view.tab==='lecon'?'active':''}" onclick="setView('chap',${c.numero},'lecon')">📘 Leçon</button>
    <button class="tab ${view.tab==='quiz'?'active':''}" onclick="setView('chap',${c.numero},'quiz')">✅ Quiz</button>
    <button class="tab ${view.tab==='exo'?'active':''}" onclick="setView('chap',${c.numero},'exo')">🧪 Exercice pratique</button>
  </div>`;
  if(view.tab==='lecon') h += renderLesson(c);
  else if(view.tab==='quiz') h += renderQuiz(c);
  else h += renderExercise(c);
  const prev = CHAPS.find(x=>x.numero===c.numero-1), next = CHAPS.find(x=>x.numero===c.numero+1);
  h += `<div class="chap-nav">
    ${prev?`<button class="btn ghost" onclick="setView('chap',${prev.numero})">← Ch. ${prev.numero}</button>`:"<span></span>"}
    ${next?`<button class="btn ghost" onclick="setView('chap',${next.numero})">Ch. ${next.numero} →</button>`:"<span></span>"}
  </div>`;
  return h;
}

function renderLesson(c){
  let h = `<div class="card">`;
  h += c.sections.map(s=>`<div class="section-block"><h3>${esc(s.titre)}</h3>${s.points?`<ul>${s.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`:`<p>${esc(s.contenu||"")}</p>`}</div>`).join("");
  h += `</div>`;
  if(c.concepts?.length){
    h += `<div class="card"><b>🔑 Concepts clés</b><div style="margin-top:10px">${c.concepts.map(k=>`<span class="chip">${esc(k)}</span>`).join("")}</div></div>`;
  }
  if(c.formules?.length){
    h += `<div class="card"><b>🧮 Formules essentielles</b><div style="margin-top:12px">`;
    h += c.formules.map(f=>`<div class="formula-card"><div class="n">${esc(f.nom)}</div><div class="f">${esc(f.formule)}</div><div class="e">${esc(f.explication)}</div></div>`).join("");
    h += `</div></div>`;
  }
  if(c.jamovi){
    h += `<div class="card"><div class="jamovi-box"><h4>▶ Dans Jamovi</h4><p>${esc(c.jamovi)}</p></div></div>`;
  }
  h += `<div style="text-align:center;margin-top:8px">
    <button class="btn green" onclick="setView('chap',${c.numero},'quiz')">Tester mes connaissances →</button>
  </div>`;
  return h;
}

// ---------- quiz ----------
function getSession(n){
  if(!quizSessions[n]) quizSessions[n] = {idx:0, score:0, answered:false, selected:null, finished:false};
  return quizSessions[n];
}
function renderQuiz(c){
  const s = getSession(c.numero);
  if(s.finished) return renderQuizResult(c, s);
  const q = c.quiz[s.idx];
  const pc = Math.round(s.idx/c.quiz.length*100);
  let h = `<div class="card">
    <div class="quiz-progress"><span>Question ${s.idx+1} / ${c.quiz.length}</span>
    <div class="progress-track"><div class="progress-fill" style="width:${pc}%"></div></div>
    <span>Score : ${s.score}</span></div>
    <div class="q-text">${esc(q.question)}</div>`;
  q.options.forEach((opt,i)=>{
    let cls = "";
    if(s.answered){
      if(i===q.bonne) cls = "correct";
      else if(i===s.selected) cls = "wrong";
    } else if(i===s.selected) cls = "selected";
    h += `<button class="opt ${cls}" ${s.answered?'disabled':''} onclick="selectOpt(${i})">
      <span class="letter">${"ABCD"[i]}</span><span>${esc(opt)}</span></button>`;
  });
  if(s.answered){
    const good = s.selected===q.bonne;
    h += `<div class="explain ${good?'good':'bad'}"><b>${good?'✅ Bonne réponse !':'❌ Mauvaise réponse — la bonne était '+"ABCD"[q.bonne]+'.'}</b>${esc(q.explication)}</div>
    <div style="text-align:right"><button class="btn" onclick="nextQuestion()">${s.idx+1<c.quiz.length?'Question suivante →':'Voir mon résultat 🏁'}</button></div>`;
  } else {
    h += `<div style="text-align:right"><button class="btn" ${s.selected==null?'disabled':''} onclick="validateAnswer()">Valider</button></div>`;
  }
  h += `</div>`;
  return h;
}
function renderQuizResult(c, s){
  const pct = Math.round(s.score/c.quiz.length*100);
  const msg = pct>=80?"Excellent ! Ce chapitre est solidement acquis.":pct>=60?"Bien ! Relisez les points manqués pour consolider.":"Ce chapitre mérite une relecture — la leçon est à un clic.";
  return `<div class="card quiz-result">
    <div style="font-size:2.4rem">${pct>=80?"🏆":pct>=60?"👍":"📚"}</div>
    <div class="big">${s.score} / ${c.quiz.length}</div>
    <p>${pct} % de bonnes réponses. ${msg}</p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn ghost" onclick="retryQuiz(${c.numero})">🔄 Recommencer le quiz</button>
      <button class="btn ghost" onclick="setView('chap',${c.numero},'lecon')">📘 Revoir la leçon</button>
      ${CHAPS.find(x=>x.numero===c.numero+1)?`<button class="btn" onclick="setView('chap',${c.numero+1})">Chapitre suivant →</button>`:`<button class="btn" onclick="setView('home')">Tableau de bord</button>`}
    </div></div>`;
}
function selectOpt(i){ const s = getSession(view.chap); if(s.answered) return; s.selected = i; render(); }
function validateAnswer(){
  const s = getSession(view.chap), c = chap(view.chap);
  if(s.selected==null||s.answered) return;
  s.answered = true;
  if(s.selected===c.quiz[s.idx].bonne) s.score++;
  render();
}
function nextQuestion(){
  const s = getSession(view.chap), c = chap(view.chap);
  if(s.idx+1<c.quiz.length){ s.idx++; s.answered=false; s.selected=null; }
  else {
    s.finished = true;
    const pct = Math.round(s.score/c.quiz.length*100);
    const p = progress[c.numero] || {best:null, attempts:0, done:false};
    p.attempts++; p.best = p.best==null?pct:Math.max(p.best,pct);
    if(pct>=60) p.done = true;
    progress[c.numero] = p;
    saveProgress();
  }
  render();
}
function retryQuiz(n){ delete quizSessions[n]; render(); }

// ---------- exercice ----------
let showCorrection = {};
function renderExercise(c){
  const e = c.exercice;
  let h = `<div class="card">
    <h3 style="margin-bottom:10px">🧪 ${esc(e.titre)}</h3>
    <p style="white-space:pre-wrap">${esc(e.enonce)}</p>
    <div style="margin-top:16px">
    <button class="btn ${showCorrection[c.numero]?'ghost':''}" onclick="toggleCorrection(${c.numero})">${showCorrection[c.numero]?'Masquer la correction':'👁 Afficher la correction'}</button></div>`;
  if(showCorrection[c.numero]) h += `<div class="exo-correction"><b>✔ Correction</b>

${esc(e.correction)}</div>`;
  h += `</div>`;
  return h;
}
function toggleCorrection(n){ showCorrection[n]=!showCorrection[n]; render(); }

// ---------- glossaire ----------
const allTerms = [];
for(const c of CHAPS) for(const g of c.glossaire) allTerms.push({...g, chap:c.numero});
allTerms.sort((a,b)=>a.terme.localeCompare(b.terme,"fr",{sensitivity:"base"}));
let gQuery = "";
function renderGloss(){
  const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  const q = norm(gQuery.trim());
  const list = q ? allTerms.filter(t=>norm(t.terme).includes(q)||norm(t.definition).includes(q)) : allTerms;
  let h = `<h2 class="page-title">Glossaire</h2>
  <p class="page-sub">${allTerms.length} termes issus du manuel — recherche par mot-clé.</p>
  <div class="card">
  <input id="gsearch" type="text" placeholder="🔍 Rechercher un terme (ex : écart-type, valeur p, ANOVA…)" value="${esc(gQuery)}" oninput="gQuery=this.value;renderGlossList()">
  <div id="glist">${glossListHTML(list,q)}</div></div>`;
  return h;
}
function glossListHTML(list,q){
  if(!list.length) return `<p style="color:var(--muted)">Aucun terme trouvé.</p>`;
  const hl = s => q ? esc(s).replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>") : esc(s);
  let h = "", letter = "";
  for(const t of list){
    const L = t.terme[0].toUpperCase().normalize("NFD")[0];
    if(L!==letter && !q){ letter = L; h += `<div class="gletter">${L}</div>`; }
    h += `<div class="gterm"><b>${hl(t.terme)}</b><span class="src" style="cursor:pointer" onclick="setView('chap',${t.chap})">Ch. ${t.chap}</span><p>${hl(t.definition)}</p></div>`;
  }
  return h;
}
function renderGlossList(){
  const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  const q = norm(gQuery.trim());
  const list = q ? allTerms.filter(t=>norm(t.terme).includes(q)||norm(t.definition).includes(q)) : allTerms;
  $("#glist").innerHTML = glossListHTML(list,q);
}

// ---------- export / import ----------
function exportProgress(){
  const blob = new Blob([JSON.stringify({progress, date:document.lastModified},null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "progression-jamovi.json";
  a.click();
  URL.revokeObjectURL(a.href);
}
function importProgress(ev){
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{ const d = JSON.parse(r.result); if(d.progress){ progress = d.progress; saveProgress(); render(); } else alert("Fichier non reconnu."); }
    catch(e){ alert("Fichier invalide."); }
  };
  r.readAsText(f);
}

// ---------- rendu ----------
function render(){
  renderNav();
  let h = "";
  if(view.page==="home") h = renderHome();
  else if(view.page==="chap") h = renderChapter();
  else if(view.page==="gloss") h = renderGloss();
  $("#main").innerHTML = h;
  if(view.page==="gloss"){ const i=$("#gsearch"); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length);} }
}
$("#burger").addEventListener("click",()=>{ $("#sidebar").classList.toggle("open"); document.body.classList.toggle("menu-open"); });
$("#overlay").addEventListener("click",()=>{ $("#sidebar").classList.remove("open"); document.body.classList.remove("menu-open"); });
render();
if("serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
</body>
