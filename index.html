08.","L'écart-type inconnu y est remplacé par son estimation, et la statistique suit une distribution t aux queues plus épaisses.","Les degrés de liberté valent l'effectif moins un ; avec un grand échantillon, la distribution t rejoint pratiquement la normale.","Le test suppose la normalité des données et l'indépendance des observations, mais plus un écart-type connu.","Dans l'exemple de Zeppo, le test conclut que la moyenne observée diffère significativement de la valeur théorique 67,5."]},{"titre":"Le test t pour échantillons indépendants (Student)","points":["Le test t pour échantillons indépendants compare deux groupes distincts, sous l'hypothèse nulle d'égalité des moyennes de population.","La statistique divise la différence des moyennes par une erreur standard poolée, avec pour degrés de liberté l'effectif total moins deux.","Dans l'exemple de Harpo, la différence de notes entre les deux tutrices est significative, avec une taille d'effet de 0,74.","Il suppose la normalité, l'indépendance des observations et l'homogénéité des variances, vérifiable par le test de Levene.","Le signe de la statistique t est arbitraire : regardez les moyennes des groupes pour savoir lequel l'emporte."]},{"titre":"Le test de Welch","points":["L'égalité parfaite des écarts-types de deux populations est rarement vraie en pratique.","Le test de Welch combine les variances séparées des deux groupes et utilise des degrés de liberté non entiers.","Sur les données de Harpo, Welch donne p égal à .054 alors que Student donnait .043.","Il ne faut pas surinterpréter la différence entre deux valeurs p situées juste autour du seuil.","Si les variances sont vraiment égales, Student est légèrement plus puissant ; sinon, Welch est préférable."]},{"titre":"Le test t pour échantillons appariés","points":["Avec des mesures répétées, un test indépendant confondrait les différences intra-sujets avec la variabilité entre sujets.","On calcule pour chaque participant la différence entre ses deux scores, puis on teste si sa moyenne vaut zéro.","C'est en fait un test t à un échantillon sur les différences, avec pour degrés de liberté l'effectif moins un.","Dans l'exemple de Chico, presque tous les étudiants progressent légèrement et le test est très significatif.","Dans Jamovi, l'analyse pour échantillons appariés donne exactement les mêmes chiffres que le test sur la variable de différence."]},{"titre":"Tests unilatéraux et taille d'effet (d de Cohen)","points":["En unilatéral, la statistique t et les degrés de liberté sont inchangés, mais la valeur p et l'intervalle de confiance changent.","Un test unilatéral n'est légitime que s'il a été planifié avant de voir les données.","Le d de Cohen exprime la différence des moyennes en nombre d'écarts-types : 0,2 petit, 0,5 modéré, 0,8 grand.","Il existe plusieurs variantes de calcul, dont la version poolée appelée g de Hedges.","Pour un test apparié, le d calculé sur les différences peut différer fortement de celui sur l'échelle originale."]},{"titre":"Vérifier la normalité : graphiques QQ et test de Shapiro-Wilk","points":["La normalité supposée est souvent raisonnable grâce au théorème de la limite centrale, mais violée pour des temps de réponse.","Sur un graphique quantile-quantile, des données normales forment une droite ; une courbure signale une asymétrie ou un aplatissement anormal.","Le test de Shapiro-Wilk prend pour hypothèse nulle que les données sont normalement distribuées.","Contrairement à l'habitude, ce sont les petites valeurs de sa statistique W, plafonnée à un, qui signalent un écart.","Dans Jamovi, cochez Normality dans Assumption Checks, puis rapportez la statistique, la valeur p et l'effectif."]},{"titre":"Tests non paramétriques : Wilcoxon et Mann-Whitney","points":["Quand les données ne sont clairement pas normales, comme dans l'exemple du football australien, les tests t deviennent discutables.","Les tests de Wilcoxon sont non paramétriques : ils ne font aucune supposition sur la distribution des données.","Leur prix est une puissance moindre que les tests t, donc un risque accru d'erreur de type II.","Le test U de Mann-Whitney remplace le test t indépendant en comparant chaque observation d'un groupe à celles de l'autre.","La version à un échantillon ou appariée de Wilcoxon se lit dans Jamovi comme un test t ordinaire."]}],"concepts":["z-test pour un échantillon (σ connu)","Test t sur un échantillon et degrés de liberté N − 1","Test t de Student pour échantillons indépendants","Homogénéité de la variance et estimation poolée de l'écart-type","Test de Welch (variances inégales, ddl non entiers)","Test t pour échantillons appariés (scores de différence)","Tests unilatéraux vs bilatéraux","Taille d'effet : d de Cohen (0,2 / 0,5 / 0,8)","Vérification de la normalité : graphique QQ et Shapiro-Wilk","Tests non paramétriques de Wilcoxon et Mann-Whitney"],"formules":[{"nom":"Statistique z (z-test à un échantillon)","formule":"z = (x̄ − μ₀) / SE(x̄), avec SE(x̄) = σ/√N","explication":"On standardise l'écart entre la moyenne observée et la moyenne prédite par l'hypothèse nulle en le divisant par l'erreur type de la moyenne, calculée avec l'écart-type de population σ supposé connu. Sous H₀, z suit une loi normale standard."},{"nom":"Statistique t (test t sur un échantillon)","formule":"t = (x̄ − μ) / (σ̂/√N)","explication":"Identique au z-score sauf que l'écart-type inconnu σ est remplacé par son estimation σ̂ ; la statistique suit alors une distribution t à N − 1 degrés de liberté, aux queues plus épaisses que la normale."},{"nom":"Statistique t (échantillons indépendants)","formule":"t = (x̄₁ − x̄₂) / SE(x̄₁ − x̄₂)","explication":"La différence entre les moyennes des deux groupes est divisée par l'erreur type de cette différence. Sous H₀ (μ₁ = μ₂), t suit une distribution t à N − 2 degrés de liberté dans la version de Student."},{"nom":"Erreur type poolée (test de Student)","formule":"SE(x̄₁ − x̄₂) = σ̂ · √(1/N₁ + 1/N₂), avec σ̂p² = Σᵢₖ(Xᵢₖ − x̄ₖ)² / (N − 2)","explication":"En supposant σ₁ = σ₂, on calcule une estimation globale de la variance en divisant la somme des écarts quadratiques aux moyennes de groupe par N − 2 (deux moyennes estimées, donc deux contraintes)."},{"nom":"Erreur type du test de Welch","formule":"SE(x̄₁ − x̄₂) = √(σ̂₁²/N₁ + σ̂₂²/N₂)","explication":"Quand les variances des deux populations peuvent différer, chaque groupe contribue sa propre variance à l'erreur type. Les degrés de liberté de Welch, ddl = (σ̂₁²/N₁ + σ̂₂²/N₂)² / [(σ̂₁²/N₁)²/(N₁−1) + (σ̂₂²/N₂)²/(N₂−1)], ne sont généralement pas entiers et sont un peu plus petits que ceux de Student."},{"nom":"Statistique t (échantillons appariés)","formule":"t = D̄ / (σ̂D/√N), avec Dᵢ = Xᵢ₁ − Xᵢ₂","explication":"On calcule le score de différence de chaque participant, puis on fait un test t à un échantillon sur ces différences (H₀ : μD = 0) ; σ̂D est l'écart-type des scores de différence et les degrés de liberté valent N − 1."},{"nom":"d de Cohen","formule":"d = (moyenne 1 − moyenne 2) / écart-type ; un échantillon : d = (x̄ − μ₀)/σ̂ ; deux échantillons : d = (x̄₁ − x̄₂)/σ̂p ; apparié : d = D̄/σ̂D","explication":"Le d de Cohen exprime la différence entre les moyennes en nombre d'écarts-types. Guide approximatif : environ 0,2 = effet petit, 0,5 = effet modéré, 0,8 = effet grand, à interpréter avec prudence selon le contexte pratique."},{"nom":"Statistique W de Shapiro-Wilk","formule":"W = (Σᵢ aᵢXᵢ)² / Σᵢ(Xᵢ − x̄)²","explication":"Test de l'hypothèse nulle que les N observations sont normalement distribuées. W vaut au maximum 1 (données « parfaitement normales ») et, contrairement à la plupart des statistiques de test, ce sont les petites valeurs de W qui signalent un écart à la normalité."}],"jamovi":"Un échantillon : Analyses → T-Tests → One Sample T-Test → variable dans Dependent Variables → Hypothesis → Test value (ex. 67.5). Indépendants : Analyses → T-Tests → Independent Samples T-Test → Dependent Variables + Grouping Variable → Tests : Student's / Welch's / Mann-Whitney U. Apparié : Analyses → T-Tests → Paired Samples T-Test → deux mesures dans Paired Variables → option Wilcoxon rank (ou Data → Compute → différence → One Sample T-Test). Options : Additional Statistics → Mean difference, Effect size (d de Cohen), Confidence interval, Descriptives. Vérifications : Assumption Checks → Normality (Shapiro-Wilk) + Equality of variances (Levene, indépendants seulement). Unilatéral : Hypothesis → > / < Test value, Group 1 > Group 2, Measure 1 > Measure 2. Descriptifs : Exploration → Descriptives.","glossaire":[{"terme":"z-test","definition":"Test comparant la moyenne d'un échantillon à une valeur hypothétique en supposant l'écart-type de population σ connu ; la statistique z suit une loi normale standard. Presque jamais utilisé en pratique car σ n'est jamais réellement connu."},{"terme":"Distribution t","definition":"Distribution d'échantillonnage de la statistique t, semblable à la normale mais avec des queues plus épaisses ; elle dépend des degrés de liberté et devient pratiquement identique à la normale quand ils augmentent."},{"terme":"Degrés de liberté (ddl)","definition":"En gros, le nombre de points de données moins le nombre de contraintes : N − 1 pour un test t à un échantillon ou apparié, N − 2 pour le test de Student. Dans le test de Welch, ils sont calculés autrement et ne sont généralement pas entiers."},{"terme":"Homogénéité de la variance (homoscédasticité)","definition":"Hypothèse du test de Student selon laquelle l'écart-type de population est le même dans les deux groupes (σ₁ = σ₂). Elle peut être testée avec le test de Levene, et le test de Welch permet de s'en passer."},{"terme":"Estimation globale (poolée) de l'écart-type","definition":"Estimation unique σ̂p de l'écart-type commun aux deux groupes, obtenue par une moyenne pondérée des variances des échantillons (poids Nₖ − 1), soit la somme des écarts quadratiques divisée par N − 2."},{"terme":"Test de Welch","definition":"Variante du test t pour échantillons indépendants qui ne suppose pas l'égalité des variances : l'erreur type combine les variances séparées des deux groupes et les degrés de liberté ne sont pas entiers. Généralement préférable quand on doute de l'égalité des écarts-types."},{"terme":"Test t pour échantillons appariés","definition":"Test utilisé quand chaque participant fournit deux scores (mesures répétées) : on teste si la moyenne des scores de différence intra-sujet est nulle. C'est au fond un test t à un échantillon appliqué à la variable de différence."},{"terme":"Test unilatéral","definition":"Test dont l'hypothèse alternative ne porte que sur une direction (par exemple μ > 67,5) : la zone de rejet est concentrée d'un seul côté et l'intervalle de confiance devient unilatéral. Légitime à condition d'être planifié à l'avance."},{"terme":"d de Cohen","definition":"Mesure standard de la taille de l'effet pour un test t : la différence entre les moyennes exprimée en nombre d'écarts-types. Guide approximatif : 0,2 petit, 0,5 modéré, 0,8 grand."},{"terme":"Graphique QQ (quantile-quantile)","definition":"Graphique de diagnostic où chaque observation est tracée selon son quantile théorique sous la normalité (x) et son quantile observé (y) : des données normales forment une ligne droite, une asymétrie ou une forte kurtosis courbe le tracé."},{"terme":"Test de Shapiro-Wilk","definition":"Test formel de normalité dont l'hypothèse nulle est que les données sont normalement distribuées ; de petites valeurs de la statistique W (maximum 1) et un p faible indiquent une violation de la normalité."},{"terme":"Test non paramétrique (Wilcoxon / Mann-Whitney)","definition":"Test qui ne fait aucune supposition sur la distribution des données : le U de Mann-Whitney remplace le test t indépendant, et le W de Wilcoxon remplace les tests t à un échantillon ou appariés. Ils sont toutefois habituellement moins puissants que les tests t."}],"quiz":[{"question":"Pourquoi le z-test à un échantillon n'est-il presque jamais utilisé dans la vraie vie ?","options":["Parce qu'il exige des échantillons de très grande taille","Parce qu'il ne fonctionne que pour des données non normales","Parce qu'il suppose que l'écart-type de la population est connu, ce qui est toujours faux en pratique","Parce qu'il ne peut pas être bilatéral"],"bonne":2,"explication":"Le manuel qualifie de « stupide » l'hypothèse d'un σ connu : dans aucun problème réel on ne connaît l'écart-type d'une population tout en ignorant sa moyenne. C'est précisément ce défaut qui motive le test t, où σ est remplacé par son estimation σ̂."},{"question":"Un chercheur mesure la mémoire de travail des mêmes 25 participants avec et sans musique. Quel test doit-il utiliser pour comparer les deux conditions ?","options":["Un test t pour échantillons appariés","Un test t pour échantillons indépendants (Student)","Un z-test à un échantillon","Un test de Levene"],"bonne":0,"explication":"Chaque participant apparaît dans les deux conditions (plan à mesures répétées) : il faut un test t apparié, qui analyse les différences intra-sujet. Un test indépendant confondrait ces différences avec la variabilité entre sujets."},{"question":"Quelle est la principale différence d'hypothèses entre le test de Student et le test de Welch pour échantillons indépendants ?","options":["Welch ne suppose pas la normalité des données","Welch ne suppose pas l'indépendance des observations","Student ne nécessite pas de variable de regroupement","Welch ne suppose pas l'homogénéité de la variance (écarts-types égaux)"],"bonne":3,"explication":"Les deux tests supposent la normalité et l'indépendance ; seul Student suppose en plus que les deux populations ont le même écart-type. Welch calcule l'erreur type à partir des variances séparées et des degrés de liberté non entiers, ce qui le rend robuste aux variances inégales."},{"question":"Sur les données de Harpo, Student donne p = .043 (significatif) et Welch p = .054 (non significatif). Quelle est la bonne attitude selon le manuel ?","options":["Conclure que les données sont inutilisables et abandonner l'analyse","Ne pas surinterpréter la différence entre un p proche de .05 de part et d'autre du seuil, et réfléchir au test le plus approprié (Welch étant souvent préférable)","Choisir le test de Student parce qu'il est significatif","Faire la moyenne des deux valeurs p"],"bonne":1,"explication":"Le manuel avertit qu'il n'est pas raisonnable d'interpréter la différence entre p = .049 et p = .051 : dans la vraie vie, un tel écart est presque certainement dû au hasard. Ce qui compte est de choisir le test adapté ; l'auteur préfère Welch car l'égalité parfaite des écarts-types de population est peu crédible."},{"question":"Dans un test t pour échantillons indépendants, votre statistique t est négative. Qu'est-ce que cela signifie ?","options":["Que le test n'est pas significatif","Que l'hypothèse de normalité est violée","Simplement que la moyenne du groupe 2 est supérieure à celle du groupe 1 ; le choix du groupe 1 est arbitraire et la valeur p bilatérale est inchangée","Qu'il faut refaire le test avec Welch"],"bonne":2,"explication":"t = (moyenne 1 − moyenne 2)/SE : le signe dépend seulement de quel groupe est étiqueté « 1 ». Pour un test bilatéral, la valeur p est identique quel que soit l'ordre ; pour savoir quel groupe est le meilleur, le plus simple est de regarder les moyennes des groupes dans la sortie Jamovi."},{"question":"Qu'est-ce qui change dans la sortie Jamovi quand on passe d'un test t bilatéral à un test unilatéral ?","options":["La statistique t et les degrés de liberté changent, mais pas la valeur p","Le d de Cohen double","Rien ne change, seul le libellé de l'hypothèse est différent","La valeur p change et l'intervalle de confiance devient unilatéral ; la statistique t et les ddl restent identiques"],"bonne":3,"explication":"Le test unilatéral a une zone de rejet différente, donc la valeur p change, et Jamovi rapporte un intervalle de confiance unilatéral (une seule borne, l'autre étant infinie). La statistique t et les degrés de liberté, eux, ne dépendent pas de la direction de l'hypothèse."},{"question":"Un test t donne d de Cohen = 0,74. Selon le guide approximatif de Cohen, comment qualifier cet effet ?","options":["Un effet plutôt grand : les moyennes sont séparées d'environ 0,74 écart-type (entre modéré, 0,5, et grand, 0,8)","Un effet nul, car d doit dépasser 1 pour compter","Un petit effet, car d est inférieur à 1","Impossible à dire sans la valeur p"],"bonne":0,"explication":"Le guide de Cohen indique environ 0,2 = petit, 0,5 = modéré, 0,8 = grand ; d = 0,74 se situe donc entre modéré et grand. Le manuel rappelle toutefois de ne pas appliquer ce guide aveuglément : d décrit la séparation des moyennes en écarts-types, et son importance dépend du contexte pratique."},{"question":"Quelle particularité distingue la statistique W de Shapiro-Wilk de la plupart des statistiques de test ?","options":["Elle peut être négative quand les données sont asymétriques","Ce sont les petites valeurs de W (le maximum étant 1) qui indiquent un écart à la normalité","Elle suit toujours une distribution normale standard","Plus W est grand, plus les données s'écartent de la normalité"],"bonne":1,"explication":"W vaut au maximum 1, valeur atteinte quand les données semblent parfaitement normales ; plus W est petit, moins les données sont normales. C'est l'inverse de la logique habituelle où de grandes statistiques signalent un effet, et la distribution d'échantillonnage de W dépend en outre de N."},{"question":"Vos données violent clairement la normalité (Shapiro-Wilk significatif, QQ plot courbé) et vous voulez comparer deux groupes indépendants. Que faire ?","options":["Utiliser quand même le test de Student, qui n'a pas d'hypothèse de normalité","Utiliser le test de Welch, conçu pour les données non normales","Utiliser le test U de Mann-Whitney, test non paramétrique qui ne fait aucune supposition sur la distribution","Supprimer les observations extrêmes jusqu'à ce que Shapiro-Wilk devienne non significatif"],"bonne":2,"explication":"Le Mann-Whitney U est l'équivalent non paramétrique du test t indépendant : il compare chaque observation d'un groupe à chaque observation de l'autre sans supposer de distribution. Attention au piège : Welch dispense de l'égalité des variances, pas de la normalité. Le prix à payer est une puissance généralement moindre que le test t."},{"question":"Pourquoi l'estimation poolée de la variance dans le test de Student divise-t-elle par N − 2 et non par N − 1 ?","options":["C'est une convention arbitraire sans justification","Parce qu'il y a deux groupes, on divise une fois par N₁ et une fois par N₂","Pour rendre le test plus conservateur face aux variances inégales","Parce que le calcul repose sur deux moyennes d'échantillon estimées (une par groupe), soit deux contraintes qui biaisent la variance si on n'en tient pas compte"],"bonne":3,"explication":"Diviser par N sous-estime la variance car les écarts sont mesurés par rapport aux moyennes d'échantillon ; chaque moyenne estimée coûte un degré de liberté. Avec un échantillon on divisait par N − 1 ; avec deux moyennes de groupe estimées, il faut diviser par N − 2, ce qui correspond aussi aux degrés de liberté du test."}],"exercice":{"titre":"Anastasia contre Bernadette : analyse complète d'une comparaison de deux groupes","enonce":"Reprenez le fichier harpo.csv du manuel (33 étudiants du Dr Harpo : variables ID, grade et tuteur, avec N₁ = 15 élèves dans les travaux dirigés d'Anastasia et N₂ = 18 dans ceux de Bernadette). Question de recherche : les élèves d'Anastasia et de Bernadette obtiennent-ils en moyenne les mêmes notes ? Dans Jamovi : (1) importez harpo.csv et vérifiez que « grade » est bien traitée comme variable continue ; (2) obtenez les moyennes et écarts-types par groupe ; (3) effectuez un test t pour échantillons indépendants en demandant à la fois le test de Student et le test de Welch, avec la différence des moyennes, l'intervalle de confiance à 95 %, la taille d'effet, et les vérifications d'hypothèses (normalité et égalité des variances) ; (4) interprétez et rédigez le résultat comme dans un article, en indiquant t, ddl, p, IC95 et d de Cohen ; (5) indiquez ce que vous feriez si le test de Shapiro-Wilk avait été clairement significatif.","correction":"Étape 1 : ouvrir harpo.csv dans Jamovi ; si « grade » a été importée en variable nominale, changer son niveau de mesure en « Continuous » (double-clic sur l'en-tête de colonne). Étape 2 : Exploration > Descriptives, avec grade en variable et tuteur en « Split by » : élèves d'Anastasia, moyenne = 74,53, écart-type = 9,00, N = 15 ; élèves de Bernadette, moyenne = 69,06, écart-type = 5,77, N = 18. Étape 3 : Analyses > T-Tests > Independent Samples T-Test ; glisser grade dans « Dependent Variables » et tuteur dans « Grouping Variable » ; cocher « Student's » et « Welch's » sous Tests, puis « Mean difference », « Effect size », « Confidence interval », « Descriptives » sous Additional Statistics, et « Normality » et « Equality of variances » sous Assumption Checks. Étape 4 : résultats : test de Student t(31) = 2,12, p = .043, différence des moyennes = 5,48, IC95 = [0,20 ; 10,76], d = 0,74 ; test de Welch t(23,02) = 2,03, p = .054, IC95 = [−0,09 ; 11,05], d = 0,74. Shapiro-Wilk n'est pas significatif (pas de preuve de non-normalité) et le test de Levene non plus (p = .12, pas de preuve d'inégalité des variances). Rédaction possible : « La note moyenne dans la classe d'Anastasia était de 74,5 (écart-type = 9,0) et celle de la classe de Bernadette de 69,1 (écart-type = 5,8). Le test t de Student pour échantillons indépendants montre que cette différence de 5,4 points est significative (t(31) = 2,1, p < .05, IC95 = [0,2 ; 10,8], d = 0,74), un effet plutôt grand. » On notera toutefois qu'avec Welch le résultat passe juste au-dessus du seuil (p = .054) : il ne faut pas surinterpréter cette différence entre les deux valeurs p, mais elle rappelle que la significativité est ici fragile, et l'auteur du manuel recommande plutôt Welch en pratique puisque l'égalité exacte des écarts-types de population est peu plausible. Étape 5 : si Shapiro-Wilk avait clairement rejeté la normalité (petit W, p faible, QQ plot courbé), on remplacerait le test t par son équivalent non paramétrique en cochant « Mann-Whitney U » sous Tests, en acceptant une puissance un peu moindre."}},{"numero":12,"titre":"Corrélation et régression linéaire","sections":[{"titre":"Corrélation et coefficient de Pearson","points":["Le fichier parenthood.csv contient le sommeil de Dan, le sommeil du bébé et la grinchiosité de Dan.","Le diagramme de dispersion donne une première idée de la force et de la direction de la relation.","Le coefficient r de Pearson varie de -1 à +1, la valeur 0 indiquant l'absence de relation.","Le r est une covariance standardisée, obtenue en divisant la covariance par le produit des deux écarts-types.","Cette standardisation élimine le problème des unités, comme le produit ininterprétable « heures × grinchiosité » de la covariance."]},{"titre":"Interpréter une corrélation et le quatuor d'Anscombe","points":["L'interprétation d'une corrélation dépend du contexte : un r de 0,3 peut être excellent en psychologie.","En guide, une corrélation de 0 à 0,2 est négligeable, de 0,2 à 0,4 faible, de 0,4 à 0,7 modérée.","Une corrélation de 0,7 à 0,9 est forte, de 0,9 à 1 très forte, seuils identiques en négatif.","Le quatuor d'Anscombe montre quatre jeux de données très différents partageant exactement la même corrélation de 0,816.","La leçon est qu'il faut toujours tracer ses données brutes avant d'interpréter une statistique."]},{"titre":"Corrélation de rang de Spearman","points":["La corrélation de Pearson mesure uniquement la force de la relation linéaire entre deux variables.","Pour une relation monotone mais non linéaire, comme entre effort d'étude et note, Pearson ne donne que 0,91.","La corrélation de Spearman, notée rho, est la corrélation calculée sur les rangs des observations.","Le rho vaut exactement 1 lorsque les classements des deux variables sont parfaitement identiques.","Dans Jamovi, il suffit de cocher l'option Spearman dans l'analyse Correlation Matrix."]},{"titre":"Le modèle de régression linéaire simple et son estimation","points":["La droite de régression s'écrit Ŷ = b₀ + b₁X et prédit la variable résultat à partir du prédicteur.","Le coefficient b₀ est l'intersection, valeur prédite quand X vaut zéro, et b₁ est la pente de la droite.","Le résidu est l'écart entre la valeur réellement observée et la valeur prédite par la droite.","La méthode des moindres carrés ordinaires choisit les coefficients qui minimisent la somme des résidus au carré.","Dans l'exemple, chaque heure de sommeil supplémentaire réduit la grinchiosité prédite d'environ 8,94 points."]},{"titre":"Régression multiple et qualité d'ajustement (R²)","points":["La régression multiple utilise plusieurs prédicteurs à la fois et définit un plan plutôt qu'une droite.","L'estimation reste identique : on choisit les coefficients qui minimisent la somme des carrés des résidus.","Le R² indique la proportion de variance de la variable résultat expliquée par le modèle.","Dans l'exemple, le sommeil de Dan explique à lui seul 81,6 % de la variance de sa grinchiosité.","Avec un seul prédicteur, R² égale r au carré ; le R² ajusté pénalise l'ajout de prédicteurs inutiles."]},{"titre":"Tests d'hypothèses et coefficients standardisés","points":["Le test F global compare le modèle complet au modèle nul qui ne contient que l'intersection.","Chaque coefficient possède son propre test t, obtenu en divisant l'estimation par son erreur standard.","Dans l'exemple, le modèle global est très significatif alors que le sommeil du bébé ne l'est pas.","Un test F significatif ne garantit donc pas que chaque prédicteur du modèle soit réellement utile.","L'intervalle de confiance encadre chaque coefficient, et les coefficients standardisés bêta comparent des prédicteurs d'échelles différentes."]},{"titre":"Hypothèses du modèle et vérification : résidus, données anormales, colinéarité","points":["Le modèle suppose la normalité, la linéarité, l'homogénéité de variance et l'indépendance des résidus.","On vérifie ces hypothèses avec un graphique Q-Q et des graphiques de résidus sans structure apparente.","Une valeur aberrante présente un grand résidu studentisé ; un point à fort levier est inhabituel sur les prédicteurs.","Une observation influente combine les deux défauts : une distance de Cook supérieure à 1 est préoccupante.","Des VIF élevés signalent une colinéarité entre prédicteurs, qui rend les coefficients très incertains."]},{"titre":"Sélection de modèle et comparaison de modèles","points":["La sélection d'un modèle repose sur la théorie et le rasoir d'Ockham, qui équilibre simplicité et ajustement.","Le critère AIC pénalise l'erreur et la complexité : le modèle au plus faible AIC (ou BIC) est préféré.","Les procédures de sélection automatisées demandent de la prudence, car l'interprétabilité du modèle prime.","Deux modèles imbriqués se comparent par un test F hiérarchique, avec les blocs du Model Builder de Jamovi.","Dans l'exemple, ajouter le sommeil du bébé n'améliore pas le modèle : ce prédicteur est inutile."]}],"concepts":["Coefficient de corrélation de Pearson (r)","Covariance et standardisation","Corrélation de rang de Spearman (ρ)","Quatuor d'Anscombe : toujours tracer les données","Droite de régression et moindres carrés ordinaires (MCO)","R² et R² ajusté (coefficient de détermination)","Test F global et tests t sur les coefficients","Coefficients standardisés (β)","Outliers, effet de levier et distance de Cook","Colinéarité (VIF) et sélection de modèle (AIC, régression hiérarchique)"],"formules":[{"nom":"Covariance","formule":"Cov(X,Y) = 1/(N-1) × Σᵢ (Xᵢ - X̄)(Yᵢ - Ȳ)","explication":"Produit croisé moyen entre X et Y : elle capte le signe de la relation (positive, négative ou nulle) mais son amplitude dépend des unités et n'est pas interprétable directement."},{"nom":"Corrélation de Pearson","formule":"r₍XY₎ = Cov(X,Y) / (σ̂X × σ̂Y)","explication":"Covariance standardisée par les deux écarts-types ; r varie entre -1 (relation négative parfaite) et +1 (relation positive parfaite), 0 signifiant l'absence de relation linéaire."},{"nom":"Modèle de régression linéaire simple","formule":"Yᵢ = b₀ + b₁Xᵢ + εᵢ  (prédiction : Ŷᵢ = b₀ + b₁Xᵢ)","explication":"b₀ est l'intersection (valeur attendue de Y quand X = 0), b₁ la pente (variation de Y pour une augmentation de X d'une unité) et εᵢ = Yᵢ - Ŷᵢ le résidu."},{"nom":"Régression linéaire multiple","formule":"Yᵢ = b₀ + b₁Xᵢ₁ + b₂Xᵢ₂ + εᵢ  (cas général : Yᵢ = b₀ + Σₖ bₖXᵢₖ + εᵢ)","explication":"Extension du modèle simple à K prédicteurs ; les coefficients estimés restent ceux qui minimisent la somme des résidus au carré Σᵢ εᵢ²."},{"nom":"Coefficient de détermination","formule":"R² = 1 - SSᵣₑₛ/SSₜₒₜ  avec SSᵣₑₛ = Σᵢ(Yᵢ - Ŷᵢ)² et SSₜₒₜ = Σᵢ(Yᵢ - Ȳ)²","explication":"Proportion de la variance de la variable résultat expliquée par le modèle ; R² = 1 signifie une prédiction parfaite, R² = 0 un modèle inutile. Pour un seul prédicteur, R² = r²."},{"nom":"R² ajusté","formule":"adj. R² = 1 - (SSᵣₑₛ/SSₜₒₜ) × (N-1)/(N-K-1)","explication":"Correction tenant compte des degrés de liberté : il n'augmente que si un nouveau prédicteur améliore le modèle plus qu'attendu par hasard, mais il perd l'interprétation en proportion de variance."},{"nom":"Statistique F du modèle","formule":"F = MSₘₒd/MSᵣₑₛ  avec MSₘₒd = SSₘₒd/dfₘₒd et MSᵣₑₛ = SSᵣₑₛ/dfᵣₑₛ (dfₘₒd = K, dfᵣₑₛ = N-K-1)","explication":"Teste le modèle dans son ensemble contre le modèle nul à intersection seule ; de grandes valeurs de F indiquent que l'hypothèse nulle fonctionne mal."},{"nom":"Test t d'un coefficient","formule":"t = b̂ / SE(b̂),  df = N - K - 1","explication":"Teste H₀ : b = 0 contre H₁ : b ≠ 0 pour chaque coefficient individuel ; des valeurs extrêmes de t conduisent à rejeter l'hypothèse nulle."},{"nom":"Intervalle de confiance d'un coefficient","formule":"CI(b) = b̂ ± (tcrit × SE(b̂))","explication":"Exprime l'incertitude sur la vraie valeur de b ; pour un IC à 95 %, tcrit est le quantile 97,5 d'une distribution t à N-K-1 degrés de liberté."},{"nom":"Coefficient standardisé","formule":"βX = bX × (σX/σY)","explication":"Coefficient qu'on aurait obtenu en convertissant toutes les variables en z-scores ; β = 1 signifie qu'une augmentation d'un écart-type du prédicteur produit une augmentation d'un écart-type du résultat."},{"nom":"Distance de Cook","formule":"Dᵢ = (εᵢ*²/(K+1)) × (hᵢ/(1-hᵢ))","explication":"Mesure l'influence d'une observation en combinant son caractère aberrant (résidu studentisé) et son effet de levier (valeur chapeau hᵢ) ; une valeur supérieure à 1 est souvent considérée comme grande."},{"nom":"Facteur d'inflation de variance","formule":"VIFₖ = 1 / (1 - R²₍₋ₖ₎)","explication":"R²₍₋ₖ₎ est le R² obtenu en régressant Xₖ sur tous les autres prédicteurs ; un VIF élevé signale une forte colinéarité, et sa racine carrée indique de combien l'intervalle de confiance de bₖ est gonflé."},{"nom":"Critère d'information d'Akaike","formule":"AIC = SSᵣₑₛ/σ̂² + 2K","explication":"Critère de sélection de modèle qui pénalise à la fois les mauvaises prédictions (terme de gauche) et la complexité (terme 2K) ; plus l'AIC est faible, meilleur est le modèle."}],"jamovi":"Corrélations : Analyses → Regression → Correlation Matrix → transférer les variables → cocher Pearson/Spearman + Report Significance (+ Confidence intervals). Nuage de points : Correlation Matrix → Plot → Correlation matrix + Densities for variables ; ou module Scatr : icône « + » → bibliothèque Jamovi → scatr → Install → Exploration → Scatterplot. Régression simple : Analyses → Regression → Linear Regression → dan.grump en Dependent Variable → dan.sleep en Covariates. Régression multiple : ajouter baby.sleep en Covariates. Ajustement : Model Fit → cocher R, R², Adjusted R², AIC/BIC, F test. Coefficients : Model Coefficients → Confidence interval (95 %) + Standardized estimate (β). Hypothèses : Assumption Checks → Q-Q plot of residuals + Residual plots + Collinearity statistics (VIF) + Cook's distance (Data Summary). Comparaison hiérarchique : Model Builder → Block 1 (dan.sleep, day) → Block 2 (baby.sleep) → tableau Model Comparisons (test F, AIC/BIC).","glossaire":[{"terme":"Corrélation de Pearson (r)","definition":"Mesure standardisée de la force et de la direction de la relation linéaire entre deux variables continues, variant de -1 à +1."},{"terme":"Covariance","definition":"Produit croisé moyen entre deux variables qui capte le signe de leur relation, mais dont l'amplitude dépend des unités et n'est pas interprétable directement."},{"terme":"Corrélation de Spearman (ρ)","definition":"Corrélation calculée sur les rangs des observations plutôt que sur leurs valeurs ; elle mesure la force d'une relation ordinale (monotone), pas seulement linéaire."},{"terme":"Droite de régression","definition":"Droite Ŷᵢ = b₀ + b₁Xᵢ qui passe au milieu des données et résume la relation entre le prédicteur et la variable résultat."},{"terme":"Résidu (εᵢ)","definition":"Différence entre la valeur observée et la valeur prédite par le modèle : εᵢ = Yᵢ - Ŷᵢ. On distingue les résidus ordinaires, standardisés et studentisés."},{"terme":"Moindres carrés ordinaires (MCO)","definition":"Méthode d'estimation qui choisit les coefficients b̂₀ et b̂₁ minimisant la somme des résidus au carré Σᵢ(Yᵢ - Ŷᵢ)²."},{"terme":"Coefficient de détermination (R²)","definition":"Proportion de la variance de la variable résultat expliquée par le modèle de régression ; pour un modèle à un seul prédicteur, R² égale le carré de la corrélation r."},{"terme":"Coefficient standardisé (β)","definition":"Coefficient de régression exprimé en écarts-types (comme si toutes les variables étaient des z-scores), utile pour comparer des prédicteurs mesurés sur des échelles différentes."},{"terme":"Valeur aberrante (outlier)","definition":"Observation très différente de ce que le modèle prévoit, repérée par un grand résidu studentisé ; elle mérite examen mais ne doit pas être supprimée automatiquement."},{"terme":"Effet de levier (valeur chapeau hᵢ)","definition":"Mesure du caractère inhabituel d'une observation sur les variables prédictrices ; un levier élevé (plus de 2-3 fois la moyenne) signale un point éloigné des autres en X."},{"terme":"Distance de Cook","definition":"Mesure de l'influence d'une observation combinant résidu et effet de levier ; une distance supérieure à 1 suggère que le point déforme fortement la droite de régression."},{"terme":"Colinéarité et VIF","definition":"Situation où les prédicteurs sont fortement corrélés entre eux ; le facteur d'inflation de variance (VIF) la diagnostique, un VIF élevé rendant les coefficients très incertains."},{"terme":"Régression hiérarchique","definition":"Approche où l'on place les covariables de contrôle dans un modèle nul puis on ajoute les variables d'intérêt dans un modèle alternatif, comparés par un test F (Model Builder dans Jamovi)."}],"quiz":[{"question":"Un coefficient de corrélation de Pearson r = -0,85 entre le sommeil et la grinchiosité indique :","options":["Une relation positive faible","Une absence de relation","Une relation négative forte : plus de sommeil est associé à moins de grinchiosité","Que dormir cause une baisse de 85 % de la grinchiosité"],"bonne":2,"explication":"Selon le guide du manuel, une valeur entre -0,9 et -0,7 correspond à une relation forte et négative : quand une variable augmente, l'autre tend à diminuer. La corrélation ne dit rien sur la causalité ni sur un pourcentage de réduction."},{"question":"Pourquoi utilise-t-on la corrélation r plutôt que la covariance brute ?","options":["Parce que la covariance est standardisée entre -1 et 1, mais dépend des unités des variables ; r corrige cela en divisant par les deux écarts-types","Parce que la covariance ne peut pas être négative","Parce que la covariance ne détecte que les relations non linéaires","Parce que r se calcule sans connaître les moyennes"],"bonne":0,"explication":"La covariance capte bien le signe de la relation, mais son amplitude dépend des unités (par exemple « heures × grinchiosité », ininterprétable). En la divisant par σ̂X × σ̂Y, on obtient r, une mesure standardisée entre -1 et 1."},{"question":"Que nous enseigne le quatuor d'Anscombe ?","options":["Que quatre variables suffisent pour toute analyse","Que la corrélation de Spearman est toujours supérieure à celle de Pearson","Que r = 0,816 correspond toujours à une relation forte et fiable","Que des jeux de données très différents peuvent avoir exactement la même corrélation : il faut toujours tracer ses données brutes"],"bonne":3,"explication":"Les quatre ensembles d'Anscombe ont tous r = 0,816, mêmes moyennes et écarts-types presque identiques, mais des nuages de points qualitativement très différents. La statistique seule peut être trompeuse : il faut toujours regarder le graphique."},{"question":"Dans quel cas la corrélation de Spearman est-elle préférable à celle de Pearson ?","options":["Quand les deux variables sont parfaitement normales","Quand la relation est monotone mais non linéaire, comme entre les heures d'étude et la note obtenue","Quand on veut mesurer la pente de la droite de régression","Quand l'échantillon dépasse 100 observations"],"bonne":1,"explication":"Spearman travaille sur les rangs : dans l'exemple du manuel, plus d'effort augmente toujours la note (relation ordinale parfaite, ρ = 1) alors que Pearson ne donne que r = 0,91 car la relation n'est pas linéaire."},{"question":"Dans le modèle Ŷᵢ = 125,96 + (-8,94 Xᵢ) prédisant la grinchiosité à partir des heures de sommeil, que signifie le coefficient -8,94 ?","options":["La grinchiosité maximale possible","La corrélation entre les deux variables","Chaque heure de sommeil supplémentaire réduit la grinchiosité prédite de 8,94 points","Le pourcentage de variance expliquée par le sommeil"],"bonne":2,"explication":"La pente b₁ indique la variation de Y quand X augmente d'une unité : ici, une heure de sommeil en plus est associée à une baisse de 8,94 points de grinchiosité. L'intersection 125,96 est la grinchiosité prédite pour zéro heure de sommeil."},{"question":"Un modèle de régression donne R² = 0,816. Quelle est l'interprétation correcte ?","options":["Le prédicteur explique 81,6 % de la variance de la variable résultat","Le modèle se trompe dans 81,6 % des cas","La corrélation entre les variables est de 0,816","81,6 % des observations sont sur la droite de régression"],"bonne":0,"explication":"R² est le coefficient de détermination : la proportion de la variance du résultat prise en compte par le modèle. Attention : pour un seul prédicteur, la corrélation serait √0,816 ≈ 0,90, pas 0,816."},{"question":"Pourquoi rapporter parfois le R² ajusté plutôt que le R² ?","options":["Parce que le R² ajusté est toujours plus grand","Parce que le R² ajusté s'interprète directement comme une proportion de variance","Parce que le R² ordinaire ne peut pas dépasser 0,5","Parce que le R² augmente mécaniquement à chaque prédicteur ajouté, alors que le R² ajusté n'augmente que si l'ajout améliore le modèle plus qu'attendu par hasard"],"bonne":3,"explication":"Ajouter des prédicteurs ne peut jamais faire baisser R², même s'ils sont inutiles. Le R² ajusté pénalise la complexité via les degrés de liberté ; en contrepartie, il perd l'interprétation simple en proportion de variance expliquée."},{"question":"Dans l'exemple du manuel, le test F global est très significatif (F(2,97) = 215,24, p < .001) mais le test t de baby.sleep donne p = 0,97. Que faut-il conclure ?","options":["Le test F est faux puisque les deux tests se contredisent","Le modèle global fait mieux que le hasard, mais baby.sleep n'apporte rien : tout le travail est fait par dan.sleep, et on ferait mieux de retirer baby.sleep","baby.sleep est le prédicteur le plus important du modèle","Il faut augmenter la taille de l'échantillon avant de conclure"],"bonne":1,"explication":"Réussir le test F ne signifie pas que le modèle est le bon : il indique seulement que le modèle fait mieux que le modèle nul. Les tests t individuels montrent que baby.sleep a un coefficient minuscule et non significatif ; le modèle simple avec dan.sleep seul est meilleur."},{"question":"Quelle est la différence entre une valeur aberrante, un point à fort effet de levier et une observation influente ?","options":["Ce sont trois noms pour le même phénomène","L'aberrante a un fort levier, le levier a un grand résidu, l'influente n'a ni l'un ni l'autre","L'aberrante a un grand résidu studentisé, le point à fort levier est inhabituel sur les prédicteurs (hᵢ élevé), et l'observation influente combine les deux et déforme la droite (distance de Cook élevée)","Seules les valeurs aberrantes doivent être supprimées automatiquement"],"bonne":2,"explication":"Le manuel distingue trois cas : l'outlier est loin de la prédiction (grand résidu), le point à fort levier est inhabituel en X mais peut être proche de la droite, et le point influent est à la fois aberrant et à fort levier, ce qui déforme réellement la régression (Dᵢ > 1 est préoccupant). Aucune observation ne doit être jetée sans examen."},{"question":"Le VIF de chaque prédicteur d'un modèle vaut environ 6. Qu'est-ce que cela suggère ?","options":["Que les résidus ne sont pas normaux","Que le modèle explique 6 % de la variance","Que six prédicteurs doivent être ajoutés au modèle","Une forte colinéarité : les prédicteurs sont très corrélés entre eux et les coefficients sont estimés avec beaucoup d'incertitude"],"bonne":3,"explication":"VIFₖ = 1/(1-R²₍₋ₖ₎) mesure à quel point Xₖ est prédit par les autres prédicteurs. Un VIF élevé (dans l'exemple du manuel, prédire « day » donnait des VIF autour de 5-6) signale une colinéarité problématique ; la racine du VIF indique de combien l'intervalle de confiance du coefficient est gonflé, contrairement au VIF de 1,65 jugé sans problème pour dan.sleep et baby.sleep."}],"exercice":{"titre":"Sommeil et grinchiosité : de la corrélation au meilleur modèle","enonce":"Avec le fichier parenthood.csv (variables dan.sleep, baby.sleep, dan.grump et day), réalisez l'analyse complète suivante dans Jamovi : (1) calculez la matrice de corrélations de Pearson entre les quatre variables et identifiez la relation la plus forte ; (2) tracez le nuage de points entre dan.sleep et dan.grump et décrivez la relation ; (3) ajustez une régression linéaire multiple avec dan.grump comme variable dépendante et dan.sleep et baby.sleep comme covariables ; rapportez R², R² ajusté, le test F global et les tests t des coefficients ; (4) vérifiez les hypothèses du modèle (Q-Q plot des résidus, graphiques des résidus, VIF, distance de Cook) ; (5) à l'aide du Model Builder, comparez le modèle avec baby.sleep au modèle sans baby.sleep et concluez sur le meilleur modèle.","correction":"Étape 1 : Analyses > Regression > Correlation Matrix ; transférer dan.sleep, baby.sleep, dan.grump et day ; cocher Pearson et Report Significance. La relation la plus forte est dan.sleep/dan.grump avec r ≈ -0,90 (p < .001), très forte et négative ; baby.sleep/dan.grump donne r ≈ -0,57 et baby.sleep/dan.sleep r ≈ 0,63 ; day n'est corrélé avec rien. Étape 2 : dans Correlation Matrix, cocher Plot > Correlation matrix (ou utiliser le module Scatr : Exploration > Scatterplot). Le nuage montre une relation linéaire négative nette : plus Dan dort, moins il est grincheux. Étape 3 : Analyses > Regression > Linear Regression ; dan.grump en Dependent Variable, dan.sleep et baby.sleep en Covariates ; sous Model Fit cocher R, R², Adjusted R² et F test ; sous Model Coefficients cocher Confidence interval. Résultats : R² = 0,82, R² ajusté = 0,81, F(2,97) = 215,24, p < .00001 : le modèle global est très significatif. Coefficients : intersection = 125,97 (SE = 3,04, t = 41,42, p < .00001) ; dan.sleep = -8,95 (SE = 0,55, t = -16,17, p < .00001, significatif) ; baby.sleep = 0,01 (SE = 0,27, t = 0,04, p = 0,97, non significatif). Étape 4 : ouvrir Assumption Checks ; le Q-Q plot montre des résidus standardisés proches de la droite (normalité respectée) ; les Residual Plots montrent des points répartis uniformément sans structure (linéarité et homogénéité de la variance acceptables) ; Collinearity statistics donne VIF = 1,65 pour les deux prédicteurs (√1,65 ≈ 1,28, pas de problème de colinéarité) ; Cook's distance (Data Summary) : moyenne 0,01, maximum 0,11, bien en dessous du seuil de 1, donc aucune observation trop influente. Étape 5 : ouvrir Model Builder ; placer dan.sleep dans Block 1 et baby.sleep dans Block 2 (avec AIC/BIC cochés dans Model Fit). Le tableau Model Comparisons montre que l'ajout de baby.sleep n'améliore pas le modèle (F ≈ 0,00, p ≈ 0,95 ; l'AIC du modèle réduit est plus faible). Conclusion : conformément au rasoir d'Ockham, on retient le modèle simple dan.grump ~ dan.sleep : c'est le sommeil de Dan, et non celui du bébé, qui prédit sa grinchiosité — sans pour autant conclure à une causalité, car il s'agit de données observationnelles."}},{"numero":13,"titre":"Comparaison de plusieurs moyennes (ANOVA à un facteur)","sections":[{"titre":"La logique de l'ANOVA : des variances aux sommes des carrés","points":["L'ANOVA à un facteur, inventée par Fisher, permet de comparer plus de deux moyennes à la fois.","L'exemple compare le gain d'humeur selon trois conditions : placebo, Anxifree et Joyzepam.","L'hypothèse nulle affirme que toutes les moyennes de population sont égales ; l'alternative, qu'au moins une diffère.","La variabilité totale se décompose exactement en variabilité inter groupes plus variabilité intra groupes.","Si l'hypothèse nulle est vraie, la variabilité inter groupes reste petite comparée à la variabilité intra groupes."]},{"titre":"La statistique F et son interprétation","points":["Les carrés moyens s'obtiennent en divisant chaque somme des carrés par ses degrés de liberté.","Les degrés de liberté valent G moins 1 entre les groupes et N moins G à l'intérieur des groupes.","La statistique F est le rapport des deux carrés moyens : une grande valeur est une preuve contre l'hypothèse nulle.","Sous l'hypothèse nulle, les deux carrés moyens estiment la même variance d'erreur et F reste proche de 1.","Dans l'exemple, F(2,15) = 18,6 avec p = 0,00009 indique un effet significatif du médicament."]},{"titre":"Exécuter l'ANOVA dans Jamovi et taille de l'effet η²","points":["Dans Jamovi, l'ANOVA se lance en plaçant mood.gain en variable dépendante et drug en facteur fixe.","Le tableau donne sommes des carrés, degrés de liberté, F et p ; Residuals désigne la variabilité intra groupes.","L'êta carré, rapport de la somme inter groupes sur la somme totale, donne la proportion de variabilité expliquée.","Dans l'exemple, l'êta carré vaut 0,71, une mesure étroitement liée au R² de la régression.","L'êta carré est légèrement biaisé ; l'oméga carré, moins biaisé, est aussi disponible dans Jamovi."]},{"titre":"Comparaisons multiples, tests post hoc et corrections de Bonferroni et Holm","points":["Après une ANOVA significative, les tests post hoc comparent les groupes deux à deux par des tests t.","Sans correction, le taux d'erreur de type I de l'ensemble des tests devient rapidement incontrôlable.","Avec dix groupes, on effectue 45 comparaisons et on attend deux ou trois faux positifs par simple hasard.","La correction de Bonferroni multiplie chaque valeur p par le nombre de tests pour garantir le taux global.","La correction de Holm, séquentielle, est plus puissante que Bonferroni et devrait toujours lui être préférée."]},{"titre":"Les hypothèses de l'ANOVA et leur vérification (Levene, Shapiro-Wilk)","points":["L'ANOVA suppose des résidus normaux, de variance homogène entre les groupes et indépendants les uns des autres.","Le test de Levene est une ANOVA sur les écarts absolus aux moyennes ; la variante Brown-Forsythe utilise les médianes.","Une valeur p supérieure à 0,05 rend l'homogénéité plausible, mais il faut aussi inspecter les écarts-types.","Si l'homogénéité des variances est violée, on utilise le test de Welch dans One Way ANOVA.","La normalité se vérifie par graphique Q-Q et test de Shapiro-Wilk ; des mesures répétées exigent l'ANOVA appariée."]},{"titre":"Le test non paramétrique de Kruskal-Wallis","points":["Le test de Kruskal-Wallis est l'alternative non paramétrique à l'ANOVA quand la normalité est violée.","Son principe consiste à classer toutes les valeurs puis à analyser les rangs plutôt que les données brutes.","Sa statistique K suit approximativement une distribution du Khi-deux à G moins 1 degrés de liberté.","En présence de valeurs ex aequo, Jamovi applique automatiquement une correction pour les liens.","Dans l'exemple, le Khi-deux vaut 12,076 avec 2 degrés de liberté et p = 0,00239."]},{"titre":"L'ANOVA à un facteur pour mesures appariées et la sphéricité","points":["Dans un plan intra-sujets, les mêmes participants passent par toutes les conditions de l'expérience.","Retirer la variabilité due aux différences entre sujets réduit le terme d'erreur et rend le test plus puissant.","Le test de Mauchly vérifie la sphéricité, c'est-à-dire l'égalité des variances des différences entre conditions.","Si la sphéricité est violée, on applique Greenhouse-Geisser quand epsilon est inférieur à 0,75, sinon Huynh-Feldt.","Dans l'exemple sur l'aphasie, F(2,10) = 6,93 avec p = 0,013 distingue parole et syntaxe."]},{"titre":"Le test de Friedman et la relation entre ANOVA et test t","points":["Le test de Friedman est la version non paramétrique de l'ANOVA pour mesures appariées à trois conditions ou plus.","On l'utilise quand la variable est ordinale ou quand la normalité n'est pas respectée.","Dans Jamovi, il se trouve sous Repeated Measures ANOVA (Non-parametric), avec les comparaisons par paires de Durbin-Conover.","Dans l'exemple sur l'aphasie, le Khi-deux vaut 6,64 avec 2 degrés de liberté et p = 0,036.","Une ANOVA sur deux groupes équivaut exactement au test t : la statistique F est le carré de t."]}],"concepts":["ANOVA à un facteur (comparaison de G moyennes)","Décomposition SS_tot = SS_b + SS_w","Statistique F et carrés moyens (MS_b, MS_w)","Degrés de liberté (G − 1 et N − G)","Taille de l'effet η² (et ω²)","Tests post hoc et taux d'erreur de type I familial","Corrections de Bonferroni et de Holm","Hypothèses : normalité, homogénéité des variances, indépendance","Tests de Levene et de Welch, test de Kruskal-Wallis","ANOVA à mesures répétées, sphéricité (Mauchly) et test de Friedman"],"formules":[{"nom":"Somme totale des carrés","formule":"SS_tot = Σ_k Σ_i (Y_ik − Ȳ)²","explication":"Somme des écarts quadratiques de chaque observation à la moyenne générale ; elle mesure la variabilité totale des données et se décompose en SS_w + SS_b."},{"nom":"Somme des carrés intra groupes","formule":"SS_w = Σ_k Σ_i (Y_ik − Ȳ_k)²","explication":"Mesure à quel point chaque personne diffère de la moyenne de son propre groupe ; c'est la variabilité résiduelle, non expliquée par les groupes."},{"nom":"Somme des carrés inter groupes","formule":"SS_b = Σ_k N_k (Ȳ_k − Ȳ)²","explication":"Mesure les différences entre les moyennes de groupes et la moyenne générale, chaque écart au carré étant pondéré par la taille du groupe N_k."},{"nom":"Carrés moyens et statistique F","formule":"MS_b = SS_b / (G − 1) ; MS_w = SS_w / (N − G) ; F = MS_b / MS_w","explication":"On divise chaque somme des carrés par ses degrés de liberté puis on forme le rapport F ; plus F est grand, plus la variation inter groupes domine la variation intra groupes et plus on a de preuves contre H₀."},{"nom":"Taille de l'effet êta carré","formule":"η² = SS_b / SS_tot","explication":"Proportion de la variabilité de la variable résultat expliquée par le prédicteur ; η² = 0 signifie aucune relation et η² = 1 une relation parfaite."},{"nom":"Correction de Bonferroni","formule":"p' = m × p","explication":"Chaque valeur p brute est multipliée par le nombre m de tests effectués, ce qui garantit que le taux d'erreur de type I de la famille de tests ne dépasse pas α."},{"nom":"Correction de Holm","formule":"p'_j = j × p_j (puis p'_j = max(p'_j, p'_(j+1)))","explication":"Les valeurs p sont triées de la plus petite à la plus grande et multipliées séquentiellement par leur rang ; plus puissante que Bonferroni pour le même taux d'erreur de type I."},{"nom":"Variable du test de Levene","formule":"Z_ik = |Y_ik − Ȳ_k|","explication":"Le test de Levene est simplement une ANOVA sur les écarts absolus à la moyenne du groupe ; Brown-Forsythe utilise les écarts aux médianes."},{"nom":"Statistique de Kruskal-Wallis","formule":"K = (N − 1) × RSS_b / RSS_tot","explication":"Analogue de l'ANOVA basé sur les rangs ; sous H₀, K suit approximativement une distribution du Khi-deux à G − 1 degrés de liberté."},{"nom":"Terme d'erreur en mesures appariées","formule":"SS_error = SS_w − SS_subjects","explication":"En ANOVA à mesures répétées, on retire de la variabilité intra groupes la part due aux différences individuelles entre sujets, ce qui rend souvent le test plus puissant."}],"jamovi":"ANOVA : Analyses → ANOVA → ANOVA → mood.gain en Dependent Variable → drug en Fixed Factors → Effect Size → cocher η² (ou ω²). Post hoc : Post Hoc Tests → déplacer le facteur → choisir la correction (None, Bonferroni, Holm). Hypothèses : Assumption Checks → Homogeneity tests (Levene) + Normality (Shapiro-Wilk) + Q-Q plot. Variances inégales : Analyses → ANOVA → One Way ANOVA → cocher Don't assume equal (Welch's). Normalité violée : Analyses → ANOVA → One Way ANOVA (Non-parametric, Kruskal-Wallis). Mesures répétées : Analyses → ANOVA → Repeated Measures ANOVA → nommer le facteur et ses niveaux → glisser les variables dans Repeated Measures Cells → cocher Sphericity checks (Mauchly) → Sphericity Corrections (Greenhouse-Geisser ou Huynh-Feldt). Friedman : Analyses → ANOVA → Repeated Measures ANOVA (Non-parametric) → variables dans Measures → comparaisons Durbin-Conover.","glossaire":[{"terme":"ANOVA à un facteur","definition":"Analyse de variance comparant les moyennes d'une variable dépendante entre plusieurs groupes définis par une seule variable de regroupement ; H₀ affirme que toutes les moyennes de population sont identiques."},{"terme":"Somme des carrés inter groupes (SS_b)","definition":"Quantité mesurant les différences entre les moyennes des groupes et la moyenne générale, pondérées par les tailles de groupes ; elle capture la variation « due aux groupes »."},{"terme":"Somme des carrés intra groupes (SS_w)","definition":"Quantité mesurant les écarts de chaque observation à la moyenne de son propre groupe ; elle correspond à la variabilité résiduelle, aussi appelée SS_error dans l'ANOVA pour groupes indépendants."},{"terme":"Rapport F","definition":"Statistique de test de l'ANOVA, F = MS_b / MS_w ; sous H₀ elle suit une distribution F et des valeurs nettement supérieures à 1 constituent des preuves contre l'hypothèse nulle."},{"terme":"Êta carré (η²)","definition":"Mesure de taille d'effet définie par SS_b / SS_tot, soit la proportion de la variabilité de la variable résultat expliquée par le prédicteur ; étroitement liée au R²."},{"terme":"Analyse post hoc","definition":"Ensemble de comparaisons par paires effectuées sans théorie préalable après une ANOVA significative, pour déterminer quels groupes diffèrent réellement les uns des autres."},{"terme":"Correction de Bonferroni","definition":"Ajustement pour comparaisons multiples qui multiplie chaque valeur p brute par le nombre de tests m, afin que le taux d'erreur de type I de toute la famille de tests ne dépasse pas α."},{"terme":"Correction de Holm","definition":"Ajustement séquentiel des valeurs p (triées de la plus petite à la plus grande, multipliées par leur rang) ; plus puissant que Bonferroni avec le même taux d'erreur de type I, il devrait lui être préféré en pratique."},{"terme":"Test de Levene","definition":"Test de l'hypothèse d'homogénéité des variances, qui consiste à exécuter une ANOVA sur les écarts absolus Z_ik = |Y_ik − Ȳ_k| ; la variante de Brown-Forsythe utilise les écarts aux médianes."},{"terme":"Test de Kruskal-Wallis","definition":"Alternative non paramétrique à l'ANOVA à un facteur, basée sur les rangs des observations ; sa statistique K suit approximativement une distribution du Khi-deux à G − 1 degrés de liberté sous H₀."},{"terme":"Sphéricité","definition":"Hypothèse de l'ANOVA à mesures répétées selon laquelle les variances des différences entre toutes les paires de conditions sont égales ; elle se vérifie par le test de Mauchly et, si elle est violée, on applique les corrections de Greenhouse-Geisser ou de Huynh-Feldt."},{"terme":"Test de Friedman","definition":"Version non paramétrique de l'ANOVA pour mesures appariées, utilisée avec trois conditions ou plus sur les mêmes participants lorsque la variable est ordinale ou que la normalité n'est pas respectée."}],"quiz":[{"question":"Quelle est l'hypothèse nulle d'une ANOVA à un facteur comparant trois groupes ?","options":["Les variances des trois groupes sont identiques","Au moins une moyenne diffère des autres","Les trois moyennes de population sont identiques","Les trois échantillons ont la même taille"],"bonne":2,"explication":"H₀ affirme que toutes les moyennes de population sont égales (μP = μA = μJ) ; l'hypothèse alternative est qu'au moins un groupe a une moyenne différente. Malgré son nom, l'ANOVA teste des moyennes, pas des variances."},{"question":"Comment la somme totale des carrés SS_tot se décompose-t-elle dans une ANOVA à un facteur ?","options":["SS_tot = SS_b + SS_w","SS_tot = SS_b × SS_w","SS_tot = SS_b − SS_w","SS_tot = MS_b + MS_w"],"bonne":0,"explication":"La variabilité totale se découpe exactement en la variation due aux différences entre les moyennes des groupes (SS_b) plus la variation résiduelle à l'intérieur des groupes (SS_w) : SS_w + SS_b = SS_tot."},{"question":"Avec G = 3 groupes et N = 18 observations, quels sont les degrés de liberté de la statistique F ?","options":["3 et 18","2 et 17","3 et 15","2 et 15"],"bonne":3,"explication":"df_b = G − 1 = 2 pour la variabilité inter groupes et df_w = N − G = 15 pour la variabilité intra groupes ; c'est exactement l'exemple des essais cliniques du manuel, où F(2,15) = 18,6."},{"question":"Pourquoi la valeur de F doit-elle être nettement supérieure à 1 pour rejeter l'hypothèse nulle ?","options":["Parce que F est toujours positive par construction","Parce que sous H₀, MS_b et MS_w estiment tous deux σ² et la distribution de F a une moyenne d'environ 1","Parce que la distribution F est symétrique autour de 0","Parce que le seuil alpha est fixé à 1"],"bonne":1,"explication":"MS_w estime la variance des erreurs σ², et MS_b estime σ² plus une quantité Q liée aux vraies différences de moyennes. Si H₀ est vraie, Q = 0 et F fluctue autour de 1 ; seules des valeurs supérieures à 1 apportent des preuves contre H₀."},{"question":"Une ANOVA donne SS_b = 3,45 et SS_w = 1,39. Que vaut η² et comment l'interpréter ?","options":["η² = 0,29 : l'effet est faible","η² = 2,48 : le rapport des variances est élevé","η² = 0,71 : 71 % de la variabilité du résultat est expliquée par le facteur","η² = 0,71 : la probabilité que H₀ soit fausse est de 71 %"],"bonne":2,"explication":"η² = SS_b / SS_tot = 3,45 / (3,45 + 1,39) = 3,45/4,84 = 0,71 : le prédicteur explique 71 % de la variabilité de la variable résultat. Ce n'est en aucun cas une probabilité concernant les hypothèses."},{"question":"Quel est le principal danger d'effectuer de nombreux tests t post hoc sans correction ?","options":["Le taux d'erreur de type I de la famille de tests devient hors de contrôle","Les tests deviennent trop conservateurs","Le taux d'erreur de type II augmente fortement","Les degrés de liberté diminuent à chaque test"],"bonne":0,"explication":"Chaque test t individuel a un taux d'erreur de type I de 5 %, mais en multipliant les tests (par exemple 45 tests pour 10 groupes), on s'attend à ce que 2 ou 3 soient significatifs par pur hasard : le taux d'erreur global de la famille explose, d'où la nécessité d'une correction."},{"question":"Pourquoi le manuel recommande-t-il la correction de Holm plutôt que celle de Bonferroni ?","options":["Elle est plus simple à calculer","Elle contrôle le taux de fausses découvertes plutôt que le taux d'erreur familial","Elle est plus puissante (moins d'erreurs de type II) pour le même taux d'erreur de type I","Elle ne nécessite pas de trier les valeurs p"],"bonne":2,"explication":"La correction de Holm, bien qu'un peu plus complexe (ajustement séquentiel des valeurs p triées), a le même taux d'erreur de type I que Bonferroni tout en étant plus puissante ; il n'y a donc en pratique jamais de raison de préférer Bonferroni."},{"question":"En quoi consiste exactement le test de Levene ?","options":["Un test du Khi-deux sur les variances de chaque groupe","Une comparaison des médianes de groupes par des rangs","Un test t entre la plus grande et la plus petite variance","Une ANOVA effectuée sur les écarts absolus Z_ik = |Y_ik − Ȳ_k|"],"bonne":3,"explication":"Le test de Levene crée la variable Z_ik = |Y_ik − Ȳ_k| (écart absolu à la moyenne du groupe) puis exécute une ANOVA sur cette nouvelle variable : si les moyennes des Z diffèrent entre groupes, les variances diffèrent. Brown-Forsythe fait de même avec les médianes."},{"question":"Le test de Mauchly d'une ANOVA à mesures répétées est significatif (p < .05) et l'epsilon de Greenhouse-Geisser vaut 0,60. Que faire ?","options":["Rien, la sphéricité est respectée","Appliquer la correction de Greenhouse-Geisser car ε < 0,75","Appliquer la correction de Huynh-Feldt car ε < 0,75","Passer directement au test de Kruskal-Wallis"],"bonne":1,"explication":"Un test de Mauchly significatif indique que la sphéricité est violée et qu'une correction de la valeur F est nécessaire : on utilise Greenhouse-Geisser si l'epsilon GG est inférieur à 0,75, et Huynh-Feldt s'il est supérieur à 0,75. Kruskal-Wallis concerne les groupes indépendants, pas les mesures appariées."},{"question":"Un test t de Student sur deux groupes donne t(16) = −1,3068 et p = 0,21. Que donnerait une ANOVA sur ces deux mêmes groupes ?","options":["F(1,16) = −1,31 avec p = 0,21","F(2,16) = 2,61 avec un p plus petit","F(1,16) = 1,71 avec p = 0,21","Un résultat imprévisible car l'ANOVA exige au moins trois groupes"],"bonne":2,"explication":"Une ANOVA sur deux groupes est strictement équivalente au test t de Student : la valeur p est identique et la statistique F est le carré de la statistique t, soit (−1,3068)² = 1,7077 ≈ 1,71 avec 1 et 16 degrés de liberté."}],"exercice":{"titre":"Analyse complète de l'essai clinique clinicaltrial.csv dans Jamovi","enonce":"Vous disposez du fichier clinicaltrial.csv (18 participants) contenant les variables drug (placebo, anxifree, joyzepam) et mood.gain (amélioration de l'humeur de −5 à +5). Dans Jamovi : (1) calculez les statistiques descriptives (moyennes et écarts-types) de mood.gain par médicament et tracez des boîtes à moustaches ; (2) réalisez une ANOVA à un facteur pour tester si le médicament a un effet sur l'amélioration de l'humeur, en demandant la taille de l'effet η² ; (3) vérifiez les hypothèses d'homogénéité des variances (test de Levene) et de normalité (Shapiro-Wilk et graphique QQ) ; (4) puisque l'ANOVA est significative, effectuez des tests post hoc avec la correction de Holm pour identifier quels médicaments diffèrent ; (5) rédigez le compte rendu des résultats au format standard.","correction":"Étape 1 : dans Exploration > Descriptives, placez mood.gain dans « Variables » et drug dans « Split by » ; cochez Mean, Std. deviation et Box plot. On obtient : placebo M = 0,45, anxifree M = 0,72, joyzepam M = 1,48 — le groupe Joyzepam s'améliore visiblement plus. Étape 2 : allez dans Analyses > ANOVA > ANOVA, placez mood.gain dans « Dependent Variable » et drug dans « Fixed Factors », cochez η² sous « Effect Size ». Résultat : SS_drug = 3,45 (df = 2, MS = 1,73), SS_residuals = 1,39 (df = 15, MS = 0,09), F(2,15) = 18,61, p = 0,00009, η² = 0,71 : l'effet est significatif et le médicament explique 71 % de la variabilité de l'humeur. Étape 3 : sous « Assumption Checks », cochez « Homogeneity tests » et « Normality (Shapiro-Wilk) » avec le graphique QQ. Le test de Levene donne F(2,15) = 1,45, p = 0,266 (non significatif : homogénéité plausible, à confirmer en comparant les écarts-types des groupes) ; Shapiro-Wilk donne W = 0,96, p = 0,605 et le QQ plot est à peu près linéaire : la normalité n'est pas remise en cause. Les hypothèses de l'ANOVA sont donc raisonnables (sinon, on utiliserait le test de Welch dans One Way ANOVA ou le Kruskal-Wallis). Étape 4 : dans « Post Hoc Tests », déplacez drug dans la case active et cochez « Holm ». Résultats : joyzepam vs placebo, différence moyenne = 1,03, t = 5,88, p(Holm) = 0,00009 ; joyzepam vs anxifree, différence = 0,77, t = 4,36, p(Holm) = 0,00112 ; anxifree vs placebo, différence = 0,27, t = 1,52, p(Holm) = 0,15021 (non significatif). Étape 5 : rédaction — « L'ANOVA à un facteur a montré un effet significatif du médicament sur l'amélioration de l'humeur (F(2,15) = 18,6, p < .001, η² = 0,71). Des tests post hoc avec correction de Holm ont indiqué que Joyzepam produisait une amélioration significativement plus importante que Anxifree (p = .001) et que le placebo (p < .001), tandis qu'aucune preuve n'indiquait qu'Anxifree fasse mieux que le placebo (p = .15). »"}},{"numero":14,"titre":"ANOVA factorielle","sections":[{"titre":"Plans factoriels équilibrés sans interaction","points":["L'ANOVA factorielle croise plusieurs facteurs à la fois, par exemple dans un plan à trois fois deux conditions.","Un plan est complètement croisé quand toutes les combinaisons de niveaux des facteurs sont représentées.","Il est équilibré quand chaque cellule du plan contient exactement le même nombre d'observations.","L'hypothèse nulle de chaque effet principal porte sur l'égalité des moyennes marginales du facteur concerné.","Ce test diffère d'ANOVA séparées, car le modèle tient compte de l'existence de l'autre facteur."]},{"titre":"Sommes des carrés, degrés de liberté et tests F","points":["Les sommes des carrés des facteurs mesurent les écarts des moyennes marginales à la moyenne générale.","La somme résiduelle est ce qui reste de la somme totale après soustraction des termes du modèle.","Les degrés de liberté valent R moins 1 pour les lignes, C moins 1 pour les colonnes.","Chaque statistique F compare le carré moyen d'un facteur au carré moyen des résidus.","Ignorer un facteur important gonfle les résidus : therapy ne devient significative que dans l'analyse bifactorielle."]},{"titre":"Les effets d'interaction","points":["Il y a interaction lorsque l'effet du facteur A change selon le niveau du facteur B.","Sous l'hypothèse nulle, chaque moyenne de cellule est prédite par la grande moyenne et les effets principaux.","La somme des carrés de l'interaction mesure les écarts des cellules à ces prédictions, avec (R−1)(C−1) degrés de liberté.","Dans l'exemple, les deux effets principaux sont significatifs mais pas l'interaction (F(2,12) = 2,5, p = 0,125).","Quand l'interaction est significative, les effets principaux deviennent rarement intéressants, car leurs moyennes marginales mélangent des groupes hétérogènes."]},{"titre":"Taille de l'effet : η² et η² partiel","points":["L'êta carré divise la somme des carrés d'un terme par la somme totale des carrés.","La somme des êta carrés de tous les termes du modèle égale le R² de ce modèle.","L'êta carré partiel, toujours au moins aussi grand, retire les autres effets du dénominateur et n'est pas comparable entre termes.","L'option Estimated Marginal Means fournit les moyennes estimées de chaque groupe avec leurs intervalles de confiance.","Dans un modèle saturé, ces moyennes estimées coïncident exactement avec les moyennes observées de l'échantillon."]},{"titre":"Vérification des hypothèses de l'ANOVA factorielle","points":["L'ANOVA factorielle suppose l'homogénéité des variances, la normalité des résidus et l'indépendance des observations.","Le test de Levene, dans Assumption Checks, s'applique de préférence au modèle saturé.","Il est prudent de compléter ce test par une inspection visuelle des écarts-types de chaque groupe.","La normalité des résidus se vérifie avec le graphique Q-Q proposé par Jamovi.","L'indépendance ne se teste pas : le chercheur doit la juger, en repérant notamment les mesures répétées."]},{"titre":"L'analyse de covariance (ANCOVA)","points":["L'ANCOVA ajoute au modèle une covariable continue liée à la variable dépendante.","L'ajustement des moyennes réduit la variance d'erreur, ce qui augmente la puissance du test.","Elle risque cependant d'aplanir des différences réelles en extrapolant vers une région sans données.","Dans Jamovi, on passe par Analyses, puis ANOVA, puis ANCOVA, avec les facteurs et la covariable.","Une hypothèse s'ajoute, l'égalité des pentes, testée via l'interaction entre la covariable et le facteur."]},{"titre":"L'ANOVA comme modèle linéaire et les contrastes","points":["L'ANOVA et la régression reposent sur les mêmes modèles linéaires, avec les mêmes sommes de carrés et tests F.","Une ANOVA deux par deux se réécrit ainsi comme une régression à deux prédicteurs binaires.","Un facteur à K niveaux se code par K moins 1 contrastes réunis dans une matrice de contrastes.","Le contraste de traitement compare chaque niveau à une référence ; celui de Helmert, à la moyenne des groupes précédents.","Les degrés de liberté se comprennent comme un comptage des paramètres qui distinguent les deux modèles comparés."]},{"titre":"Tests post hoc, comparaisons planifiées et plans non équilibrés","points":["Le HSD de Tukey teste toutes les paires avec des intervalles simultanés et des valeurs p ajustées.","Les comparaisons planifiées, prévues avant l'expérience, se testent sans ajustement pour comparaisons multiples.","Dans un plan non équilibré, les facteurs deviennent corrélés et les sommes des carrés ne s'additionnent plus.","Les tests de type I dépendent de l'ordre d'entrée ; ceux de type III, défaut de Jamovi, violent la marginalité.","Les tests de type II, indépendants de l'ordre et des contrastes, sont souvent le meilleur choix."]}],"concepts":["Plan factoriel complètement croisé et plan équilibré","Moyennes marginales et moyenne générale (notation μrc, μr., μ.c, μ..)","Effets principaux et effet d'interaction","Décomposition des sommes de carrés (SS_A, SS_B, SS_A:B, SS_R, SS_T)","Taille de l'effet : η² et η² partiel","Vérification des hypothèses : test de Levene, graphe Q-Q, indépendance","ANCOVA : covariable et moyennes ajustées","ANOVA comme modèle linéaire et matrices de contrastes (traitement, Helmert, somme à zéro)","Tests post hoc avec le HSD de Tukey et comparaisons planifiées","Plans non équilibrés : sommes des carrés de type I, II et III"],"formules":[{"nom":"Carré moyen","formule":"MS = SS / df","explication":"Le carré moyen d'un terme s'obtient en divisant sa somme des carrés par ses degrés de liberté. Cette relation vaut pour chaque facteur, l'interaction et les résidus."},{"nom":"Statistique F d'un facteur","formule":"F_A = MS_A / MS_R","explication":"La statistique F compare le carré moyen du facteur au carré moyen résiduel. Sous l'hypothèse nulle, elle suit une distribution F avec les df du facteur et les df résiduels."},{"nom":"Somme des carrés de l'effet principal A","formule":"SS_A = (N × C) × Σr (Ȳr. − Ȳ..)²","explication":"On somme les écarts quadratiques entre chaque moyenne marginale de ligne et la moyenne générale, puis on multiplie par N × C car chaque niveau de A apparaît dans C cellules de N observations."},{"nom":"Somme totale des carrés","formule":"SS_T = Σr Σc Σi (Yrci − Ȳ..)²","explication":"La triple sommation additionne, pour toutes les observations de l'ensemble des données, le carré de l'écart entre chaque observation et la grande moyenne."},{"nom":"Somme résiduelle des carrés (modèle avec interaction)","formule":"SS_R = SS_T − (SS_A + SS_B + SS_A:B)","explication":"Les résidus représentent la variabilité qui ne peut être attribuée à aucun terme du modèle. L'ajout du terme d'interaction rend SS_R plus petite que dans le modèle sans interaction."},{"nom":"Somme des carrés de l'interaction","formule":"SS_A:B = N × Σr Σc (Ȳrc − Ȳr. − Ȳ.c + Ȳ..)²","explication":"Chaque terme mesure l'écart entre la moyenne d'une cellule et ce que prédiraient les seuls effets principaux. Les degrés de liberté associés sont (R−1)(C−1)."},{"nom":"Modèle avec interaction (hypothèse alternative)","formule":"μrc = μ.. + αr + βc + (αβ)rc","explication":"Sous l'hypothèse nulle d'absence d'interaction, (αβ)rc = 0 pour tous les groupes et chaque moyenne de cellule est parfaitement prédite par la grande moyenne et les effets principaux αr = μr. − μ.. et βc = μ.c − μ.."},{"nom":"Eta-carré","formule":"η² = SS_A / SS_T","explication":"η² est la proportion de la variance de la variable résultat expliquée par un terme, interprétable comme un R². La somme des η² de tous les termes égale le R² du modèle ANOVA."},{"nom":"Eta-carré partiel","formule":"η²p = SS_A / (SS_A + SS_R)","explication":"Le η² partiel retire du dénominateur les sommes de carrés des autres termes du modèle. Il est toujours au moins aussi grand que η² et n'est pas comparable d'un terme à l'autre."}],"jamovi":"ANOVA factorielle : Analyses → ANOVA → ANOVA → mood.gain en Dependent Variable → drug + therapy en Fixed Factors (interaction drug*therapy incluse par défaut, modifiable via Model). Tailles d'effet : Effect Size → cocher η², partial η² (et ω²). Graphique d'interaction : Descriptive Plots → drug en Horizontal axis → therapy en Separate Lines. Moyennes estimées : Estimated Marginal Means → ajouter les termes. Hypothèses : Assumption Checks → Homogeneity Tests (Levene) + Q-Q plot des résidus. Contrastes : Contrasts → choisir deviation, simple, difference, Helmert, repeated ou polynomial. Post hoc : Post Hoc Tests → déplacer drug et therapy → cocher Tukey. ANCOVA : Analyses → ANOVA → ANCOVA → dépendante + Fixed Factors + covariable en Covariates → pentes égales via Model → Model terms (interaction covariable x facteur). Plans non équilibrés : Model → choisir Type 1, 2 ou 3 (défaut : Type 3).","glossaire":[{"terme":"ANOVA factorielle","definition":"Analyse de variance avec plusieurs variables de regroupement (facteurs), permettant de tester simultanément plusieurs effets principaux et leurs interactions."},{"terme":"Plan équilibré","definition":"Plan expérimental dans lequel chaque cellule (combinaison de niveaux des facteurs) contient le même nombre d'observations."},{"terme":"Moyenne marginale","definition":"Moyenne obtenue en moyennant sur tous les niveaux de l'autre facteur, par exemple μr. pour la r-ième ligne. Les hypothèses des effets principaux portent sur l'égalité des moyennes marginales."},{"terme":"Effet principal","definition":"Effet global d'un facteur sur la variable résultat, mesuré par les différences entre ses moyennes marginales et testé par un test F."},{"terme":"Effet d'interaction","definition":"Situation où l'effet du facteur A est différent selon le niveau du facteur B. Quand une interaction est significative, les effets principaux deviennent souvent peu intéressants à interpréter."},{"terme":"η² partiel","definition":"Mesure de taille d'effet qui rapporte la somme des carrés d'un terme à la somme de cette dernière et des carrés résiduels, en ignorant les autres effets du modèle."},{"terme":"Modèle saturé","definition":"Modèle ANOVA contenant tous les effets principaux possibles et toutes les interactions possibles ; ses moyennes estimées coïncident avec les moyennes d'échantillon."},{"terme":"ANCOVA","definition":"Analyse de covariance : ANOVA dans laquelle on ajoute une covariable continue, ce qui ajuste les moyennes de groupe et réduit la variance d'erreur."},{"terme":"Contraste de traitement","definition":"Codage (dit « faux codage ») où chaque niveau du facteur est comparé à une catégorie de référence ; l'interception correspond à la moyenne du groupe de référence."},{"terme":"Contraste de Helmert","definition":"Codage qui compare chaque groupe à la moyenne des groupes précédents ; ses colonnes somment à zéro, si bien que l'interception correspond à la grande moyenne."},{"terme":"HSD de Tukey","definition":"Test post hoc qui examine toutes les comparaisons par paires en construisant des intervalles de confiance simultanés et des valeurs p ajustées."},{"terme":"Sommes des carrés de type I, II, III","definition":"Trois stratégies de tests d'hypothèse pour les plans non équilibrés : type I séquentiel (dépend de l'ordre), type III basé sur le modèle complet (dépend des contrastes), type II fondé sur le principe de marginalité."},{"terme":"Principe de marginalité","definition":"Règle selon laquelle on ne doit pas omettre un terme d'ordre inférieur (p. ex. un effet principal) d'un modèle qui contient des termes d'ordre supérieur qui en dépendent (p. ex. son interaction)."}],"quiz":[{"question":"Dans un plan factoriel, que signifie le fait que le plan soit « équilibré » ?","options":["Les facteurs ont tous le même nombre de niveaux","Les moyennes de tous les groupes sont égales","Chaque cellule du plan contient le même nombre d'observations","La variable dépendante est distribuée normalement"],"bonne":2,"explication":"Un plan est équilibré lorsqu'il y a un nombre égal de personnes dans chaque groupe (chaque combinaison des niveaux des facteurs). C'est le cas le plus simple à analyser."},{"question":"Dans une ANOVA factorielle, l'hypothèse nulle de l'effet principal du facteur de ligne s'exprime en termes de :","options":["l'égalité des moyennes marginales en ligne (μ1. = μ2. = μ3.)","l'égalité de toutes les moyennes de cellules μrc","la nullité du terme d'interaction (αβ)rc","l'égalité des variances de tous les groupes"],"bonne":0,"explication":"L'hypothèse nulle d'un effet principal porte sur l'égalité des moyennes marginales du facteur concerné, obtenues en moyennant sur les niveaux de l'autre facteur."},{"question":"Pourquoi l'effet de therapy, non significatif dans une ANOVA à un facteur (p = .21), devient-il significatif dans l'ANOVA bifactorielle avec drug ?","options":["Parce que la valeur p est divisée par le nombre de facteurs","Parce que le test F change de distribution d'échantillonnage","Parce que l'ANOVA bifactorielle utilise plus d'observations","Parce qu'en ignorant drug, sa variabilité était comptée dans les résidus, ce qui ajoutait du bruit"],"bonne":3,"explication":"Si l'on ignore un facteur qui compte vraiment, toute la variabilité qu'il induit se retrouve dans les résidus, ce qui gonfle le dénominateur du test F et masque l'effet de l'autre facteur."},{"question":"Combien de degrés de liberté possède le terme d'interaction dans une ANOVA factorielle R x C ?","options":["R x C − 1","(R − 1)(C − 1)","R + C − 2","N − R − C + 1"],"bonne":1,"explication":"Les degrés de liberté de l'interaction sont le produit des degrés de liberté des deux facteurs : (R − 1)(C − 1). Par exemple 2 x 1 = 2 pour un plan 3 x 2."},{"question":"Que signifie un effet d'interaction entre les facteurs A et B ?","options":["L'effet du facteur A est différent selon le niveau du facteur B","Les deux facteurs ont chacun un effet significatif sur la variable résultat","Les deux facteurs sont corrélés entre eux dans l'échantillon","La somme des effets αr et βc est différente de zéro"],"bonne":0,"explication":"Une interaction se produit lorsque l'effet du facteur A dépend du niveau du facteur B considéré, c'est-à-dire que les moyennes de cellules s'écartent de μ.. + αr + βc."},{"question":"Quel conseil le manuel donne-t-il lorsqu'une interaction significative est présente ?","options":["Supprimer le terme d'interaction et relancer l'analyse","Interpréter en priorit
