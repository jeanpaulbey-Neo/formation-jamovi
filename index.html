ots séparés de la marge pour chaque année ?","options":["En cochant la case « Density »","En faisant glisser la variable année dans la case « Split by »","En créant une variable calculée avec IF","En exportant les données vers R"],"bonne":1,"explication":"Pour tracer des boxplots séparés par groupe, il suffit de faire glisser la variable de regroupement (ici l'année) dans la case « Split by » des Descriptives."},{"question":"Dans l'exemple du manuel, quel filtre permet d'identifier les deux valeurs aberrantes suspectes des marges AFL ?","options":["margin == 300","margin < 300","ID > 300","margin > 300"],"bonne":3,"explication":"On tape « margin > 300 » dans le champ Filtres, puis on produit une table de fréquences de la variable ID (nominale), ce qui révèle les observations suspectes 14 et 134."},{"question":"Sous quels formats peut-on enregistrer un graphique par clic droit dans Jamovi ?","options":[".eps, .svg ou .pdf",".doc, .xls ou .ppt",".bmp uniquement",".omv ou .csv"],"bonne":0,"explication":"Le manuel indique qu'un clic droit sur l'image permet de l'enregistrer aux formats .eps, .svg ou .pdf, qui produisent tous de belles images pour des devoirs ou des articles."}],"exercice":{"titre":"Explorer les marges AFL et traquer les valeurs aberrantes","enonce":"Chargez le fichier aflsmall2.csv dans Jamovi (4296 observations, variables margin et year). 1) Tracez un histogramme puis une courbe de densité de la variable margin et décrivez la forme de la distribution (symétrique ou asymétrique ?). 2) Tracez un boxplot de margin, puis des boxplots séparés par année en utilisant « Split by ». 3) Le boxplot global montre des points très éloignés au-dessus de 300 : créez un filtre pour isoler ces observations et identifiez leurs numéros ID à l'aide d'une table de fréquences. 4) Enregistrez le boxplot final au format .pdf.","correction":"1) Ouvrez « Exploration » - « Descriptives », placez margin dans « Variables », puis dans « Plots » cochez « Histogram » ; l'histogramme montre une distribution asymétrique à droite (beaucoup de petites marges, quelques très grandes). Décochez « Histogram » et cochez « Density » : la courbe lissée confirme cette asymétrie sans dépendre du nombre de compartiments. 2) Cochez « Box plot » : la ligne épaisse est la médiane, la boîte va du 25e au 75e centile, et des points apparaissent au-delà des moustaches. Faites ensuite glisser year dans « Split by » pour obtenir un boxplot par année de 1987 à 2010, ce qui donne une vue d'ensemble impossible à obtenir avec 24 histogrammes. 3) Allez dans l'onglet « Data », cliquez sur « Filters » et tapez « margin > 300 ». Retournez dans « Exploration » - « Descriptives », placez ID (variable nominale) dans « Variables » et cochez « Frequency tables » : la table indique les ID 14 et 134. Ces marges de plus de 300 points sont presque certainement des fautes de frappe : il faudrait retourner à la source des données (nettoyage des données). 4) Faites un clic droit sur le graphique du boxplot et enregistrez l'image au format .pdf."}},{"numero":6,"titre":"Problèmes pratiques","sections":[{"titre":"Les données du monde réel sont désordonnées","points":["Les données du monde réel sont désordonnées : formats inadaptés, valeurs manquantes et erreurs diverses.","Très souvent, l'analyse ne porte que sur un sous-ensemble des données recueillies.","Beaucoup de manipulation de données est donc nécessaire avant de pouvoir lancer la moindre analyse.","Le chapitre couvre cinq sujets : tableaux, expressions logiques, transformation et recodage, fonctions mathématiques, sous-ensembles."]},{"titre":"Tableaux de fréquences et tableaux de contingence","points":["Un tableau de fréquences s'obtient dans Descriptives avec « Frequency Tables » : niveaux, comptages, pourcentages et pourcentages cumulés.","L'exemple utilisé est le fichier nightgarden.csv, avec les variables speaker et utterance.","Pour croiser deux variables, on passe par Frequencies, Contingency Tables, puis Independent Samples.","On place une variable en « Rows » et l'autre en « Columns » ; chaque cellule contient un comptage.","L'option « Cellules » ajoute des pourcentages calculés par ligne ou par colonne."]},{"titre":"Expressions et opérateurs logiques","points":["Une valeur logique est soit VRAI soit FAUX, sans aucune nuance de gris possible.","L'opérateur « == » force Jamovi à porter un jugement : l'expression 2 + 2 == 5 renvoie FAUX.","Les autres opérateurs relationnels sont <, <=, >, >= et != ; ainsi 2 != 3 renvoie VRAI.","On combine les tests avec NOT, « or » (au moins un terme vrai) et « and » (les deux termes vrais).","Par exemple, (2+2 == 4) or (2+2 == 5) renvoie VRAI, mais avec « and » le résultat est FAUX."]},{"titre":"Opérations logiques sur du texte","points":["Les opérateurs logiques fonctionnent aussi sur le texte : « chat » == « chat » renvoie VRAI.","La comparaison est intolérante à la casse et à l'espacement : « chat » n'est pas égal à « CHAT ».","Les opérateurs < et > comparent les mots selon l'ordre de tri : « chat » < « chien » est VRAI.","Jamovi place toutes les majuscules avant les minuscules : « CAT » < « cat » est vrai, mais « fourmilier » < « ZEBRE » est faux.","L'ordre complet donné par le manuel est : ponctuation, puis chiffres, puis majuscules, puis minuscules."]},{"titre":"Transformer et recoder une variable","points":["Transformer une variable consiste à lui appliquer une fonction simple pour créer une nouvelle variable plus parlante.","Dans likert.omv, on centre les scores avec la formule « likert.raw − 4 » via Data puis Compute.","La force de l'opinion s'obtient par ABS(likert.centred) et sa direction par IF(likert.centred == 0, 0, likert.centred / opinion.strength).","La fonction IF(expression, value, else) peut s'imbriquer pour créer des catégories, comme des tranches d'âge 0-20, 21-40, 41-60.","Catégoriser une variable continue doit rester sensé : les inconvénients peuvent parfois être graves."]},{"titre":"Transformations réutilisables et fonctions mathématiques","points":["Data puis Transform crée une transformation nommée, sauvegardée dans le fichier .omv et réutilisable à volonté.","Le mot-clé « $source » remplace le nom de la variable, par exemple dans ABS($source − 4).","Le bouton « Add condition » enchaîne des conditions successives, comme « if $source <= 20 use 'young' ».","Jamovi offre de nombreuses fonctions mathématiques : SQRT, ABS, LOG10, LN, EXP et BOXCOX.","Le logarithme est l'inverse de la puissance : 10³ = 1000 équivaut à log₁₀(1000) = 3 ; la log-transformation est fréquente, la base e valant 2,718282."]},{"titre":"Extraction d'un sous-ensemble de données","points":["On extrait souvent un sous-ensemble : une condition expérimentale, ou les personnes de plus de 50 ans.","Un filtre se crée dans Data puis Filters, avec une expression logique comme speaker == 'makka-pakka'.","Une colonne « Filter 1 » apparaît alors : les cas exclus sont grisés, les cas retenus cochés en vert.","Des filtres plus complexes combinent plusieurs tests, par exemple utterance == 'pip' or utterance == 'oo'."]}],"concepts":["Manipulation et nettoyage de données","Tableau de fréquences","Tableau de contingence (tableau croisé)","Pourcentages par ligne et par colonne","Valeurs logiques VRAI / FAUX","Opérateurs relationnels : ==, !=, <, <=, >, >=","Opérateurs NOT, and, or","Variables calculées (Compute) et fonction IF","Transformations réutilisables avec $source","Logarithmes, exponentielles et filtres de sous-ensembles"],"formules":[{"nom":"Structure d'une déclaration IF","formule":"IF(expression, value, else)","explication":"Si l'expression logique ou mathématique est VRAIE, Jamovi retourne « value » ; sinon il retourne « else », qui peut lui-même contenir un autre IF (IF imbriqués) pour créer plusieurs catégories."},{"nom":"Signe d'une opinion centrée","formule":"IF(likert.centred == 0, 0, likert.centred / opinion.strength)","explication":"Cette formule convertit tous les nombres négatifs en −1, tous les positifs en +1 et garde zéro à 0 ; le IF est nécessaire car la division de zéro par zéro ne fonctionne pas."},{"nom":"Lien puissance-logarithme (base 10)","formule":"10³ = 1000 ⟺ log₁₀(1000) = 3","explication":"Le logarithme est le « contraire » de l'élévation à la puissance : dire que 10 à la puissance 3 égale 1000 équivaut à dire que le logarithme en base 10 de 1000 égale 3."},{"nom":"Nombre d'Euler et exponentielle","formule":"e ≈ 2,718282 ; exp(x) = eˣ ; ln(x) = logₑ(x)","explication":"Élever e à la puissance x s'appelle l'exponentielle de x (fonction EXP() dans Jamovi) ; le logarithme naturel, en base e, correspond à la fonction LN()."}],"jamovi":"Fréquences : Exploration → Descriptives → cocher Frequency tables → croisé : Frequencies → Contingency Tables → Independent Samples → Rows / Columns → Cellules : % ligne ou colonne → variable calculée : Data → Compute → formule (bouton fx) → transformation réutilisable : Data → Transform → Create New Transform → $source, Add condition → sous-ensemble : Data → Filters → expression logique","glossaire":[{"terme":"Manipulation de données","definition":"Ensemble des opérations nécessaires pour obtenir les variables d'un ensemble de données dans le format requis par l'analyse : reformatage, recodage, gestion des valeurs manquantes, extraction de sous-ensembles."},{"terme":"Tableau de fréquences","definition":"Tableau listant les niveaux d'une variable (colonne « Levels ») et le nombre de fois où chaque niveau apparaît dans les données (colonne « Counts »), souvent avec pourcentages et pourcentages cumulés."},{"terme":"Tableau de contingence","definition":"Tableau croisé de deux variables où chaque cellule contient le nombre de cas pour une combinaison de niveaux, par exemple combien de fois chaque locuteur a prononcé chaque énoncé."},{"terme":"Valeur logique","definition":"Affirmation sur le fait que quelque chose est vrai ou faux ; Jamovi n'en connaît que deux, VRAI et FAUX, sans nuance de gris."},{"terme":"Opérateur d'égalité (==)","definition":"Opérateur qui force Jamovi à porter un jugement vrai/faux, à distinguer du signe égal simple = ; la confusion entre les deux est une coquille très courante en programmation."},{"terme":"Transformation de variable","definition":"Application d'une fonction mathématique relativement simple à une variable originale pour créer une nouvelle variable qui décrit mieux ce qui intéresse l'analyste ou respecte mieux les hypothèses des tests."},{"terme":"Fonction IF","definition":"Fonction Jamovi à trois parties, IF(expression, value, else), qui retourne « value » si l'expression logique est vraie et « else » sinon ; les IF imbriqués permettent de découper une variable en catégories."},{"terme":"$source","definition":"Mot-clé utilisé dans une transformation Jamovi (bouton « Transform ») pour faire référence à la variable source, ce qui permet de réappliquer la même transformation à autant de variables que l'on veut."},{"terme":"Logarithme","definition":"Opération « contraire » de l'élévation à la puissance : log₁₀(1000) = 3 parce que 10³ = 1000 ; le logarithme naturel LN() utilise la base e et la log-transformation est très courante en statistiques."},{"terme":"Filtre (Filters)","definition":"Outil de l'onglet « Data » qui garde uniquement les observations satisfaisant une expression logique (par exemple speaker == 'makka-pakka'), en grisant les cas exclus dans le tableur."}],"quiz":[{"question":"Dans un tableau de fréquences Jamovi, que contient la colonne « Counts » ?","options":["Le pourcentage cumulé de chaque niveau","La moyenne de la variable","Le nombre de fois où chaque niveau apparaît dans les données","Le rang alphabétique des niveaux"],"bonne":2,"explication":"La colonne « Levels » liste les niveaux de la variable et la colonne « Counts » indique combien de fois chaque niveau apparaît : c'est la définition d'une table de fréquences."},{"question":"Comment obtenir un tableau croisé de speaker par utterance dans Jamovi ?","options":["« Exploration » - « Descriptives » - « Histogram »","« Frequencies » - « Contingency Tables » - « Independent Samples »","« Data » - « Transform » - « Create New Transform »","« Data » - « Filters »"],"bonne":1,"explication":"Le tableau de contingence se construit via « Frequencies » - « Contingency Tables » - « Independent Samples », en plaçant speaker dans « Rows » et utterance dans « Columns »."},{"question":"Que renvoie l'expression 2 + 2 == 5 dans Jamovi ?","options":["Un ensemble complet de valeurs FALSE","Un message d'erreur","La valeur 5","Un ensemble de valeurs TRUE"],"bonne":0,"explication":"L'opérateur d'égalité == force un jugement vrai/faux : comme 2 + 2 ne vaut pas 5, Jamovi remplit la colonne de valeurs « FALSE » — et il fait de même si l'on tape 2 + 2 = 5, car il comprend qu'il s'agit d'un test."},{"question":"Quel opérateur logique renvoie VRAI lorsque les deux valeurs comparées ne sont pas identiques ?","options":["==","<=",">=","!="],"bonne":3,"explication":"L'opérateur « pas égal à » != retourne VRAI lorsque les choses ne sont pas identiques de part et d'autre : 2 != 3 renvoie VRAI."},{"question":"Que vaut l'expression (2+2 == 4) and (2+2 == 5) ?","options":["VRAI, car un des deux termes est vrai","FAUX, car « and » exige que les deux parties soient vraies","0,5, car une partie sur deux est vraie","Une erreur de syntaxe"],"bonne":1,"explication":"L'opérateur « and » est une conjonction : il faut que les deux parties soient vraies. Comme 2+2 == 5 est faux, l'ensemble est FAUX ; avec « or », le résultat aurait été VRAI."},{"question":"Pourquoi « fourmilier » < « ZEBRE » est-il évalué comme FAUX dans Jamovi ?","options":["Parce que « fourmilier » a plus de lettres que « ZEBRE »","Parce que Jamovi ne compare pas les chaînes de texte","Parce que les accents ne sont pas gérés","Parce que Jamovi place toutes les lettres majuscules avant toutes les minuscules"],"bonne":3,"explication":"Jamovi suppose que toutes les majuscules passent avant toutes les minuscules dans l'ordre de tri : « FOURMILIER » < « ZEBRE » est vrai, mais « fourmilier » < « ZEBRE » est faux, ce qui est contre-intuitif."},{"question":"Avec le fichier likert.omv, quelle formule crée la variable centrée likert.centred ?","options":["ABS(likert.raw)","likert.raw − 4","LOG10(likert.raw)","IF(likert.raw == 4, 0, 1)"],"bonne":1,"explication":"L'échelle allant de 1 à 7, son point médian est 4 : soustraire 4 des scores bruts (likert.raw − 4) recode les réponses de −3 à +3, avec 0 pour « sans opinion »."},{"question":"Dans une transformation créée avec « Data » - « Transform », à quoi sert le mot-clé $source ?","options":["À faire référence à la variable source, pour réutiliser la transformation sur plusieurs variables","À indiquer le fichier de données d'origine","À définir la valeur retournée quand la condition est fausse","À importer une fonction depuis R"],"bonne":0,"explication":"Au lieu du nom d'une variable précise, on écrit $source (par exemple ABS($source − 4)) : la transformation, sauvegardée avec le fichier .omv, peut alors être appliquée à autant de variables différentes qu'on le souhaite."}],"exercice":{"titre":"Manipuler les données du jardin de nuit","enonce":"Chargez le fichier nightgarden.csv dans Jamovi (variables speaker et utterance). 1) Produisez la table de fréquences de speaker et indiquez combien de fois chaque personnage parle. 2) Construisez le tableau de contingence de speaker (lignes) par utterance (colonnes), puis ajoutez les pourcentages par ligne : quel pourcentage des énoncés de makka-pakka sont des « pip » ? 3) Créez un filtre pour ne garder que les cas où le locuteur est makka-pakka, puis vérifiez avec une table de fréquences. 4) Modifiez le filtre pour ne conserver que les énoncés « pip » ou « oo ».","correction":"1) Ouvrez « Exploration » - « Descriptives », placez speaker dans « Variables » et cochez « Frequency tables » : la table montre makka-pakka 4 fois (40 %), tombliboo 2 fois (20 %) et upsy-daisy 4 fois (40 %). 2) Allez dans « Frequencies » - « Contingency Tables » - « Independent Samples », glissez speaker dans « Rows » et utterance dans « Columns » ; chaque cellule est un comptage (par exemple makka-pakka a dit « onk » 2 fois). Dans l'option « Cellules », cochez « Ligne » : les pourcentages par ligne apparaissent et montrent que 50 % des énoncés de makka-pakka sont des « pip » (les 50 % restants sont des « onk »). En cochant plutôt « Colonne », on verrait par exemple que chaque fois que « ee » est prononcé, c'est un tombliboo qui le dit (100 %). 3) Dans l'onglet « Data », cliquez sur « Filters » et tapez, à côté du signe « = », l'expression speaker == 'makka-pakka'. Une colonne « Filter 1 » apparaît : les cas qui ne sont pas makka-pakka sont grisés (croix rouge) et les cas retenus portent une coche verte. Une table de fréquences de speaker ne montre alors plus que makka-pakka avec N = 4 (100 %). 4) Remplacez l'expression du filtre par utterance == 'pip' or utterance == 'oo' : seules les lignes dont l'énoncé est « pip » ou « oo » restent actives, illustrant la construction de filtres plus complexes avec les expressions logiques."}},{"numero":7,"titre":"Introduction à la probabilité","sections":[{"titre":"Probabilité et statistiques : deux questions inverses","points":["En théorie des probabilités, le modèle du monde est connu et on prédit les données à venir.","En statistique, on possède seulement des données et on cherche à en déduire le modèle du monde.","Par exemple, obtenir dix faces sur dix lancers fait soupçonner que la pièce est truquée.","Ces deux questions sont inverses l'une de l'autre, mais restent étroitement liées entre elles.","L'inférence statistique est entièrement construite sur les fondations de la théorie des probabilités."]},{"titre":"La vision fréquentiste de la probabilité","points":["Pour un fréquentiste, la probabilité d'un événement est sa fréquence à long terme sur des répétitions.","Ainsi, la proportion de faces observée converge vers 0,5 quand le nombre de lancers augmente.","Cette vision, dominante en statistique, est objective et identique pour tous les observateurs.","Sa limite est que les séquences infinies d'événements n'existent pas réellement dans le monde physique.","Elle interdit d'attribuer une probabilité à un événement unique, comme la pluie à Adélaïde en 2048."]},{"titre":"La vision bayésienne de la probabilité","points":["Pour un bayésien, la probabilité d'un événement est le degré de croyance qu'un agent rationnel lui accorde.","La probabilité existe donc dans les esprits des gens, et non dans le monde extérieur.","On peut la mesurer concrètement par les paris qu'un agent rationnel accepterait de prendre.","Son avantage est de pouvoir attribuer une probabilité à n'importe quel événement, même unique.","Son inconvénient est sa subjectivité, et c'est pourquoi le manuel adopte l'approche fréquentiste."]},{"titre":"Distributions de probabilités et règles de base","points":["Un événement élémentaire est un résultat tel qu'un seul se produit à chaque observation.","L'espace d'échantillonnage, défini par Kolmogorov, rassemble tous les événements élémentaires possibles.","Chaque probabilité est comprise entre 0 et 1, et celles des événements élémentaires somment à 1.","Pour un événement non élémentaire, comme porter un jean, on additionne les probabilités des événements élémentaires concernés.","Des règles en découlent, par exemple la probabilité du contraire de A vaut 1 moins celle de A."]},{"titre":"La distribution binomiale","points":["La distribution binomiale décrit le nombre de succès obtenus sur un nombre fixe d'essais indépendants.","Ses deux paramètres sont la probabilité de succès d'un essai, notée thêta, et le nombre d'essais.","Dans l'exemple des vingt dés à crânes, la probabilité d'obtenir exactement quatre crânes vaut environ 0,20.","C'est une distribution discrète : les valeurs vont de zéro au nombre d'essais et leurs probabilités somment à 1.","Modifier la probabilité de succès déplace la distribution, tandis qu'augmenter le nombre d'essais accroît la variabilité."]},{"titre":"La distribution normale et la densité de probabilité","points":["La distribution normale est une courbe en cloche continue décrite par sa moyenne et son écart-type.","La moyenne déplace la courbe et l'écart-type l'élargit, l'aire totale restant toujours égale à 1.","Environ 68,3 % des observations tombent à un écart-type de la moyenne, 95,4 % à deux et 99,7 % à trois.","Pour une variable continue, la probabilité d'observer exactement une valeur précise est nulle.","La hauteur de la courbe est une densité ; seules les aires sous la courbe sont de vraies probabilités."]},{"titre":"Les distributions t, χ² et F","points":["La distribution t ressemble à la normale mais possède des queues plus lourdes ; elle intervient dans le test t.","On utilise la distribution t lorsque la moyenne et l'écart-type de la population sont tous deux inconnus.","La distribution du chi carré, positive et asymétrique, apparaît quand on additionne des carrés de variables normales.","La distribution F sert à comparer deux sommes de carrés et apparaît notamment dans l'analyse de variance."]}],"concepts":["Statistiques inférentielles vs statistiques descriptives","Vision fréquentiste : probabilité comme fréquence à long terme","Vision bayésienne : probabilité comme degré de croyance","Événement élémentaire et espace d'échantillonnage","Loi de la probabilité totale (les probabilités somment à 1)","Distribution binomiale (paramètres N et θ)","Distribution normale (paramètres μ et σ)","Densité de probabilité et aire sous la courbe","Règle 68,3 % / 95,4 % / 99,7 %","Distributions t, χ² et F liées à la normale"],"formules":[{"nom":"Probabilité du complément","formule":"P(¬A) = 1 − P(A)","explication":"La probabilité qu'un événement A ne se produise pas est 1 moins la probabilité qu'il se produise."},{"nom":"Probabilité de A ou B","formule":"P(A ∪ B) = P(A) + P(B) − P(A ∩ B)","explication":"Pour la probabilité que A ou B se produise, on additionne les deux probabilités puis on retire la probabilité de leur intersection pour ne pas la compter deux fois."},{"nom":"Probabilité de A et B","formule":"P(A ∩ B) = P(A|B) × P(B)","explication":"La probabilité que A et B se produisent ensemble est la probabilité conditionnelle de A sachant B multipliée par la probabilité de B."},{"nom":"Distribution binomiale","formule":"P(X|θ, N) = N! / (X!(N − X)!) × θˣ × (1 − θ)^(N−X)","explication":"Donne la probabilité d'obtenir exactement X succès en N essais quand la probabilité de succès d'un essai est θ ; X! désigne la factorielle."},{"nom":"Densité de la distribution normale","formule":"p(X|μ, σ) = 1/√(2πσ) × exp(−(X − μ)² / (2σ²))","explication":"Formule de la courbe en cloche, entièrement déterminée par la moyenne μ et l'écart-type σ ; p(X) est une densité, pas une probabilité."},{"nom":"Notation de distribution","formule":"X ~ Binomiale(θ, N) ; X ~ Normal(μ, σ)","explication":"Le symbole ~ signifie que la variable aléatoire X est générée aléatoirement à partir de la distribution indiquée avec ses paramètres."}],"jamovi":"Simulation normale : Data → Compute → = NORM(100,15) → Analyses → Exploration → Descriptives → cocher Histogramme et Densité (plus de lignes = courbe en cloche). Distribution discrète (pantalons, binomiale) : saisir les valeurs → graphique en barres → vérifier probabilités entre 0 et 1, somme = 1.","glossaire":[{"terme":"Théorie des probabilités","definition":"Branche des mathématiques qui, partant d'un modèle connu du monde, calcule la fréquence à laquelle différents types d'événements se produisent."},{"terme":"Probabilité fréquentiste","definition":"Définition de la probabilité comme la fréquence à long terme d'un événement dans une séquence répétée : la proportion observée converge vers la vraie probabilité quand N → ∞."},{"terme":"Probabilité bayésienne","definition":"Définition de la probabilité comme le degré de croyance qu'un agent rationnel attribue à la vérité d'un événement, opérationnalisable par les paris qu'il est prêt à accepter."},{"terme":"Événement élémentaire","definition":"Résultat possible d'une observation tel qu'à chaque observation un et un seul de ces événements se produit."},{"terme":"Espace d'échantillonnage","definition":"Ensemble de tous les événements élémentaires possibles (la « garde-robe » dans l'exemple des pantalons)."},{"terme":"Distribution de probabilités","definition":"Attribution d'une probabilité comprise entre 0 et 1 à chaque événement élémentaire, la somme de toutes ces probabilités étant égale à 1."},{"terme":"Variable aléatoire","definition":"Quantité, comme le nombre de succès X d'une expérience, dont la valeur réelle est due au hasard."},{"terme":"Probabilité de succès (θ)","definition":"Paramètre de la distribution binomiale indiquant la probabilité qu'un essai unique produise le résultat qui nous intéresse."},{"terme":"Densité de probabilité","definition":"Hauteur p(x) de la courbe d'une distribution continue ; elle n'est pas une probabilité en soi, mais l'aire sous la courbe entre deux valeurs correspond à une vraie probabilité."},{"terme":"Degrés de liberté","definition":"Paramètre qui détermine la forme exacte des distributions t, χ² et F (par exemple une distribution t à 3 degrés de liberté)."}],"quiz":[{"question":"Quelle est la différence fondamentale entre une question de probabilité et une question de statistique ?","options":["En probabilité on utilise des nombres, en statistique des graphiques","En probabilité le modèle est connu et on prédit les données ; en statistique on a les données et on cherche le modèle","La probabilité concerne les pièces de monnaie, la statistique concerne les humains","Il n'y a aucune différence, ce sont deux noms pour la même discipline"],"bonne":1,"explication":"Le manuel insiste : en théorie des probabilités le modèle du monde est connu (p. ex. p(face) = 0,5) et les données ne le sont pas ; en statistique nous n'avons que des données et nous voulons en déduire quel modèle du monde est le bon."},{"question":"Selon la vision fréquentiste, que signifie « la probabilité de face est de 0,5 » ?","options":["Mon degré de croyance en l'obtention d'une face vaut 0,5","Chaque lancer donnera exactement une demi-face","Sur deux lancers, on obtient toujours une face et un pile","Si on lançait la pièce à l'infini, la proportion de faces convergerait vers 50 %"],"bonne":3,"explication":"Le fréquentiste définit la probabilité comme une fréquence à long terme : quand N → ∞, la proportion N_F/N converge vers la vraie probabilité. Les croyances personnelles relèvent de la vision bayésienne."},{"question":"Pourquoi un fréquentiste strict refuse-t-il d'énoncer « il y a 60 % de chances de pluie à Adélaïde le 2 novembre 2048 » ?","options":["Parce que cet événement est unique et non répétable, donc aucune fréquence à long terme ne peut être définie","Parce que la météo est trop chaotique pour être modélisée","Parce que 60 % n'est pas une probabilité valide","Parce que les fréquentistes ne croient pas aux prévisions météorologiques"],"bonne":0,"explication":"La définition fréquentiste exige une séquence d'événements répétables ; or il n'y a qu'une seule ville d'Adélaïde et un seul 2 novembre 2048, donc aucune probabilité fréquentiste ne peut s'attacher à cet événement unique."},{"question":"Dan possède 5 pantalons avec P(jean bleu) = 0,5, P(jean gris) = 0,3, P(jean noir) = 0,1, P(costume) = 0 et P(survêtement) = 0,1. Quelle est la probabilité qu'il porte un jean ?","options":["0,5","1,0","0,9","0,3"],"bonne":2,"explication":"L'événement non élémentaire « porter un jean » regroupe les trois événements élémentaires jean bleu, gris et noir : P(E) = 0,5 + 0,3 + 0,1 = 0,9."},{"question":"Dans l'expérience des 20 dés dont une face sur six porte un crâne, quelle distribution décrit le nombre de crânes obtenus ?","options":["Une distribution normale de moyenne 4","Une distribution χ² à 20 degrés de liberté","Une distribution F","Une distribution binomiale avec N = 20 et θ ≈ 0,167"],"bonne":3,"explication":"On compte le nombre de succès (crânes) sur N = 20 essais indépendants avec une probabilité de succès θ = 1/6 ≈ 0,167 par essai : c'est exactement X ~ Binomiale(θ, N)."},{"question":"Pour une distribution normale, quel pourcentage des observations se situe à moins de deux écarts-types de la moyenne ?","options":["68,3 %","95,4 %","99,7 %","50 %"],"bonne":1,"explication":"Quelle que soit la moyenne et l'écart-type, 68,3 % de la distribution se trouve à un écart-type de la moyenne, 95,4 % à deux écarts-types et 99,7 % à trois écarts-types."},{"question":"Piège classique : si la température de demain suit une loi normale de moyenne 23 et d'écart-type 1, quelle est la probabilité qu'il fasse exactement 23 degrés ?","options":["Environ 0,4, la hauteur de la courbe au sommet","50 %, car 23 est la moyenne","Zéro (ou un nombre si proche de zéro qu'il pourrait aussi bien l'être)","68,3 %"],"bonne":2,"explication":"Pour une variable continue, la probabilité d'une valeur exacte est nulle, comme lancer une fléchette sur une cible infiniment petite ; seule la probabilité que la valeur tombe dans une plage (l'aire sous la courbe) a un sens. La hauteur de la courbe est une densité, pas une probabilité."},{"question":"Quelle affirmation sur les distributions t, χ² et F est correcte ?","options":["La distribution t ressemble à la normale mais avec des queues plus lourdes, la χ² provient d'une somme de carrés de variables normales, et la F sert à comparer deux sommes de carrés","Ce sont trois distributions discrètes sans lien avec la normale","La distribution χ² est symétrique et peut prendre des valeurs négatives","La distribution F est identique à la distribution t"],"bonne":0,"explication":"Le manuel résume ainsi les trois distributions : toutes continues et profondément liées à la normale ; la t a des queues plus lourdes, la χ² (positive et asymétrique) apparaît quand on additionne des carrés de variables normales, et la F apparaît quand on compare deux distributions χ² entre elles."}],"exercice":{"titre":"Du dé à la courbe en cloche","enonce":"1) On lance 20 dés à six faces dont une face porte un crâne. Nommez la distribution du nombre de crânes X, donnez ses paramètres, et dites si elle est discrète ou continue. 2) Les scores de QI suivent une loi Normal(μ = 100, σ = 15). Sans calcul compliqué, donnez le pourcentage approximatif de personnes ayant un QI entre 85 et 115, puis entre 70 et 130. 3) Expliquez pourquoi on ne peut pas parler de la probabilité qu'une personne ait un QI d'exactement 100, et ce qu'il faut calculer à la place. 4) Vérifiez le point 2 par simulation dans Jamovi.","correction":"1) X suit une distribution binomiale : X ~ Binomiale(θ, N) avec N = 20 (paramètre de taille) et θ = 1/6 ≈ 0,167 (probabilité de succès). C'est une distribution discrète : X ne peut prendre que les valeurs entières 0, 1, 2, ..., 20 (on peut obtenir 3 ou 4 crânes, jamais 3,9). Le manuel indique que P(X = 4) ≈ 0,20. 2) L'intervalle 85–115 correspond à μ ± 1σ (100 ± 15), donc environ 68,3 % des personnes ; l'intervalle 70–130 correspond à μ ± 2σ, donc environ 95,4 %. 3) Le QI modélisé comme variable continue rend la probabilité d'une valeur exacte nulle : la hauteur de la courbe est une densité de probabilité, pas une probabilité. Ce qui a un sens, c'est la probabilité que le QI se situe dans une plage, par exemple entre 99,5 et 100,5, obtenue comme l'aire sous la courbe entre ces bornes. 4) Dans Jamovi : créer un fichier avec de nombreuses lignes, calculer une variable avec = NORM(100,15) (Data > Compute), puis Analyses > Exploration > Descriptives avec histogramme et courbe de densité ; on observe une courbe en cloche centrée sur 100, et en comptant les observations entre 85 et 115 (par exemple avec un filtre) on retrouve environ 68 % des cas."}},{"numero":8,"titre":"Estimation de quantités inconnues à partir d'un échantillon","sections":[{"titre":"Échantillons, populations et méthodes d'échantillonnage","points":["L'échantillon est l'ensemble concret des données que vous avez réellement recueillies.","La population est l'ensemble beaucoup plus vaste, souvent abstrait, sur lequel on veut conclure.","Définir précisément la population qui nous intéresse est souvent difficile en pratique.","Dans un échantillon aléatoire simple, chaque membre de la population a les mêmes chances d'être choisi, avec ou sans remise.","Un plan d'échantillonnage biaisé produit un échantillon qui renseigne mal sur la population."]},{"titre":"Échantillons non aléatoires en pratique","points":["Les échantillons réels ne sont presque jamais des échantillons aléatoires simples.","L'échantillonnage stratifié sélectionne séparément dans chaque sous-population et aide à étudier les groupes rares.","L'échantillonnage en boule de neige atteint les populations cachées, mais il est très peu aléatoire et pose des questions éthiques.","Un échantillon de commodité, comme des étudiants, est acceptable s'il est aléatoire vis-à-vis du phénomène étudié.","Critiquer un échantillon exige de proposer une théorie expliquant comment le biais fausserait les résultats."]},{"titre":"Paramètres de population et statistiques d'échantillon","points":["Les statisticiens opérationnalisent la population comme une distribution de probabilités avec ses paramètres.","Les paramètres de population décrivent cette distribution, par exemple un QI de moyenne 100 et d'écart-type 15.","Les statistiques d'échantillon, comme une moyenne observée de 98,5, se calculent directement à partir des données.","Les statistiques sont ce que l'on peut calculer ; les paramètres sont ce que l'on veut apprendre."]},{"titre":"La loi des grands nombres","points":["Un grand échantillon fournit une meilleure information : dix mille QI simulés donnent une moyenne très proche de 100.","La loi des grands nombres, due à Bernoulli en 1713, affirme que la moyenne d'échantillon tend vers celle de la population.","Elle justifie l'intuition que recueillir davantage de données finit par rapprocher de la vérité.","Cette garantie ne vaut toutefois qu'à long terme, alors que les échantillons réels restent modestes."]},{"titre":"Distributions d'échantillonnage et théorème de la limite centrale","points":["Répéter l'expérience un grand nombre de fois engendre la distribution d'échantillonnage de la statistique étudiée.","L'écart-type de cette distribution s'appelle l'erreur standard ; pour la moyenne, on parle d'erreur standard de la moyenne.","D'après le théorème de la limite centrale, la moyenne de cette distribution égale la moyenne de la population.","L'erreur standard de la moyenne vaut l'écart-type divisé par la racine carrée de l'effectif, et diminue donc quand celui-ci augmente.","La forme de la distribution d'échantillonnage devient normale quand l'échantillon grandit, quelle que soit la population."]},{"titre":"Estimation de la moyenne et de l'écart-type de la population","points":["La moyenne d'échantillon est un estimateur non biaisé de la moyenne de la population.","L'écart-type calculé en divisant par la taille d'échantillon sous-estime systématiquement celui de la population.","Cas extrême : avec une seule observation, cet écart-type vaut zéro, ce qui est absurde.","Diviser par la taille d'échantillon moins un corrige ce biais ; c'est le calcul qu'effectue Jamovi.","Il faut distinguer l'écart-type de l'échantillon, celui de la population, et son estimation corrigée."]},{"titre":"Intervalles de confiance : calcul et interprétation","points":["Une estimation ponctuelle ne suffit pas : il faut aussi quantifier l'incertitude qui l'entoure.","L'intervalle de confiance à 95 % vaut la moyenne d'échantillon plus ou moins 1,96 fois l'erreur standard.","Quand l'écart-type de population est inconnu et l'échantillon petit, on prend un multiplicateur plus grand issu de la distribution t.","Interprétation correcte : sur de nombreuses répétitions, 95 % des intervalles ainsi construits contiennent la vraie moyenne.","Dire qu'il y a 95 % de chances que la moyenne soit dedans est une lecture bayésienne incorrecte."]}],"concepts":["Échantillon vs population","Simple échantillon aléatoire, avec ou sans remise","Échantillonnage stratifié, en boule de neige, de commodité","Paramètres de population (μ, σ) vs statistiques d'échantillon (X̄, s)","Loi des grands nombres","Distribution d'échantillonnage d'une statistique","Théorème de la limite centrale","Erreur standard de la moyenne (SEM)","Estimateur biaisé vs non biaisé (division par N − 1)","Intervalle de confiance et son interprétation fréquentiste"],"formules":[{"nom":"Erreur standard de la moyenne","formule":"SEM = σ/√N","explication":"Écart-type de la distribution d'échantillonnage de la moyenne ; elle diminue quand la taille d'échantillon N augmente, ce qui quantifie pourquoi les grandes expériences sont plus fiables."},{"nom":"Variance d'échantillon (biaisée)","formule":"s² = (1/N) × Σᵢ (Xᵢ − X̄)²","explication":"Moyenne des écarts quadratiques à la moyenne de l'échantillon ; c'est une description de l'échantillon mais un estimateur biaisé de la variance de la population."},{"nom":"Estimation non biaisée de la variance de la population","formule":"σ̂² = (1/(N − 1)) × Σᵢ (Xᵢ − X̄)²","explication":"En divisant par N − 1 au lieu de N, on corrige le biais systématique : σ̂² est un estimateur non biaisé de la variance de la population σ²."},{"nom":"Estimation de l'écart-type de la population","formule":"σ̂ = √[(1/(N − 1)) × Σᵢ (Xᵢ − X̄)²]","explication":"Racine carrée de la variance corrigée ; c'est la valeur que calcule la fonction d'écart-type intégrée de Jamovi (σ̂, pas s)."},{"nom":"Estimation de la moyenne de la population","formule":"μ̂ = X̄","explication":"Dans un simple échantillon aléatoire, la meilleure estimation de la moyenne de la population est la moyenne de l'échantillon, qui est un estimateur non biaisé."},{"nom":"Intervalle de confiance à 95 %","formule":"IC₉₅ = X̄ ± 1,96 × (σ̂/√N)","explication":"Plage qui, sur un grand nombre de répétitions de l'expérience, contient la vraie moyenne μ dans 95 % des cas ; quand N est petit, le multiplicateur 1,96 (issu de la normale) doit être remplacé par une valeur plus grande issue de la distribution t (p. ex. 2,26)."}],"jamovi":"Simulation : Data → Compute → = NORM(100,15) (IQsim.omv, 10 000 lignes) → Analyses → Exploration → Descriptives → Histogramme + Densité (moyenne et σ̂, calculé avec N − 1, approchent 100 et 15 : loi des grands nombres). IC 95 % (pas d'option directe) : Descriptives → cocher SEM → calculer Moyenne − 1,96 × SEM et Moyenne + 1,96 × SEM (ex. 99,68 ± 1,96 × 0,15 = [99,39 ; 99,98]).","glossaire":[{"terme":"Population","definition":"Ensemble de toutes les personnes ou observations possibles au sujet desquelles on veut tirer des conclusions ; généralement beaucoup plus grand que l'échantillon et opérationnalisé par les statisticiens comme une distribution de probabilités."},{"terme":"Échantillon","definition":"Sous-ensemble fini et concret de la population, constitué des données réellement recueillies, à partir duquel on tire des inférences."},{"terme":"Simple échantillon aléatoire","definition":"Échantillon obtenu par une procédure dans laquelle chaque membre de la population a les mêmes chances d'être sélectionné."},{"terme":"Échantillonnage avec/sans remise","definition":"Avec remise, un même membre de la population peut être observé plusieurs fois ; sans remise, non. Pour les grandes populations, la différence est négligeable."},{"terme":"Paramètre de population","definition":"Caractéristique de l'ensemble de la population, comme la moyenne μ ou l'écart-type σ ; presque jamais connue avec certitude."},{"terme":"Statistique d'échantillon","definition":"Propriété calculée à partir des données de l'échantillon, comme la moyenne X̄ ou l'écart-type s ; semblable mais non identique au paramètre de population correspondant."},{"terme":"Loi des grands nombres","definition":"Loi mathématique selon laquelle, quand la taille de l'échantillon approche l'infini, la moyenne de l'échantillon approche la moyenne de la population (X̄ → μ)."},{"terme":"Distribution d'échantillonnage","definition":"Distribution que suivrait une statistique (moyenne, maximum, écart-type...) si l'on répétait l'expérience un très grand nombre de fois avec la même taille d'échantillon."},{"terme":"Théorème de la limite centrale","definition":"Théorème établissant que la distribution d'échantillonnage de la moyenne a pour moyenne μ, pour écart-type SEM = σ/√N, et devient normale quand N augmente, quelle que soit la distribution de la population."},{"terme":"Erreur standard (SE/SEM)","definition":"Écart-type de la distribution d'échantillonnage d'une statistique ; pour la moyenne on parle de SEM, qui diminue quand N augmente."},{"terme":"Estimateur non biaisé","definition":"Estimateur qui, en moyenne sur un grand nombre d'échantillons, est égal au vrai paramètre de population ; la moyenne d'échantillon en est un, l'écart-type s (division par N) n'en est pas un."},{"terme":"Intervalle de confiance à 95 %","definition":"Plage de valeurs construite de sorte que, sur de nombreuses répétitions de l'expérience, 95 % des intervalles ainsi calculés contiennent la vraie moyenne de la population."}],"quiz":[{"question":"Quelle est la différence entre une statistique d'échantillon et un paramètre de population ?","options":["La statistique se calcule à partir des données recueillies ; le paramètre décrit la population entière et est presque jamais connu avec certitude","Le paramètre se calcule à partir des données ; la statistique décrit la population","Ce sont deux synonymes exacts","La statistique est toujours plus grande que le paramètre"],"bonne":0,"explication":"Les statistiques d'échantillon (comme X̄ = 98,5) sont des propriétés de vos données, calculables directement ; les paramètres de population (comme μ = 100) sont les quantités que l'on veut apprendre et qu'on ne connaît presque jamais avec certitude."},{"question":"Un enfant sort du sac uniquement les 4 jetons noirs qu'il a choisis exprès. Pourquoi cet échantillon pose-t-il problème ?","options":["Parce que 4 jetons, c'est toujours trop peu, quel que soit le plan","Parce qu'il fallait remettre les jetons dans le sac","Parce que le plan d'échantillonnage est biaisé : un échantillon tout noir ne nous dit alors plus grand-chose sur la population","Il ne pose aucun problème puisque les jetons viennent bien du sac"],"bonne":2,"explication":"La valeur probante d'un échantillon dépend de la procédure de sélection : si le plan est biaisé pour ne sélectionner que des jetons noirs, observer 4 jetons noirs n'apporte presque aucune information sur la composition réelle de la population."},{"question":"Que dit la loi des grands nombres ?","options":["Toute distribution devient normale quand N augmente","Quand la taille de l'échantillon approche l'infini, la moyenne de l'échantillon approche la moyenne de la population","Les grands échantillons ont toujours une moyenne exactement égale à μ","Il faut au moins 30 observations pour faire des statistiques"],"bonne":1,"explication":"La loi des grands nombres énonce que lorsque N → ∞, X̄ → μ : plus on recueille de données, plus les statistiques d'échantillon tendent à se rapprocher des vrais paramètres de population. La convergence vers la normalité est le théorème de la limite centrale, pas la loi des grands nombres."},{"question":"Le QI suit une loi de moyenne 100 et d'écart-type 15. Si l'on mesure des échantillons de N = 25 personnes, quelle est l'erreur standard de la moyenne (SEM) ?","options":["15","0,6","4","3"],"bonne":3,"explication":"SEM = σ/√N = 15/√25 = 15/5 = 3. L'erreur standard diminue quand N augmente, ce qui quantifie le gain de précision des grandes expériences."},{"question":"Selon le théorème de la limite centrale, que devient la distribution d'échantillonnage de la moyenne quand N augmente, si la population n'est pas normale ?","options":["Elle garde exactement la forme de la distribution de la population","Elle devient de plus en plus asymétrique","Elle s'élargit à mesure que N augmente","Elle se rapproche d'une distribution normale, quelle que soit la forme de la population"],"bonne":3,"explication":"Le théorème de la limite centrale montre que la distribution d'échantillonnage de la moyenne devient approximativement normale quand N augmente (déjà presque parfaitement dès N = 8 dans la simulation du manuel), même si la distribution de la population ne ressemble pas du tout à une normale ; de plus elle se resserre (le SEM diminue), elle ne s'élargit pas."},{"question":"Pourquoi Jamovi divise-t-il par N − 1 plutôt que par N pour calculer l'écart-type ?","options":["Parce que l'écart-type s de l'échantillon sous-estime systématiquement σ : diviser par N − 1 donne l'estimation corrigée σ̂ de l'écart-type de la population","Pour rendre les résultats plus petits et plus lisibles","Parce que la première observation ne compte jamais","C'est une erreur historique conservée par compatibilité"],"bonne":0,"explication":"La variance d'échantillon s² (division par N) est un estimateur biaisé : en moyenne, elle est inférieure à la variance de la population. Diviser par N − 1 corrige ce biais systématique, et Jamovi calcule σ̂ (et σ̂²), pas s, car c'est l'estimation du paramètre de population qui intéresse presque toujours le chercheur."},{"question":"Piège classique : vous obtenez un IC à 95 % de [109 ; 121] pour un QI moyen. Quelle interprétation est correcte du point de vue fréquentiste ?","options":["Il y a 95 % de chances que la vraie moyenne de la population se trouve entre 109 et 121","95 % des personnes de la population ont un QI entre 109 et 121","Si l'on répétait l'expérience de nombreuses fois, environ 95 % des intervalles ainsi construits contiendraient la vraie moyenne","Il y a 95 % de chances que la moyenne du prochain échantillon soit entre 109 et 121"],"bonne":2,"explication":"Les IC sont des outils fréquentistes : la probabilité porte sur la procédure répétable (les intervalles), pas sur la moyenne de population, qui est fixe et non répétable. Dire « 95 % de chances que la vraie moyenne soit dans l'intervalle » est une interprétation bayésienne (celle des intervalles crédibles), inappropriée pour un IC fréquentiste."},{"question":"Quand N est petit et que l'on remplace σ par son estimation σ̂, que se passe-t-il pour le calcul de l'intervalle de confiance à 95 % ?","options":["Rien, on garde toujours 1,96","Il faut utiliser les percentiles de la distribution t, avec un multiplicateur plus grand (p. ex. 2,26), d'où un intervalle plus large","L'intervalle devient plus étroit car on a moins de données","On doit utiliser la distribution χ² à la place de la normale"],"bonne":1,"explication":"Comme σ̂ pourrait être faux, il y a une incertitude supplémentaire : on utilise la distribution t plutôt que la normale, ce qui donne un multiplicateur plus grand quand N est petit (2,26 au lieu de 1,96 dans l'exemple du manuel) et donc un intervalle de confiance plus large, reflétant cette incertitude accrue."}],"exercice":{"titre":"Estimer le QI moyen d'une ville à partir d'un échantillon","enonce":"Sur le modèle de l'exemple de Port Pirie du manuel : vous mesurez le QI de N = 100 habitants d'une ville industrielle. Votre échantillon donne une moyenne X̄ = 98,5 et un écart-type calculé par Jamovi de 15 (donc σ̂ = 15, car Jamovi divise par N − 1). 1) Donnez la meilleure estimation de la moyenne de la population μ̂. 2) Calculez l'erreur standard de la moyenne. 3) Calculez l'intervalle de confiance à 95 % pour le QI moyen de la ville. 4) Formulez l'interprétation fréquentiste correcte de cet intervalle et donnez un exemple d'interprétation incorrecte à éviter. 5) Décrivez comment obtenir SEM et l'IC dans Jamovi.","correction":"1) Dans un simple échantillon aléatoire, la meilleure estimation de la moyenne de la population est la moyenne de l'échantillon : μ̂ = X̄ = 98,5 (la moyenne d'échantillon est un estimateur non biaisé de μ). 2) SEM = σ̂/√N = 15/√100 = 15/10 = 1,5. 3) Comme N = 100 est assez grand, on peut utiliser le multiplicateur 1,96 de la loi normale : IC₉₅ = X̄ ± 1,96 × SEM = 98,5 ± 1,96 × 1,5 = 98,5 ± 2,94, soit environ [95,56 ; 101,44]. (Avec un N petit, il aurait fallu un multiplicateur plus grand issu de la distribution t.) 4) Interprétation correcte : si l'on répétait cette étude un très grand nombre de fois en calculant à chaque fois un IC à 95 %, environ 95 % de ces intervalles contiendraient le vrai QI moyen de la ville. Interprétation incorrecte à éviter : « il y a 95 % de chances que la vraie moyenne se trouve entre 95,56 et 101,44 » — cette formulation attribue une probabilité à la moyenne de population, ce qui est une lecture bayésienne inappropriée pour un outil fréquentiste (la moyenne de population est fixe, ce sont les intervalles qui varient d'une réplication à l'autre). 5) Dans Jamovi : charger les données, ouvrir Analyses > Exploration > Descriptives, cocher la case SEM (les Descriptives n'offrent pas encore l'IC directement), puis calculer à la main : borne inférieure = Moyenne − 1,96 × SEM et borne supérieure = Moyenne + 1,96 × SEM."}},{"numero":9,"titre":"Tests d'hypothèses","sections":[{"titre":"Hypothèses de recherche et hypothèses statistiques","points":["Une hypothèse de recherche est une affirmation scientifique, par exemple que la perception extrasensorielle existe.","Une hypothèse statistique est une affirmation précise sur un paramètre, par exemple une probabilité différente de 0,5.","Le test porte uniquement sur l'hypothèse statistique, jamais directement sur l'hypothèse de recherche.","Une étude mal conçue rompt le lien entre l'hypothèse statistique testée et l'hypothèse de recherche."]},{"titre":"Hypothèse nulle et hypothèse alternative","points":["L'hypothèse nulle correspond à l'opposé de ce que le chercheur veut croire, par exemple une réussite au hasard.","L'hypothèse alternative correspond à ce que le chercheur espère réellement montrer.","Le but du test est de montrer que l'hypothèse nulle est probablement fausse, pas de prouver l'alternative.","Comme dans un procès, l'hypothèse nulle est l'accusée et bénéficie de la présomption d'innocence."]},{"titre":"Erreurs de type I et II, niveau de signification et puissance","points":["L'erreur de type I consiste à rejeter une hypothèse nulle pourtant vraie ; sa probabilité est notée alpha.","L'erreur de type II consiste à conserver une hypothèse nulle pourtant fausse ; sa probabilité est notée bêta.","Le niveau de signification alpha, fixé par convention à .05, .01 ou .001, plafonne l'erreur de type I.","La puissance, égale à un moins bêta, doit être maximisée mais reste un objectif secondaire.","Suivant Blackstone, mieux vaut conserver dix hypothèses nulles fausses que rejeter une seule vraie."]},{"titre":"Statistique de test, distribution d'échantillonnage et régions critiques","points":["La statistique de test est une quantité calculée à partir des données, comme le nombre de bonnes réponses.","Sous l'hypothèse nulle, cette statistique suit une distribution d'échantillonnage connue, ici une binomiale de paramètre 0,5.","La région critique regroupe les valeurs extrêmes des queues : pour cent essais, au plus quarante ou au moins soixante succès.","Le résultat observé de soixante-deux succès tombe dans la région critique, donc l'hypothèse nulle est rejetée.","Un résultat significatif signifie seulement que l'hypothèse nulle est rejetée, pas que le résultat est important."]},{"titre":"Tests unilatéraux et bilatéraux","points":["Un test bilatéral rejette dans les deux queues, avec 2,5 % de chaque côté au seuil de 5 %.","Un test unilatéral place toute la région critique dans une seule queue, soit les 5 % supérieurs.","Le choix entre les deux dépend des croyances du chercheur, fixées avant de voir les données."]},{"titre":"La valeur p et ses interprétations","points":["Selon Neyman, la valeur p est le plus petit seuil alpha qui permettrait encore de rejeter l'hypothèse nulle.","Selon Fisher, la valeur p est la probabilité d'observer des données au moins aussi extrêmes si l'hypothèse nulle est vraie.","Interpréter la valeur p comme la probabilité que l'hypothèse nulle soit vraie est une erreur classique.","La règle de décision est simple : on rejette l'hypothèse nulle si p est inférieur ou égal à alpha.","Dans l'étude de perception extrasensorielle, soixante-deux réussites sur cent donnent p égal à .021, significatif au seuil .05."]},{"titre":"Taille de l'effet, taille de l'échantillon et puissance","points":["La taille de l'effet mesure l'écart entre la réalité et ce que prédit l'hypothèse nulle.","Le test demande si l'effet est réel ; la taille d'effet demande s'il est intéressant.","Avec un très grand échantillon, une différence de 1 % devient significative tout en restant triviale.","La puissance du test augmente avec la taille de l'effet et la taille de l'échantillon.","Une analyse de puissance permet d'estimer avant l'étude le nombre de participants nécessaires."]},{"titre":"Neyman contre Fisher et pièges du NHST","points":["Le test d'hypothèse moderne est un hybride entre l'improbabilité selon Fisher et la décision formelle selon Neyman.","La différence entre un résultat significatif et un résultat non significatif ne prouve pas une différence réelle.","Pour comparer deux groupes, il faut tester directement la différence entre eux, pas comparer leurs valeurs p.","Assimiler p à la probabilité que l'hypothèse nulle soit vraie est si trompeur que certains préfèrent l'approche bayésienne."]}],"concepts":["Hypothèse de recherche vs hypothèse statistique","Hypothèse nulle H₀ et hypothèse alternative H₁","Erreur de type I (α) et erreur de type II (β)","Niveau de signification α","Statistique de test et distribution d'échantillonnage","Région critique et valeurs critiques","Test unilatéral vs test bilatéral","Valeur p (interprétations de Neyman et de Fisher)","Puissance du test (1 − β)","Taille de l'effet"],"formules":[{"nom":"Distribution de la statistique de test sous H₀ (exemple PES)","formule":"X ~ Binomiale(θ, N), avec θ = 0,5 sous H₀","explication":"Si l'hypothèse nulle est vraie, le nombre X de bonnes réponses sur N essais suit une loi binomiale ; cette distribution d'échantillonnage indique quelles valeurs de X sont attendues sous H₀."},{"nom":"Puissance du test","formule":"Puissance = 1 − β","explication":"β est le taux d'erreur de type II ; la puissance est la probabilité de rejeter correctement l'hypothèse nulle quand elle est réellement fausse. Elle dépend de la vraie valeur du paramètre et de N."},{"nom":"Taille de l'effet (exemple simple)","formule":"effet = θ − θ₀, ou |θ − θ₀|","explication":"Mesure l'ampleur de la différence entre la vraie valeur du paramètre de population θ et la valeur θ₀ supposée par l'hypothèse nulle."},{"nom":"Règle de décision avec la valeur p","formule":"rejeter H₀ si p ≤ α ; conserver H₀ si p > α","explication":"p est le plus petit niveau α qui permettrait de rejeter l'hypothèse nulle avec les données obtenues ; on le compare au niveau de signification choisi."}],"jamovi":"Test binomial : ouvrir binomialtest.omv → Analyses → Frequencies → 2 Outcomes (Proportion Test) → variable réponse dans Outcome → Test value = 0,5 (θ sous H₀) → Hypothesis : ≠ / > / < Test value → cocher Confidence intervals → lire p ≈ 0,02 < .05 → rejeter H₀.","glossaire":[{"terme":"Hypothèse nulle (H₀)","definition":"Hypothèse statistique correspondant à l'opposé de ce que le chercheur veut croire (par exemple « pas d'effet », θ = 0,5) ; elle est considérée comme vraie tant que les données ne prouvent pas hors de tout doute raisonnable qu'elle est fausse."},{"terme":"Hypothèse alternative (H₁)","definition":"Hypothèse statistique qui correspond à ce que le chercheur espère montrer ; le test vise à rejeter H₀ en sa faveur, pas à la prouver directement."},{"terme":"Erreur de type I","definition":"Rejeter l'hypothèse nulle alors qu'elle est en fait vraie ; sa probabilité maximale est fixée par le niveau de signification α."},{"terme":"Erreur de type II","definition":"Retenir l'hypothèse nulle alors qu'elle est en fait fausse ; sa probabilité est notée β."},{"terme":"Niveau de signification (α)","definition":"Taux d'erreur de type I maximal toléré par le test ; par convention .05, .01 ou .001. Un test a un niveau α si son taux d'erreur de type I n'est pas supérieur à α."},{"terme":"Statistique de test","definition":"Quantité calculée à partir des données (comme X, le nombre de succès) dont la valeur guide la décision de retenir ou rejeter l'hypothèse nulle."},{"terme":"Région critique","definition":"Ensemble des valeurs de la statistique de test qui conduisent au rejet de l'hypothèse nulle ; elle correspond aux valeurs les plus extrêmes (queues de la distribution) et couvre une proportion α de la distribution d'échantillonnage sous H₀."},{"terme":"Valeur p","definition":"Selon Neyman, le plus petit taux d'erreur de type I que l'on doit tolérer pour rejeter H₀ ; selon Fisher, la probabilité d'observer une statistique au moins aussi extrême que celle obtenue si H₀ est vraie. Ce n'est jamais la probabilité que H₀ soit vraie."},{"terme":"Puissance","definition":"Probabilité (1 − β) de rejeter l'hypothèse nulle quand elle est réellement fausse ; elle augmente avec la taille de l'effet et la taille de l'échantillon."},{"terme":"Taille de l'effet","definition":"Mesure de l'ampleur de la différence entre les paramètres réels de la population et les valeurs supposées par l'hypothèse nulle ; elle indique si un effet significatif est aussi important en pratique."}],"quiz":[{"question":"Quel est le but principal d'un test d'hypothèse nulle ?","options":["Prouver que l'hypothèse alternative est vraie","Calculer la probabilité que l'hypothèse nulle soit vraie","Montrer que l'hypothèse nulle est probablement fausse","Mesurer la taille de l'effet"],"bonne":2,"explication":"Le manuel insiste : le but d'un test n'est pas de montrer que H₁ est (probablement) vraie, mais de montrer que H₀ est (probablement) fausse, comme dans un procès où l'on cherche à condamner l'accusé (H₀)."},{"question":"Rejeter l'hypothèse nulle alors qu'elle est en réalité vraie correspond à :","options":["Une erreur de type I","Une erreur de type II","Une décision juste","Un manque de puissance"],"bonne":0,"explication":"L'erreur de type I consiste à rejeter une hypothèse nulle qui est en fait vraie ; sa probabilité est contrôlée par le niveau de signification α."},{"question":"Un test d'hypothèse obtient p = .021. Quelle interprétation est correcte ?","options":["Il y a 2,1 % de chances que l'hypothèse nulle soit vraie","2,1 % est le plus petit taux d'erreur de type I à tolérer pour rejeter H₀","Il y a 97,9 % de chances que l'hypothèse alternative soit vraie","L'effet observé est important en pratique"],"bonne":1,"explication":"C'est la définition de Neyman utilisée dans le manuel : p est le plus petit α qui permettrait de rejeter H₀. Interpréter p comme la probabilité que H₀ soit vraie est l'erreur classique, absolument fausse dans le cadre fréquentiste."},{"question":"Dans l'étude PES avec H₁ : θ > .5, la région critique du test :","options":["Couvre les deux queues de la distribution, 2,5 % de chaque côté","Couvre le centre de la distribution","Disparaît car le test n'a plus de niveau α","Ne couvre qu'une seule queue, les 5 % supérieurs si α = .05"],"bonne":3,"explication":"Avec une alternative unilatérale (θ > .5), on ne rejette H₀ que pour les grandes valeurs de X : la région critique ne couvre que la queue supérieure de la distribution d'échantillonnage."},{"question":"Qu'est-ce que la puissance d'un test ?","options":["La probabilité α de rejeter H₀ à tort","La taille de l'effet mesurée dans l'échantillon","La probabilité 1 − β de rejeter H₀ quand elle est réellement fausse","Le nombre d'observations nécessaires pour le test"],"bonne":2,"explication":"La puissance est définie comme 1 − β, où β est le taux d'erreur de type II ; c'est la probabilité de détecter un effet qui existe réellement. Elle dépend de la vraie valeur de θ et de N."},{"question":"Un « résultat statistiquement significatif » signifie que :","options":["Les données ont permis de rejeter l'hypothèse nulle","Le résultat est important dans le monde réel","L'effet mesuré est de grande taille","L'expérience est bien conçue"],"bonne":0,"explication":"« Significatif » est un terme ancien qui veut simplement dire que H₀ a été rejetée. La question de savoir si le résultat est réellement important est différente et dépend notamment de la taille de l'effet."},{"question":"Avec des milliers d'étudiants, on trouve que les filles ont des notes en moyenne 1 % plus élevées que les garçons, avec p très faible. Que conclure ?","options":["L'effet est forcément important puisque p est très faible","Le test est invalide car l'échantillon est trop grand","Il faut refaire le test avec un plus petit échantillon","La différence est probablement réelle mais de faible taille, donc peu intéressante en pratique"],"bonne":3,"explication":"C'est l'exemple du manuel : avec un très grand N, une toute petite différence devient statistiquement significative, mais peu importe à quel point p est faible, une différence de 1 % n'est généralement pas très intéressante. D'où l'importance de rapporter la taille de l'effet."},{"question":"Dans une étude PES, le test est significatif chez les femmes (p = .03) mais pas chez les hommes (p = .32). Que peut-on conclure ?","options":["Les femmes ont plus de capacités psychiques que les hommes","Rien sur la différence hommes-femmes : il faudrait tester directement cette différence","Les hommes n'ont aucune capacité psychique","Il faut baisser α à .01 pour trancher"],"bonne":1,"explication":"Piège classique (Gelman et Stern) : la différence entre significatif et non significatif n'est pas la preuve d'une différence réelle. Pour affirmer que les groupes diffèrent, il faut tester l'hypothèse nulle d'absence de différence entre eux (ici, ce test donne p = .54)."}],"exercice":{"titre":"Test binomial sur l'étude PES dans Jamovi","enonce":"Vous répliquez l'étude de clairvoyance du manuel : 100 participants doivent deviner la couleur (noir ou blanc) d'une carte cachée, et 62 donnent la bonne réponse. En utilisant le fichier binomialtest.omv (ou en créant une variable nominale « Outcome » avec 62 valeurs 1 et 38 valeurs 0), testez dans Jamovi l'hypothèse nulle que la probabilité de bonne réponse est θ = 0,5, au niveau α = .05, avec un test bilatéral. Rapportez la décision, la valeur p et rédigez la conclusion en une phrase.","correction":"1) Ouvrez binomialtest.omv dans Jamovi (ou saisissez la variable Outcome avec 62 « 1 » et 38 « 0 »). 2) Allez dans Analyses > Frequencies > 2 Outcomes (Proportion Test, 2 Outcomes) et déplacez Outcome dans la case d'analyse. 3) Vérifiez que « Test value » vaut 0,5 : c'est la valeur de θ sous H₀ (réponse au hasard). Sous « Hypothesis », laissez l'option ≠ Test value pour un test bilatéral. 4) Lisez le tableau de résultats : proportion observée 0,62 et valeur p ≈ 0,021 (Jamovi affiche 0,02). 5) Décision : p = .021 < α = .05, donc on rejette l'hypothèse nulle ; le résultat est statistiquement significatif. 6) Rédaction : « Sur 100 participants, 62 ont correctement identifié la couleur de la carte ; un test binomial rejette l'hypothèse que la probabilité de réussite est de 0,5 (p = .021), ce qui suggère une performance supérieure au hasard. » Attention : cela ne prouve pas que la PES existe (hypothèse de recherche) ; cela montre seulement que θ ≠ 0,5 (hypothèse statistique), et p n'est pas la probabilité que H₀ soit vraie."}},{"numero":10,"titre":"Analyse des données catégoriques","sections":[{"titre":"Le test d'adéquation χ² (qualité de l'ajustement)","points":["Le test d'adéquation de Pearson compare les fréquences observées d'une variable nominale aux fréquences attendues.","Dans l'exemple des cartes, deux cents participants produisent 35, 51, 64 et 50 choix selon la couleur.","Sous l'hypothèse nulle de probabilités égales, chaque catégorie attend cinquante observations, soit un quart du total.","Le calcul donne ici une statistique du chi carré égale à 8,44.","L'hypothèse nulle peut aussi spécifier des probabilités inégales, pourvu qu'elles soient positives et somment à un."]},{"titre":"Distribution d'échantillonnage et degrés de liberté","points":["Sous l'hypothèse nulle, la somme des écarts au carré suit approximativement une distribution du chi carré.","Les degrés de liberté valent le nombre de catégories moins une contrainte, soit trois pour quatre couleurs.","Ce test est toujours unilatéral : on rejette seulement quand la statistique dépasse la valeur critique.","Avec trois degrés de liberté, la valeur critique vaut 7,815 ; la statistique 8,44 conduit au rejet avec p égal à .038."]},{"titre":"Le test d'indépendance (ou d'association) χ²","points":["Le test d'indépendance s'applique à un tableau de contingence croisant deux variables nominales.","L'hypothèse nulle affirme que les deux variables sont indépendantes, avec les mêmes probabilités dans chaque groupe.","La fréquence attendue d'une cellule vaut le total de sa ligne multiplié par celui de sa colonne, divisé par l'effectif total.","Les degrés de liberté valent le nombre de lignes moins un, multiplié par le nombre de colonnes moins un.","Dans l'exemple des robots de Chapek 9, le test donne p égal à .005, révélant une association."]},{"titre":"La correction de continuité (correction de Yates)","points":["La statistique du test est discrète, mais on l'approche par la distribution continue du chi carré.","Avec un petit échantillon et un seul degré de liberté, la statistique devient trop grande et les valeurs p trop petites.","La correction de Yates consiste à soustraire 0,5 aux écarts absolus avant de les élever au carré.","Dans Jamovi, on l'active en cochant la case de correction de continuité dans les options Statistics."]},{"titre":"Taille de l'effet : φ et V de Cramer","points":["La statistique phi, racine carrée du chi carré divisé par l'effectif, est censée aller de zéro à un.","Pour des tableaux plus grands que deux par deux, phi peut pourtant dépasser un.","Le V de Cramer corrige ce défaut en divisant aussi par le plus petit nombre de lignes ou colonnes moins un.","Le V de Cramer varie réellement de zéro à un ; il vaut 0,24 dans l'exemple de Chapek 9.","Dans Jamovi, une case des options Statistics des tableaux de contingence permet de l'obtenir."]},{"titre":"Hypothèses des tests χ² et test exact de Fisher","points":["Le test du chi carré exige des effectifs attendus suffisants, en général supérieurs à cinq par cellule.","Il exige aussi que les observations soient indépendantes les unes des autres.","Quand les effectifs attendus sont trop faibles, on remplace le chi carré par le test exact de Fisher.","Le test de Fisher calcule directement la valeur p grâce à la distribution hypergéométrique, en fixant les totaux du tableau.","Sur les données des procès de Salem, il donne p égal à .036 malgré le très petit échantillon."]},{"titre":"Le test de McNemar pour données appariées","points":["Quand les mêmes personnes sont mesurées avant et après, les observations ne sont plus indépendantes.","Le test de McNemar réorganise les données pour que chaque participant n'occupe qu'une seule cellule du tableau.","Il teste l'homogénéité marginale, c'est-à-dire l'égalité des totaux de lignes et de colonnes.","Seules les cellules hors diagonale comptent dans le calcul, avec un seul degré de liberté.","Dans l'exemple des publicités, le test très significatif révèle un effet négatif de la campagne."]}],"concepts":["Données catégorielles (échelle nominale)","Test d'adéquation χ² de Pearson (goodness of fit)","Fréquences observées (Oᵢ) et fréquences attendues (Eᵢ)","Degrés de liberté (k − 1 ; (r − 1)(c − 1))","Test d'indépendance χ² sur tableau de contingence","Correction de continuité de Yates","Taille de l'effet : φ et V de Cramer","Hypothèses du test : effectifs attendus suffisants et indépendance des observations","Test exact de Fisher (distribution hypergéométrique)","Test de McNemar (homogénéité marginale, données appariées)"],"formules":[{"nom":"Statistique du test d'adéquation χ²","formule":"χ² = Σᵢ₌₁ᵏ (Oᵢ − Eᵢ)² / Eᵢ, avec Eᵢ = N × Pᵢ","explication":"Somme, sur les k catégories, des écarts au carré entre fréquences observées et attendues, normalisés par les fréquences attendues. Une grande valeur indique que H₀ prédit mal les données ; sous H₀, la statistique suit une loi χ² à k − 1 degrés de liberté."},{"nom":"Fréquences attendues du test d'indépendance","formule":"Eᵢⱼ = (Rᵢ × Cⱼ) / N","explication":"Sous l'hypothèse d'indépendance, l'effectif attendu d'une cellule est le produit du total de sa ligne et du total de sa colonne, divisé par le nombre total d'observations."},{"nom":"Statistique du test d'indépendance et degrés de liberté","formule":"X² = Σᵢ₌₁ʳ Σⱼ₌₁ᶜ (Eᵢⱼ − Oᵢⱼ)² / Eᵢⱼ, avec df = (r − 1)(c − 1)","explication":"Même logique que le test d'adéquation, mais sommée sur les lignes et colonnes du tableau de contingence ; les degrés de liberté découlent du nombre de cellules moins les contraintes (totaux fixés et probabilités estimées)."},{"nom":"Correction de continuité de Yates","formule":"χ² = Σᵢ (|Eᵢ − Oᵢ| − 0,5)² / Eᵢ","explication":"On soustrait 0,5 aux écarts absolus avant de les élever au carré, pour compenser le fait que la statistique tend à être trop grande quand N est petit et df = 1."},{"nom":"Statistique φ","formule":"φ = √(X² / N)","explication":"Mesure de taille de l'effet pour un tableau de contingence, entre 0 (aucune association) et 1 (association parfaite), mais elle peut dépasser 1 pour des tableaux plus grands que 2×2."},{"nom":"V de Cramer","formule":"V = √(X² / (N(k − 1))), avec k = min(r, c)","explication":"Version corrigée de φ qui varie réellement de 0 à 1 quelle que soit la taille du tableau ; c'est la mesure de taille de l'effet la plus couramment rapportée pour un χ²."},{"nom":"Statistique du test de McNemar (avec correction de Yates)","formule":"χ² = (|b − c| − 0,5)² / (b + c), soit (|O₁₂ − O₂₁| − 0,5)² / (O₁₂ + O₂₁)","explication":"Seules les cellules hors diagonale b et c du tableau avant × après comptent ; la statistique suit approximativement une loi χ² avec df = 1 et teste l'homogénéité marginale."}],"jamovi":"Adéquation : Analyses → Frequencies → One Sample Proportion Tests → N Outcomes → variable (ex. choice_1 de randomness.csv) dans Variable → cocher Expected counts → Expected Proportions pour une H₀ inégale. Indépendance : Analyses → Frequencies → Contingency Tables → Independent Samples → variables en Rows/Columns → Cells → Counts Expected → Statistics → χ² continuity correction / Cramer's V / Fisher's exact test. McNemar : Analyses → Frequencies → Contingency Tables → Paired Samples → response_before en Rows → response_after en Columns.","glossaire":[{"terme":"Données catégorielles","definition":"Autre nom des données à échelle nominale ; l'analyse catégorielle des données regroupe les outils applicables à ce type de variables."},{"terme":"Test d'adéquation χ² (goodness of fit)","definition":"Test de Pearson qui vérifie si les fréquences observées d'une variable nominale correspondent à un ensemble de probabilités « connues » spécifiées par l'hypothèse nulle."},{"terme":"Fréquence attendue (Eᵢ)","definition":"Nombre de réponses de la catégorie i que l'on s'attend à observer si l'hypothèse nulle est vraie ; pour le test d'adéquation, Eᵢ = N × Pᵢ."},{"terme":"Degrés de liberté","definition":"Nombre de quantités distinctes décrivant les données moins le nombre de contraintes qu'elles doivent satisfaire ; k − 1 pour le test d'adéquation, (r − 1)(c − 1) pour le test d'indépendance."},{"terme":"Test d'indépendance χ²","definition":"Test appliqué à un tableau de contingence entre deux variables catégorielles ; l'hypothèse nulle est qu'il n'y a aucune relation ou association entre les variables."},{"terme":"Correction de continuité (Yates)","definition":"Ajustement (soustraire 0,5 aux écarts absolus) utilisé quand df = 1 et N petit, car la distribution discrète de la statistique est approchée par la distribution χ² continue, ce qui rend sinon les valeurs p trop petites."},{"terme":"V de Cramer","definition":"Mesure de la taille de l'effet pour un tableau de contingence, V = √(X²/(N(k − 1))) ; elle varie de 0 (aucune association) à 1 (association parfaite)."},{"terme":"Test exact de Fisher","definition":"Test d'association pour petits effectifs qui calcule directement la valeur p à partir de la distribution hypergéométrique, en traitant les totaux de lignes et de colonnes comme fixes, sans statistique de test."},{"terme":"Test de McNemar","definition":"Test de l'homogénéité marginale pour des données appariées (mesures répétées) ; il ne fait intervenir que les cellules hors diagonale du tableau avant × après et suit approximativement une loi χ² à 1 degré de liberté."},{"terme":"Distribution hypergéométrique","definition":"Distribution de probabilité qui décrit les fréquences d'un tableau de contingence quand les totaux de lignes et de colonnes sont fixés ; elle est au cœur du test exact de Fisher."}],"quiz":[{"question":"Dans l'exemple des cartes (N = 200, 4 couleurs, H₀ : probabilités égales), quelle est la fréquence attendue de chaque catégorie ?","options":["25","64","50","200"],"bonne":2,"explication":"Eᵢ = N × Pᵢ = 200 × 0,25 = 50 : si les quatre couleurs sont également probables, on attend en moyenne 50 observations dans chaque catégorie."},{"question":"Combien de degrés de liberté a un test d'adéquation χ² avec k = 4 catégories ?","options":["4","3","2","1"],"bonne":1,"explication":"df = k − 1 = 3 : bien que les données soient décrites par quatre chiffres, la contrainte que les effectifs somment à N (ou que les probabilités somment à 1) ne laisse que trois quantités réellement indépendantes."},{"question":"Le test du chi carré rejette l'hypothèse nulle quand :","options":["χ² est très petit, dans la queue inférieure","χ² est proche de zéro","χ² tombe dans l'une des deux queues de la distribution","χ² dépasse la valeur critique, dans la queue supérieure uniquement"],"bonne":3,"explication":"Le test du chi carré est toujours un test unilatéral : seules les grandes valeurs de χ² indiquent que H₀ prédit mal les données, donc la région critique ne couvre que la queue supérieure."},{"question":"Pour un tableau de contingence à r lignes et c colonnes, les degrés de liberté du test d'indépendance sont :","options":["(r − 1) × (c − 1)","r × c − 1","r + c − 2","r × c"],"bonne":0,"explication":"On part des r × c cellules et on soustrait les contraintes (totaux fixés et probabilités estimées), ce qui donne df = (r − 1)(c − 1) ; par exemple 2 pour le tableau 3×2 de Chapek 9."},{"question":"Quand la correction de continuité de Yates est-elle recommandée ?","options":["Quand le tableau a plus de 5 catégories","Quand N est petit et qu'il n'y a qu'un seul degré de liberté","Quand les observations ne sont pas indépendantes","Quand la valeur p est supérieure à .05"],"bonne":1,"explication":"L'approximation de la distribution discrète de X² par la loi χ² continue fonctionne mal quand N est petit et df = 1 (par exemple un tableau 2×2) : la statistique tend à être trop grande, et la correction de Yates (soustraire 0,5) compense ce biais."},{"question":"Pourquoi préfère-t-on le V de Cramer à la statistique φ comme taille de l'effet ?","options":["φ ne peut être calculé que dans Jamovi","V est plus facile à calculer que φ","V teste l'hypothèse nulle alors que φ ne le fait pas","φ peut dépasser 1 pour des tableaux plus grands que 2×2, alors que V reste entre 0 et 1"],"bonne":3,"explication":"φ = √(X²/N) est censée aller de 0 à 1 mais peut dépasser 1 pour des tableaux plus grands que 2×2 ; le V de Cramer divise en plus par (k − 1), avec k = min(r, c), et varie réellement de 0 à 1."},{"question":"Dans quelle situation le test exact de Fisher est-il particulièrement utile ?","options":["Quand les fréquences attendues sont trop faibles pour le test χ²","Quand les observations sont appariées (mesures répétées)","Quand les variables sont continues","Quand on veut mesurer la taille de l'effet"],"bonne":0,"explication":"Quand les effectifs attendus sont trop petits (règle indicative : inférieurs à environ 5), l'approximation χ² n'est pas fiable ; le test exact de Fisher calcule directement la valeur p via la distribution hypergéométrique, comme dans l'exemple salem.csv."},{"question":"On interroge 100 personnes avant puis après une campagne publicitaire sur leur intention de vote. Quel test convient et pourquoi ?","options":["Le test d'adéquation χ², car il y a une seule variable","Le test exact de Fisher, car l'échantillon est petit","Le test de McNemar, car les 200 observations proviennent des mêmes 100 personnes et ne sont pas indépendantes","Le test d'indépendance χ² classique sur le tableau avant/après"],"bonne":2,"explication":"Chaque personne fournit deux réponses (avant et après), donc l'hypothèse d'indépendance du χ² classique est violée. Le test de McNemar réorganise les données pour que chaque participant occupe une seule cellule et teste l'homogénéité marginale à partir des cellules hors diagonale."}],"exercice":{"titre":"Choix de cartes et test d'indépendance dans Jamovi","enonce":"Avec le fichier randomness.csv (variables id, choice_1 et choice_2 pour 200 participants) : (a) réalisez un test d'adéquation χ² sur choice_1 pour vérifier si les quatre couleurs (trèfle, carreau, cœur, pique) sont choisies avec une probabilité égale ; (b) réalisez ensuite un test d'indépendance χ² entre choice_1 et choice_2 pour vérifier si le second choix dépend du premier, en demandant les effectifs attendus et le V de Cramer. Rapportez chaque résultat sous forme conventionnelle (bloc statistique) et interprétez.","correction":"Partie (a) : ouvrez randomness.csv dans Jamovi, puis Analyses > Frequencies > One Sample Proportion Tests > N Outcomes ; déplacez choice_1 dans « Variable » et cochez « Expected counts ». Les fréquences observées sont 35 (trèfles), 51 (carreaux), 64 (cœurs) et 50 (piques), contre 50 attendues partout ; Jamovi affiche χ² = 8,44, df = 3, p = .038. Comme p < .05, on rejette H₀ : « Sur les 200 participants, 64 ont choisi des cœurs, 51 des carreaux, 50 des piques et 35 des trèfles. Un test d'ajustement du chi carré était significatif (χ²(3) = 8,44, p < .05), ce qui suggère que les gens n'ont pas choisi les couleurs au hasard. » Partie (b) : Analyses > Frequencies > Contingency Tables > Independent Samples, choice_1 en « Rows » et choice_2 en « Columns » ; dans « Cells », cochez Counts > Expected, et dans « Statistics », cochez « Cramer's V ». Jamovi donne χ² = 29,24, df = 9 (car (4 − 1) × (4 − 1) = 9), p < .001, avec un V de Cramer modéré. Conclusion : le second choix n'est pas indépendant du premier ; on rapporte « χ²(9) = 29,24, p < .001 », en précisant que le V de Cramer quantifie la force de cette association. Vérifiez au passage les hypothèses du test : effectifs attendus suffisants (tous bien supérieurs à 5 ici) et indépendance des observations entre participants."}},{"numero":11,"titre":"Comparer deux moyennes","sections":[{"titre":"Le z-test pour un échantillon","points":["Le z-test compare la moyenne d'un échantillon à une valeur théorique en supposant l'écart-type de population connu.","La statistique z vaut l'écart entre la moyenne observée et la valeur théorique, divisé par l'erreur standard.","Dans l'exemple de Zeppo, la moyenne observée de 72,3 contre 67,5 attendue donne un résultat significatif.","Supposer l'écart-type connu est toujours faux en pratique : le z-test n'est qu'un tremplin pédagogique.","Jamovi ne propose d'ailleurs aucun z-test intégré, précisément parce qu'il ne sert jamais en pratique."]},{"titre":"Le test t sur un échantillon","points":["Quand l'écart-type de population est inconnu, on utilise le test t, inventé par Gosset alias « Student » en 19
