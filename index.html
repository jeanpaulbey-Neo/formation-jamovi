riées dans « Measures », et on peut demander les comparaisons par paires de Durbin-Conover et des statistiques descriptives ; pour les données d'aphasie, χ² = 6,64, df = 2, p = 0,036. Enfin, le chapitre souligne qu'une ANOVA sur deux groupes est strictement équivalente au test t de Student : les valeurs p sont identiques et le carré de la statistique t redonne la statistique F (par exemple t(16) = −1,3068 donne F(1,16) = 1,71 = (−1,3068)²)."}],"concepts":["ANOVA à un facteur (comparaison de G moyennes)","Décomposition SS_tot = SS_b + SS_w","Statistique F et carrés moyens (MS_b, MS_w)","Degrés de liberté (G − 1 et N − G)","Taille de l'effet η² (et ω²)","Tests post hoc et taux d'erreur de type I familial","Corrections de Bonferroni et de Holm","Hypothèses : normalité, homogénéité des variances, indépendance","Tests de Levene et de Welch, test de Kruskal-Wallis","ANOVA à mesures répétées, sphéricité (Mauchly) et test de Friedman"],"formules":[{"nom":"Somme totale des carrés","formule":"SS_tot = Σ_k Σ_i (Y_ik − Ȳ)²","explication":"Somme des écarts quadratiques de chaque observation à la moyenne générale ; elle mesure la variabilité totale des données et se décompose en SS_w + SS_b."},{"nom":"Somme des carrés intra groupes","formule":"SS_w = Σ_k Σ_i (Y_ik − Ȳ_k)²","explication":"Mesure à quel point chaque personne diffère de la moyenne de son propre groupe ; c'est la variabilité résiduelle, non expliquée par les groupes."},{"nom":"Somme des carrés inter groupes","formule":"SS_b = Σ_k N_k (Ȳ_k − Ȳ)²","explication":"Mesure les différences entre les moyennes de groupes et la moyenne générale, chaque écart au carré étant pondéré par la taille du groupe N_k."},{"nom":"Carrés moyens et statistique F","formule":"MS_b = SS_b / (G − 1) ; MS_w = SS_w / (N − G) ; F = MS_b / MS_w","explication":"On divise chaque somme des carrés par ses degrés de liberté puis on forme le rapport F ; plus F est grand, plus la variation inter groupes domine la variation intra groupes et plus on a de preuves contre H₀."},{"nom":"Taille de l'effet êta carré","formule":"η² = SS_b / SS_tot","explication":"Proportion de la variabilité de la variable résultat expliquée par le prédicteur ; η² = 0 signifie aucune relation et η² = 1 une relation parfaite."},{"nom":"Correction de Bonferroni","formule":"p' = m × p","explication":"Chaque valeur p brute est multipliée par le nombre m de tests effectués, ce qui garantit que le taux d'erreur de type I de la famille de tests ne dépasse pas α."},{"nom":"Correction de Holm","formule":"p'_j = j × p_j (puis p'_j = max(p'_j, p'_(j+1)))","explication":"Les valeurs p sont triées de la plus petite à la plus grande et multipliées séquentiellement par leur rang ; plus puissante que Bonferroni pour le même taux d'erreur de type I."},{"nom":"Variable du test de Levene","formule":"Z_ik = |Y_ik − Ȳ_k|","explication":"Le test de Levene est simplement une ANOVA sur les écarts absolus à la moyenne du groupe ; Brown-Forsythe utilise les écarts aux médianes."},{"nom":"Statistique de Kruskal-Wallis","formule":"K = (N − 1) × RSS_b / RSS_tot","explication":"Analogue de l'ANOVA basé sur les rangs ; sous H₀, K suit approximativement une distribution du Khi-deux à G − 1 degrés de liberté."},{"nom":"Terme d'erreur en mesures appariées","formule":"SS_error = SS_w − SS_subjects","explication":"En ANOVA à mesures répétées, on retire de la variabilité intra groupes la part due aux différences individuelles entre sujets, ce qui rend souvent le test plus puissant."}],"jamovi":"ANOVA à un facteur : ouvrez Analyses > ANOVA > ANOVA, placez la variable dépendante (ex. mood.gain) dans « Dependent Variable » et le facteur (ex. drug) dans « Fixed Factors » ; cochez η² (ou ω²) sous « Effect Size ». Tests post hoc : dans les options « Post Hoc Tests », déplacez le facteur dans la case active et choisissez les corrections (No correction, Bonferroni, Holm). Vérification des hypothèses : sous « Assumption Checks », cochez « Homogeneity tests » (test de Levene) et « Normality (Shapiro-Wilk) » / « Q-Q plot ». Si l'homogénéité des variances est violée : utilisez Analyses > ANOVA > One Way ANOVA et cochez l'option de Welch (« Don't assume equal (Welch's) »). Si la normalité est violée : Analyses > ANOVA > One Way ANOVA (Non-parametric, Kruskal-Wallis). ANOVA à mesures répétées : Analyses > ANOVA > Repeated Measures ANOVA ; nommez le facteur répété (ex. « Tâche »), définissez ses niveaux dans « Repeated Measures Factors », glissez les variables dans « Repeated Measures Cells » et cochez « Sphericity checks » (test de Mauchly, corrections Greenhouse-Geisser ou Huynh-Feldt sous « Sphericity Corrections »). Équivalent non paramétrique apparié : Analyses > ANOVA > Repeated Measures ANOVA (Non-parametric) pour le test de Friedman, avec les comparaisons par paires de Durbin-Conover.","glossaire":[{"terme":"ANOVA à un facteur","definition":"Analyse de variance comparant les moyennes d'une variable dépendante entre plusieurs groupes définis par une seule variable de regroupement ; H₀ affirme que toutes les moyennes de population sont identiques."},{"terme":"Somme des carrés inter groupes (SS_b)","definition":"Quantité mesurant les différences entre les moyennes des groupes et la moyenne générale, pondérées par les tailles de groupes ; elle capture la variation « due aux groupes »."},{"terme":"Somme des carrés intra groupes (SS_w)","definition":"Quantité mesurant les écarts de chaque observation à la moyenne de son propre groupe ; elle correspond à la variabilité résiduelle, aussi appelée SS_error dans l'ANOVA pour groupes indépendants."},{"terme":"Rapport F","definition":"Statistique de test de l'ANOVA, F = MS_b / MS_w ; sous H₀ elle suit une distribution F et des valeurs nettement supérieures à 1 constituent des preuves contre l'hypothèse nulle."},{"terme":"Êta carré (η²)","definition":"Mesure de taille d'effet définie par SS_b / SS_tot, soit la proportion de la variabilité de la variable résultat expliquée par le prédicteur ; étroitement liée au R²."},{"terme":"Analyse post hoc","definition":"Ensemble de comparaisons par paires effectuées sans théorie préalable après une ANOVA significative, pour déterminer quels groupes diffèrent réellement les uns des autres."},{"terme":"Correction de Bonferroni","definition":"Ajustement pour comparaisons multiples qui multiplie chaque valeur p brute par le nombre de tests m, afin que le taux d'erreur de type I de toute la famille de tests ne dépasse pas α."},{"terme":"Correction de Holm","definition":"Ajustement séquentiel des valeurs p (triées de la plus petite à la plus grande, multipliées par leur rang) ; plus puissant que Bonferroni avec le même taux d'erreur de type I, il devrait lui être préféré en pratique."},{"terme":"Test de Levene","definition":"Test de l'hypothèse d'homogénéité des variances, qui consiste à exécuter une ANOVA sur les écarts absolus Z_ik = |Y_ik − Ȳ_k| ; la variante de Brown-Forsythe utilise les écarts aux médianes."},{"terme":"Test de Kruskal-Wallis","definition":"Alternative non paramétrique à l'ANOVA à un facteur, basée sur les rangs des observations ; sa statistique K suit approximativement une distribution du Khi-deux à G − 1 degrés de liberté sous H₀."},{"terme":"Sphéricité","definition":"Hypothèse de l'ANOVA à mesures répétées selon laquelle les variances des différences entre toutes les paires de conditions sont égales ; elle se vérifie par le test de Mauchly et, si elle est violée, on applique les corrections de Greenhouse-Geisser ou de Huynh-Feldt."},{"terme":"Test de Friedman","definition":"Version non paramétrique de l'ANOVA pour mesures appariées, utilisée avec trois conditions ou plus sur les mêmes participants lorsque la variable est ordinale ou que la normalité n'est pas respectée."}],"quiz":[{"question":"Quelle est l'hypothèse nulle d'une ANOVA à un facteur comparant trois groupes ?","options":["Les variances des trois groupes sont identiques","Au moins une moyenne diffère des autres","Les trois moyennes de population sont identiques","Les trois échantillons ont la même taille"],"bonne":2,"explication":"H₀ affirme que toutes les moyennes de population sont égales (μP = μA = μJ) ; l'hypothèse alternative est qu'au moins un groupe a une moyenne différente. Malgré son nom, l'ANOVA teste des moyennes, pas des variances."},{"question":"Comment la somme totale des carrés SS_tot se décompose-t-elle dans une ANOVA à un facteur ?","options":["SS_tot = SS_b + SS_w","SS_tot = SS_b × SS_w","SS_tot = SS_b − SS_w","SS_tot = MS_b + MS_w"],"bonne":0,"explication":"La variabilité totale se découpe exactement en la variation due aux différences entre les moyennes des groupes (SS_b) plus la variation résiduelle à l'intérieur des groupes (SS_w) : SS_w + SS_b = SS_tot."},{"question":"Avec G = 3 groupes et N = 18 observations, quels sont les degrés de liberté de la statistique F ?","options":["3 et 18","2 et 17","3 et 15","2 et 15"],"bonne":3,"explication":"df_b = G − 1 = 2 pour la variabilité inter groupes et df_w = N − G = 15 pour la variabilité intra groupes ; c'est exactement l'exemple des essais cliniques du manuel, où F(2,15) = 18,6."},{"question":"Pourquoi la valeur de F doit-elle être nettement supérieure à 1 pour rejeter l'hypothèse nulle ?","options":["Parce que F est toujours positive par construction","Parce que sous H₀, MS_b et MS_w estiment tous deux σ² et la distribution de F a une moyenne d'environ 1","Parce que la distribution F est symétrique autour de 0","Parce que le seuil alpha est fixé à 1"],"bonne":1,"explication":"MS_w estime la variance des erreurs σ², et MS_b estime σ² plus une quantité Q liée aux vraies différences de moyennes. Si H₀ est vraie, Q = 0 et F fluctue autour de 1 ; seules des valeurs supérieures à 1 apportent des preuves contre H₀."},{"question":"Une ANOVA donne SS_b = 3,45 et SS_w = 1,39. Que vaut η² et comment l'interpréter ?","options":["η² = 0,29 : l'effet est faible","η² = 2,48 : le rapport des variances est élevé","η² = 0,71 : 71 % de la variabilité du résultat est expliquée par le facteur","η² = 0,71 : la probabilité que H₀ soit fausse est de 71 %"],"bonne":2,"explication":"η² = SS_b / SS_tot = 3,45 / (3,45 + 1,39) = 3,45/4,84 = 0,71 : le prédicteur explique 71 % de la variabilité de la variable résultat. Ce n'est en aucun cas une probabilité concernant les hypothèses."},{"question":"Quel est le principal danger d'effectuer de nombreux tests t post hoc sans correction ?","options":["Le taux d'erreur de type I de la famille de tests devient hors de contrôle","Les tests deviennent trop conservateurs","Le taux d'erreur de type II augmente fortement","Les degrés de liberté diminuent à chaque test"],"bonne":0,"explication":"Chaque test t individuel a un taux d'erreur de type I de 5 %, mais en multipliant les tests (par exemple 45 tests pour 10 groupes), on s'attend à ce que 2 ou 3 soient significatifs par pur hasard : le taux d'erreur global de la famille explose, d'où la nécessité d'une correction."},{"question":"Pourquoi le manuel recommande-t-il la correction de Holm plutôt que celle de Bonferroni ?","options":["Elle est plus simple à calculer","Elle contrôle le taux de fausses découvertes plutôt que le taux d'erreur familial","Elle est plus puissante (moins d'erreurs de type II) pour le même taux d'erreur de type I","Elle ne nécessite pas de trier les valeurs p"],"bonne":2,"explication":"La correction de Holm, bien qu'un peu plus complexe (ajustement séquentiel des valeurs p triées), a le même taux d'erreur de type I que Bonferroni tout en étant plus puissante ; il n'y a donc en pratique jamais de raison de préférer Bonferroni."},{"question":"En quoi consiste exactement le test de Levene ?","options":["Un test du Khi-deux sur les variances de chaque groupe","Une comparaison des médianes de groupes par des rangs","Un test t entre la plus grande et la plus petite variance","Une ANOVA effectuée sur les écarts absolus Z_ik = |Y_ik − Ȳ_k|"],"bonne":3,"explication":"Le test de Levene crée la variable Z_ik = |Y_ik − Ȳ_k| (écart absolu à la moyenne du groupe) puis exécute une ANOVA sur cette nouvelle variable : si les moyennes des Z diffèrent entre groupes, les variances diffèrent. Brown-Forsythe fait de même avec les médianes."},{"question":"Le test de Mauchly d'une ANOVA à mesures répétées est significatif (p < .05) et l'epsilon de Greenhouse-Geisser vaut 0,60. Que faire ?","options":["Rien, la sphéricité est respectée","Appliquer la correction de Greenhouse-Geisser car ε < 0,75","Appliquer la correction de Huynh-Feldt car ε < 0,75","Passer directement au test de Kruskal-Wallis"],"bonne":1,"explication":"Un test de Mauchly significatif indique que la sphéricité est violée et qu'une correction de la valeur F est nécessaire : on utilise Greenhouse-Geisser si l'epsilon GG est inférieur à 0,75, et Huynh-Feldt s'il est supérieur à 0,75. Kruskal-Wallis concerne les groupes indépendants, pas les mesures appariées."},{"question":"Un test t de Student sur deux groupes donne t(16) = −1,3068 et p = 0,21. Que donnerait une ANOVA sur ces deux mêmes groupes ?","options":["F(1,16) = −1,31 avec p = 0,21","F(2,16) = 2,61 avec un p plus petit","F(1,16) = 1,71 avec p = 0,21","Un résultat imprévisible car l'ANOVA exige au moins trois groupes"],"bonne":2,"explication":"Une ANOVA sur deux groupes est strictement équivalente au test t de Student : la valeur p est identique et la statistique F est le carré de la statistique t, soit (−1,3068)² = 1,7077 ≈ 1,71 avec 1 et 16 degrés de liberté."}],"exercice":{"titre":"Analyse complète de l'essai clinique clinicaltrial.csv dans Jamovi","enonce":"Vous disposez du fichier clinicaltrial.csv (18 participants) contenant les variables drug (placebo, anxifree, joyzepam) et mood.gain (amélioration de l'humeur de −5 à +5). Dans Jamovi : (1) calculez les statistiques descriptives (moyennes et écarts-types) de mood.gain par médicament et tracez des boîtes à moustaches ; (2) réalisez une ANOVA à un facteur pour tester si le médicament a un effet sur l'amélioration de l'humeur, en demandant la taille de l'effet η² ; (3) vérifiez les hypothèses d'homogénéité des variances (test de Levene) et de normalité (Shapiro-Wilk et graphique QQ) ; (4) puisque l'ANOVA est significative, effectuez des tests post hoc avec la correction de Holm pour identifier quels médicaments diffèrent ; (5) rédigez le compte rendu des résultats au format standard.","correction":"Étape 1 : dans Exploration > Descriptives, placez mood.gain dans « Variables » et drug dans « Split by » ; cochez Mean, Std. deviation et Box plot. On obtient : placebo M = 0,45, anxifree M = 0,72, joyzepam M = 1,48 — le groupe Joyzepam s'améliore visiblement plus. Étape 2 : allez dans Analyses > ANOVA > ANOVA, placez mood.gain dans « Dependent Variable » et drug dans « Fixed Factors », cochez η² sous « Effect Size ». Résultat : SS_drug = 3,45 (df = 2, MS = 1,73), SS_residuals = 1,39 (df = 15, MS = 0,09), F(2,15) = 18,61, p = 0,00009, η² = 0,71 : l'effet est significatif et le médicament explique 71 % de la variabilité de l'humeur. Étape 3 : sous « Assumption Checks », cochez « Homogeneity tests » et « Normality (Shapiro-Wilk) » avec le graphique QQ. Le test de Levene donne F(2,15) = 1,45, p = 0,266 (non significatif : homogénéité plausible, à confirmer en comparant les écarts-types des groupes) ; Shapiro-Wilk donne W = 0,96, p = 0,605 et le QQ plot est à peu près linéaire : la normalité n'est pas remise en cause. Les hypothèses de l'ANOVA sont donc raisonnables (sinon, on utiliserait le test de Welch dans One Way ANOVA ou le Kruskal-Wallis). Étape 4 : dans « Post Hoc Tests », déplacez drug dans la case active et cochez « Holm ». Résultats : joyzepam vs placebo, différence moyenne = 1,03, t = 5,88, p(Holm) = 0,00009 ; joyzepam vs anxifree, différence = 0,77, t = 4,36, p(Holm) = 0,00112 ; anxifree vs placebo, différence = 0,27, t = 1,52, p(Holm) = 0,15021 (non significatif). Étape 5 : rédaction — « L'ANOVA à un facteur a montré un effet significatif du médicament sur l'amélioration de l'humeur (F(2,15) = 18,6, p < .001, η² = 0,71). Des tests post hoc avec correction de Holm ont indiqué que Joyzepam produisait une amélioration significativement plus importante que Anxifree (p = .001) et que le placebo (p < .001), tandis qu'aucune preuve n'indiquait qu'Anxifree fasse mieux que le placebo (p = .15). »"}},{"numero":14,"titre":"ANOVA factorielle","sections":[{"titre":"Plans factoriels équilibrés sans interaction","contenu":"L'ANOVA factorielle étend l'ANOVA à un facteur au cas où l'on dispose de plusieurs variables de regroupement, par exemple un médicament à 3 niveaux et une thérapie à 2 niveaux, ce qui donne un plan factoriel 3 x 2. Lorsque toutes les combinaisons des facteurs sont représentées, le plan est dit complètement croisé, et s'il y a le même nombre de personnes dans chaque cellule, le plan est équilibré. Les hypothèses nulles portent sur l'égalité des moyennes marginales : pour le facteur en ligne, H0 dit que μ1. = μ2. = μ3., et pour le facteur en colonne que μ.1 = μ.2. Ce sont les mêmes hypothèses que dans des ANOVA à un facteur séparées, mais le test est subtilement différent car il reconnaît l'existence de la deuxième variable de regroupement."},{"titre":"Sommes des carrés, degrés de liberté et tests F","contenu":"Comme dans l'ANOVA à un facteur, on décompose la variabilité en sommes de carrés : SS_A et SS_B pour les effets principaux, calculées à partir des écarts entre moyennes marginales et moyenne générale, et SS_R pour les résidus, définie comme la variabilité totale SS_T moins celle du modèle. Le carré moyen est toujours MS = SS/df et chaque statistique F se calcule en divisant le carré moyen du facteur par le carré moyen résiduel. Les degrés de liberté valent R-1 pour le facteur de ligne, C-1 pour le facteur de colonne, et N-R-C+1 pour les résidus. Un avantage crucial de l'analyse conjointe est que la variabilité due à un facteur ignoré n'est plus versée dans les résidus : une ANOVA à un facteur sur therapy seule n'était pas significative (p = .21), alors que l'effet principal de therapy devient significatif dans l'ANOVA bifactorielle."},{"titre":"Les effets d'interaction","contenu":"Une interaction entre A et B se produit lorsque l'effet du facteur A est différent selon le niveau du facteur B considéré : par exemple, Anxifree pourrait être beaucoup plus efficace lorsqu'il est administré avec la TCC, alors que Joyzepam aurait le même effet avec ou sans thérapie. Formellement, on définit les effets αr = μr. − μ.. et βc = μ.c − μ.., et l'hypothèse nulle d'absence d'interaction dit que μrc = μ.. + αr + βc pour tous les groupes ; l'alternative introduit un terme (αβ)rc non nul. La somme des carrés d'interaction SS_A:B se calcule à partir des écarts entre les moyennes de cellule et ce que prédisent les seuls effets principaux, avec (R−1)(C−1) degrés de liberté. Sur les données d'essai clinique, on trouve des effets principaux significatifs du médicament et de la thérapie, mais pas d'interaction significative (F(2,12) = 2,5, p = .125). Attention à l'interprétation : quand une interaction est significative, les effets principaux testent des moyennes marginales qui mélangent des groupes hétérogènes et sont donc rarement les hypothèses intéressantes."},{"titre":"Taille de l'effet : η² et η² partiel","contenu":"La taille d'effet η² d'un terme est la proportion de variance de la variable résultat qu'il explique : η² = SS du terme divisé par SS totale ; la somme des η² de tous les termes égale le R² du modèle. Le η² partiel ignore délibérément les autres effets du modèle : on retire leurs sommes de carrés du dénominateur, ce qui donne toujours une valeur plus grande que η². Les valeurs partielles ne sont pas comparables d'un terme à l'autre, car chacune exprime l'importance d'un effet uniquement par rapport à la variation résiduelle. Jamovi peut aussi produire les moyennes marginales estimées (« Estimated Marginal Means ») avec leurs intervalles de confiance ; dans un modèle saturé elles coïncident avec les moyennes d'échantillon."},{"titre":"Vérification des hypothèses de l'ANOVA factorielle","contenu":"Les hypothèses clés sont l'homogénéité de la variance (tous les groupes ont le même écart-type), la normalité des résidus et l'indépendance des observations. L'homogénéité se vérifie avec le test de Levene (option « Assumption Checks » - « Homogeneity Tests »), de préférence sur un modèle saturé, en le complétant par une inspection visuelle des écarts-types. La normalité des résidus s'examine graphiquement avec un graphe Q-Q. L'indépendance, elle, doit être évaluée par le chercheur en réfléchissant au plan de l'étude, par exemple en repérant des mesures répétées sur les mêmes personnes."},{"titre":"L'analyse de covariance (ANCOVA)","contenu":"L'ANCOVA ajoute au modèle une covariable continue susceptible d'être liée à la variable dépendante : les scores sont « ajustés » pour l'influence de la covariable, puis les moyennes ajustées sont comparées entre groupes. Cet ajustement réduit la variance d'erreur et augmente la puissance du test, mais l'ANCOVA risque aussi d'aplanir des différences réelles, notamment quand les groupes ne se chevauchent pas sur la covariable et que l'analyse extrapole « à une région sans données ». Dans Jamovi, on utilise Analyses - ANOVA - ANCOVA, en plaçant la variable dépendante, les facteurs fixes et la covariable dans les cases correspondantes. Il existe une hypothèse supplémentaire : la relation entre la covariable et la variable dépendante doit être semblable pour tous les niveaux des facteurs, ce qu'on vérifie en ajoutant un terme d'interaction covariable x facteur dans « Model - Model terms »."},{"titre":"L'ANOVA comme modèle linéaire et les contrastes","contenu":"ANOVA et régression sont fondamentalement la même chose : deux modèles linéaires reposant sur des sommes de carrés et des tests F. Une ANOVA 2 x 2 s'écrit exactement comme une régression Yp = b0 + b1 X1p + b2 X2p + εp où X1 et X2 sont des variables binaires ; b0 est la note de base, et b1 et b2 correspondent aux effets principaux. Un facteur à K niveaux se recode en K−1 variables binaires appelées contrastes, rassemblées dans une matrice de contrastes. Les contrastes de traitement comparent chaque niveau à une catégorie de référence (l'interception est la moyenne du groupe de référence), les contrastes de Helmert comparent chaque groupe à la moyenne des précédents (colonnes de somme nulle, interception = grande moyenne), et les contrastes « somme à zéro » (simples dans Jamovi) construisent des comparaisons par paires avec le premier groupe. Cette perspective permet aussi de définir proprement les degrés de liberté comme un comptage de paramètres : df1 est la différence du nombre de paramètres entre les deux modèles comparés, et df2 = N − K − 1."},{"titre":"Tests post hoc, comparaisons planifiées et plans non équilibrés","contenu":"Après un effet significatif, le HSD de Tukey examine toutes les comparaisons par paires en construisant des intervalles de confiance simultanés et des valeurs p ajustées ; dans Jamovi il suffit de déplacer les termes voulus dans « Post Hoc Tests » et de cocher « Tukey ». Si l'on avait dès le départ un ensemble limité de comparaisons précises, la méthode des comparaisons planifiées permet de les tester sans ajustement pour comparaisons multiples. Quand les cellules n'ont pas le même effectif, le plan est non équilibré et il n'existe plus une seule ANOVA standard : les sommes de carrés de type I (séquentielles) dépendent de l'ordre d'entrée des facteurs, celles de type III (défaut de Jamovi) comparent le modèle complet au modèle privé du terme testé mais violent le principe de marginalité et dépendent en général des contrastes, et celles de type II respectent le principe de marginalité, ne dépendent ni de l'ordre ni des contrastes, et sont souvent le meilleur choix. Dans un plan non équilibré, les facteurs sont corrélés entre eux et une partie de la variance devient « manquante », de sorte que les sommes de carrés ne s'additionnent plus exactement."}],"concepts":["Plan factoriel complètement croisé et plan équilibré","Moyennes marginales et moyenne générale (notation μrc, μr., μ.c, μ..)","Effets principaux et effet d'interaction","Décomposition des sommes de carrés (SS_A, SS_B, SS_A:B, SS_R, SS_T)","Taille de l'effet : η² et η² partiel","Vérification des hypothèses : test de Levene, graphe Q-Q, indépendance","ANCOVA : covariable et moyennes ajustées","ANOVA comme modèle linéaire et matrices de contrastes (traitement, Helmert, somme à zéro)","Tests post hoc avec le HSD de Tukey et comparaisons planifiées","Plans non équilibrés : sommes des carrés de type I, II et III"],"formules":[{"nom":"Carré moyen","formule":"MS = SS / df","explication":"Le carré moyen d'un terme s'obtient en divisant sa somme des carrés par ses degrés de liberté. Cette relation vaut pour chaque facteur, l'interaction et les résidus."},{"nom":"Statistique F d'un facteur","formule":"F_A = MS_A / MS_R","explication":"La statistique F compare le carré moyen du facteur au carré moyen résiduel. Sous l'hypothèse nulle, elle suit une distribution F avec les df du facteur et les df résiduels."},{"nom":"Somme des carrés de l'effet principal A","formule":"SS_A = (N × C) × Σr (Ȳr. − Ȳ..)²","explication":"On somme les écarts quadratiques entre chaque moyenne marginale de ligne et la moyenne générale, puis on multiplie par N × C car chaque niveau de A apparaît dans C cellules de N observations."},{"nom":"Somme totale des carrés","formule":"SS_T = Σr Σc Σi (Yrci − Ȳ..)²","explication":"La triple sommation additionne, pour toutes les observations de l'ensemble des données, le carré de l'écart entre chaque observation et la grande moyenne."},{"nom":"Somme résiduelle des carrés (modèle avec interaction)","formule":"SS_R = SS_T − (SS_A + SS_B + SS_A:B)","explication":"Les résidus représentent la variabilité qui ne peut être attribuée à aucun terme du modèle. L'ajout du terme d'interaction rend SS_R plus petite que dans le modèle sans interaction."},{"nom":"Somme des carrés de l'interaction","formule":"SS_A:B = N × Σr Σc (Ȳrc − Ȳr. − Ȳ.c + Ȳ..)²","explication":"Chaque terme mesure l'écart entre la moyenne d'une cellule et ce que prédiraient les seuls effets principaux. Les degrés de liberté associés sont (R−1)(C−1)."},{"nom":"Modèle avec interaction (hypothèse alternative)","formule":"μrc = μ.. + αr + βc + (αβ)rc","explication":"Sous l'hypothèse nulle d'absence d'interaction, (αβ)rc = 0 pour tous les groupes et chaque moyenne de cellule est parfaitement prédite par la grande moyenne et les effets principaux αr = μr. − μ.. et βc = μ.c − μ.."},{"nom":"Eta-carré","formule":"η² = SS_A / SS_T","explication":"η² est la proportion de la variance de la variable résultat expliquée par un terme, interprétable comme un R². La somme des η² de tous les termes égale le R² du modèle ANOVA."},{"nom":"Eta-carré partiel","formule":"η²p = SS_A / (SS_A + SS_R)","explication":"Le η² partiel retire du dénominateur les sommes de carrés des autres termes du modèle. Il est toujours au moins aussi grand que η² et n'est pas comparable d'un terme à l'autre."}],"jamovi":"1) ANOVA factorielle : Analyses - ANOVA - ANOVA ; placer la variable dépendante (p. ex. mood.gain) dans « Dependent Variable » et les deux facteurs (drug, therapy) dans « Fixed Factors » ; l'interaction drug*therapy est incluse par défaut (modifiable via « Model »). 2) Tailles d'effet : cocher η², partial η² (et ω²) sous « Effect Size ». 3) Graphique d'interaction : ouvrir « Descriptive Plots », mettre drug dans « Horizontal axis » et therapy dans « Separate Lines ». 4) Moyennes estimées : ouvrir « Estimated Marginal Means » et ajouter les termes voulus. 5) Hypothèses : « Assumption Checks » - cocher « Homogeneity Tests » (test de Levene) et le graphe Q-Q des résidus. 6) Contrastes : option « Contrasts » (deviation, simple, difference, Helmert, repeated, polynomial). 7) Post hoc : « Post Hoc Tests », déplacer drug et therapy vers la droite et cocher « Tukey ». 8) ANCOVA : Analyses - ANOVA - ANCOVA ; variable dépendante dans « Dependent Variable », facteurs dans « Fixed Factors », covariable (p. ex. âge) dans « Covariates » ; vérifier l'hypothèse de pentes égales via « Model - Model terms ». 9) Plans non équilibrés : dans « Model », choisir le type de somme des carrés (Type 1, 2 ou 3 ; Type 3 par défaut).","glossaire":[{"terme":"ANOVA factorielle","definition":"Analyse de variance avec plusieurs variables de regroupement (facteurs), permettant de tester simultanément plusieurs effets principaux et leurs interactions."},{"terme":"Plan équilibré","definition":"Plan expérimental dans lequel chaque cellule (combinaison de niveaux des facteurs) contient le même nombre d'observations."},{"terme":"Moyenne marginale","definition":"Moyenne obtenue en moyennant sur tous les niveaux de l'autre facteur, par exemple μr. pour la r-ième ligne. Les hypothèses des effets principaux portent sur l'égalité des moyennes marginales."},{"terme":"Effet principal","definition":"Effet global d'un facteur sur la variable résultat, mesuré par les différences entre ses moyennes marginales et testé par un test F."},{"terme":"Effet d'interaction","definition":"Situation où l'effet du facteur A est différent selon le niveau du facteur B. Quand une interaction est significative, les effets principaux deviennent souvent peu intéressants à interpréter."},{"terme":"η² partiel","definition":"Mesure de taille d'effet qui rapporte la somme des carrés d'un terme à la somme de cette dernière et des carrés résiduels, en ignorant les autres effets du modèle."},{"terme":"Modèle saturé","definition":"Modèle ANOVA contenant tous les effets principaux possibles et toutes les interactions possibles ; ses moyennes estimées coïncident avec les moyennes d'échantillon."},{"terme":"ANCOVA","definition":"Analyse de covariance : ANOVA dans laquelle on ajoute une covariable continue, ce qui ajuste les moyennes de groupe et réduit la variance d'erreur."},{"terme":"Contraste de traitement","definition":"Codage (dit « faux codage ») où chaque niveau du facteur est comparé à une catégorie de référence ; l'interception correspond à la moyenne du groupe de référence."},{"terme":"Contraste de Helmert","definition":"Codage qui compare chaque groupe à la moyenne des groupes précédents ; ses colonnes somment à zéro, si bien que l'interception correspond à la grande moyenne."},{"terme":"HSD de Tukey","definition":"Test post hoc qui examine toutes les comparaisons par paires en construisant des intervalles de confiance simultanés et des valeurs p ajustées."},{"terme":"Sommes des carrés de type I, II, III","definition":"Trois stratégies de tests d'hypothèse pour les plans non équilibrés : type I séquentiel (dépend de l'ordre), type III basé sur le modèle complet (dépend des contrastes), type II fondé sur le principe de marginalité."},{"terme":"Principe de marginalité","definition":"Règle selon laquelle on ne doit pas omettre un terme d'ordre inférieur (p. ex. un effet principal) d'un modèle qui contient des termes d'ordre supérieur qui en dépendent (p. ex. son interaction)."}],"quiz":[{"question":"Dans un plan factoriel, que signifie le fait que le plan soit « équilibré » ?","options":["Les facteurs ont tous le même nombre de niveaux","Les moyennes de tous les groupes sont égales","Chaque cellule du plan contient le même nombre d'observations","La variable dépendante est distribuée normalement"],"bonne":2,"explication":"Un plan est équilibré lorsqu'il y a un nombre égal de personnes dans chaque groupe (chaque combinaison des niveaux des facteurs). C'est le cas le plus simple à analyser."},{"question":"Dans une ANOVA factorielle, l'hypothèse nulle de l'effet principal du facteur de ligne s'exprime en termes de :","options":["l'égalité des moyennes marginales en ligne (μ1. = μ2. = μ3.)","l'égalité de toutes les moyennes de cellules μrc","la nullité du terme d'interaction (αβ)rc","l'égalité des variances de tous les groupes"],"bonne":0,"explication":"L'hypothèse nulle d'un effet principal porte sur l'égalité des moyennes marginales du facteur concerné, obtenues en moyennant sur les niveaux de l'autre facteur."},{"question":"Pourquoi l'effet de therapy, non significatif dans une ANOVA à un facteur (p = .21), devient-il significatif dans l'ANOVA bifactorielle avec drug ?","options":["Parce que la valeur p est divisée par le nombre de facteurs","Parce que le test F change de distribution d'échantillonnage","Parce que l'ANOVA bifactorielle utilise plus d'observations","Parce qu'en ignorant drug, sa variabilité était comptée dans les résidus, ce qui ajoutait du bruit"],"bonne":3,"explication":"Si l'on ignore un facteur qui compte vraiment, toute la variabilité qu'il induit se retrouve dans les résidus, ce qui gonfle le dénominateur du test F et masque l'effet de l'autre facteur."},{"question":"Combien de degrés de liberté possède le terme d'interaction dans une ANOVA factorielle R x C ?","options":["R x C − 1","(R − 1)(C − 1)","R + C − 2","N − R − C + 1"],"bonne":1,"explication":"Les degrés de liberté de l'interaction sont le produit des degrés de liberté des deux facteurs : (R − 1)(C − 1). Par exemple 2 x 1 = 2 pour un plan 3 x 2."},{"question":"Que signifie un effet d'interaction entre les facteurs A et B ?","options":["L'effet du facteur A est différent selon le niveau du facteur B","Les deux facteurs ont chacun un effet significatif sur la variable résultat","Les deux facteurs sont corrélés entre eux dans l'échantillon","La somme des effets αr et βc est différente de zéro"],"bonne":0,"explication":"Une interaction se produit lorsque l'effet du facteur A dépend du niveau du facteur B considéré, c'est-à-dire que les moyennes de cellules s'écartent de μ.. + αr + βc."},{"question":"Quel conseil le manuel donne-t-il lorsqu'une interaction significative est présente ?","options":["Supprimer le terme d'interaction et relancer l'analyse","Interpréter en priorité les effets principaux","Ne pas accorder beaucoup d'attention aux effets principaux, car les moyennes marginales mélangent des groupes hétérogènes","Transformer la variable dépendante pour éliminer l'interaction"],"bonne":2,"explication":"Quand l'interaction est significative, les effets principaux testent des moyennes marginales formées en moyennant des groupes que l'interaction nous dit justement de ne pas moyenner : il faut s'arrêter et réfléchir à ce que l'effet principal signifie réellement."},{"question":"Quelle affirmation à propos du η² partiel est correcte ?","options":["Il est toujours plus petit que η²","La somme des η² partiels de tous les termes vaut le R² du modèle","Il mesure la corrélation entre les deux facteurs","Il vaut SS_A / (SS_A + SS_R) et n'est pas comparable d'un terme à l'autre"],"bonne":3,"explication":"Le η² partiel retire du dénominateur les SS des autres termes : partial η²_A = SS_A / (SS_A + SS_R). Il est toujours au moins aussi grand que η² et exprime chaque effet seulement par rapport à la variation résiduelle, ce qui interdit les comparaisons entre termes."},{"question":"Quel risque particulier l'ANCOVA présente-t-elle lorsque les groupes ne se chevauchent pas sur la covariable (p. ex. âges très différents) ?","options":["Le test de Levene devient impossible à calculer","L'analyse peut aplanir des différences réelles en extrapolant « à une région sans données »","La puissance statistique du test augmente artificiellement","La covariable devient automatiquement significative"],"bonne":1,"explication":"Quand les groupes sont distincts sur la covariable, l'ajustement extrapole vers une région sans données et peut conclure à tort à l'absence de différence entre les groupes (exemple de l'anxiété statistique selon l'âge chez artistes et scientifiques)."},{"question":"Dans le codage d'une ANOVA 2 x 2 comme régression Ŷ = b0 + b1 X1 + b2 X2 avec des variables binaires, à quoi correspond b0 ?","options":["À la grande moyenne de toutes les observations","À l'effet d'interaction entre les deux facteurs","À la note attendue du groupe de référence (X1 = 0 et X2 = 0)","À la différence entre les deux moyennes marginales"],"bonne":2,"explication":"Avec des contrastes de traitement, l'interception b0 est la valeur attendue quand les deux prédicteurs binaires valent 0 (le groupe de référence), tandis que b1 et b2 représentent les augmentations associées à chaque facteur."},{"question":"Dans un plan non équilibré, quel type de somme des carrés le manuel recommande-t-il généralement, et pourquoi ?","options":["Le type II, car il ne dépend ni de l'ordre d'entrée des facteurs ni du choix des contrastes","Le type I, car il est la valeur par défaut de Jamovi","Le type III, car il respecte le principe de marginalité","Aucun : l'ANOVA est impossible dans un plan non équilibré"],"bonne":0,"explication":"Les tests de type I dépendent de l'ordre des facteurs et ceux de type III dépendent des contrastes et violent le principe de marginalité ; les tests de type II évitent ces deux problèmes et sont souvent le meilleur choix (le type III est néanmoins le défaut de Jamovi)."}],"exercice":{"titre":"ANOVA factorielle complète sur les données d'essai clinique","enonce":"Avec le fichier clinicaltrial.csv (18 participants, facteur drug à 3 niveaux : placebo, anxifree, joyzepam ; facteur therapy à 2 niveaux : no.therapy, CBT ; variable résultat mood.gain), réalisez dans Jamovi une ANOVA factorielle complète. (a) Ouvrez Analyses - ANOVA - ANOVA, placez mood.gain en variable dépendante et drug et therapy en facteurs fixes, en conservant l'interaction drug*therapy. (b) Demandez les tailles d'effet η² et partial η². (c) Créez un graphique descriptif avec drug en axe horizontal et therapy en lignes séparées, et commentez le parallélisme des lignes. (d) Vérifiez les hypothèses avec le test de Levene et le graphe Q-Q. (e) Effectuez des tests post hoc de Tukey sur les effets principaux. Rédigez vos conclusions au format statistique standard.","correction":"(a) Le tableau ANOVA du modèle complet donne : drug, SS = 3,45, df = 2, F(2,12) = 31,7, p < .001 ; therapy, SS = 0,47, df = 1, F(1,12) = 8,6, p = .013 ; interaction drug*therapy, SS = 0,27, df = 2, F(2,12) = 2,5, p = .125 ; résidus SS = 0,65, df = 12. On conclut à deux effets principaux significatifs (médicament et thérapie) mais à l'absence d'interaction significative. (b) η² = 0,71 pour drug et 0,10 pour therapy (effets η² partiels : 0,84 et 0,42 ; interaction η² = 0,06, partiel 0,29) : très grand effet du médicament, effet modeste de la thérapie ; les η² partiels sont plus grands et non comparables entre termes. (c) Les lignes ne sont pas exactement parallèles (l'effet de la CBT semble plus grand avec Anxifree), mais le test montre que cet écart peut être attribué au hasard puisque l'interaction n'est pas significative. (d) Le test de Levene n'est pas significatif (F(5,12) = 0,21, p = .954), donc l'homogénéité des variances n'est pas violée ; les points du graphe Q-Q sont proches de la droite, donc la normalité des résidus est plausible. (e) Post hoc de Tukey (modèle avec interaction) : joyzepam vs placebo, différence = 1,03, p(tukey) < .001 ; anxifree vs joyzepam, différence = −0,77, p = .00027 ; placebo vs anxifree, différence = −0,27, p = .16 (non significatif) ; no.therapy vs CBT, différence = −0,32, p = .013. Conclusion : Joyzepam est supérieur au placebo et à Anxifree, Anxifree ne se distingue pas significativement du placebo, et la TCC améliore significativement le gain d'humeur."}},{"numero":15,"titre":"Épilogue : les statistiques non découvertes","sections":[{"titre":"Un livre d'introduction, pas un point final","contenu":"L'auteur reconnaît que l'épilogue est un peu étrange car le livre n'est pas fini : il manque un index, des références, des exercices, et beaucoup de contenu. Le message central est que les cours d'introduction à la statistique ne sont que cela, une introduction : pour analyser des données réelles, il faudra apprendre bien d'autres outils. Il ne faut ni présumer qu'une méthode est impossible parce qu'elle n'a pas été enseignée, ni qu'une méthode est bonne simplement parce qu'elle a été couverte en premier cycle. Même parmi les sujets couverts, l'auteur cite des omissions : autres types de corrélations (p. ex. polychorique), tailles d'effet plus détaillées, gestion des hypothèses violées, termes d'interaction en régression, comparaisons planifiées et méthodes de comparaisons multiples."},{"titre":"Les modèles statistiques manquants","contenu":"Les outils du livre (chi carré, tests t, régression, ANOVA) forment le noyau des manuels d'introduction, mais bien d'autres modèles existent. L'auteur mentionne la régression non linéaire (isotonique, Lowess, polynomiale), la régression logistique pour les variables résultat binaires, et le modèle linéaire général (GLM) qui englobe toutes ces familles. Il évoque aussi l'analyse de survie pour les données censurées, les modèles mixtes qui modélisent à la fois les individus et les effets globaux, la mise à l'échelle multidimensionnelle (MDS), le regroupement (clustering, p. ex. k-means), et les modèles causaux comme la modélisation par équations structurelles (SEM). Cette liste est présentée comme la « liste de souhaits » de l'auteur pour les versions futures du livre."},{"titre":"D'autres façons de faire des inférences","contenu":"Le livre repose surtout sur l'orthodoxie fréquentiste du début du XXe siècle (estimateurs non biaisés, distributions d'échantillonnage, tests de signification et valeurs p), même si un chapitre présente la perspective bayésienne. D'autres méthodes d'inférence méritent d'être connues : le bootstrapping simule la distribution d'échantillonnage en supposant que la population ressemble à l'échantillon, une méthode simple qui fonctionne remarquablement bien en pratique. La validation croisée divise les données en deux sous-ensembles pour ajuster le modèle sur l'un et évaluer sa généralisation sur l'autre, car l'objectif scientifique est de prédire de nouvelles données, pas de décrire les anciennes. Les statistiques robustes s'intéressent aux inférences sûres quand les données sont contaminées, par exemple en préférant la médiane à la moyenne, très sensible aux valeurs aberrantes."},{"titre":"Sujets divers : données manquantes, puissance, modèles théoriques","contenu":"Le traitement des données manquantes est de plus en plus important : les ignorer n'est pas sûr, surtout quand elles manquent de façon systématique, et l'imputation multiple permet d'exprimer l'incertitude sur les valeurs imputées. L'analyse de puissance sert à planifier une étude (taille d'échantillon nécessaire) mais aussi à interpréter des résultats déjà obtenus : un résultat significatif avec une puissance estimée très faible suggère que le hasard a joué un grand rôle. Enfin, il existe des modèles inspirés de la théorie, comme les modèles d'échantillonnage séquentiel pour les temps de réponse, dont les hypothèses sont extrêmement bien adaptées à un type de données spécifique, contrairement aux outils standard généralistes."},{"titre":"Pourquoi apprendre les bases (et avec Jamovi)","contenu":"Deux arguments justifient d'apprendre l'ANOVA classique malgré ses critiques : le pragmatisme (elle est partout dans la littérature scientifique) et la connaissance incrémentale (les outils avancés, comme les modèles mixtes, prolongent l'installation ANOVA fondamentale). Le but d'une introduction à la statistique n'est pas d'enseigner l'ANOVA ou les tests t, mais de mettre l'étudiant sur la voie pour devenir un analyste de données compétent, capable de penser correctement aux données. Le temps passé sur les fondamentaux (théorie des probabilités, densité, estimation) rend l'extensibilité possible : passer par exemple des analyses fréquentistes aux analyses bayésiennes. Les débutants ne sont pas « muets » : il ne faut pas leur cacher les complexités de l'analyse de données réelles, mais leur donner les compétences et les outils pour les gérer."}],"concepts":["Les cours d'introduction ne sont qu'une introduction : ne pas confondre couvert et suffisant","Modèles manquants : régression logistique, GLM, analyse de survie, modèles mixtes, MDS, clustering, modèles causaux (SEM)","Bootstrapping : simuler la distribution d'échantillonnage à partir de l'échantillon","Validation croisée : évaluer la généralisation d'un modèle à de nouvelles données","Statistiques robustes et point de rupture (médiane vs moyenne)","Données manquantes et imputation multiple","Analyse de puissance pour planifier et interpréter les études","Extensibilité : les fondamentaux permettent d'apprendre les outils avancés"],"formules":[],"jamovi":"","glossaire":[{"terme":"Bootstrapping","definition":"Méthode d'inférence qui simule maintes fois les résultats de l'expérience en supposant que la population ressemble aux données brutes, afin d'obtenir la distribution d'échantillonnage d'une statistique sans hypothèse de forme."},{"terme":"Validation croisée","definition":"Technique qui divise les données en sous-ensembles, ajuste le modèle sur l'un (X1) et évalue sa performance sur l'autre (X2), mesurant ainsi la qualité de généralisation du modèle à de nouvelles données."},{"terme":"Statistiques robustes","definition":"Branche des statistiques qui étudie les outils restant fiables quand les données ne satisfont pas les hypothèses théoriques ou sont contaminées, par exemple la médiane comme estimateur robuste de tendance centrale."},{"terme":"Imputation multiple","definition":"Traitement des données manquantes qui impute une série de suppositions plausibles plutôt qu'une valeur unique, afin de refléter l'incertitude sur les valeurs manquantes."},{"terme":"Analyse de survie","definition":"Ensemble d'outils conçus pour les données censurées, où il manque systématiquement un « côté » des observations parce que l'étude a pris fin (p. ex. durées de jeu limitées à deux heures, suivi de patients pendant 5 ans)."},{"terme":"Modèles mixtes","definition":"Modèles qui apprennent à la fois les caractéristiques des unités expérimentales individuelles (p. ex. la trajectoire de bonheur de chaque personne) et les effets globaux, généralisant l'ANOVA pour mesures répétées."}],"quiz":[{"question":"Quel outil l'auteur recommande-t-il pour prédire une variable résultat binaire (p. ex. être ou non sur Twitter) à partir de prédicteurs continus ?","options":["La régression linéaire standard","La régression logistique","L'ANOVA factorielle","La mise à l'échelle multidimensionnelle"],"bonne":1,"explication":"Avec une variable résultat binaire, les résidus ne peuvent pas être distribués normalement, ce qui exclut la régression linéaire standard ; l'outil le plus important dans ce cas est la régression logistique."},{"question":"Quelle est l'idée de base du bootstrapping ?","options":["Corriger les valeurs p pour les comparaisons multiples","Remplacer les valeurs manquantes par la moyenne de l'échantillon","Diviser l'échantillon en deux pour tester la généralisation du modèle","Simuler la distribution d'échantillonnage en supposant que la population ressemble aux données brutes"],"bonne":3,"explication":"Le bootstrapping simule les résultats de l'expérience à maintes reprises en supposant que l'hypothèse nulle est vraie et que la population inconnue ressemble à l'échantillon, au lieu de supposer une distribution théorique connue."},{"question":"Dans l'exemple des cinq amis âgés de 34, 39, 31, 43 et 4003 ans, pourquoi la médiane (39 ans) est-elle préférable à la moyenne (830 ans) ?","options":["Parce que la médiane est un estimateur robuste, peu sensible à l'observation clairement erronée","Parce que la médiane est toujours un meilleur estimateur que la moyenne","Parce que la moyenne ne peut pas être calculée avec cinq observations","Parce que la médiane suit une distribution normale"],"bonne":0,"explication":"La moyenne n'est pas un estimateur robuste de la tendance centrale : une seule valeur aberrante (4003, probablement une faute de frappe) la contamine complètement, alors que la médiane donne une réponse raisonnable malgré l'erreur."},{"question":"Pourquoi ignorer les données manquantes n'est-il généralement pas une solution sûre ?","options":["Parce que les logiciels statistiques refusent les jeux de données incomplets","Parce que cela réduit toujours la puissance en dessous de 50 %","Parce que les données manquent souvent de façon systématique (p. ex. les personnes en surpoids répondent moins), ce qui biaise les conclusions","Parce que la loi impose l'imputation multiple dans toutes les revues"],"bonne":2,"explication":"Quand les données manquent de façon systématique (non-réponse liée à la variable mesurée), les ignorer biaise les estimations ; l'imputation, idéalement multiple pour refléter l'incertitude, est alors importante."},{"question":"Quels sont les deux arguments clés de l'auteur pour continuer d'apprendre l'ANOVA classique malgré ses critiques ?","options":["Sa simplicité de calcul et sa disponibilité dans Jamovi","Le pragmatisme (elle domine la littérature scientifique) et la connaissance incrémentale (elle sert de base aux outils avancés)","Son exactitude mathématique et sa robustesse aux valeurs aberrantes","Son caractère bayésien et sa gratuité"],"bonne":1,"explication":"L'ANOVA est largement utilisée, à tort ou à raison, donc indispensable pour comprendre la littérature ; et beaucoup d'outils plus avancés (comme les modèles mixtes) prolongent l'installation ANOVA fondamentale : il faut apprendre à ramper avant de gravir une montagne."}],"exercice":{"titre":"Cartographier les limites de sa boîte à outils statistique","enonce":"Exercice de réflexion. Pour chacune des trois situations suivantes, expliquez pourquoi les outils vus dans ce manuel (tests t, ANOVA, régression linéaire, chi carré) sont insuffisants, identifiez la méthode évoquée dans l'épilogue qui conviendrait, et justifiez votre choix : (1) vous suivez pendant 5 ans des patients atteints d'un cancer recevant le traitement A ou B, et certains sont encore vivants à la fin de l'étude ; (2) vous mesurez le bonheur de plusieurs personnes à trois moments dans le temps et vous voulez modéliser à la fois les trajectoires individuelles et les effets globaux ; (3) vous voulez prédire si une personne possède un compte sur un réseau social (oui/non) en fonction de son revenu et de son âge. Enfin, expliquez en quelques phrases pourquoi, selon l'auteur, il vaut quand même la peine d'avoir appris les outils « classiques » d'abord.","correction":"(1) Les données sont censurées : on ne connaît pas la durée de survie des patients encore vivants à la fin du suivi, et une ANOVA ou une régression standard ne sait pas traiter ce « côté » manquant systématiquement ; l'analyse de survie est conçue exactement pour cette situation et permet de comparer l'efficacité des traitements et le risque de décès au fil du temps. (2) Une ANOVA pour mesures répétées traiterait de la même manière une personne dont le bonheur diminue (10, 8, 6) et une dont il augmente (6, 8, 10) puisqu'elles ont la même moyenne ; les modèles mixtes modélisent à la fois les unités expérimentales individuelles (les trajectoires de chaque personne) et les effets globaux, ce qui est nécessaire ici. (3) La variable résultat est binaire, donc les résidus ne peuvent pas être normalement distribués et la régression linéaire standard est inappropriée ; la régression logistique (membre de la famille du GLM) est l'outil le plus important pour ce cas. Pourquoi apprendre les classiques : d'abord par pragmatisme, car l'ANOVA et la régression sont omniprésentes dans la littérature qu'il faut pouvoir lire ; ensuite par connaissance incrémentale, car les outils avancés prolongent le socle ANOVA/régression (personne n'apprend les modèles mixtes sans maîtriser d'abord l'ANOVA et la régression) ; enfin parce que le but d'une introduction est de rendre l'étudiant capable de penser correctement aux données, avec des compétences transférables aux modèles plus complexes."}}]};
const CHAPS = DATA.chapitres;
const GROUPS = [
  {label:"Général", items:["home","gloss"]},
  {label:"I · Contexte général", chapters:[1,2]},
  {label:"II · Découvrir Jamovi", chapters:[3]},
  {label:"III · Décrire les données", chapters:[4,5,6]},
  {label:"IV · Probabilités & estimation", chapters:[7,8]},
  {label:"V · Tests statistiques", chapters:[9,10,11]},
  {label:"VI · Modèles linéaires", chapters:[12,13,14]},
  {label:"VII · Conclusion", chapters:[15]}
];
// ---------- état (sauvegardé automatiquement dans le navigateur) ----------
const STORE_KEY = "jamovi-formation-progress";
let progress = {}; // num -> {best:%, attempts:n, done:bool}
try{ const saved = localStorage.getItem(STORE_KEY); if(saved) progress = JSON.parse(saved).progress || {}; }catch(e){}
function saveProgress(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify({progress})); }catch(e){} }
let quizSessions = {}; // num -> {idx, score, answered, selected, finished}
let view = {page:"home", chap:null, tab:"lecon"};

const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const chap = n => CHAPS.find(c=>c.numero===n);

function setView(page, chapNum=null, tab="lecon"){
  view = {page, chap:chapNum, tab};
  render();
  document.body.classList.remove("menu-open");
  $("#sidebar").classList.remove("open");
  window.scrollTo({top:0});
}

// ---------- sidebar ----------
function renderNav(){
  let h = "";
  h += `<div class="nav-group">
    <button class="nav-item ${view.page==='home'?'active':''}" onclick="setView('home')"><span class="num">🏠</span><span class="ttl">Tableau de bord</span></button>
    <button class="nav-item ${view.page==='gloss'?'active':''}" onclick="setView('gloss')"><span class="num">📖</span><span class="ttl">Glossaire (${allTerms.length})</span></button>
  </div>`;
  for(const g of GROUPS){
    if(!g.chapters) continue;
    h += `<div class="nav-group"><div class="grp">${g.label}</div>`;
    for(const n of g.chapters){
      const c = chap(n), p = progress[n];
      const done = p && p.done;
      h += `<button class="nav-item ${done?'done':''} ${view.page==='chap'&&view.chap===n?'active':''}" onclick="setView('chap',${n})">
        <span class="num">${done?'✓':n}</span><span class="ttl" title="${esc(c.titre)}">${esc(c.titre)}</span>
        ${p&&p.best!=null?`<span class="score">${p.best}%</span>`:""}</button>`;
    }
    h += `</div>`;
  }
  $("#nav").innerHTML = h;
}

// ---------- accueil ----------
function renderHome(){
  const doneCount = CHAPS.filter(c=>progress[c.numero]?.done).length;
  const scores = CHAPS.map(c=>progress[c.numero]?.best).filter(v=>v!=null);
  const avg = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : null;
  const totalQ = CHAPS.reduce((a,c)=>a+c.quiz.length,0);
  const pct = Math.round(doneCount/CHAPS.length*100);
  let h = `
  <div class="hero">
    <h2>Bienvenue dans votre formation 👋</h2>
    <p>Un parcours complet en 15 étapes fondé sur le manuel <em>Apprentissage des statistiques avec Jamovi</em> : leçons synthétiques, ${totalQ} questions de quiz corrigées, exercices pratiques dans Jamovi et glossaire de ${allTerms.length} termes.</p>
  </div>
  <div class="stats-row">
    <div class="stat"><div class="v">${doneCount} / ${CHAPS.length}</div><div class="l">Chapitres terminés</div></div>
    <div class="stat"><div class="v">${avg!=null?avg+" %":"—"}</div><div class="l">Score moyen aux quiz</div></div>
    <div class="stat"><div class="v">${scores.length}</div><div class="l">Quiz réalisés</div></div>
    <div class="stat"><div class="v">${pct} %</div><div class="l">Progression globale</div></div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <b>Progression du parcours</b><span style="color:var(--muted);font-size:.85rem">${pct} %</span>
    </div>
    <div class="progress-track"><div class="progress-fill ${pct===100?'green':''}" style="width:${pct}%"></div></div>
    <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn ghost" onclick="exportProgress()">💾 Exporter ma progression</button>
      <button class="btn ghost" onclick="$('#importFile').click()">📂 Importer une progression</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importProgress(event)">
    </div>
    <p style="font-size:.78rem;color:var(--muted);margin-top:8px">La progression est enregistrée automatiquement dans ce navigateur. L'export en fichier permet de la transférer sur un autre appareil.</p>
  </div>
  <h2 class="page-title" style="font-size:1.2rem;margin:26px 0 14px">Les chapitres</h2>
  <div class="chap-grid">`;
  for(const c of CHAPS){
    const p = progress[c.numero];
    h += `<button class="chap-card ${p?.done?'done':''}" onclick="setView('chap',${c.numero})">
      <div class="top"><span class="badge">${p?.done?'✓':c.numero}</span><h3>${esc(c.titre)}</h3></div>
      <div class="meta">${c.sections.length} sections · ${c.quiz.length} questions${p?.best!=null?` · meilleur score ${p.best} %`:""}</div>
    </button>`;
  }
  h += `</div>
  <p class="footer-note">D'après Navarro D.J. &amp; Foxcroft D.R., <em>Apprentissage des statistiques avec Jamovi</em> (trad. J.-M. Meunier, Univ. Paris 8), licence CC BY-SA 4.0.</p>`;
  return h;
}

// ---------- chapitre ----------
function renderChapter(){
  const c = chap(view.chap);
  const p = progress[c.numero];
  let h = `<h2 class="page-title">Chapitre ${c.numero===15?'— Épilogue':c.numero} · ${esc(c.titre)}</h2>
  <p class="page-sub">${c.sections.length} sections · ${c.quiz.length} questions de quiz${p?.best!=null?` · meilleur score : ${p.best} %`:""}</p>
  <div class="tabs">
    <button class="tab ${view.tab==='lecon'?'active':''}" onclick="setView('chap',${c.numero},'lecon')">📘 Leçon</button>
    <button class="tab ${view.tab==='quiz'?'active':''}" onclick="setView('chap',${c.numero},'quiz')">✅ Quiz</button>
    <button class="tab ${view.tab==='exo'?'active':''}" onclick="setView('chap',${c.numero},'exo')">🧪 Exercice pratique</button>
  </div>`;
  if(view.tab==='lecon') h += renderLesson(c);
  else if(view.tab==='quiz') h += renderQuiz(c);
  else h += renderExercise(c);
  const prev = CHAPS.find(x=>x.numero===c.numero-1), next = CHAPS.find(x=>x.numero===c.numero+1);
  h += `<div class="chap-nav">
    ${prev?`<button class="btn ghost" onclick="setView('chap',${prev.numero})">← Ch. ${prev.numero}</button>`:"<span></span>"}
    ${next?`<button class="btn ghost" onclick="setView('chap',${next.numero})">Ch. ${next.numero} →</button>`:"<span></span>"}
  </div>`;
  return h;
}

function renderLesson(c){
  let h = `<div class="card">`;
  h += c.sections.map(s=>`<div class="section-block"><h3>${esc(s.titre)}</h3><p>${esc(s.contenu)}</p></div>`).join("");
  h += `</div>`;
  if(c.concepts?.length){
    h += `<div class="card"><b>🔑 Concepts clés</b><div style="margin-top:10px">${c.concepts.map(k=>`<span class="chip">${esc(k)}</span>`).join("")}</div></div>`;
  }
  if(c.formules?.length){
    h += `<div class="card"><b>🧮 Formules essentielles</b><div style="margin-top:12px">`;
    h += c.formules.map(f=>`<div class="formula-card"><div class="n">${esc(f.nom)}</div><div class="f">${esc(f.formule)}</div><div class="e">${esc(f.explication)}</div></div>`).join("");
    h += `</div></div>`;
  }
  if(c.jamovi){
    h += `<div class="card"><div class="jamovi-box"><h4>▶ Dans Jamovi</h4><p>${esc(c.jamovi)}</p></div></div>`;
  }
  h += `<div style="text-align:center;margin-top:8px">
    <button class="btn green" onclick="setView('chap',${c.numero},'quiz')">Tester mes connaissances →</button>
  </div>`;
  return h;
}

// ---------- quiz ----------
function getSession(n){
  if(!quizSessions[n]) quizSessions[n] = {idx:0, score:0, answered:false, selected:null, finished:false};
  return quizSessions[n];
}
function renderQuiz(c){
  const s = getSession(c.numero);
  if(s.finished) return renderQuizResult(c, s);
  const q = c.quiz[s.idx];
  const pc = Math.round(s.idx/c.quiz.length*100);
  let h = `<div class="card">
    <div class="quiz-progress"><span>Question ${s.idx+1} / ${c.quiz.length}</span>
    <div class="progress-track"><div class="progress-fill" style="width:${pc}%"></div></div>
    <span>Score : ${s.score}</span></div>
    <div class="q-text">${esc(q.question)}</div>`;
  q.options.forEach((opt,i)=>{
    let cls = "";
    if(s.answered){
      if(i===q.bonne) cls = "correct";
      else if(i===s.selected) cls = "wrong";
    } else if(i===s.selected) cls = "selected";
    h += `<button class="opt ${cls}" ${s.answered?'disabled':''} onclick="selectOpt(${i})">
      <span class="letter">${"ABCD"[i]}</span><span>${esc(opt)}</span></button>`;
  });
  if(s.answered){
    const good = s.selected===q.bonne;
    h += `<div class="explain ${good?'good':'bad'}"><b>${good?'✅ Bonne réponse !':'❌ Mauvaise réponse — la bonne était '+"ABCD"[q.bonne]+'.'}</b>${esc(q.explication)}</div>
    <div style="text-align:right"><button class="btn" onclick="nextQuestion()">${s.idx+1<c.quiz.length?'Question suivante →':'Voir mon résultat 🏁'}</button></div>`;
  } else {
    h += `<div style="text-align:right"><button class="btn" ${s.selected==null?'disabled':''} onclick="validateAnswer()">Valider</button></div>`;
  }
  h += `</div>`;
  return h;
}
function renderQuizResult(c, s){
  const pct = Math.round(s.score/c.quiz.length*100);
  const msg = pct>=80?"Excellent ! Ce chapitre est solidement acquis.":pct>=60?"Bien ! Relisez les points manqués pour consolider.":"Ce chapitre mérite une relecture — la leçon est à un clic.";
  return `<div class="card quiz-result">
    <div style="font-size:2.4rem">${pct>=80?"🏆":pct>=60?"👍":"📚"}</div>
    <div class="big">${s.score} / ${c.quiz.length}</div>
    <p>${pct} % de bonnes réponses. ${msg}</p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn ghost" onclick="retryQuiz(${c.numero})">🔄 Recommencer le quiz</button>
      <button class="btn ghost" onclick="setView('chap',${c.numero},'lecon')">📘 Revoir la leçon</button>
      ${CHAPS.find(x=>x.numero===c.numero+1)?`<button class="btn" onclick="setView('chap',${c.numero+1})">Chapitre suivant →</button>`:`<button class="btn" onclick="setView('home')">Tableau de bord</button>`}
    </div></div>`;
}
function selectOpt(i){ const s = getSession(view.chap); if(s.answered) return; s.selected = i; render(); }
function validateAnswer(){
  const s = getSession(view.chap), c = chap(view.chap);
  if(s.selected==null||s.answered) return;
  s.answered = true;
  if(s.selected===c.quiz[s.idx].bonne) s.score++;
  render();
}
function nextQuestion(){
  const s = getSession(view.chap), c = chap(view.chap);
  if(s.idx+1<c.quiz.length){ s.idx++; s.answered=false; s.selected=null; }
  else {
    s.finished = true;
    const pct = Math.round(s.score/c.quiz.length*100);
    const p = progress[c.numero] || {best:null, attempts:0, done:false};
    p.attempts++; p.best = p.best==null?pct:Math.max(p.best,pct);
    if(pct>=60) p.done = true;
    progress[c.numero] = p;
    saveProgress();
  }
  render();
}
function retryQuiz(n){ delete quizSessions[n]; render(); }

// ---------- exercice ----------
let showCorrection = {};
function renderExercise(c){
  const e = c.exercice;
  let h = `<div class="card">
    <h3 style="margin-bottom:10px">🧪 ${esc(e.titre)}</h3>
    <p style="white-space:pre-wrap">${esc(e.enonce)}</p>
    <div style="margin-top:16px">
    <button class="btn ${showCorrection[c.numero]?'ghost':''}" onclick="toggleCorrection(${c.numero})">${showCorrection[c.numero]?'Masquer la correction':'👁 Afficher la correction'}</button></div>`;
  if(showCorrection[c.numero]) h += `<div class="exo-correction"><b>✔ Correction</b>

${esc(e.correction)}</div>`;
  h += `</div>`;
  return h;
}
function toggleCorrection(n){ showCorrection[n]=!showCorrection[n]; render(); }

// ---------- glossaire ----------
const allTerms = [];
for(const c of CHAPS) for(const g of c.glossaire) allTerms.push({...g, chap:c.numero});
allTerms.sort((a,b)=>a.terme.localeCompare(b.terme,"fr",{sensitivity:"base"}));
let gQuery = "";
function renderGloss(){
  const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  const q = norm(gQuery.trim());
  const list = q ? allTerms.filter(t=>norm(t.terme).includes(q)||norm(t.definition).includes(q)) : allTerms;
  let h = `<h2 class="page-title">Glossaire</h2>
  <p class="page-sub">${allTerms.length} termes issus du manuel — recherche par mot-clé.</p>
  <div class="card">
  <input id="gsearch" type="text" placeholder="🔍 Rechercher un terme (ex : écart-type, valeur p, ANOVA…)" value="${esc(gQuery)}" oninput="gQuery=this.value;renderGlossList()">
  <div id="glist">${glossListHTML(list,q)}</div></div>`;
  return h;
}
function glossListHTML(list,q){
  if(!list.length) return `<p style="color:var(--muted)">Aucun terme trouvé.</p>`;
  const hl = s => q ? esc(s).replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>") : esc(s);
  let h = "", letter = "";
  for(const t of list){
    const L = t.terme[0].toUpperCase().normalize("NFD")[0];
    if(L!==letter && !q){ letter = L; h += `<div class="gletter">${L}</div>`; }
    h += `<div class="gterm"><b>${hl(t.terme)}</b><span class="src" style="cursor:pointer" onclick="setView('chap',${t.chap})">Ch. ${t.chap}</span><p>${hl(t.definition)}</p></div>`;
  }
  return h;
}
function renderGlossList(){
  const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  const q = norm(gQuery.trim());
  const list = q ? allTerms.filter(t=>norm(t.terme).includes(q)||norm(t.definition).includes(q)) : allTerms;
  $("#glist").innerHTML = glossListHTML(list,q);
}

// ---------- export / import ----------
function exportProgress(){
  const blob = new Blob([JSON.stringify({progress, date:document.lastModified},null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "progression-jamovi.json";
  a.click();
  URL.revokeObjectURL(a.href);
}
function importProgress(ev){
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{ const d = JSON.parse(r.result); if(d.progress){ progress = d.progress; saveProgress(); render(); } else alert("Fichier non reconnu."); }
    catch(e){ alert("Fichier invalide."); }
  };
  r.readAsText(f);
}

// ---------- rendu ----------
function render(){
  renderNav();
  let h = "";
  if(view.page==="home") h = renderHome();
  else if(view.page==="chap") h = renderChapter();
  else if(view.page==="gloss") h = renderGloss();
  $("#main").innerHTML = h;
  if(view.page==="gloss"){ const i=$("#gsearch"); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length);} }
}
$("#burger").addEventListener("click",()=>{ $("#sidebar").classList.toggle("open"); document.body.classList.toggle("menu-open"); });
$("#overlay").addEventListener("click",()=>{ $("#sidebar").classList.remove("open"); document.body.classList.remove("menu-open"); });
render();
if("serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
</body>
