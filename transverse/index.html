<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Le Transverse</title>
<meta name="theme-color" content="#14120f" />
<meta name="description" content="Programme de renforcement du transverse — 6 semaines" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Transverse" />

<style>
  :root {
    --bg: #14120f;
    --card: #1b1812;
    --card-checked: #1f1c14;
    --border: #26221b;
    --border-strong: #3a3222;
    --ink: #ece6da;
    --muted: #a89e8c;
    --muted2: #8a8070;
    --dim: #6b6152;
    --gold: #b08d57;
    --gold-light: #d4af7a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    color: var(--ink);
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, 'Times New Roman', serif;
    min-height: 100vh;
    min-height: 100dvh;
    padding: max(28px, env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));
  }
  .sans { font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; }

  header { margin-bottom: 28px; }
  .eyebrow {
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 6px; font-weight: 600;
  }
  h1 { font-size: 38px; margin: 0 0 10px; font-weight: 400; letter-spacing: -0.01em; }
  .subtitle { font-size: 14px; line-height: 1.55; color: var(--muted); margin: 0 0 22px; max-width: 480px; }

  .progress-wrap { display: flex; flex-direction: column; gap: 6px; }
  .progress-bar-bg { height: 6px; border-radius: 4px; background: var(--border); overflow: hidden; }
  .progress-bar-fill {
    height: 100%; background: linear-gradient(90deg, #8a6d3f, var(--gold-light));
    transition: width 0.3s ease; width: 0%;
  }
  .progress-label { font-size: 12px; color: var(--muted2); }

  .streak {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 14px;
    font-size: 13px; color: var(--gold-light);
  }

  nav.days {
    display: flex; justify-content: space-between; gap: 6px; margin-bottom: 26px;
    border-bottom: 1px solid var(--border); padding-bottom: 18px;
  }
  .day-btn {
    flex: 1; background: transparent; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 6px;
    cursor: pointer; color: var(--muted); transition: background 0.15s ease; font-size: 11.5px;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .day-btn:hover { background: #2a2620; }
  .day-btn.active { border-color: var(--gold); color: var(--ink); background: #221e17; }
  .day-btn.rest { opacity: 0.65; }
  .day-dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--dim); background: transparent; }
  .day-dot.partial { background: var(--dim); }
  .day-dot.full { background: var(--gold); border-color: var(--gold); }

  main { min-height: 240px; }
  section { margin-bottom: 26px; }
  .section-title {
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted2); margin-bottom: 12px; font-weight: 600;
  }
  .cards { display: flex; flex-direction: column; gap: 10px; }
  .ex-card {
    display: flex; align-items: center; gap: 14px; background: var(--card);
    border: 1px solid var(--border); border-radius: 12px; padding: 14px;
    transition: border-color 0.15s ease; animation: fadeIn 0.25s ease both;
  }
  .ex-card.checked { background: var(--card-checked); border-color: var(--border-strong); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  input[type=checkbox].ex-check {
    appearance: none; width: 24px; height: 24px; border-radius: 6px;
    border: 2px solid var(--dim); cursor: pointer; flex-shrink: 0; position: relative;
    background: transparent; transition: all 0.15s ease;
  }
  input[type=checkbox].ex-check:checked { background: var(--gold); border-color: var(--gold); }
  input[type=checkbox].ex-check:checked::after {
    content: ""; position: absolute; left: 7px; top: 3px; width: 6px; height: 11px;
    border: solid #14120f; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg);
  }

  .card-body { flex: 1; cursor: pointer; }
  .card-name { font-size: 16.5px; margin-bottom: 3px; }
  .card-name.done { color: var(--muted2); text-decoration: line-through; }
  .card-detail { font-size: 12.5px; color: var(--muted2); line-height: 1.4; }

  .card-link {
    width: 36px; height: 36px; border-radius: 50%; background: var(--border);
    color: var(--gold-light); display: flex; align-items: center; justify-content: center;
    text-decoration: none; font-size: 12px; flex-shrink: 0;
  }

  .day-footer { text-align: center; margin-top: 8px; font-size: 13px; }
  .day-footer.done { color: var(--gold); font-weight: 600; }
  .day-footer.prog { color: var(--dim); }

  .rest-block { text-align: center; padding: 50px 20px; color: var(--muted2); }
  .rest-icon { font-size: 32px; margin-bottom: 12px; color: var(--dim); }
  .rest-text { font-size: 14px; line-height: 1.6; max-width: 320px; margin: 0 auto; }

  footer.app-footer {
    margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--dim); line-height: 1.6; text-align: center;
  }

  #installBtn {
    display: none; margin: 0 0 20px; width: 100%; padding: 12px;
    background: var(--gold); color: #14120f; border: none; border-radius: 10px;
    font-weight: 700; font-size: 14px; cursor: pointer;
  }
</style>
</head>
<body>
<div class="wrap">

  <button id="installBtn" class="sans">📲 Installer l'app sur l'écran d'accueil</button>

  <header>
    <div class="eyebrow sans">Programme 6 semaines</div>
    <h1>Le Transverse</h1>
    <p class="subtitle sans">Le muscle profond qui tient le ventre — travaillé en endurance, presque tous les jours, comme un mollet.</p>
    <div class="progress-wrap">
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="weekFill"></div></div>
      <span class="progress-label sans" id="weekLabel">0/0 cette semaine · 0%</span>
    </div>
    <div class="streak sans" id="streakLabel"></div>
  </header>

  <nav class="days" id="dayNav"></nav>

  <main id="main"></main>

  <footer class="app-footer sans">
    Progression sur 3–4 semaines : allonge le gainage, monte la roulette des genoux vers debout, augmente la tension de l'élastique.
  </footer>
</div>

<script>
// ---- Data -----------------------------------------------------------
const DAILY = [
  { id: "vacuum", name: "Stomach Vacuum", detail: "3 x 20–30 sec — aspiration du ventre, allongé ou à 4 pattes", video: "https://www.youtube.com/watch?v=N9msEniBkbU" },
  { id: "deadbug", name: "Dead Bug", detail: "3 x 8 / côté — référence n°1 pour le transverse", video: "https://www.youtube.com/watch?v=bG17b4f_4bg" },
  { id: "birddog", name: "Bird Dog", detail: "3 x 8 / côté — bonus stabilité lombaire (utile à cheval)", video: "https://www.youtube.com/watch?v=ZmW47SX0lts" },
];
const COMPLEMENT = [
  { id: "roulette", name: "Roulette abdominale", detail: "3 x 6–8 — genoux au sol au début, dos plat, ne pas creuser les lombaires", video: "https://www.youtube.com/watch?v=yJ2Or6zX3LM" },
  { id: "planche", name: "Gainage planche", detail: "3 x 30–45 sec", video: "https://www.youtube.com/watch?v=bG17b4f_4bg" },
  { id: "pallof", name: "Pallof press (élastique)", detail: "3 x 10 / côté — anti-rotation du tronc", video: "https://www.youtube.com/watch?v=I4SKLCM9lyo" },
];
const DAYS = [
  { key: "lun", label: "Lun", complement: true },
  { key: "mar", label: "Mar", complement: false },
  { key: "mer", label: "Mer", complement: true },
  { key: "jeu", label: "Jeu", complement: false },
  { key: "ven", label: "Ven", complement: true },
  { key: "sam", label: "Sam", complement: false },
  { key: "dim", label: "Dim", complement: false, rest: true },
];
const STORAGE_KEY = "transverse-state-v1";
const STREAK_KEY = "transverse-streak-v1";

function todayKey() {
  // Monday-based index -> DAYS key
  const jsDay = new Date().getDay(); // 0=Sun..6=Sat
  const idx = jsDay === 0 ? 6 : jsDay - 1;
  return DAYS[idx].key;
}

let state = {};
try { state = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch (e) { state = {}; }
let activeDay = todayKey();

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function dayExercises(day) {
  if (day.rest) return [];
  return day.complement ? DAILY.concat(COMPLEMENT) : DAILY;
}
function dayProgress(day) {
  const exs = dayExercises(day);
  if (!exs.length) return { done: 0, total: 0 };
  let done = 0;
  exs.forEach(e => { if (state[day.key + ":" + e.id]) done++; });
  return { done, total: exs.length };
}

function toggle(dayKey, exId) {
  const k = dayKey + ":" + exId;
  state[k] = !state[k];
  save();
  render();
}

function renderNav() {
  const nav = document.getElementById("dayNav");
  nav.innerHTML = "";
  DAYS.forEach(d => {
    const p = dayProgress(d);
    const full = p.total > 0 && p.done === p.total;
    const btn = document.createElement("button");
    btn.className = "day-btn sans" + (d.key === activeDay ? " active" : "") + (d.rest ? " rest" : "");
    btn.innerHTML = '<span>' + d.label + '</span>' +
      (!d.rest ? '<span class="day-dot ' + (full ? "full" : (p.done > 0 ? "partial" : "")) + '"></span>' : '');
    btn.onclick = () => { activeDay = d.key; render(); };
    nav.appendChild(btn);
  });
}

function cardHTML(ex, dayKey) {
  const checked = !!state[dayKey + ":" + ex.id];
  return '<div class="ex-card' + (checked ? " checked" : "") + '">' +
    '<input type="checkbox" class="ex-check" ' + (checked ? "checked" : "") + ' onchange="toggle(\'' + dayKey + '\',\'' + ex.id + '\')" />' +
    '<div class="card-body" onclick="toggle(\'' + dayKey + '\',\'' + ex.id + '\')">' +
      '<div class="card-name' + (checked ? " done" : "") + '">' + ex.name + '</div>' +
      '<div class="card-detail sans">' + ex.detail + '</div>' +
    '</div>' +
    '<a class="card-link" href="' + ex.video + '" target="_blank" rel="noreferrer" onclick="event.stopPropagation()" title="Voir la vidéo">▶</a>' +
  '</div>';
}

function renderMain() {
  const day = DAYS.find(d => d.key === activeDay);
  const main = document.getElementById("main");
  if (day.rest) {
    main.innerHTML = '<div class="rest-block"><div class="rest-icon">◌</div>' +
      '<p class="rest-text sans">Repos complet. Le transverse récupère aussi — c\'est ce qui le rend plus solide.</p></div>';
    return;
  }
  const prog = dayProgress(day);
  let html = '<section><div class="section-title sans">Base quotidienne</div><div class="cards">';
  DAILY.forEach(ex => html += cardHTML(ex, day.key));
  html += '</div></section>';
  if (day.complement) {
    html += '<section><div class="section-title sans">Complément du jour</div><div class="cards">';
    COMPLEMENT.forEach(ex => html += cardHTML(ex, day.key));
    html += '</div></section>';
  }
  html += '<div class="day-footer sans ' + (prog.done === prog.total ? "done" : "prog") + '">' +
    (prog.done === prog.total ? "Séance bouclée ✓" : prog.done + "/" + prog.total + " exercices faits") +
  '</div>';
  main.innerHTML = html;
}

function renderHeader() {
  let done = 0, total = 0;
  DAYS.forEach(d => { const p = dayProgress(d); done += p.done; total += p.total; });
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById("weekFill").style.width = pct + "%";
  document.getElementById("weekLabel").textContent = done + "/" + total + " cette semaine · " + pct + "%";

  // streak: consecutive days (going backward from today) fully completed
  let streak = 0;
  const todayIdx = DAYS.findIndex(d => d.key === todayKey());
  for (let i = todayIdx; i >= 0; i--) {
    const d = DAYS[i];
    if (d.rest) continue;
    const p = dayProgress(d);
    if (p.total > 0 && p.done === p.total) streak++;
    else break;
  }
  const streakEl = document.getElementById("streakLabel");
  streakEl.textContent = streak > 0 ? "🔥 " + streak + " jour" + (streak > 1 ? "s" : "") + " d'affilée" : "";
}

function render() {
  renderHeader();
  renderNav();
  renderMain();
}
render();

// ---- PWA install prompt ----------------------------------------------
let deferredPrompt;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById("installBtn").style.display = "block";
});
document.getElementById("installBtn").addEventListener("click", async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById("installBtn").style.display = "none";
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
